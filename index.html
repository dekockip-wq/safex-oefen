<style>
  :root {
    /* IDK Tech brand tokens (idktech.co.za style.css) */
    --bg: #17181A; --card: #202125; --line: #2A2B30; --text: #EDE7DB; --muted: #A29E95;
    --accent: #4C8DFF; --good: #5BC48A; --bad: #e5534b; --warn: #C9A45C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 17px/1.5 "Jost", "Futura", "Avenir Next", -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    padding: max(12px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  h2 { font-size: 19px; margin: 18px 0 8px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
  button {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 14px; width: 100%; text-align: left; margin: 6px 0; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 650; text-align: center; }
  button.small { width: auto; padding: 8px 12px; font-size: 15px; display: inline-block; margin: 4px 4px 4px 0; }
  button:disabled { opacity: .55; cursor: default; }
  .opt { display: flex; gap: 10px; align-items: flex-start; }
  .opt b { min-width: 22px; }
  .opt.correct { border-color: var(--good); background: #173524; }
  .opt.wrong { border-color: var(--bad); background: #3a1a19; }
  .opt.picked { border-color: var(--accent); background: #1c2a45; }
  .lesson p, .lesson li { margin: 6px 0; }
  .lesson table { margin: 8px 0; }
  .lesson code, .calc code { background: #11171d; padding: 1px 5px; border-radius: 5px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14px; }
  .box { border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
  .box.remember { background: #16233b; border: 1px solid #2a4170; }
  .box.trap { background: #352a14; border: 1px solid #6b5420; }
  .box.check { background: #18301f; border: 1px solid #2c5a3a; }
  .box h3 { margin: 0 0 6px; font-size: 15px; }
  .box ul { margin: 0; padding-left: 20px; }
  details.example { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
  details.example summary { cursor: pointer; font-weight: 600; }
  .calc label { display: block; margin: 8px 0 2px; font-size: 15px; color: var(--muted); }
  .calc input, .calc select { font: inherit; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #11171d; color: var(--text); }
  .calc .out { margin-top: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stmts { margin: 8px 0 4px; padding-left: 0; list-style: none; }
  .stmts li { margin: 5px 0; padding-left: 8px; border-left: 3px solid var(--line); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
  .progress > div { height: 100%; background: var(--accent); }
  .feedback { border-left: 4px solid var(--good); }
  .feedback.bad { border-left-color: var(--bad); }
  .flag { color: var(--warn); font-size: 15px; margin-top: 8px; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--muted); margin-right: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  td.num { text-align: right; white-space: nowrap; }
  .pass { color: var(--good); } .fail { color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 8px 0; }
  .grid button { padding: 6px 0; text-align: center; font-size: 13px; margin: 0; }
  .grid button.done { background: #2a3440; }
  .grid button.cur { border-color: var(--accent); }
  .big { font-size: 40px; font-weight: 700; margin: 4px 0; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; margin: 4px 0 6px; }
  .brand svg { width: 30px; height: 30px; }
  .brand b { font-weight: 600; letter-spacing: .04em; } .brand span { color: var(--muted); letter-spacing: .12em; font-size: 14px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
  footer { max-width: 680px; margin: 28px auto 0; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
  footer a { color: var(--muted); }
  pre.data { white-space: pre-wrap; font-size: 14px; background: #11171d; padding: 8px; border-radius: 8px; overflow-x: auto; }
</style>

<script>
const QUESTIONS = [{"paper": "BOOK", "n": "ch1-1", "question": "Sunflower seeds can have a khaki bush odour.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Sonneblomsaad mag nie 'n muf, suur, khakibos of ander onaangename reuk hê nie; dit geld vir alle landbouprodukte se gradering.", "book_ref": "1.6 Self-test quiz, p.23", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "False. Sunflower seed may not have a musty, sour, khaki bush or any other unpleasant odour. This rule applies to the grading of all agricultural products.", "note_en": null}, {"paper": "BOOK", "n": "ch1-2", "question": "Gauteng is a major production area for wheat in South Africa.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die drie hoof-produksiegebiede vir koring is die Wes-Kaap, Vrystaat en Noord-Kaap (2022), nie Gauteng nie.", "book_ref": "1.6 Self-test quiz, p.23", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "False. The three main wheat production areas are the Western Cape, the Free State and the Northern Cape (2022). Gauteng is not one of them.", "note_en": null}, {"paper": "BOOK", "n": "ch1-3", "question": "There are no government interventions in the wheat market in South Africa.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die koringmark is in 1997 gedereguleer, maar die regering hef steeds 'n tarief op koringinvoere; dis die enigste oorblywende ingryping.", "book_ref": "1.6 Self-test quiz, p.23", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "False. The wheat market was deregulated in 1997. However, the government still charges a tariff on wheat imports. This is the only government intervention that remains.", "note_en": null}, {"paper": "BOOK", "n": "ch1-4", "question": "South Africa is normally a surplus producer of white maize.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Suid-Afrika produseer normaalweg 'n surplus witmielies; witmielies word net in jare van erge droogte ingevoer.", "book_ref": "1.6 Self-test quiz, p.23", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "True. South Africa normally produces a surplus of white maize. White maize is only imported in years of severe drought.", "note_en": null}, {"paper": "BOOK", "n": "ch1-5", "question": "White maize is mostly used for human consumption.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Witmielies word hoofsaaklik vir menslike verbruik gebruik, terwyl geelmielies hoofsaaklik veevoer is.", "book_ref": "1.6 Self-test quiz, p.23", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "True. White maize is mainly used for human consumption. Yellow maize is mainly used for animal feed.", "note_en": null}, {"paper": "BOOK", "n": "ch1-6", "question": "The maximum moisture content for soya beans is 9%.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die voginhoud van sojabone mag nie 13% oorskry nie, nie 9% nie.", "book_ref": "1.6 Self-test quiz, p.23", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "False. The moisture content of soya beans may not exceed 13%, not 9%.", "note_en": null}, {"paper": "BOOK", "n": "ch2-1", "question": "SAFEX was incorporated into the JSE in 2009.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. SAFEX het die JSE se oorname in 2001 aanvaar en die Agricultural Products Division geword; dit staan nou bekend as die JSE Commodity Derivatives Market (CDM).", "book_ref": "2.6 Self-test quiz, p.29", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "False. SAFEX accepted the JSE's takeover in 2001, not 2009, and became the Agricultural Products Division. It is now known as the JSE Commodity Derivatives Market (CDM).", "note_en": null}, {"paper": "BOOK", "n": "ch2-2", "question": "Option contracts on maize can be traded on the CDM.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Opsies op mielies word sedert 1998 op SAFEX verhandel en word steeds op die JSE CDM verhandel.", "book_ref": "2.6 Self-test quiz, p.29", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "True. Options on maize have traded on SAFEX since 1998. They still trade on the JSE CDM today.", "note_en": null}, {"paper": "BOOK", "n": "ch2-3", "question": "A futures contract specifies the commodity traded, the quantity and quality of the product, location and when delivery should take place.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Futures contracts spesifiseer 'n gestandaardiseerde kommoditeit, kwaliteit, hoeveelheid, plek en afleweringstydperk.", "book_ref": "2.6 Self-test quiz, p.29", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "True. Futures contracts specify a standardised commodity, its quality, the quantity, the location and the delivery period.", "note_en": null}, {"paper": "BOOK", "n": "ch2-4", "question": "The primary purpose of a futures market is to provide a platform for speculators to participate in the market.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die primêre doel van 'n futures market is 'n doeltreffende meganisme vir price risk management (en price discovery), nie 'n platform vir spekulante nie.", "book_ref": "2.6 Self-test quiz, p.29", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "False. The primary purpose of a futures market is to provide an efficient mechanism for price risk management (and price discovery). It is not mainly a platform for speculators.", "note_en": null}, {"paper": "BOOK", "n": "ch3-1", "question": "Forward contracts are marked to market on a daily basis.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Futures contracts word daagliks marked to market; forwards is OTC-kontrakte wat eers op vervaldatum vereffen word.", "book_ref": "3 Self-test quiz, p.38", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "False. Futures contracts are marked to market daily. Forwards are OTC contracts that are only settled on the expiry date.", "note_en": null}, {"paper": "BOOK", "n": "ch3-3", "question": "The cost of carry includes both storage cost and convenience yields.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Carry costs = cost of funds + storage cost - convenience yield, dus is albei deel van die cost of carry.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "True. Carry costs = cost of funds + storage cost - convenience yield. So both storage cost and convenience yield are part of the cost of carry.", "note_en": null}, {"paper": "BOOK", "n": "ch3-4", "question": "Financing cost is seen as a cost of carry.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Carrying costs sluit storage, insurance, transport en financing costs in.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "True. Carrying costs include storage, insurance, transport and financing costs.", "note_en": null}, {"paper": "BOOK", "n": "ch3-5", "question": "Time value of money is ignored in determining forward prices.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die tyd tot vervaldatum is deel van die berekening: F0 = (S0+U)(1+i/f)^(n·f), dus word die toekomstige waarde saamgestel.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "False. The time to expiry is part of the calculation: F0 = (S0+U)(1+i/f)^(n·f). The formula compounds the value forward in time, so the time value of money is built into the forward price.", "note_en": null}, {"paper": "BOOK", "n": "ch4-1", "question": "Basis can be affected by:", "statements": [], "options": {"A": "Storage and transportation costs", "B": "Local supply and demand", "C": "Quality", "D": "All of the above"}, "answer": "D", "uitleg": "Al die faktore beïnvloed basis (spot price - futures price): stoor- en vervoerkoste, plaaslike vraag en aanbod, en kwaliteit.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "All of these factors affect the basis (spot price - futures price): storage and transport costs, local supply and demand, and quality.", "note_en": null}, {"paper": "BOOK", "n": "ch4-2", "question": "Agricultural futures markets participants include:", "statements": [], "options": {"A": "Commodity sellers", "B": "Commodity buyers", "C": "Speculators", "D": "All of the above"}, "answer": "D", "uitleg": "Kopers, verkopers (hedgers) en spekulante neem almal deel; arbitrage traders is ook deel van die markdeelnemers.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "Buyers and sellers (hedgers) and speculators all take part in the market. Arbitrage traders are also market participants. So all of the above is correct.", "note_en": null}, {"paper": "BOOK", "n": "ch4-3", "question": "Hedgers include:", "statements": [], "options": {"A": "Commodity buyers who want to protect against the risk of higher prices", "B": "Commodity sellers who want to protect against the risk of higher prices", "C": "Speculators seeking to make a profit", "D": "Both A and B"}, "answer": "A", "uitleg": "Kopers hedge teen hoër pryse. Verkopers wil hulle teen laer pryse (nie hoër nie) beskerm, so B is verkeerd en daarom ook D; spekulante het nie fisiese voorraad nie.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "Buyers of a commodity hedge against higher prices, so A is correct. Sellers want protection against lower prices, not higher prices. That makes B wrong, and therefore D (which includes B) is wrong too. Speculators hold no physical stock, so they are not hedgers.", "note_en": null}, {"paper": "BOOK", "n": "ch4-4", "question": "Which of the following is FALSE:", "statements": [], "options": {"A": "The objective of speculators is to make a profit.", "B": "Speculators add liquidity to the marketplace.", "C": "Speculators buy or sell futures to offset their spot market exposure.", "D": "Although it mimics the dollar price of gold, the rand price of a gold quanto future traded on JSE CDM is not affected by the rand-dollar exchange rate."}, "answer": "C", "uitleg": "Spekulante het nie, en beoog ook nie, fisiese voorraad nie, so hulle het geen spot market exposure om te offset nie. D is waar: 'n quanto future word in rand geprys sonder wisselkoersblootstelling.", "book_ref": "4.13 Self-test quiz, p.87", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "Speculators do not hold physical stock and do not plan to. So they have no spot market exposure to offset. That makes C the false statement. D is true: a quanto future is priced in rand, with no exchange rate exposure.", "note_en": null}, {"paper": "BOOK", "n": "ch4-5", "question": "You are a producer of maize and are interested in managing your exposure to a fall in the price of maize when you will harvest your maize by securing a guaranteed price for your maize through the futures market. You should do the following:", "statements": [], "options": {"A": "Consult a medium", "B": "Consult a JSE CDM member with a view to buying maize futures contracts", "C": "Consult a JSE CDM member with a view to selling maize futures contracts", "D": "None of the above"}, "answer": "C", "uitleg": "'n Produsent wat teen 'n prysdaling wil hedge, doen 'n short hedge: hy verkoop futures via 'n JSE CDM member met wie hy 'n client agreement het, en sluit so 'n prys in.", "book_ref": "4.13 Self-test quiz, p.87", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "A producer who wants to hedge against a price fall does a short hedge. He sells futures through a JSE CDM member with whom he has a client agreement. This locks in a price for his maize.", "note_en": null}, {"paper": "BOOK", "n": "ch4-6", "question": "You've entered into a short futures position and decided not to make delivery on the futures contracts, but to close out your position on the futures market. Do you....", "statements": [], "options": {"A": "Buy back an equivalent number of futures contracts at the ruling price on the futures market?", "B": "Sell an equivalent number of futures contracts at the ruling price on the futures market?", "C": "Ignore the futures market?", "D": "Discard your futures contracts?"}, "answer": "A", "uitleg": "Om uit te sluit, doen jy 'n gelyke maar teenoorgestelde transaksie. Jy het oopgemaak deur te verkoop, dus koop jy dieselfde aantal kontrakte terug teen die heersende prys.", "book_ref": "4.13 Self-test quiz, p.87", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "To close out a position, you do an equal but opposite trade. You opened the position by selling, so you close it by buying back the same number of contracts at the ruling price.", "note_en": null}, {"paper": "BOOK", "n": "ch4-7", "question": "You've entered into a short futures position and decided not to close out your position on the futures market, but to make physical delivery on the futures contract. Do you...", "statements": [], "options": {"A": "Deliver the maize to the JSE in Johannesburg and wait around for the JSE to pay you for your maize?", "B": "Inform your JSE CDM member to arrange for a transporter to come and collect the maize at your farm?", "C": "Deliver the maize to any silo and inform your broker as to the location thereof?", "D": "Deliver your maize to a JSE approved delivery station, request a silo receipt, notify your JSE CDM member accordingly and follow the designated procedure?"}, "answer": "D", "uitleg": "Aflewering gebeur by 'n JSE-goedgekeurde delivery station (silo): jy vra 'n silo receipt, stel jou JSE CDM member in kennis en volg die voorgeskrewe prosedure. Enige silo is nie goed genoeg nie.", "book_ref": "4.13 Self-test quiz, p.88", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "Delivery takes place at a JSE-approved delivery station (silo). You request a silo receipt, notify your JSE CDM member and follow the designated procedure. Delivering to just any silo is not good enough.", "note_en": null}, {"paper": "BOOK", "n": "ch4-8", "question": "Which one of the following is true?", "statements": [], "options": {"A": "SA farmers can hedge against sharp rises in fuel prices by selling foreign referenced crude oil futures listed on the JSE.", "B": "The minimum contract size for a NYMEX crude oil futures contract listed on the JSE CDM is 1,000 US barrels.", "C": "The minimum contract size for a COMEX gold futures contract listed on the JSE CDM is 10 troy ounces.", "D": "The US corn contract listed on the JSE CDM has to be cash settled in US dollars."}, "answer": "C", "uitleg": "Goud (en platinum) op die JSE CDM: 1 kontrak = 10 troy ounces. A is verkeerd (teen stygende brandstofpryse koop jy, nie verkoop nie); B: die JSE-kontrak is 100 barrels (1 000 is New York); D: dit word in rand vereffen.", "book_ref": "4.13 Self-test quiz, p.88", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "For gold (and platinum) on the JSE CDM, 1 contract = 10 troy ounces, so C is correct. A is wrong: to protect against rising fuel prices you buy futures, not sell. B is wrong: the JSE contract is 100 barrels (1 000 barrels is the New York contract). D is wrong: the contract is settled in rand.", "note_en": null}, {"paper": "BOOK", "n": "ch5-1", "question": "A swap is an agreement between two companies/individuals to exchange commodities in the future.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n Swap ruil kontantvloeie (cash flows) in die toekoms uit, nie die kommoditeit self nie; commodity swaps word altyd kontant vereffen.", "book_ref": "5.8 Self-test quiz, p.96", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "False. A swap exchanges future cash flows, not the commodity itself. Commodity swaps are always cash settled.", "note_en": null}, {"paper": "BOOK", "n": "ch5-2", "question": "Large South African grain-consuming companies commonly use commodity swaps.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Groot graanverbruikers verkies fixed-price delivery contracts bo cash-settling swaps.", "book_ref": "5.8 Self-test quiz, p.97", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "False. Large grain consumers prefer fixed-price delivery contracts over cash-settling swaps.", "note_en": null}, {"paper": "BOOK", "n": "ch5-3", "question": "Farmers can utilize swaps as a hedging tool.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. In beginsel kan swaps boere help om prysrisiko te hedge, ook vir bates wat nie op 'n beurs verhandel word nie.", "book_ref": "5.8 Self-test quiz, p.97", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "True. In principle, swaps can help farmers hedge price risk, even for assets that are not traded on an exchange.", "note_en": null}, {"paper": "BOOK", "n": "ch6-1", "question": "A ____ option conveys the right to buy without an obligation.", "statements": [], "options": {"A": "put", "B": "call"}, "answer": "B", "uitleg": "'n Call option gee die reg, maar nie die verpligting nie, om die onderliggende bate te koop.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "A call option gives the right, but not the obligation, to buy the underlying asset.", "note_en": null}, {"paper": "BOOK", "n": "ch6-2", "question": "A ____ option conveys the right to sell.", "statements": [], "options": {"A": "put", "B": "call"}, "answer": "A", "uitleg": "'n Put option gee die reg, maar nie die verpligting nie, om die onderliggende bate te verkoop.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "A put option gives the right, but not the obligation, to sell the underlying asset.", "note_en": null}, {"paper": "BOOK", "n": "ch6-3", "question": "If a long put is exercised, a ____ futures is assigned to the option holder.", "statements": [], "options": {"A": "long", "B": "short"}, "answer": "B", "uitleg": "Wanneer 'n put uitgeoefen word, kry die put-koper 'n short futures position (reg om te verkoop) en die skrywer 'n long position.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "When a put is exercised, the put buyer (holder) gets a short futures position, because a put is the right to sell. The writer of the put gets the opposite, a long futures position.", "note_en": null}, {"paper": "BOOK", "n": "ch6-4", "question": "If a long call is exercised, a ____ futures is assigned to the option holder.", "statements": [], "options": {"A": "long", "B": "short"}, "answer": "A", "uitleg": "Wanneer 'n call uitgeoefen word, kry die call-koper 'n long futures position en die call-skrywer 'n short futures position.", "book_ref": "6.15 Self-test quiz, p.138-139", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "When a call is exercised, the call buyer gets a long futures position. The call writer gets a short futures position.", "note_en": null}, {"paper": "BOOK", "n": "ch6-5", "question": "The maximum that a long call holder can gain on his position is the premium.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die premie is die maksimum wat 'n long call holder kan verloor; sy wins is teoreties onbeperk.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "False. The premium is the maximum a long call holder can LOSE. His potential profit is, in theory, unlimited.", "note_en": null}, {"paper": "BOOK", "n": "ch6-6", "question": "When an in-the-money long call expires the owner of the call option has no further obligation.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n In-the-money opsie word met verval outomaties deur die Exchange uitgeoefen en 'n long futures position word aan die houer toegeken.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "False. At expiry, an in-the-money option is automatically exercised by the Exchange. A long futures position is then assigned to the holder of the call. So the owner does end up with a position (and its obligations).", "note_en": null}, {"paper": "BOOK", "n": "ch6-7", "question": "A long put on white maize may be exercised any time until option expiry.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Opsies op die JSE CDM is American-type en kan enige tyd tot die vervaldatum uitgeoefen word.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "True. Options on the JSE CDM are American-type. They can be exercised at any time up to the expiry date.", "note_en": null}, {"paper": "BOOK", "n": "ch6-8", "question": "During the months of January to March volatility as indicated by the SAVI-White Maize is normally quite low.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Volatiliteit ('vrees') styg juis in die kritieke weermaande Jan-Mrt wanneer opvolgreëns nodig is vir 'n goeie oes.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "False. Volatility ('fear') actually rises in the critical weather months of January to March. That is when follow-up rains are needed for a good harvest.", "note_en": null}, {"paper": "BOOK", "n": "ch7-1", "question": "You successfully hedged your position against a price rise by trading futures contracts at a level which covered your breakeven buying price and locked in a return on your investment. You close out your position at a price of the futures contract which reflects the expected shortage of maize on the market at around the expiry time of the contracts you traded. The money in your margin account is repaid to you. Your margin account would reflect –", "statements": [], "options": {"A": "Only the initial margin paid by yourself.", "B": "The initial margin paid by yourself plus the variation margin paid into your account by the seller or short position holder.", "C": "The initial margin paid by yourself minus the variation margin paid by yourself into the account of the seller or short position holder.", "D": "That portion of the margin account proportionately representing the movement of the futures price as against the price movement on the actual physical or spot market."}, "answer": "B", "uitleg": "Jy is long (hedge teen prysstyging) en die futures-prys het gestyg, so jou rekening is daagliks met variation margin van die short-houer gekrediteer. Jy kry dus initial margin plus variation margin terug.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "You are long futures, because you hedged against a price rise. The futures price rose (the market expected a shortage). So each day your margin account was credited with variation margin paid by the short holder. When you close out, you get back your initial margin plus that variation margin.", "note_en": null}, {"paper": "BOOK", "n": "ch7-2", "question": "The premise that makes hedging possible is cash and futures prices –", "statements": [], "options": {"A": "move in opposite directions.", "B": "move upward and downward by identical amounts.", "C": "generally, change in the same direction by similar amounts.", "D": "are regulated by the exchange."}, "answer": "C", "uitleg": "Cash- en futures-pryse beweeg oor die algemeen saam op en af, nie noodwendig met presies dieselfde bedrag nie (dis basis risk), maar naby genoeg om met teenoorgestelde posisies te hedge.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Cash and futures prices generally move up and down together. They do not always move by exactly the same amount (that difference is basis risk). But they move closely enough that you can hedge by taking opposite positions in the two markets.", "note_en": null}, {"paper": "BOOK", "n": "ch7-3", "question": "To hedge against an increase in prices, you would –", "statements": [], "options": {"A": "purchase futures contracts.", "B": "sell futures contracts."}, "answer": "A", "uitleg": "Beskerming teen stygende pryse = long hedge: koop futures contracts. Teen dalende pryse verkoop jy futures.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Protection against rising prices = a long hedge, so you buy futures contracts. To protect against falling prices, you would sell futures.", "note_en": null}, {"paper": "BOOK", "n": "ch7-4", "question": "A farmer's crop is still in the field. Their cash market position is-", "statements": [], "options": {"A": "long", "B": "short", "C": "neither, since the crop hasn't been harvested", "D": "neutral, because they have no position in the futures market"}, "answer": "A", "uitleg": "Die boer is soos iemand wat die oes besit en stoor: hy wen as pryse styg en verloor as dit daal, dus is sy cash position long.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "A farmer with a crop in the field is like someone who owns and stores the crop. He gains if prices rise and loses if prices fall. That means his cash market position is long.", "note_en": null}, {"paper": "BOOK", "n": "ch7-5", "question": "Arbitrage traders manipulate markets, and this results in mispriced instruments.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Arbitrageurs koop en verkoop in verskillende markte en verseker juis dat wanprysing verdwyn.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "False. Arbitrageurs buy and sell in different markets. Their trading actually makes mispricing disappear.", "note_en": null}, {"paper": "BOOK", "n": "ch7-6", "question": "An intermarket spread can be accomplished by going long on futures in one market, and on short futures of the same month in the same market.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n Intermarket spread is long futures in een mark en short futures van dieselfde maand in 'n ANDER mark.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "False. An intermarket spread is long futures in one market and short futures of the same month in a DIFFERENT market. The statement says 'the same market', which is wrong.", "note_en": null}, {"paper": "BOOK", "n": "ch7-7", "question": "Assuming that your local physical market price is generally below the value of the authorized futures contract (reference point) and that the basis tends to fluctuate as a result of demand and supply factors in the area where you deliver and because of changes in transportation rates. You have hedged your maize crop by selling futures contracts. Which ONE of the following actions do you follow to maximize your realization if you choose to deliver your maize?", "statements": [], "options": {"A": "You lift your hedge when the basis weakens.", "B": "You lift your hedge when the price in the physical market is at its peak.", "C": "You do not worry about the basis because once you have hedged as it makes no difference.", "D": "You lift your hedge when the basis strengthens."}, "answer": "D", "uitleg": "'n Short hedger se effektiewe prys = F1 + B2, dus baat hy as die basis versterk (cash price styg relatief tot futures). Lig die hedge wanneer die basis sterk is.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "For a short hedger, the effective price = F1 + B2 (the futures price he sold at plus the basis when he lifts the hedge). So he benefits when the basis strengthens, i.e. when the cash price rises relative to futures. He should therefore lift the hedge when the basis is strong.", "note_en": null}, {"paper": "BOOK", "n": "ch8-1", "question": "The directives are binding on all members and officers and employees of members and any person using the services of member or who concludes a transaction with a member in the course of that member's JSE regulated activities.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die directives bind net trading members, hul officers en employees. Die rules (nie directives nie) bind ook persone wat 'n member se dienste gebruik of met hom transaksies sluit.", "book_ref": "8.18 Self-test quiz, p.190; 8.1 p.173", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "False. The directives bind only trading members and their officers and employees. It is the rules (not the directives) that also bind people who use a member's services or transact with a member.", "note_en": null}, {"paper": "BOOK", "n": "ch8-3", "question": "The Market Controller is responsible for identifying the origin and the accuracy, integrity, and validity of all data submitted to the JSE trading system by or on behalf of that trading member.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die trading member self is verantwoordelik vir die oorsprong, akkuraatheid, integriteit en geldigheid van data wat deur of namens hom in die JSE trading system ingevoer word.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "False. It is not the Market Controller. The trading member itself is responsible for the origin, accuracy, integrity and validity of data entered into the JSE trading system by it or on its behalf.", "note_en": null}, {"paper": "BOOK", "n": "ch8-4", "question": "Who may reduce or extend the hours of operation of the JSE trading system for any particular business day?", "statements": [], "options": {"A": "Market Controller", "B": "JSE Executive", "C": "Director: Market Regulation"}, "answer": "B", "uitleg": "Die JSE Executive mag die bedryfsure van die JSE trading system vir 'n spesifieke besigheidsdag verkort of verleng.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The JSE Executive may shorten or extend the hours of operation of the JSE trading system for a particular business day.", "note_en": null}, {"paper": "BOOK", "n": "ch8-5", "question": "Insider trading offences only apply to transactions in listed companies and therefore exclude transactions in agricultural product securities.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Insider trading offences geld vir enige transaksies in securities wat op 'n regulated market genoteer is, insluitend agricultural product securities.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "False. Insider trading offences apply to any transaction in securities listed on a regulated market. This includes agricultural product securities.", "note_en": null}, {"paper": "BOOK", "n": "ch8-6", "question": "Who may declare a trading halt in an agricultural product security?", "statements": [], "options": {"A": "Chief Executive Officer, in conjunction with the JSE Executive", "B": "The Market Controller, in conjunction with the Director: Market Regulation", "C": "The Director: Market Regulation, in conjunction with the Chief Executive Officer"}, "answer": "C", "uitleg": "Die Director: Market Regulation, saam met die Chief Executive Officer, mag 'n trading halt in 'n agricultural product security verklaar.", "book_ref": "8.18 Self-test quiz, p.191", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The Director: Market Regulation, together with the Chief Executive Officer, may declare a trading halt in an agricultural product security.", "note_en": null}, {"paper": "BOOK", "n": "ch8-9", "question": "The CDM operates on every calendar day.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die CDM werk op elke business day, nie elke kalenderdag nie.", "book_ref": "8.18 Self-test quiz, p.191", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "False. The CDM operates on every business day, not on every calendar day.", "note_en": null}, {"paper": "BOOK", "n": "ch9-1", "question": "Fundamental analysis is rooted in the basic premise that:", "statements": [], "options": {"A": "Price behaviour in the financial markets is random.", "B": "Price behaviour in the financial markets moves in trends", "C": "Price behaviour in the financial markets can only be understood by analysis of the underlying economic conditions surrounding the markets.", "D": "Price behaviour in the financial markets is cyclically based."}, "answer": "C", "uitleg": "Fundamental analysis glo pryse kan net verstaan word deur die onderliggende ekonomiese toestande te ontleed (top-down: ekonomie, bedryf, kommoditeit). 'Pryse beweeg in trends' (B) is 'n aanname van technical analysis.", "book_ref": "9.4 Self-test quiz, p.202", "topic": "Other", "note": null, "data": null, "uitleg_en": "Fundamental analysis holds that prices can only be understood by analysing the underlying economic conditions. It works top-down: economy, then industry, then commodity. The idea that 'prices move in trends' (B) is an assumption of technical analysis, not fundamental analysis.", "note_en": null}, {"paper": "BOOK", "n": "ch9-3", "question": "All commodity prices are equally sensitive to changes in demand as to changes in supply.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Sommige markte is meer sensitief vir aanbodfaktore, ander reageer meer op vraagveranderinge.", "book_ref": "9.4 Self-test quiz, p.203", "topic": "Other", "note": null, "data": null, "uitleg_en": "False. Some markets are more sensitive to supply factors. Others react more to changes in demand.", "note_en": null}, {"paper": "BOOK", "n": "ch9-5", "question": "Import parity prices reflect the lowest / highest level of the South African domestic price.", "statements": [], "options": {"A": "lowest", "B": "highest"}, "answer": "B", "uitleg": "Import parity is die internasionale prys plus alle koste om in te voer. Plaaslike pryse styg selde daarbo, want meulenaars voer dan eerder in. Import parity is dus die plafon (highest), en export parity is die vloer (lowest).", "book_ref": "9.4 Self-test quiz, p.203; cf. p.76, 9.1.1 p.198", "topic": "Physical market", "note": "Die boek se self-toets sê 'lowest', maar die boek se teks (p.76 en p.198) sê import parity is die maksimum prys.", "data": null, "uitleg_en": "Import parity is the international price plus all the costs of importing. Local prices seldom rise above it, because millers would then rather import. So import parity is the ceiling (highest level), and export parity is the floor (lowest level).", "note_en": "The book's self-test says 'lowest', but the book's text (p.76 and p.198) says import parity is the maximum price."}, {"paper": "BOOK", "n": "exam-1", "question": "On average, how much grain can be produced for each millimetre of water consumed?", "statements": [], "options": {"A": "10kg", "B": "15kg", "C": "20kg", "D": "25kg"}, "answer": "B", "uitleg": "Volgens die boek kan gemiddeld ongeveer 15 kg graan geproduseer word vir elke millimeter water wat verbruik word (mielies benodig 450-600 mm per seisoen).", "book_ref": "Exam Q1 p.204, answers p.208; 1.x p.8", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "According to the book, on average about 15 kg of grain can be produced for every millimetre of water used. (Maize needs 450-600 mm per season.)", "note_en": null}, {"paper": "BOOK", "n": "exam-2", "question": "Which of the following statements regarding the futures market and formal futures exchanges are correct?", "statements": ["i. Futures markets trade futures contracts where the commodity, quality, quantity, location and delivery period are customised.", "ii. Futures markets trade futures contracts where the commodity, quality, quantity, location and delivery period are standardised.", "iii. Commitments to make or accept delivery can be offset against each other so that actual physical delivery of the underlying does not take place.", "iv. Commitments to make or accept delivery may not be offset against each other and actual physical delivery of the underlying must take place."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Futures contracts is gestandaardiseer (commodity, quality, quantity, location en delivery period), nie customised nie, dus (ii). Verpligtinge kan teen mekaar ge-offset word, sodat fisiese aflewering meestal nie plaasvind nie, dus (iii).", "book_ref": "Exam Q2 p.204, answers p.208; 2.2 p.26", "topic": "Futures basics", "note": "Die boek se memo (p.208) sê A, maar dit weerspreek die boek se eie teks in 2.2. C is reg.", "data": null, "uitleg_en": "Futures contracts are standardised (commodity, quality, quantity, location and delivery period). They are not customised. So (ii) is correct. Obligations can be offset against each other, so physical delivery mostly does not take place. So (iii) is correct.", "note_en": "The book's memo (p.208) says A, but that contradicts the book's own text in section 2.2. C is correct."}, {"paper": "BOOK", "n": "exam-3", "question": "Which of the following is considered an advantage of forward contracts?", "statements": [], "options": {"A": "Because prices are locked in buyers can benefit from a sudden fall in prices", "B": "There is no default risk.", "C": "For the seller, income is deferred until delivery.", "D": "Contracts are flexible in terms of the size, quality and delivery time."}, "answer": "D", "uitleg": "Forwards is buigsaam wat grootte, kwaliteit en afleweringstyd betref. A is verkeerd (ingeslote pryse beteken kopers kan NIE baat by 'n prysdaling nie), B (default risk bestaan wel) en C is nadele.", "book_ref": "Exam Q3 p.204, answers p.208; 3.1.1-3.1.2 p.31", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "Forwards are flexible in terms of size, quality and delivery time, so D is the advantage. A is wrong: because the price is locked in, buyers can NOT benefit from a price fall. B (default risk does exist with forwards) and C are disadvantages, not advantages.", "note_en": null}, {"paper": "BOOK", "n": "exam-4", "question": "Calculate the present value of the storage cost on a 9-month forward contract on maize given the following information: Spot maize price R2 500 per ton; Interest rate 12.5% p.a.; Interest accrual quarterly compounded basis; Storage cost R160/ton payable after nine months; Convenience yield 5% of the spot price.", "statements": [], "options": {"A": "R125.00", "B": "R145.89", "C": "R146.49", "D": "R193.75"}, "answer": "B", "uitleg": "PVU = U(1+i/f)^(-n·f) = 160 × (1 + 0.125/4)^(-0.75×4) = 160 × 1.03125^(-3) = 160 / 1.09670 = R145.89. Die spotprys en convenience yield is afleiers.", "book_ref": "Exam Q4 p.205, answers p.208; formula 3.4", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "Discount the storage cost back to today: PVU = U(1+i/f)^(-n·f) = 160 × (1 + 0.125/4)^(-0.75×4) = 160 × 1.03125^(-3) = 160 / 1.09670 = R145.89. The spot price and convenience yield are distractors; you do not need them for this question.", "note_en": null}, {"paper": "BOOK", "n": "exam-5", "question": "The first day on which a short position holder may notify the JSE of its intention to deliver the commodity is referred to as:", "statements": [], "options": {"A": "First position day", "B": "First notice day", "C": "First delivery day", "D": "First allocation day"}, "answer": "A", "uitleg": "First position day is die eerste dag waarop die short-houer die JSE van sy voorneme om te lewer in kennis mag stel (4 besigheidsdae voor eerste afleweringsdag, die dag voor first notice day). First notice day is wanneer die delivery notice self ingedien word.", "book_ref": "Exam Q5 p.205, answers p.208; trading calendar p.58", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "First position day is the first day on which the short holder may notify the JSE that he intends to deliver. It is 4 business days before the first delivery day, and the day before first notice day. First notice day is when the delivery notice itself is submitted.", "note_en": null}, {"paper": "BOOK", "n": "exam-6", "question": "Which of the following statements regarding clearing are correct?", "statements": ["i. Bilateral clearing involves the clearing of transactions by the participants.", "ii. Standard OTC derivatives are usually between two financial institutions and are cleared through the Central Counterparty (CCP).", "iii. In the OTC derivatives market, collateral posted within a transaction is often referred to as margin.", "iv. Non-standard transactions are cleared bilaterally but are subject to regulation on the amount of collateral required."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Al vier stellings kom direk uit die boek: bilateral clearing deur die deelnemers self, standard OTC derivatives deur die CCP, collateral word margin genoem, en non-standard transaksies word bilateraal ge-clear maar met gereguleerde collateral.", "book_ref": "Exam Q6 p.205, answers p.208; 5.x p.91-92", "topic": "Other", "note": null, "data": null, "uitleg_en": "All four statements come straight from the book: (i) bilateral clearing is done by the participants themselves; (ii) standard OTC derivatives are cleared by the CCP; (iii) collateral is called margin; (iv) non-standard transactions are cleared bilaterally, but with regulated collateral.", "note_en": null}, {"paper": "BOOK", "n": "exam-7", "question": "An option where the holder has the right to purchase at any time during the life of the contract is called an –", "statements": [], "options": {"A": "European call option", "B": "European put option", "C": "American call option", "D": "American put option"}, "answer": "C", "uitleg": "Reg om te koop = call; enige tyd uitoefenbaar = American. European opsies kan net op vervaldatum uitgeoefen word.", "book_ref": "Exam Q7 p.206, answers p.208; 6.1.1 p.99", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "Right to buy = call. Can be exercised at any time = American. European options can only be exercised on the expiry date.", "note_en": null}, {"paper": "BOOK", "n": "exam-8", "question": "What does this diagram represent? (Diagram: profit on the vertical axis vs asset price at expiry; the line starts high on the left, slopes downward as the price rises, crosses zero and then runs flat below zero to the right.)", "statements": [], "options": {"A": "Basic payoff profile of a long put option", "B": "Basic payoff profile of a short put option", "C": "Basic payoff profile of a long call option", "D": "Basic payoff profile of a short call option"}, "answer": "A", "uitleg": "Wins styg soos die prys daal en die verlies is beperk (plat lyn onder nul = premie betaal) bo die strike. Dit is die payoff van 'n long put.", "book_ref": "Exam Q8 p.206 (diagram), answers p.208", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "Read the graph step by step. Profit rises as the price falls (left side). Above the strike, the line is flat below zero: the loss is limited to the premium paid. This is the payoff of a long put.", "note_en": null}, {"paper": "BOOK", "n": "exam-9", "question": "Who are the JSE Derivatives Rules binding on?", "statements": ["i. All members.", "ii. All officers of members.", "iii. All employees of members.", "iv. Any person who concludes a transaction with a member during the course of that member's business."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Die rules bind alle trading members, officers en employees, asook enige persoon wat 'n member se dienste gebruik of met hom 'n transaksie sluit. (Die directives bind net members, officers en employees.)", "book_ref": "Exam Q9 p.206, answers p.208; 8.1 p.173", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The rules bind all trading members, their officers and employees, and also any person who uses a member's services or does a transaction with a member. (By contrast, the directives bind only members, officers and employees.)", "note_en": null}, {"paper": "BOOK", "n": "exam-10", "question": "Which of the following statements regarding the general requirements of officers of members are correct? An officer -", "statements": ["i. must be of full legal capacity.", "ii. may not be an unrehabilitated insolvent.", "iii. may not have been disqualified by a court from acting as a director of a company.", "iv. must comply with the criteria of good character and integrity, as deemed fit by the JSE."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Rule 3.20 vereis almal: volle regsbevoegdheid, nie 'n ongerehabiliteerde insolvent nie, nie deur 'n hof as direkteur gediskwalifiseer nie, en goeie karakter en integriteit soos die JSE goedvind.", "book_ref": "Exam Q10 p.207, answers p.208; 8.2 rule 3.20 p.173-174", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Rule 3.20 requires all four. An officer must: have full legal capacity; not be an unrehabilitated insolvent; not be disqualified by a court from acting as a director; and be of good character and integrity, as the JSE decides.", "note_en": null}, {"paper": "IDK", "n": "F-01", "question": "A client sells 6 wheat futures contracts at R5 800 per ton. Assume the initial margin is calculated as 6.46% of the contract value, in line with Table 4.3. The total initial margin the client must deposit is", "statements": [], "options": {"A": "R224 808", "B": "R112 404", "C": "R18 734", "D": "R134 850"}, "answer": "B", "uitleg": "Wheat is 50 ton per contract: 6 x 50 x R5 800 x 6.46% = R112 404. R224 808 gebruik verkeerdelik 100 ton (die maize contract size); R18 734 is net een contract; R134 850 gebruik die white maize persentasie van 7.75%.", "book_ref": "4.6, Table 4.3, p.54", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "Wheat is 50 tons per contract. Initial margin = 6 x 50 x R5 800 x 6.46% = R112 404. Why the other options are wrong: R224 808 wrongly uses 100 tons (the maize contract size). R18 734 is only one contract. R134 850 uses the white maize percentage of 7.75%.", "note_en": null}, {"paper": "IDK", "n": "F-02", "question": "On Monday morning a feed manufacturer buys 4 yellow maize (YMAZ) futures contracts at R3 215 per ton. The marked-to-market (MTM) prices are shown in the table. The variation margin cash flow for the feed manufacturer on Wednesday is", "statements": [], "options": {"A": "+R10 400", "B": "-R17 200", "C": "+R17 200", "D": "+R4 300"}, "answer": "C", "uitleg": "VM op dag t = (MTM_t - MTM_t-1) x contract size x aantal contracts = (3 241 - 3 198) x 100 x 4 = +R17 200; long wen as prys styg. +R10 400 vergelyk verkeerdelik met die trade price (R3 215) i.p.v. Dinsdag se MTM; +R4 300 vergeet die 4 contracts; -R17 200 het die verkeerde teken.", "book_ref": "4.6, Table 4.4 and note, p.55-56", "topic": "Margining & MTM", "note": null, "data": "Day        MTM price (R/ton)\nMonday     3 230\nTuesday    3 198\nWednesday  3 241\nThursday   3 236", "uitleg_en": "Variation margin on day t = (MTM_t - MTM_t-1) x contract size x number of contracts. For Wednesday: (3 241 - 3 198) x 100 x 4 = +R17 200. It is positive because a long position gains when the price rises. Wrong options: +R10 400 wrongly compares with the trade price (R3 215) instead of Tuesday's MTM; +R4 300 forgets the 4 contracts; -R17 200 has the wrong sign.", "note_en": null}, {"paper": "IDK", "n": "F-03", "question": "A trader sells 2 white maize futures contracts at R3 000 per ton on Day 1 and deposits an initial margin of R15 000 per contract (R30 000 in total), which must be maintained as the minimum balance in his margin account. The MTM prices are given in the table. Ignoring interest and fees, the total amount of margin top-up payments the trader must make over Days 2 to 4 is", "statements": [], "options": {"A": "R14 000", "B": "R4 000", "C": "R10 000", "D": "R6 000"}, "answer": "D", "uitleg": "Short 2 x 100 t. Dag 2: +R8 000 VM -> balans R38 000. Dag 3: -R10 000 -> R28 000, top-up R2 000 -> R30 000. Dag 4: -R4 000 -> R26 000, top-up R4 000. Totaal top-ups = R6 000. R14 000 tel al die verliese as top-ups en ignoreer die surplus van R8 000 wat op dag 2 ontvang is (net soos die buyer in Table 4.4 net die tekort bo die initial margin inbetaal).", "book_ref": "4.6, Table 4.4, p.55-57", "topic": "Margining & MTM", "note": null, "data": "Day    MTM price (R/ton)\nDay 1  3 000\nDay 2  2 960\nDay 3  3 010\nDay 4  3 030", "uitleg_en": "The trader is short 2 contracts x 100 t. Day 2: +R8 000 variation margin, so the balance is R38 000. Day 3: -R10 000, so the balance drops to R28 000. He tops up R2 000 to get back to R30 000. Day 4: -R4 000, so the balance drops to R26 000. He tops up R4 000. Total top-ups = R2 000 + R4 000 = R6 000. The answer R14 000 counts every loss as a top-up and ignores the R8 000 surplus received on Day 2. (Compare the buyer in Table 4.4, who only pays in the shortfall below the initial margin.)", "note_en": null}, {"paper": "IDK", "n": "F-04", "question": "A soya bean futures contract trades at R8 000 per ton and the initial margin is R26 400 per contract. If the price moves by R120 per ton, this movement represents approximately what percentage of the total contract value and of the initial margin respectively?", "statements": [], "options": {"A": "1.5% and 22.7%", "B": "3.0% and 45.5%", "C": "22.7% and 1.5%", "D": "1.5% and 0.45%"}, "answer": "A", "uitleg": "Soya is 50 ton: contract value = 50 x R8 000 = R400 000; beweging = R120 x 50 = R6 000. R6 000/R400 000 = 1.5% en R6 000/R26 400 = 22.7%: dit is gearing. 3.0%/45.5% gebruik 100 ton vir die beweging; 0.45% deel net R120 (per ton) deur die margin en vergeet die contract size.", "book_ref": "4.6 (gearing), p.57", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "Soya is 50 tons per contract. Step 1: contract value = 50 x R8 000 = R400 000. Step 2: price movement in rand = R120 x 50 = R6 000. Step 3: R6 000/R400 000 = 1.5% of contract value, and R6 000/R26 400 = 22.7% of the margin. This difference is gearing. Wrong options: 3.0%/45.5% uses 100 tons for the movement. 0.45% divides only R120 (per ton) by the margin and forgets the contract size.", "note_en": null}, {"paper": "IDK", "n": "F-05", "question": "Which of the following statements regarding the determination of the daily marked-to-market (MTM) price of futures contracts on the JSE CDM are correct?", "statements": ["i. A volume weighted average price (VWAP) is used to calculate the MTM for all liquid contracts", "ii. A liquid futures contract is defined as any expiry that trades 100 or more contracts in the last half hour of trading", "iii. The settlement (MTM) price for the day is chosen at random by the exchange anytime during the final five minutes of trading", "iv. For illiquid contracts, the offer will be used as the MTM price if the offer is higher than the last traded price"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "B", "uitleg": "Volgens die boek word VWAP vir liquid contracts gebruik, 'n liquid contract handel 100 of meer contracts in die laaste halfuur, en die settlement price word ewekansig in die laaste vyf minute gekies. (iv) is vals: by 'n illiquid contract word die offer net gebruik as dit LAER as die laaste trade is (die bid as dit hoer is).", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "According to the book: (i) VWAP is used for liquid contracts; (ii) a liquid contract trades 100 or more contracts in the last half hour; (iii) the settlement price is taken from a random moment in the last five minutes. (iv) is false: for an illiquid contract the offer is only used if it is LOWER than the last trade (the bid is used if it is higher).", "note_en": null}, {"paper": "IDK", "n": "F-06", "question": "Which ONE of the following statements regarding margin on the JSE CDM is INCORRECT?", "statements": [], "options": {"A": "Only cash is accepted as margin", "B": "Margins are required from all participants to cover, on an ongoing basis, two days' worth of the market risk of their unsettled positions", "C": "In times of extreme volatility only the clearing members, and never the exchange or the clearing house, may make an intra-day margin call", "D": "Failure to honour a variation margin call within the prescribed time will result in the position being closed out by the member immediately"}, "answer": "C", "uitleg": "Die boek se: in tye van uiterste volatility kan BEIDE die exchange en die clearing house 'n intra-day margin call maak vir onmiddellike top-up. Die ander drie stellings kom woordeliks uit 4.6: slegs kontant, twee dae se market risk, en posisies word gesluit as 'n VM call nie betyds betaal word nie.", "book_ref": "4.6, p.54 and p.57", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "Statement C is the incorrect one. The book says that in times of extreme volatility BOTH the exchange and the clearing house can make an intra-day margin call for an immediate top-up. The other three statements come word for word from 4.6: margin is cash only, it covers two days' market risk, and positions are closed out if a VM call is not paid on time.", "note_en": null}, {"paper": "IDK", "n": "F-07", "question": "Which of the following statements regarding the JSE risk management structure and the clearing of futures are correct?", "statements": ["i. Once a trade has been matched and confirmed, JSE Clear becomes the counterparty to each trade, a process referred to as novation", "ii. Each trading member will carry its client's losses if the client defaults", "iii. Clearing members are responsible to guarantee against the default risk of the trading members for whom they clear", "iv. Because of novation, JSE Clear carries the default risk of every individual client directly, so trading members carry no risk for their clients"], "options": {"A": "(i), (ii) and (iii) only", "B": "(i) and (iv) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "A", "uitleg": "Novation beteken JSE Clear word die counterparty sodra 'n trade gematch en bevestig is; 'You stand good for your client': die trading member dra die klient se verliese en die clearing member staan in vir sy trading members. (iv) is vals: JSE Clear se risiko is dat 'n clearing member in default gaan; die onus le by clearing members wat dit na trading members deurgee.", "book_ref": "4.6, p.52-54", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "(i) Novation means JSE Clear becomes the counterparty as soon as a trade is matched and confirmed. (ii)/(iii) 'You stand good for your client': the trading member carries the client's losses, and the clearing member stands in for its trading members. (iv) is false: JSE Clear's risk is that a clearing member defaults. The onus lies with the clearing members, who pass it on to trading members.", "note_en": null}, {"paper": "IDK", "n": "F-08", "question": "A speculator buys 3 white maize futures contracts at R3 400 per ton and pays an initial margin of R12 000 per contract. During the following days he receives and pays variation margin, including R4 000 in margin top-up payments. He then closes out the position at R3 365 per ton and his remaining margin balance (including the initial margin) is repaid. Ignoring interest and fees, his total net cash flow over the period is", "statements": [], "options": {"A": "+R10 500", "B": "-R14 500", "C": "-R46 500", "D": "-R10 500"}, "answer": "D", "uitleg": "Die totaal van alle margin-kontantvloei moet gelyk wees aan die totale wins/verlies: (3 365 - 3 400) x 100 x 3 = -R10 500. Initial margin en top-ups kom terug saam met die surplus balans, so hulle is nie ekstra verliese nie (-R14 500 tel die top-up dubbel). -R46 500 vergeet dat die R36 000 initial margin terugbetaal word.", "book_ref": "4.6, Table 4.4, p.56-57", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "The total of all margin cash flows must equal the total profit or loss on the position: (3 365 - 3 400) x 100 x 3 = -R10 500. The initial margin and the top-ups are paid back with the remaining balance, so they are not extra losses. -R14 500 counts the R4 000 top-up twice. -R46 500 forgets that the R36 000 initial margin is repaid.", "note_en": null}, {"paper": "IDK", "n": "F-09", "question": "Assume the everyday price limit for wheat is R240/ton and the extended limit is R360/ton. September is the spot month, while December, March, May and July are hedging months with open interest. The MTM price movements over four days are given in the table. On which day will the extended limits first apply?", "statements": [], "options": {"A": "Day 2", "B": "Day 3", "C": "Day 4", "D": "Day 5"}, "answer": "C", "uitleg": "Extended limits word getrigger as twee of meer hedging months vir twee opeenvolgende dae in dieselfde rigting by die everyday limit MTM word; die spot month (Sep) tel nie. Dag 1: net Dec (1 hedging month). Dag 2: Dec en May; Dag 3: Mar en May -> twee dae agtereenvolgens, so extended limits geld vanaf Dag 4. Dag 3 is die lokval as jy Sep op Dag 1 meetel.", "book_ref": "8.14.1-8.14.2, Table 8.1, p.182-183", "topic": "Price discovery & limits", "note": null, "data": "Day    Sep(spot)  Dec    Mar    May    Jul\nDay 1  -R240      -R240  -R150  -R100  -R90\nDay 2  -R200      -R240  -R180  -R240  -R120\nDay 3  -R240      -R200  -R240  -R240  -R100\nDay 4  -R180      -R250  -R300  -R210  -R160", "uitleg_en": "Extended limits are triggered when two or more hedging months move by the everyday limit (MTM) in the same direction on two consecutive days. The spot month (Sep) does not count. Day 1: only Dec hits the limit (just 1 hedging month). Day 2: Dec and May. Day 3: Mar and May. So Days 2 and 3 are two consecutive qualifying days, and extended limits apply from Day 4. Day 3 is the trap answer: you get it if you wrongly count Sep on Day 1.", "note_en": null}, {"paper": "IDK", "n": "F-10", "question": "Extended price limits currently apply to white maize (everyday limit R150/ton, extended limit R225/ton). On a specific day the MTM price movements are: July (spot month) +R60, September +R180, December +R150, March +R120, May +R200 and July (next year) +R100. Which ONE of the following statements is correct?", "statements": [], "options": {"A": "Everyday limits return the next day because more than 50% of the hedging months were MTM at or below the everyday limit", "B": "Extended limits remain in place because only 60% of the hedging months were MTM at or below the everyday limit", "C": "Everyday limits return the next day because the spot month was MTM below the everyday limit", "D": "Extended limits remain in place because at least one hedging month was MTM above the everyday limit"}, "answer": "B", "uitleg": "Die spot month tel nie. Van die 5 hedging months is Dec (R150), Mar (R120) en Jul (R100) gelyk aan of onder R150: 3/5 = 60%. 'n Majority word gedefinieer as MEER as 65%, so extended limits bly. A gebruik die gewone 50%-meerderheid; D is vals want nie alle maande hoef onder die limit te wees nie.", "book_ref": "8.14.3, p.183", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "Step 1: the spot month does not count. Step 2: of the 5 hedging months, Dec (R150), Mar (R120) and Jul (R100) are at or below R150. That is 3/5 = 60%. Step 3: a majority is defined as MORE than 65%. 60% is not enough, so extended limits stay in place. A uses the ordinary 50% majority. D is false because not all months need to be below the limit.", "note_en": null}, {"paper": "IDK", "n": "F-11", "question": "Which of the following statements regarding daily price limits on the JSE CDM are correct?", "statements": ["i. Price limits and triggers apply to all hedging months where open interest exists, excluding the spot month", "ii. Extended limits are set at 150% of the original (everyday) limit", "iii. Extended price limits result in increased initial margin requirements for the periods when they apply", "iv. When a contract trades at its maximum limit, liquidity improves because both buyers and sellers are attracted to the market"], "options": {"A": "(i) and (ii) only", "B": "(ii), (iii) and (iv) only", "C": "(i) and (iv) only", "D": "(i), (ii) and (iii) only"}, "answer": "D", "uitleg": "Limits geld vir hedging months met open interest, uitgesluit die spot month; extended limits is 150% van die oorspronklike limit (bv. R150 -> R225 vir WMAZ) en lei tot hoer initial margin. (iv) is vals: as die mark by die limit handel, wil kopers of verkopers nie handel nie en die contract kan totaal illiquid raak.", "book_ref": "4.4, p.47-48; 4.6, p.55; 8.14.1, p.182", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "(i) Limits apply to hedging months with open interest, excluding the spot month. (ii)/(iii) Extended limits are 150% of the original limit (e.g. R150 -> R225 for WMAZ) and lead to higher initial margin. (iv) is false: when the market trades at the limit, buyers or sellers do not want to trade, and the contract can become totally illiquid.", "note_en": null}, {"paper": "IDK", "n": "F-12", "question": "During January the March white maize futures contract trades at R4 350/ton while the May contract trades at R3 980/ton. Which ONE of the following BEST describes this situation?", "statements": [], "options": {"A": "A normal old-crop/new-crop inversion: March reflects old crop that may be in short supply, while May reflects the incoming new crop", "B": "A carrying-charge (contango) market, as May includes storage and finance costs", "C": "A guaranteed arbitrage opportunity, since the later month must always trade higher than the earlier month", "D": "A breach of the daily price limit, which the JSE must correct by suspending trading in the March contract"}, "answer": "A", "uitleg": "Vir maize word die old-crop/new-crop spread deur die March en May contracts verteenwoordig; March (laaste maand van die bemarkingseisoen) kan hoer as May wees omdat ou oes skaars is en die nuwe oes pryse druk. Dit is 'n inverted mark, nie contango nie (B), en die boek noem dit 'n gereelde 'normal inversion', nie arbitrage nie.", "book_ref": "4.4, p.47", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "For maize, the old-crop/new-crop spread is represented by the March and May contracts. March is the last month of the marketing season. It can trade higher than May because old crop is scarce, while the incoming new crop pushes May prices down. This is an inverted market, not contango (B). The book calls it a regular 'normal inversion', not arbitrage.", "note_en": null}, {"paper": "IDK", "n": "F-13", "question": "In November the March white maize futures trades at R4 100/ton and the May futures at R3 900/ton. A trader expects the (far crop minus near crop) spread to decrease further and trades 5 contracts on each leg accordingly. In February he closes both legs when March trades at R4 180/ton and May at R3 920/ton. Which position did he take and what is his total profit or loss?", "statements": [], "options": {"A": "Bought the spread (long May, short March); profit of R30 000", "B": "Sold the spread (short May, long March); profit of R30 000", "C": "Sold the spread (short May, long March); profit of R15 000", "D": "Bought the spread (long May, short March); profit of R40 000"}, "answer": "B", "uitleg": "Spread = far - near; om te wen as dit daal, verkoop jy die spread: short far (May), long near (March). Long March: +R80/t; short May: -R20/t; netto +R60/t x 100 t x 5 = R30 000 (spread het van -R200 na -R260 gedaal). R15 000 gebruik 50 ton; om die spread te koop sou 'n verlies van R30 000 gee.", "book_ref": "7.2.1, p.159-160; 4.4, p.47", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "Spread = far - near. To profit when the spread falls, you sell the spread: short the far month (May), long the near month (March). Long March: +R80/t. Short May: -R20/t. Net +R60/t x 100 t x 5 = R30 000. (The spread fell from -R200 to -R260.) R15 000 wrongly uses 50 tons. Buying the spread would give a loss of R30 000.", "note_en": null}, {"paper": "IDK", "n": "F-14", "question": "The December yellow maize contract is illiquid: only 40 contracts traded in the last half hour of trading. The last trade was at R3 450/ton. At the random sample taken in the last five minutes of trade the best bid is R3 462/ton and the best offer is R3 470/ton, with no further trades. The MTM price will be", "statements": [], "options": {"A": "R3 450", "B": "R3 466", "C": "R3 470", "D": "R3 462"}, "answer": "D", "uitleg": "Minder as 100 contracts in die laaste halfuur = illiquid. As die bid HOER as die laaste trade is, word die bid die MTM: R3 462. Die offer (R3 470) word net gebruik as dit LAER as die laaste trade is; die midpoint R3 466 en VWAP-gebaseerde antwoorde geld nie vir illiquid contracts nie.", "book_ref": "4.6, p.56", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "Fewer than 100 contracts in the last half hour means the contract is illiquid. For illiquid contracts: if the bid is HIGHER than the last trade, the bid becomes the MTM. Here the bid R3 462 > last trade R3 450, so MTM = R3 462. The offer (R3 470) is only used if it is LOWER than the last trade. The midpoint R3 466 and VWAP-based answers do not apply to illiquid contracts.", "note_en": null}, {"paper": "IDK", "n": "F-15", "question": "A newly listed futures expiry has no open positions at the start of the day. During the day the following trades occur, in this order: (1) A buys 10 contracts from B, both opening new positions; (2) C buys 4 contracts from D, both opening new positions; (3) D buys 6 contracts from A. What are the open interest and the trading volume at the end of the day?", "statements": [], "options": {"A": "Open interest 20; volume 20", "B": "Open interest 14; volume 20", "C": "Open interest 10; volume 20", "D": "Open interest 10; volume 40"}, "answer": "C", "uitleg": "Open interest = aantal long (of short) posisies wat nog oop is. Na trade 3: A long 4, C long 4, D long 2 (was short 4, koop 6) = 10 long; B short 10. Volume = 10 + 4 + 6 = 20 contracts. 14 vergeet dat trade 3 posisies sluit; 40 tel elke kant van die trade apart.", "book_ref": "4.1.3, p.41-42", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "Open interest = the number of long (or short) positions still open. Track each trader after trade 3: A is long 4 (bought 10, sold 6). C is long 4. D is long 2 (was short 4, then bought 6). Total long = 10. B is short 10, which matches. Volume = 10 + 4 + 6 = 20 contracts. The answer 14 forgets that trade 3 closes positions. The answer 40 counts each side of every trade separately.", "note_en": null}, {"paper": "IDK", "n": "F-16", "question": "The spot (delivery month) price of white maize is R3 600/ton while the December futures contract trades at R3 450/ton. Which ONE of the following statements is correct?", "statements": [], "options": {"A": "The market is in backwardation, which can be caused by a negative cost of carry due to a high convenience yield", "B": "The market is in contango because the futures price includes financing and storage costs", "C": "The market is in backwardation because storage and financing costs exceed the convenience yield", "D": "The market is in contango because the net cost of carry is positive"}, "answer": "A", "uitleg": "Futures onder spot = backwardation; dit gebeur by 'n negatiewe net cost of carry weens 'n hoe convenience yield. Contango (B, D) is wanneer futures bo spot is met 'n positiewe cost of carry. C is verkeerd om: as storage en finansiering die convenience yield oorskry, is cost of carry positief (contango).", "book_ref": "4.1.2, p.41", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "Futures below spot = backwardation. This happens when the net cost of carry is negative because of a high convenience yield. Contango (B, D) is when futures are above spot, with a positive cost of carry. C is the wrong way round: if storage and financing exceed the convenience yield, the cost of carry is positive (contango).", "note_en": null}, {"paper": "IDK", "n": "F-17", "question": "Speculator Pietie buys 8 wheat futures contracts at R6 100/ton, expecting prices to rise. Shortly before expiry he offsets his position at R5 940/ton. Ignoring fees, his total profit or loss on the position is", "statements": [], "options": {"A": "-R128 000", "B": "+R64 000", "C": "-R1 280", "D": "-R64 000"}, "answer": "D", "uitleg": "(R5 940 - R6 100) x 50 t x 8 contracts = -R64 000; 'n long verloor as die prys daal. -R128 000 gebruik 100 ton (maize se size); -R1 280 vergeet die contract size; +R64 000 het die verkeerde teken.", "book_ref": "4.3.2, p.45; Table 4.9, p.65", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "Profit/loss = (R5 940 - R6 100) x 50 t x 8 contracts = -R64 000. A long position loses when the price falls. Wrong options: -R128 000 uses 100 tons (the maize contract size, not wheat); -R1 280 forgets the contract size; +R64 000 has the wrong sign.", "note_en": null}, {"paper": "IDK", "n": "F-18", "question": "Which of the following statements regarding JSE silo receipts are correct?", "statements": ["i. A silo receipt is a transferable but non-negotiable document that certifies the quantity and quality of stock in a registered silo", "ii. A silo receipt is only finally cancelled when it is given back to a storage employee for the actual product's outloading", "iii. The producer who delivered the grain into the silo guarantees the quality and quantity of the stock covered by the receipt", "iv. After receiving physical delivery through the JSE, the long position holder has three months to access the delivery from the storage operator or take steps to ensure that a good delivery was made"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "B", "uitleg": "'n Silo receipt is transferable maar non-negotiable, en word eers finaal gekanselleer wanneer dit vir outloading aan die storage employee teruggegee word; die long het drie maande om die aflewering te kontroleer. (iii) is vals: die approved storage operator (nie die producer nie) waarborg die kwaliteit en hoeveelheid.", "book_ref": "4.5.2, p.49-51", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "A silo receipt is transferable but non-negotiable. It is only finally cancelled when it is handed back to the storage employee for outloading. The long has three months to check the delivery. Statement (iii) is false: the approved storage operator (not the producer) guarantees the quality and quantity.", "note_en": null}, {"paper": "IDK", "n": "F-19", "question": "A short position holder in the July white maize contract submits a valid delivery notice, including the electronic silo receipt, to the exchange at 13h30 on Tuesday 14 July. Which ONE of the following statements is correct?", "statements": [], "options": {"A": "The contracts are closed at Wednesday's MTM price and delivery takes place on Wednesday", "B": "The contracts are closed at the original trade price and delivery takes place on Tuesday", "C": "The contracts are closed at Tuesday's MTM price, adjusted for items such as outstanding storage costs and location differentials, and delivery takes place on Wednesday", "D": "The contracts are closed at Tuesday's MTM price and delivery takes place on the last business day of July"}, "answer": "C", "uitleg": "Physical delivery loop oor twee besigheidsdae: notice day (kennisgewing voor 14h15) en dan delivery day (volgende besigheidsdag). Die contracts word gesluit teen die closing MTM price op notice day, aangepas vir storage costs, VAT (waar van toepassing), location differentials, grade premiums/discounts en basis premiums. Woensdag se MTM (A) is verkeerd want die prys word op n
