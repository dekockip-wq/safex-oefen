cts", "body": "<p><b>Theoretical (fair) futures price<\/b> = spot plus interest to close-out; for grain, add storage:<\/p><p><code>F0 = S0 (1 + i/f)^(n x f)<\/code> and <code>F0 = (S0 + U)(1 + i/f)^(n x f)<\/code>, where U = PV of storage.<\/p><p>The actual price comes from supply and demand; fair value tells you if arbitrage exists. <b>EMH<\/b>: weak form (past prices already in the price), semi-strong (all public information), strong (even inside information). Behavioural finance says prices can drift from fair value through biases.<\/p><p><b>Foreign-referenced contracts<\/b> (SARB approval June 2008) are <b>cash settled in rand<\/b>. CBOT corn (from 2009) 100 t; Chicago wheat 50 t; soya beans 100 t; meal 100 t; oil 25 t; KCBT wheat 25 t. Crude oil (WTIO) 100 US barrels (NYMEX: 1 000), a diesel hedge for farmers who <b>buy<\/b> it. Gold and platinum 10 troy oz, silver 500, copper 2 500 lb. <b>Quanto futures<\/b> mimic a USD price in rand at a fixed exchange rate: no currency risk.<\/p>", "example": "<p>Gold R1 000/g, 1-year futures R1 160, rate 15%.<\/p><p><code>Fair value = 1 000 x 1.15 = R1 150<\/code>. Borrow R1 000, buy gold, sell futures at R1 160, repay R1 150: <code>arbitrage profit = R10<\/code>.<\/p>", "remember": ["Fair value = (S0 + U)(1 + i/f)^(nf)", "Weak = past prices; semi-strong = public info; strong = all info incl. insider", "JSE corn and other foreign contracts: cash settled in RAND", "JSE gold contract = 10 troy oz; crude = 100 barrels"], "trap": "Self-test traps: farmers hedge fuel by BUYING crude futures (not selling); JSE crude is 100 barrels (not 1 000); US corn is cash settled in rand (not dollars); a gold quanto is NOT affected by the rand-dollar rate.", "check": {"q": "Which form of the EMH says even insiders cannot make abnormal profits from their information?", "a": "The strong form: all information, public and private, is already in the price."}, "ref": "4.9, 4.10, 4.11, p.77-86"}]}, {"chapter": 5, "title": "Commodity swaps", "intro": "A swap is basically a string of cash-settled forwards glued together. Expect 2-3 exam questions here: the jargon (reset periods, notional principal), why SA grain users avoid swaps, and the zero-value-at-inception pricing rule.", "cards": [{"title": "What a commodity swap is", "body": "<p>A simple <b>fixed-for-floating commodity swap<\/b> is an agreement between two counterparties to exchange cash flows based on a <b>fixed price<\/b> for a commodity for cash flows based on a <b>floating (variable) price<\/b> for the same commodity.<\/p><ul><li>Cash flows are exchanged regularly over predefined intervals, for a period of one year or more.<\/li><li>Those intervals are called <b>reset periods<\/b>: between one and six months, with <b>quarterly<\/b> resets the most common.<\/li><li>The amount on which the fixed and floating flows are calculated is the <b>notional principal<\/b>.<\/li><li>Swaps are <b>always cash settled<\/b>: neither the physical commodity nor the notional principal is ever exchanged.<\/li><\/ul><p>So think of a swap as <b>a series of cash-settling forward contracts<\/b>. The point is to transfer <b>price risk<\/b>, not ownership of the product.<\/p>", "example": null, "remember": ["Reset periods: 1 to 6 months, quarterly most common", "Notional principal = the amount the flows are calculated on; it is never exchanged", "Swap = a series of CASH-settling forwards (not physically settled futures)", "A swap exchanges cash flows, not commodities"], "trap": "Paper 1 option A: 'a series of physical settled futures contracts'. Wrong twice: swaps are cash settled, and they are like forwards (OTC), not futures. The self-test also says 'exchange commodities in the future' = False; it is cash flows.", "check": {"q": "What do you call the intervals on which swap cash flows are exchanged, and what is the most common one?", "a": "Reset periods; quarterly is the most common (range 1 to 6 months)."}, "ref": "5.2, p.89"}, {"title": "The oil swap: who pays whom", "body": "<p>A refinery and an oil producer agree on a 12-month swap on a notional of <b>100 000 barrels<\/b> of WTI crude:<\/p><ul><li>Refinery pays the producer a <b>fixed $102/barrel<\/b> each month.<\/li><li>Producer pays the refinery the <b>floating<\/b> price: the CME WTI futures MTM on the reset date (last business day of each month).<\/li><\/ul><p>In practice <b>only the difference is paid<\/b>. Each side still buys or sells physical oil in the spot market, so each effectively trades at $102 no matter where oil goes.<\/p><p><b>Jargon:<\/b> the refinery <b>bought<\/b> the swap (it pays fixed, fearing rising prices). The producer <b>sold<\/b> the swap (it receives fixed, fearing falling prices). The swap does the same job as a forward.<\/p><p>Via a <b>swap dealer<\/b> (a bank) neither side knows the other; the dealer earns a bid-offer spread, e.g. pays the producer $101.75, receives $102.25 from the refinery = <b>$0.50/barrel<\/b>.<\/p>", "example": "<p>End of March WTI futures close at <b>$103.50<\/b>.<\/p><ul><li>Difference: $103.50 - $102.00 = <b>$1.50/barrel<\/b><\/li><li>Floating &gt; fixed, so the producer (floating payer) pays the refinery: $1.50 x 100 000 = <b>$150 000<\/b><\/li><li>Refinery: buys spot at about $103.50, gets $1.50 back = effective <b>$102<\/b><\/li><li>Producer: sells spot at $103.50, pays $1.50 away = effective <b>$102<\/b><\/li><\/ul>", "remember": ["Buyer of a swap = pays FIXED, receives floating (the consumer/user)", "Seller of a swap = receives FIXED, pays floating (the producer)", "Only the net difference changes hands on each reset date", "Dealer spread example: $101.75 / $102.25 = $0.50 per barrel"], "trap": "Don't flip buyer and seller. 'Buy' refers to the fixed leg: the buyer PAYS fixed.", "check": {"q": "On a reset date the floating price is below the fixed price. Who pays whom?", "a": "The user (buyer, fixed payer) pays the hedge provider the difference, but buys the physical product cheaper, so its net cost stays fixed."}, "ref": "5.2 and 5.6, p.90 and p.93"}, {"title": "Why SA grain buyers don't use swaps", "body": "<p>Swaps are big in the US oil market but are <b>not really used<\/b> in the local agricultural market. Large SA grain consumers prefer <b>physical delivery contracts such as forwards<\/b>.<\/p><p>Example: a big chicken producer agrees with a grain supplier (Farmwise, Cargill, Senwes) to take <b>20 000 tons of maize a month for 6 months at a fixed price<\/b>, paying only on delivery. The supplier hedges by <b>buying JSE CDM futures<\/b>: if maize rises it loses on the forward but gains on the long futures, and vice versa.<\/p><p><b>The main reason: accounting (IFRS).<\/b> Cash-settled derivatives (swaps, futures, options) must be carried on the balance sheet at <b>fair value<\/b>, with changes going through the income statement. That marking-to-market causes misleading volatility in reported earnings. Fixed-price <b>physical-delivery forwards do not<\/b> have to be marked to market in the income statement.<\/p>", "example": null, "remember": ["Large SA grain consumers prefer physical forwards over cash-settled swaps", "Reason: IFRS fair-value rules for cash-settled derivatives cause earnings volatility", "Physical-delivery forwards escape MTM in the income statement", "Farmers CAN in principle use swaps, e.g. for assets not traded on exchanges (self-test: True)"], "trap": "'Commodity swaps are very popular hedging instruments for South African producers and users' is FALSE. Popular globally, not locally.", "check": {"q": "Give the main reason large listed grain users avoid cash-settled swaps.", "a": "IFRS accounting: cash-settled derivatives must be fair-valued with changes in the income statement, creating complex reporting and misleading earnings volatility."}, "ref": "5.3, p.91"}, {"title": "Regulation of OTC swaps", "body": "<p>Before the <b>2007-2008 financial crisis<\/b> the OTC market was mostly unregulated. OTC trades can be cleared:<\/p><ul><li><b>Bilaterally<\/b>: by the participants themselves.<\/li><li><b>Centrally<\/b>: a central counterparty (<b>CCP<\/b>) stands between the two parties as clearing house.<\/li><\/ul><p>In OTC markets the word <b>margin<\/b> also means the collateral posted in the transaction.<\/p><p>Now: <b>standard<\/b> OTC derivatives (usually between two financial institutions) are cleared through a CCP and need both <b>variation and initial margin<\/b>. <b>Non-standard<\/b> ones are cleared bilaterally but are regulated on the amount of collateral.<\/p><p>SA updated the <b>Financial Markets Act Regulations 2016<\/b> to meet <b>G20<\/b> obligations. Recommendations: more standardisation, central clearing, trading standardised contracts on exchanges or electronic platforms, and reporting to <b>trade repositories<\/b>. In the USA, <b>physical delivery commodity forwards are exempted<\/b>.<\/p>", "example": null, "remember": ["Bilateral clearing = by the parties; central clearing = via a CCP", "Standard OTC derivatives: CCP-cleared, initial + variation margin", "SA: Financial Markets Act Regulations 2016 (G20 obligations)", "USA: physical-delivery commodity forwards exempted from the reforms"], "trap": null, "check": {"q": "Which SA regulations were updated for OTC derivatives, and why?", "a": "The Financial Markets Act Regulations 2016, to meet SA's G20 obligations on regulating OTC markets."}, "ref": "5.4, p.91-92"}, {"title": "Two types of swap", "body": "<p>There are two broad types:<\/p><ul><li><b>Fixed-for-floating<\/b>: one side pays a fixed price and receives a floating price; the other side does the opposite. Like a fixed-for-floating interest rate swap. The floating side can be a <b>single commodity price<\/b> or an <b>index<\/b> of commodity prices. Most are cash settled, but <b>physical delivery swaps also exist<\/b>.<\/li><li><b>Commodity-for-interest<\/b>: the <b>total return on the commodity<\/b> is exchanged for a <b>money market rate plus/minus a spread<\/b>. Like an equity swap but on a commodity. E.g. an oil producer pays the bank the total return on a notional volume of oil and receives a floating interest rate on the same notional.<\/li><\/ul><p><b>Reference rates:<\/b> LIBOR is being retired. US: <b>SOFR<\/b>. UK: <b>SONIA<\/b> (end of 2021). SA used <b>JIBAR<\/b>, ending in 2024; <b>ZARONIA<\/b> is the candidate replacement, with the SARB making the final decision.<\/p>", "example": null, "remember": ["Fixed-for-floating and commodity-for-interest are the two types", "Commodity-for-interest: commodity total return vs money market rate +/- spread", "Floating leg can be one commodity or an index", "LIBOR replaced by SOFR (US) and SONIA (UK); JIBAR to ZARONIA (SA)"], "trap": "Book says 'most' fixed-for-floating swaps are cash settled, while also saying swaps are 'always cash settled' by nature. For the exam: swaps settle in cash; physical delivery swaps are the exception.", "check": {"q": "In a commodity-for-interest swap, what does the producer pay and receive?", "a": "Pays the total return on the commodity (on the notional) and receives a floating money market interest rate on the same notional."}, "ref": "5.5, p.92-93"}, {"title": "Pros, cons and production risk", "body": "<table><tr><th>Advantages<\/th><th>Disadvantages<\/th><\/tr><tr><td>Lower transaction cost<\/td><td>Limited liquidity<\/td><\/tr><tr><td>Flexibility in terms of exposure<\/td><td>Counterparty risk<\/td><\/tr><tr><td>Customised<\/td><td>Complexity and lack of transparency<\/td><\/tr><tr><td><\/td><td>Production risk<\/td><\/tr><\/table><p>Swaps are simple, give <b>longer-term<\/b> protection, and as OTC products offer flexible maturity and size with <b>no daily margining<\/b> like futures. That last point is also the downside: <b>credit risk<\/b> (though the 2010 US rules now force many swaps to be cleared and marked to market).<\/p><p><b>Production risk<\/b> still exists even with no physical delivery: if your crop fails you still owe on the swap.<\/p>", "example": "<p>A wheat farmer sells a swap at <b>R4 000/t<\/b> (receives fixed). Drought: no crop. Wheat swaps rise to <b>R5 000/t<\/b>.<\/p><ul><li>He must pay floating minus fixed: R5 000 - R4 000 = <b>R1 000/t<\/b> on the hedged portion<\/li><li>And he has no crop to sell at the high price. Double pain.<\/li><\/ul>", "remember": ["Advantages: lower cost, flexible exposure, customised", "Disadvantages: limited liquidity, counterparty risk, complexity/opacity, production risk", "No daily margining = flexibility but credit risk", "Swaps are OTC, NOT exchange traded"], "trap": "Paper 3: 'Since commodity swaps are exchange traded, they are very liquid' is FALSE. They are OTC and liquidity is limited.", "check": {"q": "Why does a swap still carry production risk if nothing is delivered?", "a": "Because you still owe the cash difference if prices rise; if your crop fails you have the swap loss without the higher-priced crop to offset it (e.g. R1 000/t in the drought example)."}, "ref": "5.6, p.93-94"}, {"title": "Pricing a swap: zero value at inception", "body": "<p>The <b>basic principle<\/b>: a swap must have <b>zero value at inception<\/b>. The present value of all cash outflows must equal the present value of all inflows.<\/p><p>Steps for a simple fixed-for-floating swap:<\/p><ul><li>Use futures prices for each reset date as estimates of the floating flows.<\/li><li>Discount each with the reference rate for that maturity (simple interest): <code>PV = Float / (1 + i x n)<\/code><\/li><li>Find the single fixed price <code>Fix<\/code> whose PV equals the floating PV: <code>Fix = PV(floating) / sum of discount factors<\/code><\/li><\/ul>", "example": "<p>9-month WTI swap, 3 quarterly resets. Futures: 3m $110.80, 6m $113.10, 9m $117.40. Rates: 3.0%, 3.2%, 3.5%.<\/p><ul><li>Factors: 1 + 0.03 x 3/12 = 1.0075; 1 + 0.032 x 6/12 = 1.016; 1 + 0.035 x 9/12 = 1.02625<\/li><li>PV floating = 110.80/1.0075 + 113.10/1.016 + 117.40/1.02625 = 109.9752 + 111.3189 + 114.3971 = <b>$335.6912<\/b><\/li><li>Sum of 1/factor = 0.9926 + 0.9843 + 0.9744 = <b>2.9512<\/b><\/li><li>Fix = 335.6912 / 2.9512 = <b>about $113.75<\/b> (the book shows $113.74 in the working, then quotes $113.75)<\/li><\/ul><p>The buyer pays $113.75 fixed on each reset date and receives the WTI futures MTM.<\/p>", "remember": ["Swap value at inception = ZERO (not positive)", "PV of fixed flows = PV of floating flows", "Floating flows estimated from futures prices; discounted at reference rates", "Book example answer: about $113.75 per barrel"], "trap": "Paper 3 option: 'the swap must have a POSITIVE value at inception'. Wrong: zero.", "check": {"q": "Why is the fixed price ($113.75) higher than the first futures price ($110.80)?", "a": "The fixed price is a single level whose PV matches all three floating flows ($110.80, $113.10, $117.40); with rising futures it lands in between."}, "ref": "5.7, p.94-96"}, {"title": "Correlation: hedging the unhedgeable", "body": "<p>Sometimes there is <b>no listed contract<\/b> to use as the floating reference. Example: a road construction company wants to hedge <b>bitumen<\/b> (a crude oil by-product). No bitumen contract exists.<\/p><p>An OTC trader can still quote a swap by using <b>correlation<\/b>: how closely bitumen prices move with a widely traded product such as <b>crude oil<\/b>. They make assumptions about the stability and volatility of the correlation and \"shade\" the price.<\/p><p>The dealer sold you the swap (must pay you floating bitumen), so they hedge by going <b>long crude oil futures<\/b>. If correlation stays near 100%, gains and losses offset.<\/p><p>But the dealer <b>cannot hedge the correlation risk itself<\/b>. If bitumen rises faster than crude, the dealer pays you more on the swap than it makes on its long crude futures.<\/p>", "example": null, "remember": ["Correlation = degree to which two prices move in harmony", "Used to price OTC hedges where no listed reference exists (bitumen vs crude)", "The market maker CANNOT hedge correlation risk", "Dealer short a bitumen swap hedges with LONG crude oil futures"], "trap": null, "check": {"q": "What goes wrong for the dealer if bitumen rises much faster than crude oil?", "a": "Its loss on the swap (paying you the higher bitumen price difference) exceeds its gain on the long crude oil futures, because the correlation broke down."}, "ref": "5.7.1, p.96"}]}, {"chapter": 6, "title": "Options", "intro": "Options are the biggest examinable block after futures: about 8-10 questions on the past papers cover calls/puts, moneyness, time vs intrinsic value, volatility, margining cash flows and put-call parity. Master the numbers here and you bank serious marks.", "cards": [{"title": "Calls, puts, holders and writers", "body": "<p>Forwards, futures and swaps share price risk equally. An <b>option<\/b> gives the <b>buyer the right but not the obligation<\/b>, so it completely transfers the price risk from buyer to seller. The buyer pays a <b>premium<\/b> for this.<\/p><ul><li><b>Call<\/b>: right to <b>buy<\/b> the underlying futures contract at the <b>strike (exercise) price<\/b>.<\/li><li><b>Put<\/b>: right to <b>sell<\/b> the underlying futures at the strike.<\/li><li>The <b>buyer/holder<\/b> (long) has rights; the <b>writer/grantor/seller<\/b> (short) has obligations if exercised.<\/li><\/ul><table><tr><th>On exercise<\/th><th>Call<\/th><th>Put<\/th><\/tr><tr><td>Buyer gets<\/td><td>Long futures<\/td><td>Short futures<\/td><\/tr><tr><td>Writer gets<\/td><td>Short futures<\/td><td>Long futures<\/td><\/tr><\/table><p>Every bought option is matched by someone writing the same option. A put and a call are <b>not<\/b> opposite sides of the same trade. Organised option exchanges began in <b>1973<\/b> when CBOT formed the <b>CBOE<\/b>.<\/p>", "example": "<p>Wheat put, strike <b>R1 900/t<\/b> at harvest:<\/p><ul><li>Market at R1 800: exercise, sell at R1 900<\/li><li>Market at R2 000: don't exercise, sell in the market<\/li><\/ul>", "remember": ["Long put exercised = SHORT futures for the holder", "Long call exercised = LONG futures for the holder", "Writer of a call = sold the right to buy (obliged to sell)", "Options on JSE CDM grain have a futures contract as underlying"], "trap": "Paper 3 Q24: 'originally SOLD the right to BUY' = writer of a CALL, not writer of a put. Ask: which right was sold?", "check": {"q": "A farmer holds a long put and exercises it. What futures position does he get, and what does the writer get?", "a": "Farmer gets a short futures position at the strike; the writer is assigned a long futures position."}, "ref": "6.1, 6.4 and 6.6.1, p.98-99, 102-103, 110"}, {"title": "American, European, exchange and OTC", "body": "<ul><li><b>American<\/b>: exercise any time up to expiry.<\/li><li><b>European<\/b>: exercise only on the expiry date.<\/li><li><b>Bermudan<\/b>: on specific dates up to maturity (not discussed further).<\/li><\/ul><p><b>JSE grain options are all American.<\/b> Most exchange-traded options are American, but the book analyses European ones because they are easier.<\/p><p><b>Exchange vs OTC<\/b>. Exchange options:<\/p><ul><li>are <b>guaranteed against default risk<\/b><\/li><li>trade <b>electronically<\/b> (system matches bids and offers)<\/li><li>are <b>revalued daily<\/b>: holders and writers settle the daily change in option value; premiums are not paid upfront (except warrants on the JSE main board)<\/li><\/ul><p>OTC options are non-standardised, had a thinner secondary market, and <b>cannot be sold to third parties<\/b>. Exchange-traded holders can sell to a new buyer.<\/p><p>JSE CDM options exist on white maize, yellow maize, white and yellow maize grade 2, wheat, sunflower seed and soya beans.<\/p>", "example": "<p>Limpopo farmer buys an American <b>call<\/b> on his neighbour's land: strike <b>R1 550/ha<\/b>, premium <b>R50/ha<\/b>, 6 months. He can buy any time in the 6 months, let it lapse, or (if transferable) sell it on.<\/p>", "remember": ["American = any time to expiry; European = expiry only", "JSE CDM grain options are American", "Exchange options: no default risk, electronic, revalued daily", "OTC options cannot be sold to third parties"], "trap": "Self-test: 'A long put on white maize may be exercised any time until expiry' = TRUE, because JSE options are American.", "check": {"q": "Name three differences between exchange-traded and OTC options.", "a": "Exchange options are guaranteed against default, traded electronically, and revalued (settled) daily; OTC ones are bilateral, non-standard and can't be sold to third parties."}, "ref": "6.1.1, 6.4.1, 6.9, p.99, 103, 117-118"}, {"title": "Options as insurance, and minimum price contracts", "body": "<p>An option is like an <b>insurance policy<\/b>: you pay a premium for protection against adverse price moves while keeping the upside.<\/p><p>A <b>minimum price contract (MPC)<\/b> guarantees the farmer a minimum price at harvest but lets him share in price increases. No upfront cash for the farmer, but the cost is built in: the minimum price offered is <b>lower than the futures price<\/b>, because the contract seller hedges by <b>buying a call<\/b> and offsets the call premium against the minimum price.<\/p><p><b>Key difference:<\/b> an MPC is structured as a <b>forward<\/b>, so the farmer <b>must physically deliver<\/b> (or buy grain in the cash market, or pay a penalty). An option holder has <b>no obligation<\/b>.<\/p><p><b>Benefits of agricultural options:<\/b> flexibility, versatility (profit from volatility or time changes even without a view on direction), extra hedging opportunities, risk limitation (buyer's loss limited to premium), liquidity (JSE CDM) and implied supervision (exchange audit trail).<\/p>", "example": null, "remember": ["MPC = forward with a built-in floor; delivery is compulsory", "MPC seller hedges by BUYING A CALL", "MPC minimum price is below the futures price (call cost built in)", "Option buyer's maximum loss = premium"], "trap": "Don't treat an MPC as an option: the farmer has an obligation to deliver.", "check": {"q": "Why is the minimum price in an MPC lower than the current futures price?", "a": "The contract seller buys a call to hedge and deducts that call premium from the minimum price offered."}, "ref": "6.1.2, 6.1.3, 6.2, p.100-101"}, {"title": "Payoff profiles and breakeven", "body": "<table><tr><th>Position<\/th><th>Max profit<\/th><th>Max loss<\/th><\/tr><tr><td>Long call<\/td><td>Unlimited<\/td><td>Premium<\/td><\/tr><tr><td>Short call<\/td><td>Premium<\/td><td>Unlimited<\/td><\/tr><tr><td>Long put<\/td><td>Strike - premium (futures can only fall to zero)<\/td><td>Premium<\/td><\/tr><tr><td>Short put<\/td><td>Premium<\/td><td>Large but limited (futures can only fall to zero)<\/td><\/tr><\/table><p><b>Breakeven<\/b> = futures price where the gain on exercise equals the premium:<\/p><ul><li>Call: <code>strike + premium<\/code><\/li><li>Put: <code>strike - premium<\/code><\/li><\/ul><p>Writer and holder are mirror images. Writing a put carries (in theory) <b>less<\/b> market risk than writing a call. ITM options cost more than OTM ones; an OTM option needs a bigger price move before it becomes profitable.<\/p>", "example": "<p>Dec maize put, strike <b>R800<\/b>, premium <b>R45<\/b>.<\/p><ul><li>Breakeven = R800 - R45 = <b>R755<\/b><\/li><li>Below R755 the holder is sure of a profit<\/li><li>Above R800 the put expires worthless: loss = R45 (plus commission)<\/li><\/ul>", "remember": ["Long call/put: max loss = premium paid", "Short call: limited profit, unlimited loss", "Call breakeven = strike + premium; put breakeven = strike - premium", "Writing a put is less risky (in theory) than writing a call"], "trap": "Self-test: 'The maximum a long call holder can GAIN is the premium' = FALSE. That is his maximum LOSS.", "check": {"q": "Strike R2 000 call, premium R80. At what futures price does the holder break even at expiry?", "a": "R2 080 (strike + premium)."}, "ref": "6.4.2, 6.4.3, 6.5, p.103-109"}, {"title": "Intrinsic value and moneyness", "body": "<p><b>Intrinsic value<\/b> = what you'd get by exercising right now. It can <b>never be negative<\/b> (minimum zero).<\/p><ul><li>Call: <code>max(0, futures - strike)<\/code><\/li><li>Put: <code>max(0, strike - futures)<\/code><\/li><\/ul><table><tr><th><\/th><th>Call<\/th><th>Put<\/th><\/tr><tr><td>In-the-money (ITM)<\/td><td>Futures &gt; Strike<\/td><td>Futures &lt; Strike<\/td><\/tr><tr><td>At-the-money (ATM)<\/td><td>Futures = Strike<\/td><td>Futures = Strike<\/td><\/tr><tr><td>Out-of-the-money (OTM)<\/td><td>Futures &lt; Strike<\/td><td>Futures &gt; Strike<\/td><\/tr><\/table><p>ITM = has intrinsic value. OTM = no intrinsic value (and cheaper).<\/p><p>When a long OTM call's futures price <b>falls<\/b>, the option moves further OTM and its value <b>decreases<\/b>. A rising futures price raises call premiums; a falling futures price raises put premiums.<\/p>", "example": "<p>Wheat, strike <b>R3 200<\/b>:<\/p><ul><li>Futures R3 300: call intrinsic = 3 300 - 3 200 = <b>R100<\/b>; put intrinsic = <b>R0<\/b><\/li><li>Futures R3 100: put intrinsic = 3 200 - 3 100 = <b>R100<\/b> (sell to writer at R3 200, buy back on JSE at R3 100)<\/li><\/ul>", "remember": ["Call ITM when futures > strike; put ITM when futures < strike", "Intrinsic value can never be negative", "ITM options cost more than OTM options", "OTM call + futures falling = value decreases (further OTM)"], "trap": "Swap the logic for puts: a put with strike ABOVE the futures price is in the money. On payoff-diagram questions, check whether the futures price sits left or right of the strike.", "check": {"q": "May wheat futures trade at R3 300. Is a R3 400 put ITM or OTM, and what is its intrinsic value?", "a": "ITM: futures (R3 300) < strike (R3 400). Intrinsic value = R100."}, "ref": "6.3, 6.4.4, 6.4.5, p.101, 106-107"}, {"title": "Premium = intrinsic value + time value", "body": "<p><code>Premium = intrinsic value + time value<\/code><\/p><p><b>Time value<\/b> (also called <b>extrinsic value<\/b>) is what the buyer pays above intrinsic value, for the chance the option gains value before expiry. It reflects the risk the writer bears. If the option has no intrinsic value, the whole premium is time value.<\/p><p><b>Time decay<\/b>:<\/p><ul><li>More time to expiry = more time value.<\/li><li>Time value is <b>zero at expiry<\/b>; the premium is then intrinsic value only.<\/li><li>It does <b>not<\/b> erode in a straight line: it follows a <b>negative exponential curve<\/b>. Minimal early on (3 months or more), <b>precipitous in the last month<\/b>.<\/li><\/ul>", "example": "<p><b>1.<\/b> R750 Dec maize put, premium <b>R50<\/b>, futures <b>R740<\/b>:<\/p><ul><li>Intrinsic = 750 - 740 = <b>R10<\/b>; time value = 50 - 10 = <b>R40<\/b><\/li><li>On 100 t: total R5 000 = R1 000 intrinsic + R4 000 time value<\/li><\/ul><p><b>2.<\/b> R800 put, premium <b>R45<\/b>, futures <b>R820<\/b>: OTM by R20, intrinsic <b>R0<\/b>, time value <b>R45<\/b>.<\/p><p><b>3.<\/b> (Paper 3 style) R800 call, premium <b>R50<\/b>, futures <b>R820<\/b>: intrinsic = 820 - 800 = <b>R20<\/b>; time value = 50 - 20 = <b>R30<\/b>.<\/p>", "remember": ["Time value = premium - intrinsic value", "OTM option: premium is 100% time value", "Time value = 0 at expiry", "Decay is exponential, fastest in the last month"], "trap": "Paper 1 Q27: R850 PUT, premium R50, futures R880. The put is OTM, so intrinsic = R0 and time value = R50. Don't calculate 880 - 850 = R30 as intrinsic value: that would be the call's.", "check": {"q": "R2 300 call, premium R90, futures R2 300. Split the premium.", "a": "ATM: intrinsic R0, time value R90."}, "ref": "6.3, 6.7, p.101-102, 111-112"}, {"title": "What drives the premium, and the Greeks", "body": "<p>Option premiums depend on:<\/p><ul><li>market price of the underlying<\/li><li>volatility<\/li><li>interest rates<\/li><li>strike price (moneyness)<\/li><li>time until expiration<\/li><li>supply and demand (premium is discovered by auction)<\/li><\/ul><table><tr><th>Greek<\/th><th>Measures premium sensitivity to<\/th><\/tr><tr><td><b>Delta<\/b><\/td><td>underlying futures price<\/td><\/tr><tr><td><b>Gamma<\/b><\/td><td>underlying futures price on the <i>delta<\/i> itself<\/td><\/tr><tr><td><b>Theta<\/b><\/td><td>time to expiration<\/td><\/tr><tr><td><b>Vega<\/b><\/td><td>volatility (not actually a Greek letter)<\/td><\/tr><tr><td><b>Rho<\/b><\/td><td>interest rate<\/td><\/tr><\/table><p>Delta <b>increases<\/b> as an option goes deeper ITM and <b>decreases<\/b> as it goes deeper OTM. <b>Delta is the most important Greek<\/b>, because changes in the other components also affect delta.<\/p><p><b>Interest rates<\/b> (minimal effect on ag options): higher rates make options <b>cheaper<\/b>, lower rates make them dearer. The buyer's financing cost rises; the writer earns more on the premium.<\/p><p><b>Black-Scholes (1973)<\/b> prices European options on a non-dividend share, assuming constant volatility: <code>C = SN(d1) - Ke<sup>-rt<\/sup>N(d2)<\/code>.<\/p>", "example": null, "remember": ["Delta = change in premium per change in futures price", "Gamma = change in delta; theta = time; vega = volatility; rho = interest", "Delta is the most important Greek", "Higher interest rates mean cheaper options"], "trap": "Vega is not a Greek letter, but it is still counted among 'the Greeks'. Also: higher interest rates make options cheaper, not dearer.", "check": {"q": "Which Greek measures how fast delta changes when the futures price moves?", "a": "Gamma."}, "ref": "6.7, 6.7.1, p.111-115"}, {"title": "Volatility: the fear factor", "body": "<p><b>Volatility<\/b> measures the size of price changes in the underlying futures. It is usually the <b>annualised standard deviation<\/b> of the % change in daily price. It is often described as the <b>probability of the option expiring in the money<\/b>, and it is the <b>most important input<\/b> to the premium. The volatility used is forward-looking <b>implied volatility<\/b>.<\/p><p>Higher volatility = higher time value (writers want more for the risk).<\/p><ul><li><b>Time value is highest ATM<\/b>: most uncertainty about ending ITM. Deep ITM and deep OTM options have little time value.<\/li><li><b>ITM<\/b>: intrinsic value isn't affected by volatility, so a 10% volatility change may move the premium only about 2%.<\/li><li><b>ATM<\/b>: price is <b>directly proportional<\/b> to volatility (same % change).<\/li><li><b>OTM<\/b>: a volatility change has a <b>marked effect<\/b>, the biggest proportionally.<\/li><\/ul><p><b>SAVI White Maize<\/b>: a JSE <b>3-month forward-looking<\/b> index, based on <b>ATM<\/b> volatility of the near and next-near expiries. It is high in <b>January-March<\/b> (weather), at times <b>over 60%<\/b>. A volatility index is a general <b>inverse<\/b> sentiment indicator.<\/p>", "example": "<p>Paper 1 Q28 logic: four puts, underlying <b>R90<\/b>, strikes R80/R90/R100/R110. The R80 put is OTM (strike &lt; price), so it gains the most time value <b>proportionally<\/b> when volatility rises. For calls with underlying R100, the OTM one is the R110 call.<\/p>", "remember": ["Time value is highest for ATM options", "Volatility up: OTM premium changes most proportionally; ATM in direct proportion; ITM least (about 2% per 10%)", "SAVI White Maize: 3-month forward-looking, based on ATM volatility", "SAVI White Maize is high in Jan-Mar (self-test: 'low' = False)"], "trap": "Don't mix up 'most time value in Rand' (ATM) with 'proportionally gains most from a volatility rise' (OTM). Read the question word 'proportionally'.", "check": {"q": "Underlying R100. Which call gains most, proportionally, if volatility rises: strike R80, R100 or R110?", "a": "R110, the OTM call: a volatility change has the most marked effect on OTM option prices."}, "ref": "6.3, 6.7(i), 6.7(iii), 6.13, p.102, 112-114, 136-137"}, {"title": "Hedging with options: farmer's minimum price", "body": "<p>Three steps:<\/p><ul><li><b>Contract month<\/b>: the option expiring closest to when you sell or buy the physical crop. JSE grain options expire <b>5 business days before the month preceding the futures expiry month<\/b>.<\/li><li><b>Type<\/b>: producers (farmers) <b>buy puts<\/b>; feedlots, millers and bakers <b>buy calls<\/b>.<\/li><li><b>Strike<\/b>: sets the farmer's minimum selling price or the miller's maximum buying price. ITM options cost more.<\/li><\/ul><p>Costs: premium, interest on financing the premium, commissions and fees, plus the <b>location differential<\/b> (transport).<\/p><p><code>MSP = Strike - premium - interest cost - commissions - location differential<\/code> (ignoring silo premium)<\/p><p>The buyer of a put sets a floor without giving up upside. The buyer of a call sets a ceiling without giving up the benefit of falling prices.<\/p>", "example": "<p>Farmer John, 1 000 t of maize in July. He buys <b>10<\/b> July puts (each option has 1 futures contract underlying), strike <b>R2 000<\/b>, premium <b>R80<\/b>, fees <b>R10<\/b>, interest R80 x 10% x 6/12 = <b>R4<\/b>, location differential <b>R105<\/b>.<\/p><ul><li>MSP = 2 000 - 80 - 4 - 10 - 105 = <b>R1 801/t<\/b><\/li><li>If maize rises to R2 300: let the put lapse; net = 2 300 - 80 - 4 - 10 - 105 = <b>R2 101/t<\/b><\/li><\/ul>", "remember": ["Farmer fears price falls: BUY PUTS (not sell calls or puts)", "Miller/feedlot fears price rises: BUY CALLS", "MSP = strike - premium - interest - commission - location differential", "Grain options expire 5 business days before the month preceding futures expiry"], "trap": "Papers 1 and 3 Q29/Q37: 'short call' or 'short put, receive the premium upfront' are tempting distractors. Writing options gives no protection. The farmer who wants a floor plus upside takes a LONG PUT.", "check": {"q": "Strike R2 000, premium R80, interest R4, fees R10, location differential R105. What is the MSP?", "a": "R1 801/t."}, "ref": "6.6, 6.8, p.109, 115-117"}, {"title": "Getting out: expire, exercise or offset", "body": "<p>Three ways to exit:<\/p><ul><li><b>Let it expire<\/b>: you lose only premium and fees.<\/li><li><b>Exercise<\/b>: the buyer initiates; the exchange creates a futures position at the strike for the buyer and the opposite for a <b>randomly selected<\/b> writer. The option falls away and a futures contract with all its obligations is created.<\/li><li><b>Offset<\/b>: sell an identical option (same strike and expiry). This is the <b>only way to recover remaining time value<\/b>, so for ITM options with time left, offsetting is usually better (exercising also may cost extra brokerage). For a writer, offsetting removes the risk of being assigned.<\/li><\/ul><p><b>JSE rules:<\/b> strike intervals of <b>R20/t<\/b>. A call is deemed ITM at expiry if futures trade <b>R0.20/t above<\/b> the strike. ITM options are <b>automatically exercised<\/b> by the exchange at expiry.<\/p><p>Liquidity risk: OTM or near-expiry options may have no active market to offset in.<\/p>", "example": "<p>Farmer buys a R2 300 Dec white maize call (ATM) for <b>R90<\/b>. Futures rise to <b>R2 450<\/b>.<\/p><ul><li>Exercise: long futures at R2 300, sell at R2 450 = <b>+R150<\/b><\/li><li>Net = 150 - 90 = <b>+R60<\/b><\/li><li>Writer: short at R2 300, buys back at R2 450 = -R150, plus R90 premium = <b>-R60<\/b><\/li><\/ul>", "remember": ["Exit options: let expire, exercise, offset", "Offsetting is the only way to capture remaining time value", "ITM at expiry = automatic exercise by the JSE (call ITM if R0.20/t above strike)", "Strike intervals: R20/t"], "trap": "Self-test: 'When an ITM long call expires the owner has no further obligation' = FALSE. It is auto-exercised and he is assigned a long futures position.", "check": {"q": "Your put is ITM with two weeks of time value left. Why offset rather than exercise?", "a": "Exercise only yields intrinsic value; selling the option captures intrinsic plus remaining time value (and avoids extra commission)."}, "ref": "6.6.1, 6.8, p.109-111, 115-117"}, {"title": "Option margining: buyer's daily cash flow", "body": "<p>JSE options are <b>marked to market daily<\/b>. The buyer does <b>not<\/b> pay the full premium upfront; it is collected over the life of the option. The buyer is guaranteed <b>never to pay more than the traded premium<\/b> from their own funds. The MTM premium comes from Black-Scholes at that day's futures MTM and volatility.<\/p><p>Two formulas:<\/p><ul><li><code>VM<sub>t<\/sub> = P<sub>t<\/sub> - P<sub>t-1<\/sub><\/code> (variation margin = change in premium)<\/li><li><code>CF<sub>t<\/sub> = VM<sub>t<\/sub> - (IM<sub>t<\/sub> - IM<sub>t-1<\/sub>)<\/code> (net bank cash flow = VM minus change in initial margin)<\/li><\/ul><p>The <b>writer<\/b> pays variation margin rand for rand as the option moves against them, and initial margin <b>never more than the futures initial margin<\/b>. On 10 March the writer's IM was <b>R92<\/b>, R20 more than the buyer's.<\/p>", "example": "<p>Peter buys a July YMAZ <b>700 call at R60<\/b> (futures R727, volatility 30%).<\/p><table><tr><th>Date<\/th><th>Premium<\/th><th>IM<\/th><th>VM<\/th><th>CF<\/th><th>Cumulative<\/th><\/tr><tr><td>1 Mar<\/td><td>R67<\/td><td>R50<\/td><td>67-60 = +7<\/td><td>7-(50-0) = -43<\/td><td>-43<\/td><\/tr><tr><td>2 Mar<\/td><td>R83<\/td><td>R59<\/td><td>+16<\/td><td>16-9 = +7<\/td><td>-36<\/td><\/tr><tr><td>10 Mar<\/td><td>R115<\/td><td>R72<\/td><td>+32<\/td><td>32-13 = +19<\/td><td>-17<\/td><\/tr><tr><td>10 May<\/td><td>R24<\/td><td>R22<\/td><td>-91<\/td><td>-91-(-50) = -41<\/td><td>-58<\/td><\/tr><tr><td>10 Jun<\/td><td>R2<\/td><td>R0<\/td><td>-22<\/td><td>-22-(-22) = 0<\/td><td>-58<\/td><\/tr><\/table><p>Total paid so far: R58. The last R2 is paid by expiry, so R60 in total, never more.<\/p>", "remember": ["VM = today's premium - yesterday's premium", "Net cash flow = VM - change in initial margin", "Long option holder never pays more than the premium bought at", "Writer: IM never more than the futures IM, plus full variation margin"], "trap": "Day 1 uses the TRADED premium as P0 (R60), and IM0 = 0. Sign check: a rise in IM is a cash OUTflow for the buyer.", "check": {"q": "Premium moves from R83 to R115 and IM from R59 to R72. What is the buyer's net cash flow?", "a": "VM = +32; change in IM = +13; CF = 32 - 13 = +R19 (inflow)."}, "ref": "6.3, 6.10, p.102, 118-121"}, {"title": "Put-call parity", "body": "<p>Put, call and underlying prices must be consistent, otherwise arbitrageurs would lock in riskless profit. First described by <b>Hans Stoll<\/b> (1969).<\/p><p>Portfolio 1: call + cash of PV(strike). Portfolio 2: put + the underlying. At expiry both are worth <b>max(S<sub>T<\/sub>, X)<\/b>, so they must be equal today:<\/p><p><code>S + p = c + K(1 + r)<sup>-t<\/sup><\/code><\/p><p>Rearranged: <code>c = p + S<sub>0<\/sub> - K/(1 + r)<sup>t<\/sup><\/code> or <code>c - p = S<sub>0<\/sub> - PV(K)<\/code>.<\/p><p><b>Conditions:<\/b> same underlying, same strike, same maturity (and volatility), European (no early exercise), no dividends. If you know any three, you can find the fourth. For grain, the underlying is the futures contract.<\/p>", "example": "<p>Wheat futures <b>R3 100<\/b>, strike <b>R3 000<\/b>, 3 months, 10% p.a., put <b>R140<\/b> (volatility 38% isn't needed).<\/p><ul><li>PV(K) = 3 000 / (1 + 0.10/4) = 3 000 / 1.025 = <b>R2 927<\/b><\/li><li>c = 140 + 3 100 - 2 927 = <b>R313<\/b><\/li><\/ul>", "remember": ["S + p = c + PV(K)", "c = p + S - PV(K); p = c + PV(K) - S", "Same underlying, strike, maturity; European; no dividends", "Book PV uses K / (1 + r x months/12)"], "trap": "Discount the STRIKE, not the futures price, and use the period fraction (3 months = r/4). Volatility is a red herring input in the calculation.", "check": {"q": "Futures R3 100, strike R3 000, PV(K) = R2 927, call = R313. What should the put cost?", "a": "p = c + PV(K) - S = 313 + 2 927 - 3 100 = R140."}, "ref": "6.11, p.122-124"}, {"title": "Synthetic positions: covered call and protective put", "body": "<p>The four basic profiles and their market views:<\/p><table><tr><th>Position<\/th><th>Pay-off<\/th><th>View<\/th><\/tr><tr><td>Long call<\/td><td>Limited risk, unlimited reward<\/td><td>Bullish<\/td><\/tr><tr><td>Long put<\/td><td>Limited risk, limited (but high) reward<\/td><td>Bearish<\/td><\/tr><tr><td>Short call<\/td><td>Limited reward, unlimited risk<\/td><td>Bearish, earn premium<\/td><\/tr><tr><td>Short put<\/td><td>Limited reward, high but not unlimited risk<\/td><td>Bullish, earn premium<\/td><\/tr><\/table><p>Memory key: <b>long + short = flat<\/b>; <b>long + flat = long<\/b>; <b>short + flat = short<\/b>.<\/p><ul><li><b>Covered call<\/b> = long futures + write a call (same expiry) = <b>synthetic short put<\/b>. Use when you expect a flat, low-volatility market. You earn the premium but lose if futures fall sharply.<\/li><li><b>Protective put<\/b> = long futures + buy a put = <b>synthetic long call<\/b>. This is the insurance idea.<\/li><li><b>Synthetic long put<\/b> = short futures + buy a call. Useful for a farmer who has sold futures but fears a rally.<\/li><\/ul><p>When the number of options equals the number of futures, the hedge is <b>static<\/b>. Progressively selling futures as the price falls is <b>dynamic hedging<\/b> (delta hedging, chapter 7).<\/p>", "example": null, "remember": ["Covered call (long futures + short call) = synthetic SHORT PUT", "Protective put (long futures + long put) = synthetic LONG CALL", "Short futures + long call = synthetic LONG PUT", "Static = equal numbers of options and futures; dynamic = adjusting futures as price moves"], "trap": "Paper 1 Q32 offers 'synthetic short call' and 'synthetic short put'. Decode the diagram: long futures + short call gives a short-put shape (flat on top, sloping loss to the left).", "check": {"q": "You hold long futures and buy a put with the same expiry. What synthetic position do you have?", "a": "A synthetic long call: limited risk, unlimited reward."}, "ref": "6.12.1, p.124-129"}, {"title": "Spreads: bull, bear, butterfly, calendar", "body": "<p>A <b>spread<\/b> means buying and selling the <b>same type<\/b> of option (calls with calls, or puts with puts).<\/p><ul><li><b>Vertical<\/b>: same expiry, different strikes.<\/li><li><b>Horizontal (calendar)<\/b>: same strike, different expiries.<\/li><\/ul><table><tr><th>Spread<\/th><th>How<\/th><th>View<\/th><\/tr><tr><td><b>Bull<\/b><\/td><td>Buy the LOW strike, sell the HIGH strike (\"buy low, sell high\")<\/td><td>Price up, but not a lot<\/td><\/tr><tr><td><b>Bear<\/b><\/td><td>Buy the HIGH strike, sell the LOW strike (\"buy high, sell low\")<\/td><td>Price down, but not a lot<\/td><\/tr><tr><td><b>Butterfly<\/b><\/td><td>Buy X1 and X3 calls, sell 2 X2 calls; net outlay close to zero<\/td><td>Price stays near X2 (low volatility)<\/td><\/tr><tr><td><b>Calendar<\/b><\/td><td>Sell the near call (e.g. July), buy the far call (e.g. September), same strike<\/td><td>Needs an initial cash outlay<\/td><\/tr><\/table><p>Bull, bear and butterfly spreads all have <b>limited risk and limited reward<\/b>. Bull and bear spreads can use calls or puts. Higher strike = cheaper call but dearer put. The butterfly loses if futures end below X1 or above X3.<\/p>", "example": null, "remember": ["Spread = same option type bought and sold", "Vertical = different strikes; horizontal/calendar = different expiries", "Bull: buy low strike, sell high; bear: buy high strike, sell low", "Butterfly: 4 options, bets on low volatility around X2"], "trap": "A bull spread can be built with PUTS too (still buy the low strike, sell the high strike). Don't assume bull = calls and bear = puts.", "check": {"q": "You buy a R2 400 put and sell a R2 300 put, same expiry. Which spread is this?", "a": "A bear spread: you buy the higher strike and sell the lower one."}, "ref": "6.12.2, p.129-133"}, {"title": "Straddles, strangles and collars", "body": "<p>A <b>combination<\/b> buys (or sells) a call <b>and<\/b> a put together.<\/p><ul><li><b>Long (bottom) straddle<\/b>: buy a call and a put with the <b>same strike and expiry<\/b>. Limited risk, unlimited reward. Use it when you expect a big move but don't know the direction.<\/li><li><b>Short (top) straddle<\/b>: sell the call and the put. This is a bet on a quiet market.<\/li><li><b>Long strangle<\/b>: buy a call at the higher strike X2 and a put at the lower strike X1, same maturity. It costs <b>less<\/b> than a straddle and is a bullish view on volatility. It only makes money once futures move above X2 or below X1.<\/li><\/ul><p><b>Collar (min-max)<\/b>: long underlying + <b>long put<\/b> (X1) + <b>short call<\/b> (higher X2). The call premium offsets the put cost; with equal premiums it is a <b>zero cost collar<\/b>. Limited risk, limited reward. Net value never below <code>X1 - cost of collar<\/code> and never above <code>X2 - cost of collar<\/code>. A farmer gets a floor and gives up the upside above X2.<\/p>", "example": null, "remember": ["Straddle = call + put, SAME strike; strangle = DIFFERENT strikes (cheaper)", "Long straddle/strangle: expect big move, direction unknown", "Collar = long underlying + long put (low strike) + short call (high strike)", "Zero cost collar: put and call premiums equal"], "trap": "Paper 3 Q32 asks you to pick straddle vs strangle, long vs short. A V-shape with ONE kink point = straddle; a flat bottom between two strikes = strangle. Profit on big moves = long; profit in the middle = short.", "check": {"q": "What is the difference between a long straddle and a long strangle?", "a": "Both buy a call and a put. The straddle uses the same strike; the strangle uses a higher call strike and lower put strike, so it's cheaper but needs a bigger move."}, "ref": "6.12.3, 6.12.4, p.133-136"}, {"title": "JSE option contract specifications", "body": "<p>Specs change regularly, so the book refers you to the latest versions on the JSE website. What you must know:<\/p><ul><li><b>Local grain options<\/b> on the JSE CDM: white maize, yellow maize, white &amp; yellow maize (grade 2), wheat (Randfontein reference point), sunflower seed and soya beans.<\/li><li><b>Options on foreign-referenced futures<\/b>: Chicago corn, Chicago wheat, KCBT hard red winter wheat, CBOT soya beans, CBOT soya bean meal and CBOT soya bean oil.<\/li><li>Options on foreign-referenced <b>metals<\/b> futures: copper, gold, platinum, silver and palladium.<\/li><\/ul><p>Key spec facts from the chapter:<\/p><ul><li>The underlying is <b>1 futures contract<\/b> per option.<\/li><li>Grain options are <b>American<\/b>.<\/li><li>Strike intervals are <b>R20/t<\/b>.<\/li><li>Options expire <b>5 business days before the month preceding the futures expiry month<\/b>.<\/li><li>ITM options are <b>automatically exercised<\/b> at expiry; a call counts as ITM if futures are <b>R0.20/t above the strike<\/b>.<\/li><\/ul>", "example": null, "remember": ["Local grain options: WMAZ, YMAZ, grade 2 maize, wheat, sunflower seed, soya beans", "1 option = 1 futures contract underlying", "American style; R20/t strike intervals", "Auto-exercise if ITM at expiry (call: R0.20/t above strike)"], "trap": null, "check": {"q": "Is a R2 570 strike possible on a JSE maize option?", "a": "No. Strikes go in R20/t intervals, so a strike must be a multiple of 20 (e.g. R2 560 or R2 580)."}, "ref": "6.14, plus 6.6 and 6.6.1, p.109-111, 138"}]}, {"chapter": 7, "title": "Practical applications of commodity futures and options", "intro": "This is where the theory turns into money: how farmers, millers and bakers actually hedge, how spreads and delta hedging work, and why a hedge is never quite perfect. Expect several calculation and 'who does what' questions from here.", "cards": [{"title": "Hedgers vs speculators, and why people hedge", "body": "<p>A <b>hedger<\/b> has an interest in the actual commodity (farmer selling, miller buying). A <b>speculator<\/b> has no interest in the commodity and only wants to profit from price moves, up or down. A <b>hedge<\/b> is an opposite position in futures to your cash position: cash and futures prices tend to move together, so a loss in one is roughly offset by a gain in the other.<\/p><p>Who needs which protection:<\/p><ul><li><b>Farmers<\/b>: against falling crop prices (or rising feed costs)<\/li><li><b>Merchandisers/elevators<\/b>: against lower prices while they hold grain<\/li><li><b>Processors/feed makers<\/b>: against rising raw material costs<\/li><li><b>Exporters<\/b>: against <b>higher<\/b> prices for grain contracted for future delivery but not yet purchased<\/li><li><b>Importers<\/b>: want to take advantage of <b>lower<\/b> prices for grain contracted but not yet received<\/li><\/ul><p>Reasons to hedge: protect profit margins, stabilise (lock in) cash flows, transfer risk, diversify, improve liquidity or reduce transaction costs.<\/p>", "example": null, "remember": ["Hedging is possible because cash and futures prices generally change in the same direction by similar amounts (not identical amounts).", "Objectives of hedging: protect margins, lock in cash flows, transfer risk, diversify. NOT 'increase exposure'.", "Exporter fears HIGHER prices (sold grain he hasn't bought yet).", "The threat of delivery stops speculators from controlling the market."], "trap": "Exam options say an exporter hedges against LOWER prices, or that hedging means you'll always beat the neighbour who didn't hedge. Both wrong: the exporter fears higher prices, and a hedge locks a price, it doesn't guarantee the best price.", "check": {"q": "A farmer's crop is still in the field. Is his cash position long, short or neutral?", "a": "Long. He's in the same position as someone holding the crop: he gains if prices rise and loses if they fall."}, "ref": "7.1.1, p.141-142; 7.8 quiz p.169-170"}, {"title": "Long hedge (buyer) and short hedge (seller)", "body": "<p>Your first futures trade is always the <b>opposite<\/b> of your natural cash position.<\/p><ul><li><b>Long (buying) hedge<\/b>: a miller, feedlot or baker is naturally <b>short<\/b> the product (always needs to buy). He <b>buys futures<\/b> to protect against rising prices. Mike's mill goes long 3 September maize contracts at R2 000/t.<\/li><li><b>Short (selling) hedge<\/b>: a farmer is naturally <b>long<\/b> the product. She <b>sells futures<\/b> to protect against falling prices. Lebo sells July maize at R2 000/t.<\/li><\/ul><p>Later both close out (do the opposite futures trade) and buy/sell the physical maize in the spot market. Whatever the price does, the futures profit or loss offsets the spot price, so the effective price stays at R2 000/t.<\/p>", "example": "<p><b>Lebo (short hedge):<\/b> sells July futures at R2 000. In July futures = spot = R1 900.<\/p><ul><li>Buys back futures at R1 900: profit 2 000 - 1 900 = <b>+R100/t<\/b><\/li><li>Sells maize in spot market: <b>R1 900/t<\/b><\/li><li>Effective price: 1 900 + 100 = <b>R2 000/t<\/b><\/li><\/ul><p>If July went to R3 000 instead: futures loss -R1 000, spot R3 000, effective price still <b>R2 000/t<\/b>.<\/p><p><b>Mike (long hedge):<\/b> buys Sep at R2 000; Sep goes to R2 100. Futures profit +R100, pays R2 100 in spot, net cost <b>R2 000/t<\/b>.<\/p>", "remember": ["Long hedge = long futures to protect an existing SHORT physical position (a buyer/user).", "Short hedge = short futures to protect a LONG physical position (a producer).", "Wheat producer = hedger + long the underlying.", "Baker hedging input costs at R2 600 goes LONG and profits on futures if wheat rises to R2 700."], "trap": "'A long hedge because the farmer is long maize' sounds neat but is wrong. A farmer who is long maize does a SHORT hedge. Watch which market the question asks about: a wheat user is SHORT in the physical market but LONG in the futures (derivatives) market. A wheat producer is the opposite: long physical, short futures.", "check": {"q": "A farmer wants to protect against a sudden fall in maize prices. Which hedge and why?", "a": "A short hedge (sell futures), because he is long maize in the physical market."}, "ref": "7.1.1-7.1.3, p.142-146"}, {"title": "The full cash-flow picture: offset vs deliver", "body": "<p>The Bethlehem wheat farmer shorts 40 December wheat contracts (2 000 t, 50 t each) at R2 000/t. Costs: initial margin R100/t, brokerage R5/t per trade, basis -R140 (location differential R110 + handling R30). In December futures = R1 600.<\/p><p>Two ways out:<\/p><ul><li><b>Offset<\/b>: buy back futures, sell wheat in the local spot market at <code>S = F + B<\/code>.<\/li><li><b>Deliver<\/b>: deliver to a JSE registered silo; pay JSE delivery charges (R100/contract = R2/t) and silo certificate fee (R2/t); JSE pays futures minus R140.<\/li><\/ul><p>Key formula: <code>Net cash flow = F1 + B2<\/code> or <code>= S2 + variation margin<\/code>. Initial margin goes out and comes back, so it nets to zero. With a constant basis the futures price at expiry does not matter: R1 600 or R2 500, the farmer nets the same.<\/p>", "example": "<p><b>Offset, F = R1 600:<\/b><\/p><table><tr><td>Initial margin<\/td><td>-100<\/td><\/tr><tr><td>Brokerage x2<\/td><td>-10<\/td><\/tr><tr><td>Variation margin (2 000 - 1 600)<\/td><td>+400<\/td><\/tr><tr><td>Margin back<\/td><td>+100<\/td><\/tr><tr><td>Spot sale 1 600 - 140<\/td><td>+1 460<\/td><\/tr><tr><td><b>Net<\/b><\/td><td><b>R1 850/t<\/b><\/td><\/tr><\/table><p>x 2 000 t = <b>R3 700 000<\/b>.<\/p><p><b>Deliver:<\/b> same, minus R2 delivery charge and R2 silo certificate = <b>R1 846/t<\/b> = R3 692 000 (R8 000 less).<\/p><p><b>Baker (long hedge) in Bela-Bela<\/b>, basis -R100, F = R1 600: -100 -5 -400 -5 -1 500 +100 = <b>-R1 910/t<\/b> (-R3 820 000). Taking delivery in Bethlehem (basis -R140): <b>-R1 872/t<\/b>, but he must still pay transport to Bela-Bela.<\/p>", "remember": ["Net cash flow = F1 + B2 (= S2 + variation margin).", "Basis = S - F, so S = F + B; basis 'under' is negative.", "Bethlehem farmer: offset R1 850/t, deliver R1 846/t (JSE R2 delivery + R2 silo cert).", "JSE delivery charge R100 per contract (wheat 50 t = R2/t)."], "trap": "Don't forget initial margin comes BACK; it is not a cost. And brokerage is charged on both the opening and closing trade.", "check": {"q": "Why is the delivery route R4/t worse than offsetting for the Bethlehem farmer?", "a": "JSE physical delivery charge (R2/t) plus the silo certificate fee to the storage operator (R2/t). R4 x 2 000 = R8 000."}, "ref": "7.1.4, p.147-151"}, {"title": "Basis changes: who wins, who loses", "body": "<p>With a constant basis the hedge locks the price. When the <b>basis changes<\/b>, the offset route's result changes.<\/p><ul><li><b>Basis strengthens (narrows)<\/b>: less negative / 'less under', e.g. -R140 to -R110. Spot rises relative to futures.<\/li><li><b>Basis weakens (widens)<\/b>: more negative / 'more under'.<\/li><\/ul><p>The <b>short hedger<\/b> (seller, farmer) is short futures and therefore <b>long the basis<\/b>: benefits when the basis <b>strengthens<\/b>. The <b>long hedger<\/b> (buyer, baker) is <b>short the basis<\/b>: benefits when the basis <b>weakens<\/b>.<\/p><p>Important: the basis change only affects you if you <b>offset and sell/buy in the spot market<\/b>. If you deliver to a JSE silo, the JSE applies its constant location differential, so a local area premium doesn't help you.<\/p>", "example": "<p>Bethlehem farmer, basis strengthens from -R140 to -R110 (R30 area premium), F = R1 600:<\/p><ul><li>Spot sale = 1 600 - 110 = R1 490 (was R1 460)<\/li><li>Net = -100 -5 -5 +400 +100 +1 490 = <b>R1 880/t<\/b><\/li><li>Total = 1 880 x 2 000 = <b>R3 760 000<\/b>, i.e. R60 000 better than R3 700 000<\/li><li>Delivery route: still <b>R1 846/t<\/b> (JSE still deducts R140)<\/li><\/ul>", "remember": ["Seller of futures = long the basis, benefits when basis strengthens.", "Buyer of futures = short the basis, benefits when basis weakens.", "Strengthening = smaller negative ('less under').", "Hedged farmer who delivers: lift the hedge when the basis strengthens."], "trap": "A 'stronger' basis HURTS the long hedger (baker): he pays a higher spot price. Don't automatically treat 'stronger' as good for everyone.", "check": {"q": "Bela-Bela baker: offset at F = R1 600, basis was -R100 (net -R1 910/t). If the basis strengthens by R15, what is his net price per ton?", "a": "Spot = 1 600 - 85 = R1 515, so net = -100 -5 -400 -5 -1 515 +100 = -R1 925/t (-R3 850 000 for 2 000 t). Worse, because a long hedger is short the basis."}, "ref": "7.1.4, p.151-154"}, {"title": "Why hedges aren't perfect: yield and basis risk", "body": "<p>A <b>perfect hedge<\/b> is when futures gains/losses exactly offset cash losses/gains. Basis risk often makes this impossible. Hedging also does <b>not protect against yield risk<\/b>: if the crop is smaller than the futures you sold, you must buy back the extra contracts at the market price.<\/p><p>Hedges don't give full protection because:<\/p><ul><li><b>Timing differences<\/b> between cash transactions and futures expiry (cash and futures don't move by exactly the same amount)<\/li><li><b>Different grades<\/b> change at different rates (futures based on grade 1, sometimes grade 2 for maize)<\/li><li><b>Fixed contract size<\/b> may not match your cash quantity<\/li><li>Hedging a <b>related but not identical<\/b> product (cross-hedge)<\/li><\/ul>", "example": "<p>Bethlehem farmer sold 40 contracts (2 000 t) but hail leaves only 1 500 t. F = R1 600, basis -R140.<\/p><ul><li>1 500 t at R1 850 = R2 775 000 (A)<\/li><li>Remaining 10 contracts (500 t) bought back: +400 - 5 - 5 = +R390/t x 500 = +R195 000 (B)<\/li><li>Total A + B = <b>R2 970 000<\/b> vs R3 700 000: <b>R730 000 less<\/b><\/li><\/ul><p>At F = R2 500 it's worse: 10 extra contracts lose -500 -10 = -R510/t x 500 = -R255 000, total R2 520 000, i.e. <b>R1 180 000 less<\/b>.<\/p>", "remember": ["Hedging does not protect against yield (volume) risk.", "Four reasons for imperfect hedges: timing, grades, fixed contract size, related-not-identical product.", "Smaller crop under a higher price = bigger shortfall."], "trap": null, "check": {"q": "Why does a smaller harvest hurt more when prices rise?", "a": "The farmer is over-hedged: the extra short futures lose money when prices rise, and he has no physical crop to offset that loss."}, "ref": "7.1.4, p.154-156"}, {"title": "Hedging with options: long put floor, short call income", "body": "<p><b>Long put (producer)<\/b>: right, not obligation, to sell futures at the strike. Creates a <b>floor price<\/b> but keeps the upside. Cost = premium (most members want the full premium upfront). If exercised, the farmer is assigned a <b>short futures at the strike<\/b>, then offsets or delivers. Brokerage is paid three times: buying the option, on exercise, and closing the futures.<\/p><p><b>Short call (producer)<\/b>: sells the right to buy from him, to <b>earn premium<\/b> (e.g. to finance storage). Benefits: keeps the premium if the call expires OTM; premium pays storage. Disadvantages: margin requirements, loss if the market rises a lot, may be called on to deliver, <b>limited profit (premium) but unlimited losses<\/b>.<\/p>", "example": "<p><b>Bothaville farmer<\/b>: long July YMAZ R1 900 put at R200/t, basis -R110, brokerage R5.<\/p><ul><li>F = R2 300: let it lapse. -5 -200 + (2 300 - 110) = <b>R1 985/t<\/b><\/li><li>F = R1 500: exercise. -5 -200 -100 -5 +400 -5 +100 + (1 500 - 110) = <b>R1 575/t<\/b> (offset) or <b>R1 571/t<\/b> (deliver, minus R2 + R2)<\/li><\/ul><p><b>Short call<\/b>: farmer sells 10 May WMAZ 1800 calls at R200. Expires at R2 100: premium +200, loss 2 100 - 1 800 = -300, net <b>-R100/t<\/b>. At R1 700 or R1 800 he keeps the full R200.<\/p>", "remember": ["Best low-risk option hedge against falling prices: LONG PUT.", "Initial and variation margin must be paid by 12:00 the next trading day.", "Short call: profit limited to premium, losses unlimited.", "One option contract = exposure to one futures contract."], "trap": "'Short put/short call because she receives the premium if prices fall' is the classic distractor. Selling options gives premium, not protection. Protection against falling prices = buy a put.", "check": {"q": "Farmer needs at least R850/t and fears falling prices, but wants an option, not a future. Which position?", "a": "Long put: it gives a floor (limited downside) while keeping upside, unlike a short futures position."}, "ref": "7.1.5, p.156-159"}, {"title": "Spread trading: buying and selling the spread", "body": "<p>A <b>spread<\/b> = buy one futures contract and sell a related one at the same time, to profit from a change in the price <b>difference<\/b>.<\/p><ul><li><b>Calendar (time) spread = intramarket spread<\/b>: same commodity, different months. SA convention: <code>spread = far crop - near crop<\/code>. <b>Buying the spread<\/b> = long far, short near (expect widening). <b>Selling the spread<\/b> = short far, long near (expect narrowing).<\/li><li><b>Intermarket / intercommodity<\/b> spread: long one market, short another, <b>same month<\/b> (e.g. short May WMAZ, long May YMAZ, locally called <b>splits<\/b>).<\/li><li><b>Commodity-product<\/b> spread: commodity vs its products (yellow maize vs ethanol; soya beans vs soya oil).<\/li><\/ul><p>Carrying-charge (<b>contango<\/b>) market: each later month priced higher. <b>Inverted<\/b> (backwardation): nearby highest, e.g. when spot demand is strong.<\/p><p>Benefits: <b>less initial margin<\/b>, lower risk, greater return on margin, can create partial positions. Spreads carry <b>less risk<\/b> than outright futures; every hedge is a form of spread.<\/p>", "example": "<p>Nov 2023: March 2024 = R2 400, July 2024 = R2 485. Spread = 2 485 - 2 400 = R85. You expect widening, so you <b>buy the spread<\/b> (long July, short March).<\/p><p>Feb 2024: March R2 425 (+25), July R2 520 (+35). Spread = R95.<\/p><ul><li>Long July: +R35/t<\/li><li>Short March: -R25/t<\/li><li>Net +R10/t x 100 t = <b>R1 000<\/b> per spread<\/li><\/ul>", "remember": ["Calendar spread = far minus near.", "Buy the spread = LONG far (July), SHORT near (March), same market.", "Intramarket spread needs LESS margin than an outright future.", "Intermarket = same month, different markets (splits)."], "trap": "'Buying the spread = long near, short far' is the reverse. Also 'spreads contain more risk' or 'need more margin' are both false.", "check": {"q": "Which trade is buying an intramarket spread: long March/short July or short March/long July, same market?", "a": "Short March, long July in the same market (long far crop, short near crop)."}, "ref": "7.2, p.159-161"}, {"title": "Delta: what it is and what moves it", "body": "<p><b>Delta<\/b> (hedge ratio) = how much the option price changes for a small change in the futures price. Delta 0.50 on a July maize option: futures +R1, option +R0.50. The option behaves like half a futures contract. Delta also indicates the probability of exercise.<\/p><table><tr><th>Position<\/th><th>Delta<\/th><th>Gains when futures...<\/th><\/tr><tr><td>Long call<\/td><td>0 to 1<\/td><td>rise<\/td><\/tr><tr><td>Short call<\/td><td>-1 to 0<\/td><td>fall<\/td><\/tr><tr><td>Long put<\/td><td>-1 to 0<\/td><td>fall<\/td><\/tr><tr><td>Short put<\/td><td>0 to 1<\/td><td>rise<\/td><\/tr><\/table><p>Futures delta is always 1. <b>Moneyness<\/b>: ATM delta about 0.50; deeper ITM, delta rises; further OTM, delta falls. <b>Time<\/b>: closer to expiry, ITM deltas rise and OTM deltas fall; ATM stays about 0.50. <b>Volatility<\/b> affects ITM and OTM deltas, <b>not ATM<\/b>. <b>Gamma<\/b> measures how delta changes as the underlying moves.<\/p>", "example": null, "remember": ["ATM delta is about 0.50 (not 0, not 1).", "Absolute delta is between 0 and 1; futures delta = 1.", "Long call delta RISES if futures rise.", "Volatility changes ITM/OTM deltas much more than ATM deltas."], "trap": "Watch the sign: a short call position has NEGATIVE delta and a short put has POSITIVE delta. 'Delta of a short call rises when futures rise' is false.", "check": {"q": "What happens to the delta of an ITM option as expiry gets closer?", "a": "It rises (towards 1), because it becomes more likely to stay in the money."}, "ref": "7.3.1-7.3.3, p.161-164"}, {"title": "Delta hedging: buy or sell delta units", "body": "<p><b>Delta-neutral hedging<\/b>: combine options with futures so small futures moves don't change the portfolio value. Number of futures = <code>delta x number of options<\/code>.<\/p><ul><li><b>Long call<\/b>: SELL delta units<\/li><li><b>Short call<\/b>: BUY delta units<\/li><li><b>Long put<\/b>: BUY delta units<\/li><li><b>Short put<\/b>: SELL delta units<\/li><\/ul><p>Delta changes when futures move a lot, so you must <b>rebalance<\/b> (dynamic hedging). Each rebalance costs fees, and buying more futures needs more initial margin. An option seller (puts or calls) ends up <b>buying futures into rallies and selling into price falls<\/b>. Option buyers need not delta hedge (loss limited to premium), but big option books aim to be delta neutral so they can isolate <b>volatility<\/b>. Buying options = buying volatility; selling options = selling volatility.<\/p>", "example": "<p>Trader writes 10 maize calls, delta 0.6: buys 0.6 x 10 = <b>6 futures<\/b>. Futures +R1: futures gain R1 x 600 t = R600; options lose R0.60 x 10 x 100 t = R600. Neutral.<\/p><p>Futures fall R20, delta drops to 0.5: needs only 5 futures, so <b>sell 1<\/b>.<\/p><p><b>Long calls<\/b>: buys 10 ATM wheat calls (R3 000 strike), delta 0.5: <b>sell 5<\/b> futures. Wheat falls to R2 900, delta 0.4: needs 4, so <b>buy back 1<\/b>.<\/p>", "remember": ["Short call: buy delta units. Long call: sell delta units.", "Short put: sell delta units. Long put: buy delta units.", "Wrote 10 puts, delta 0.4: SELL 4 futures.", "Static hedge = set once; dynamic = rebalance as delta changes."], "trap": "'The short call holder should SELL delta units' and 'the long call holder should BUY delta units' are both wrong (reversed).", "check": {"q": "You wrote 10 maize puts with delta 0.4. What futures trade makes you delta neutral?", "a": "Sell 4 maize futures. A short put has positive position delta, so you short delta units of the underlying."}, "ref": "7.3.4-7.3.7, p.164-165; quiz p.171"}, {"title": "Speculators, position-taking, carry, arbitrage and price discovery", "body": "<ul><li><b>Speculators<\/b> provide <b>liquidity<\/b> (enter and exit quickly), so hedgers can always find a counterparty near the last price.<\/li><li><b>Position-taking<\/b> = a futures position without an offsetting cash position. It can be speculative, or <b>anticipatory hedging<\/b> (e.g. locking in a future interest rate or FX rate), on the long or short side.<\/li><li><b>Carrying<\/b>: a grain holder can short futures (or swaps, or buy puts) to recover storage, insurance and interest costs, if the market is in <b>contango<\/b> (futures above spot). A user can go long futures instead of holding stock.<\/li><li><b>Arbitrage<\/b> = simultaneous purchase and resale of the same thing in different markets. <b>Market arbitrage<\/b> is risk-free and rare; <b>risk arbitrage<\/b> has some risk and is more common. Arbitrage keeps spot and futures in line and makes prices converge; it does <b>not<\/b> manipulate markets.<\/li><li><b>Price determination<\/b> = supply and demand set the level. <b>Price discovery<\/b> = buyers and sellers arriving at a price for a given quality, quantity, time and place.<\/li><\/ul>", "example": "<p>Gold spot $400, 1-year futures $450, interest 10%. Fair futures = 400 x 1.10 = <b>$440<\/b>. Borrow $400, buy gold, sell futures at $450: riskless profit 450 - 440 = <b>$10<\/b>.<\/p>", "remember": ["Arbitrage conditions: same asset different prices; identical cash flows different prices; basis not reflecting cost of carry.", "Arbitrage must be SIMULTANEOUS.", "Speed of price convergence = measure of market efficiency.", "Exchange is a focal point for statistics and weather info."], "trap": "'Arbitrage traders manipulate markets and cause mispricing' is FALSE. They remove mispricing.", "check": {"q": "Is all position-taking speculation?", "a": "No. Position-taking can be anticipatory hedging, e.g. a company locking in today's interest rate for debt it will issue later."}, "ref": "7.4-7.7, p.166-168"}]}, {"chapter": 8, "title": "Trading and governance in the CDM", "intro": "Pure rule-knowledge, and the exam loves it: about 8-10 questions on who may do what (JSE Executive vs Market Controller vs Director: Market Regulation), insider trading, market abuse and price limits. Learn the names and the exceptions.", "cards": [{"title": "Rules vs directives: who they bind", "body": "<p>The JSE is a licensed exchange under the <b>Financial Markets Act, 2012 (Act No. 19 of 2012)<\/b>, the FMA. It must maintain rules (section 17), <b>supervise<\/b> compliance, <b>enforce<\/b> the rules and <b>may issue directives<\/b> (section 10).<\/p><p>Purpose of the rules and directives:<\/p><ul><li>achieve the JSE's objectives by providing procedures for <b>fair and efficient markets<\/b><\/li><li>ensure JSE business is carried out in an <b>orderly<\/b> manner<\/li><li>achieve the objectives of the FMA (fair, efficient, transparent markets; confidence; <b>a stable financial market<\/b>; protect clients and investors; reduce systemic risk; competitiveness)<\/li><\/ul><p><b>Rules<\/b> bind trading members, officers, employees <b>and<\/b> anyone using a member's services or trading with a member. <b>Directives<\/b> bind only trading members, officers and employees.<\/p>", "example": null, "remember": ["FMA = Financial Markets Act 19 of 2012.", "Rules bind clients too; directives do NOT bind clients.", "Purpose includes contributing to a stable financial market."], "trap": "Distractors: 'prevent speculative activities', 'promote healthy hedging', 'maximise profits'. None of these is a stated purpose.", "check": {"q": "Are directives binding on a client who trades through a member?", "a": "No. Directives bind only trading members, their officers and employees. Rules also bind clients."}, "ref": "8.1, p.172-173; quiz p.190"}, {"title": "Registration of officers (rule 3.20)", "body": "<p>Only <b>registered traders<\/b> may trade for a member or for clients. To be registered, a trader needs the JSE qualification (the JSE CDM Dealers Examination) and must meet rule 3.20. Officers must (subject to JSE waiver):<\/p><ul><li>be of <b>full legal capacity<\/b><\/li><li>meet JSE criteria of <b>good character and high business integrity<\/b><\/li><li>not be an <b>unrehabilitated insolvent<\/b><\/li><\/ul><p>And must not, in a period the JSE deems fit, have been:<\/p><ul><li>convicted of fraud, theft, dishonesty or market abuse (SA or elsewhere), or held civilly/administratively liable for it<\/li><li>found to have contravened market abuse, money laundering or terrorism legislation<\/li><li>disqualified by a court from being a director<\/li><li>the subject of a <b>formal investigation<\/b> by a regulatory or government agency<\/li><li>expelled from an exchange, or linked to an expelled member they contributed to, or declared a defaulter<\/li><li>refused entry to/expelled from a profession, or <b>dismissed<\/b> or asked to resign from an office or employment or position of trust<\/li><\/ul>", "example": null, "remember": ["Two requirements: JSE qualification + rule 3.20 general requirements.", "Being investigated by a regulator, or being dismissed from employment, can disqualify you.", "There is NO rule about being an officer of a foreign or competing exchange, nor a net-asset test."], "trap": "Options like 'must have assets exceeding liabilities by a prescribed sum' or 'may not be an officer of a foreign exchange' are not in rule 3.20. The real items are full legal capacity, good character, not insolvent, no fraud/dishonesty history.", "check": {"q": "Name three things in rule 3.20 that would block registration.", "a": "Any of: unrehabilitated insolvency, conviction for fraud/theft/dishonesty/market abuse, a formal regulatory investigation, court disqualification as director, expulsion from an exchange, dismissal from employment."}, "ref": "8.2, p.173-174"}, {"title": "The JSE trading system: member's responsibilities", "body": "<p>A trading member may access the trading system only with the approval of the <b>Market Controller<\/b> and must follow the MC's instructions, sign the JSE agreements and meet JSE specifications.<\/p><p>Rule 7.80:<\/p><ul><li>The member is <b>bound by all offers, acceptances or entries made in its name<\/b>, whether or not it authorised them.<\/li><li>It must keep codes and passwords confidential to the <b>compliance officer and the registered trader<\/b> they're meant for, and only those people may use them.<\/li><li>It must have the resources to ensure data it sends <b>does not interfere<\/b> with the efficiency and integrity of the market or JSE systems.<\/li><li>The <b>Market Controller<\/b> may tell a member to immediately stop using (or restrict) a member or client application.<\/li><\/ul><p>The <b>trading member<\/b> (not the Market Controller) is responsible for the origin, accuracy, integrity and validity of all data it submits.<\/p>", "example": null, "remember": ["Access approval comes from the Market Controller (not the compliance officer).", "Member is bound by everything entered in its name.", "Member must ensure its data doesn't interfere with JSE systems.", "Market Controller = person who supervises and controls daily operations of the trading system."], "trap": "'The JSE validates all data' and 'access with approval of the member's compliance officer' are both false.", "check": {"q": "Someone uses a member's password without authorisation and enters a trade. Is the member bound?", "a": "Yes. The member is bound by all entries made in its name, authorised or not."}, "ref": "8.3, p.174-175; quiz p.190"}, {"title": "Who has which power: JSE Executive, Market Controller, emergencies", "body": "<p><b>Market Controller + any one of the JSE Executive<\/b> may close the market if a <b>fair and realistic market<\/b> doesn't exist (considering the percentage of members who can't access the system, their contribution to price formation, and why).<\/p><p><b>JSE Executive<\/b> (CEO + top management) may:<\/p><ul><li>reduce or extend trading hours for any particular business day<\/li><li><b>halt or close<\/b> the trading system <b>without prior notice<\/b><\/li><li>suspend automated trading without notice<\/li><li>after a system failure, closure, halt or suspension, declare a transaction <b>void<\/b> (binding on the members and their clients)<\/li><li>take other steps for an orderly market<\/li><\/ul><p><b>Emergency provisions (rule 10.30)<\/b>: the JSE may restrict or suspend trading in emergencies (another exchange closing, war, acts of state, change in law, etc.). If trading in the underlying stops on any exchange, the <b>JSE Executive shall consider<\/b> stopping the derivative. The <b>CEO notifies the Registrar<\/b>.<\/p>", "example": null, "remember": ["JSE Executive may halt WITHOUT prior notice.", "JSE Executive (not MC) may reduce or extend hours for a business day.", "Void after system failure: JSE Executive.", "CEO notifies the Registrar in an emergency."], "trap": "'The Market Controller may declare a transaction void after system failure' or 'the MC may cease trading if the underlying stops' are wrong: those are JSE Executive powers. 'Extend hours to a Saturday' is also a distractor; hours apply to a business day.", "check": {"q": "Who may reduce or extend the trading hours for a particular day?", "a": "The JSE Executive."}, "ref": "8.4-8.5, p.175-176"}, {"title": "Insider trading", "body": "<p><b>Inside information<\/b> = specific or precise information, not made public, obtained as an insider, that would likely have a <b>material effect<\/b> on the price of a listed security. This includes agricultural product securities. Example: an <b>unpublished crop estimate<\/b> of the National Crop Estimates Committee.<\/p><p><b>Insider<\/b> = someone with inside information through being a director/employee/shareholder of the issuer or through employment, office or profession, <b>or<\/b> someone who knows the source was such a person (e.g. a JSE trader who knows the tip came from a committee member's relative).<\/p><p>It is <b>not<\/b> an offence to be an insider or to hold inside info. Offences (FMA s78), if you <b>know<\/b> you have inside info:<\/p><ul><li>dealing for your own account<\/li><li>dealing for someone else (exception: trader acting on a client's specific instruction, not knowing the client was an insider)<\/li><li><b>disclosing<\/b> it (exception: necessary for your job, unrelated to dealing, and you say it's inside info)<\/li><li><b>encouraging or discouraging<\/b> someone to deal<\/li><\/ul><p>Liability (s82): profit made/loss avoided, up to <b>R1 million<\/b> (adjusted), interest, costs incl. investigation, and commission received.<\/p>", "example": "<p><b>Legal or not?<\/b><\/p><ul><li>NCEC chairman asks secretary Mary to type the minutes: <b>legal<\/b> (part of her job).<\/li><li>Mary emails the minutes to other NCEC members to check: <b>legal<\/b>.<\/li><li>Mary emails them to her broker and says trade for her: <b>illegal<\/b>.<\/li><li>Broker trades on it for Mary and for himself: <b>illegal<\/b>.<\/li><li>Farmer trades on estimates published in Landbou Weekblad: <b>legal<\/b> (now public).<\/li><\/ul>", "remember": ["Offence = ACTING on inside info (deal, disclose, encourage/discourage), not having it.", "Insider trading applies to agricultural product securities.", "Admin sanction up to R1 million plus profit, interest and costs."], "trap": "'Insider trading only applies to listed companies, not agricultural products' is FALSE. Once information is published, trading on it is legal.", "check": {"q": "A trader executes a client's specific instruction, not knowing the client is an insider. Offence?", "a": "No. That is a listed exception for a trading member or trader acting on a client's specific instructions."}, "ref": "8.6, p.176-179"}, {"title": "Prohibited (manipulative) practices", "body": "<p>A member may not use or knowingly take part in any manipulative or deceptive practice that creates a <b>false or misleading appearance of trading<\/b> or an <b>artificial value<\/b>. The member must consider the circumstances of client orders and is responsible for their integrity.<\/p><p>Deemed manipulative:<\/p><ul><li>orders knowing an <b>opposite order<\/b> of substantially the same size, time and price will be entered (to fake activity)<\/li><li>buying at successively <b>higher<\/b> or selling at successively <b>lower<\/b> prices to influence price<\/li><li>an order <b>at or near the close<\/b> mainly to change or maintain the closing price<\/li><li>an order in the <b>pre-opening<\/b> period cancelled just before opening to fake supply/demand<\/li><li>an order with <b>no change in beneficial ownership<\/b> (wash trade)<\/li><li>effecting or assisting a <b>market corner<\/b><\/li><li><b>maintaining the price at an artificial level<\/b><\/li><li>any device, scheme or artifice to defraud; any deceptive act<\/li><\/ul>", "example": null, "remember": ["Illegal: pre-opening order cancelled just before opening.", "Illegal: order near the close to maintain the closing price.", "Illegal: maintaining price at artificial level; false/misleading statements.", "Legal: entering a client trade in terms of a mandate; selling at market prices."], "trap": "Normal business ('entering orders to sell at market prices', 'entering a client trade in terms of a mandate') is NOT abuse. Don't tick it just because it sits in a list of bad things.", "check": {"q": "Why is a buy order in the pre-opening, cancelled just before the open, illegal?", "a": "It creates a false or misleading appearance of demand for the security."}, "ref": "8.7, p.179-180"}, {"title": "Market integrity: void transactions and trading halts", "body": "<p><b>Void transactions<\/b>:<\/p><ul><li><
