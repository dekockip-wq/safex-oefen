otice day vasgestel.", "book_ref": "4.5.2, p.50", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "Physical delivery runs over two business days. Day 1 is notice day (the notice must be in before 14h15). Day 2 is delivery day (the next business day). The contracts are closed at the closing MTM price on notice day. That price is adjusted for storage costs, VAT (where applicable), location differentials, grade premiums/discounts and basis premiums. Wednesday's MTM (A) is wrong because the price is fixed on notice day.", "note_en": null}, {"paper": "IDK", "n": "F-20", "question": "Which of the following statements regarding exchange for physical (EFP) transactions on the JSE CDM are correct?", "statements": ["i. The delivery months in the physical contract and the expiry month of the futures contract must be within two months of each other", "ii. Quantities of the EFP futures contracts must be within 5% of the quantities specified in the physical contract", "iii. A farmer who buys an EFP from a miller is buying a futures contract while simultaneously selling physical grain", "iv. The physical delivery resulting from an EFP is randomly allocated to long position holders by the JSE's allocation algorithm"], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(iii) and (iv) only", "D": "(i) and (iv) only"}, "answer": "A", "uitleg": "By 'n EFP moet die delivery month van die physical contract en die futures expiry binne twee maande van mekaar wees, en die futures hoeveelheid binne 5% van die physical contract. Die boer wat die EFP koop, koop futures en verkoop fisiese maize. (iv) is vals: die aflewering word juis vooraf aan 'n spesifieke long holder toegeken, nie random allocated nie.", "book_ref": "8.10-8.11, p.181; 4.5.2, p.51", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "For an EFP: (i) the delivery month of the physical contract and the futures expiry must be within two months of each other; (ii) the futures quantity must be within 5% of the physical contract; (iii) the farmer who buys the EFP buys futures and sells physical maize. (iv) is false: the delivery is allocated in advance to a specific long holder, not randomly allocated.", "note_en": null}, {"paper": "IDK", "n": "P-01", "question": "Consider a 6-month forward contract on wheat. The spot price is R3 200 per ton, the interest rate is 9% per annum compounded monthly, storage cost of R120 per ton is payable after six months, and the convenience yield is 3% of the spot price. The theoretical 6-month forward price is closest to", "statements": [], "options": {"A": "R3 420.85 per ton", "B": "R3 466.73 per ton", "C": "R3 415.43 per ton", "D": "R3 518.66 per ton"}, "answer": "C", "uitleg": "Eers PV van storage: 120 x (1 + 0.09/12)^-6 = R114.74. Dan F0 = (3 200 + 114.74)(1 + (0.09 - 0.03)/12)^6 = 3 314.74 x 1.0304 = R3 415.43. R3 420.85 vergeet om die storage cost te verdiskonteer; R3 466.73 ignoreer die convenience yield; R3 518.66 tel die convenience yield by in plaas daarvan om dit af te trek.", "book_ref": "3.2, formulas 3.4 and 3.5, p.35-36", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "Step 1: find the present value of storage: 120 x (1 + 0.09/12)^-6 = R114.74. Step 2: F0 = (3 200 + 114.74)(1 + (0.09 - 0.03)/12)^6 = 3 314.74 x 1.0304 = R3 415.43. Why the other answers are wrong: R3 420.85 forgets to discount the storage cost. R3 466.73 ignores the convenience yield. R3 518.66 adds the convenience yield instead of subtracting it.", "note_en": null}, {"paper": "IDK", "n": "P-02", "question": "The spot price of gold is R1 800 per gram and the interest rate is 9% per annum, compounded quarterly. A 6-month forward contract on gold (no storage cost, no income) is quoted in the market at R1 900 per gram. Assuming equal borrowing and lending rates, which ONE of the following describes the arbitrage opportunity correctly?", "statements": [], "options": {"A": "Borrow R1 800, buy the gold spot and sell it 6 months forward at R1 900, making a risk-free profit of about R18.09 per gram.", "B": "Sell the gold spot, invest the proceeds and buy it 6 months forward at R1 900, making a risk-free profit of about R18.09 per gram.", "C": "Borrow R1 800, buy the gold spot and sell it 6 months forward at R1 900, making a risk-free profit of exactly R19.00 per gram.", "D": "Borrow R1 800, buy the gold spot and sell it 6 months forward at R1 900, making a risk-free profit of R100 per gram."}, "answer": "A", "uitleg": "Fair value = 1 800 x (1 + 0.09/4)^2 = R1 881.91. Die mark-prys van R1 900 is te hoog, dus cash-and-carry: leen, koop spot, verkoop forward; wins = 1 900 - 1 881.91 = R18.09. R19.00 gebruik simple interest (1 800 x 1.045) in plaas van kwartaallikse compounding; R100 ignoreer die rente-koste heeltemal.", "book_ref": "3.2 (arbitrage example), p.34; 4.9, p.77-78", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "Step 1: fair value = 1 800 x (1 + 0.09/4)^2 = R1 881.91. Step 2: the market price of R1 900 is too high. So do a cash-and-carry: borrow, buy spot, sell forward. Step 3: profit = 1 900 - 1 881.91 = R18.09. R19.00 uses simple interest (1 800 x 1.045) instead of quarterly compounding. R100 ignores the interest cost completely.", "note_en": null}, {"paper": "IDK", "n": "P-03", "question": "Which of the following statements regarding contango and backwardation are correct?", "statements": ["i. If the net cost of carry is positive, the futures price will exceed the spot price and the market is said to be in contango.", "ii. Backwardation can occur where a high convenience yield causes a negative cost of carry.", "iii. In a backwardation market the basis (spot minus futures) is negative.", "iv. Backwardation is usually only associated with commodities such as oil and agricultural products, because the convenience yield for investment assets is always zero."], "options": {"A": "(i) and (ii) only", "B": "(ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(i), (ii) and (iv) only"}, "answer": "D", "uitleg": "(i), (ii) en (iv) kom direk uit die boek: positiewe net cost of carry gee contango; hoë convenience yield kan negatiewe carry en backwardation veroorsaak; backwardation word met commodities geassosieer omdat convenience yield vir investment assets nul is. (iii) is vals: in backwardation is St > Ft, dus is basis = S - F positief, nie negatief nie.", "book_ref": "4.1.2, p.41; 3.2, p.37; 4.7.1, p.71", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "(i), (ii) and (iv) come straight from the book: (i) a positive net cost of carry gives contango; (ii) a high convenience yield can cause negative carry and backwardation; (iv) backwardation is associated with commodities, because the convenience yield for investment assets is zero. (iii) is false: in backwardation St > Ft, so basis = S - F is positive, not negative.", "note_en": null}, {"paper": "IDK", "n": "P-04", "question": "All else being equal, which ONE of the following changes will LOWER the theoretical forward price of a storable agricultural commodity?", "statements": [], "options": {"A": "An increase in the applicable interest rate.", "B": "An increase in the storage cost payable at maturity.", "C": "An increase in the convenience yield of holding the commodity.", "D": "An increase in the spot price of the commodity."}, "answer": "C", "uitleg": "Carry costs = cost of funds + storage cost - convenience yield, en F0 = (S0 + U)(1 + (i - y)/f)^nf. 'n Hoër convenience yield (y) verlaag die net carry en dus die forward prys. Hoër rente, hoër storage en 'n hoër spot prys verhoog almal die forward prys.", "book_ref": "3.2, formulas 3.3 and 3.5, p.34-36", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "Carry costs = cost of funds + storage cost - convenience yield, and F0 = (S0 + U)(1 + (i - y)/f)^nf. A higher convenience yield (y) reduces the net carry, so it lowers the forward price. Higher interest rates, higher storage costs and a higher spot price all raise the forward price.", "note_en": null}, {"paper": "IDK", "n": "P-05", "question": "Consider a 9-month forward contract on maize. The spot price is R2 800 per ton, the interest rate is 10% per annum compounded quarterly, and storage cost of R90 per ton is payable after nine months. Because of expected shortages, millers are stockpiling and the convenience yield has risen to 18% of the spot price. The theoretical forward price and the resulting market condition are", "statements": [], "options": {"A": "R2 714.00 per ton; contango.", "B": "R2 714.00 per ton; backwardation.", "C": "R2 720.04 per ton; backwardation.", "D": "R3 105.29 per ton; contango."}, "answer": "B", "uitleg": "PV storage = 90 x (1.025)^-3 = R83.57. F0 = (2 800 + 83.57)(1 + (0.10 - 0.18)/4)^3 = 2 883.57 x 0.98^3 = R2 714.00. Omdat die forward prys onder die spot prys van R2 800 is, is dit backwardation. R2 720.04 vergeet om storage te verdiskonteer; R3 105.29 ignoreer die convenience yield.", "book_ref": "3.2, formula 3.5 and backwardation example, p.36-37; 4.1.2, p.41", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "Step 1: PV of storage = 90 x (1.025)^-3 = R83.57. Step 2: F0 = (2 800 + 83.57)(1 + (0.10 - 0.18)/4)^3 = 2 883.57 x 0.98^3 = R2 714.00. Step 3: the forward price is below the spot price of R2 800, so the market is in backwardation. R2 720.04 forgets to discount the storage cost. R3 105.29 ignores the convenience yield.", "note_en": null}, {"paper": "IDK", "n": "P-06", "question": "Which of the following statements regarding the calculation of forward (and futures) prices are correct?", "statements": ["i. Using continuous compounding at the same nominal rate produces a slightly higher forward price than using monthly compounding.", "ii. The study book prescribes the continuous compounding convention for all forward price calculations.", "iii. The interest rate convention to be used is arbitrary and depends on the convention used in the particular carry cost market.", "iv. Storage cost is treated as a negative income, and its present value is added to the spot price."], "options": {"A": "(i), (iii) and (iv) only", "B": "(i), (ii) and (iii) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "A", "uitleg": "(i) Waar: continuous compounding gee 'n effens hoër prys (R264.14 teenoor R264.07 in die boek se voorbeeld). (iii) Waar: die konvensie is arbitrêr en hang af van die carry cost mark (bv. NACM as die banklening maandeliks compound). (iv) Waar: storage word as negatiewe inkomste hanteer en die PV word by S0 getel. (ii) is vals: die boek sê uitdruklik dat dit NIE continuous compounding gebruik nie.", "book_ref": "3.2, p.33-34", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "(i) True: continuous compounding gives a slightly higher price (R264.14 versus R264.07 in the book's example). (iii) True: the compounding convention is arbitrary and depends on the carry cost market (e.g. NACM if the bank loan compounds monthly). (iv) True: storage is treated as negative income, and its PV is added to S0. (ii) is false: the book says explicitly that it does NOT use continuous compounding.", "note_en": null}, {"paper": "IDK", "n": "P-07", "question": "Which of the following statements regarding forward contracts are correct?", "statements": ["i. A forward contract is an OTC agreement negotiated between two parties, known as counterparties.", "ii. A forward contract is a standardised contract that must be traded on a formal exchange.", "iii. Should one party default, the counterparty's only form of recourse is the normal remedies provided by the legal system.", "iv. Because a forward contract is a legal contract, it eliminates the risk of default by the other party."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i) and (iii) only", "C": "(ii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "B", "uitleg": "(i) en (iii) is waar: 'n forward is 'n OTC ooreenkoms tussen twee counterparties, en by default is die enigste verhaal die normale regsprosesse (tyd en geld). (ii) is vals: forwards is nie gestandaardiseer of noodwendig op 'n formele exchange verhandel nie. (iv) is vals: al is dit 'n regskontrak, elimineer dit nie default risk nie.", "book_ref": "3.1, p.30", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "(i) and (iii) are true. A forward is an OTC agreement between two counterparties. If one side defaults, the only recourse is the normal legal process, which costs time and money. (ii) is false: forwards are not standardised and are not necessarily traded on a formal exchange. (iv) is false: even though a forward is a legal contract, that does not remove default risk.", "note_en": null}, {"paper": "IDK", "n": "P-08", "question": "A feedlot owner enters into a forward contract with a farmer to buy 80 tons of yellow maize at R3 500 per ton for delivery at the end of August. At the end of August the spot price of yellow maize is R3 650 per ton. Compared to buying in the spot market at that time, the feedlot owner's forward position has resulted in a", "statements": [], "options": {"A": "loss of R12 000.", "B": "profit of R292 000.", "C": "loss of R280 000.", "D": "profit of R12 000."}, "answer": "D", "uitleg": "Die feedlot owner is long die forward. Die long party maak wins as die werklike prys hoër is as die kontrakprys: (3 650 - 3 500) x 80 = R12 000 wins. 'Loss of R12 000' is die perspektief van die short party (die boer). R292 000 en R280 000 is net die totale waarde teen spot of teen kontrakprys, nie die wins of verlies nie.", "book_ref": "3.1, p.30", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "The feedlot owner is long the forward. The long party profits when the actual price is higher than the contract price: (3 650 - 3 500) x 80 = R12 000 profit. 'Loss of R12 000' is the view of the short party (the farmer). R292 000 and R280 000 are just the total value at the spot price or the contract price, not the profit or loss.", "note_en": null}, {"paper": "IDK", "n": "P-09", "question": "Which ONE of the following statements regarding cash-settling and physically delivered forwards is correct?", "statements": [], "options": {"A": "If the buyer and seller of a forward contract only exchange cash payments on the maturity date instead of the physical product, the contract is regarded as a cash-settling instrument and as a swap.", "B": "Fixed-price physical delivery forwards must be marked to market in the income statement in the same way as swaps and futures.", "C": "Accounting standards do not require companies to indicate whether a forward transaction is aimed at transferring ownership or only price risk.", "D": "A cash-settling forward involves the exchange of the physical commodity, with only the price difference settled in cash."}, "answer": "A", "uitleg": "Die boek sê 'n forward waar net kontant op maturity uitgeruil word, is 'n cash-settling instrument en word as 'n swap beskou (some practitioners noem dit 'n one period swap). B is vals: fixed-price physical delivery forwards hoef nie in die income statement marked to market te word nie. C is vals: IFRS vereis juis dat die intent (ownership vs price risk) aangedui word.", "book_ref": "3.3, p.37; 5.4, p.91", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "The book says that a forward where only cash is exchanged at maturity is a cash-settling instrument and is regarded as a swap (some practitioners call it a one period swap). So A is correct. B is false: fixed-price physical delivery forwards do not have to be marked to market in the income statement. C is false: IFRS actually requires the intent (ownership vs price risk) to be stated.", "note_en": null}, {"paper": "IDK", "n": "P-10", "question": "Which ONE of the following statements regarding the difference between forwards and futures is correct?", "statements": [], "options": {"A": "The sum of the daily mark-to-market price movements over the life of a futures contract will always exceed the overall price movement of a forward with the same maturity.", "B": "Forward contracts are marked to market daily, while futures are settled once on the expiration day.", "C": "Because futures mark-to-market profits (losses) are carried at the risk-free rate until expiry, the time value of a futures position at expiry may be greater or less than the terminal value of the equivalent forward position.", "D": "Basis risk is more prominent in forward contracts than in futures trading, because forwards can be offset early."}, "answer": "C", "uitleg": "Volgens die boek word futures MTM winste/verliese teen die risk-free rate belê tot expiry, dus kan die tydwaarde groter of kleiner wees as die forward s'n, afhangend van die prys-pad. A is vals: die som van die daaglikse MTM bewegings is GELYK aan die forward se totale beweging. B draai forwards en futures om. D is vals: basis risk is minder prominent by forwards, want daar is geen early offset nie.", "book_ref": "3.2, p.37; 4.7.2, p.75", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "According to the book, futures MTM profits and losses are invested at the risk-free rate until expiry. So the time value of a futures position can end up greater or smaller than that of the forward, depending on the path prices took. A is false: the sum of the daily MTM moves EQUALS the forward's total move. B swaps forwards and futures around. D is false: basis risk is less prominent with forwards, because there is no early offset.", "note_en": null}, {"paper": "IDK", "n": "P-11", "question": "On t1 the spot price of maize at a local silo is R3 120 per ton and the nearby futures price is R3 230 per ton. On t2 the spot price is R3 180 per ton and the futures price is R3 255 per ton. From t1 to t2 the basis has", "statements": [], "options": {"A": "weakened by R35 per ton, which benefits a short hedger.", "B": "strengthened by R35 per ton, which benefits a short hedger.", "C": "strengthened by R35 per ton, which benefits a long hedger.", "D": "weakened by R35 per ton, which benefits a long hedger."}, "answer": "B", "uitleg": "B1 = 3 120 - 3 230 = -R110; B2 = 3 180 - 3 255 = -R75. Die basis het minder negatief geword, dus versterk (narrowed) met R35. Die short hedger is 'long the basis' en baat by versterking (ontvang F1 + B2). Die long hedger is 'short the basis' en verloor as die basis versterk, want hy betaal F1 + B2.", "book_ref": "4.7, p.69-71", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "B1 = 3 120 - 3 230 = -R110. B2 = 3 180 - 3 255 = -R75. The basis became less negative, so it strengthened (narrowed) by R35. The short hedger is 'long the basis' and benefits when it strengthens (he receives F1 + B2). The long hedger is 'short the basis' and loses when the basis strengthens, because he pays F1 + B2.", "note_en": null}, {"paper": "IDK", "n": "P-12", "question": "A maize farmer hedges 600 tons by selling 6 July white maize futures contracts at R3 400 per ton. Brokerage is R5 per ton per trade. Just before expiry he offsets his futures position when the July futures price is R3 260 per ton and sells his maize in the local spot market at R3 150 per ton. His total net cash flow (ignoring initial margin, which is returned) is", "statements": [], "options": {"A": "R1 974 000", "B": "R2 100 000", "C": "R1 800 000", "D": "R1 968 000"}, "answer": "D", "uitleg": "Effektiewe prys = F1 + B2 - brokerage = 3 400 + (3 150 - 3 260) - 10 = R3 280 per ton (of S2 + variation margin = 3 150 + 140 - 10). Vir 600 t (6 kontrakte x 100 t) = R1 968 000. R1 974 000 vergeet die brokerage op albei trades; R2 100 000 trek die basis af in plaas daarvan om dit by te tel; R1 800 000 het die teken van die variation margin verkeerd.", "book_ref": "4.7, p.69-70; 7.1.4, Table 7.3, p.148", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Effective price = F1 + B2 - brokerage. B2 = spot - futures = 3 150 - 3 260 = -110. Brokerage = R5 x 2 trades = R10. So 3 400 - 110 - 10 = R3 280 per ton. (Check: S2 + variation margin - brokerage = 3 150 + 140 - 10 = R3 280.) For 600 t (6 contracts x 100 t): 3 280 x 600 = R1 968 000. Wrong options: R1 974 000 forgets the brokerage on both trades; R2 100 000 subtracts the basis instead of adding it; R1 800 000 has the sign of the variation margin wrong.", "note_en": null}, {"paper": "IDK", "n": "P-13", "question": "A miller buys 20 December wheat futures contracts at R5 200 per ton to hedge 1 000 tons. Brokerage is R5 per ton per trade. In December he offsets his futures position at R5 450 per ton and buys the wheat in his local spot market at R5 300 per ton. The effective net price he pays per ton is", "statements": [], "options": {"A": "R5 060", "B": "R5 040", "C": "R5 050", "D": "R5 310"}, "answer": "A", "uitleg": "Long hedger betaal F1 + B2 plus brokerage: B2 = 5 300 - 5 450 = -R150, dus 5 200 - 150 + 10 = R5 060. Of: spot R5 300 minus variation margin wins R250 plus R10 brokerage. R5 050 vergeet brokerage; R5 040 trek brokerage af in plaas daarvan om dit by te tel; R5 310 ignoreer die futures wins.", "book_ref": "4.7, p.70; 7.1.4, Table 7.7, p.150", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "A long hedger pays F1 + B2 plus brokerage. First find the basis: B2 = 5 300 - 5 450 = -R150. Then 5 200 - 150 + 10 = R5 060. (Brokerage is R5 per trade, and there are two trades, so R10.) Another way: pay R5 300 spot, subtract the R250 variation margin profit, and add R10 brokerage = R5 060. R5 050 forgets the brokerage. R5 040 subtracts the brokerage instead of adding it. R5 310 ignores the futures profit.", "note_en": null}, {"paper": "IDK", "n": "P-14", "question": "A miller is long 20 December wheat futures contracts (1 000 tons) bought at R5 200 per ton and decides to take delivery. Before delivery the futures position is closed at R5 450 per ton. He is allocated wheat at a silo where the location differential and handling fees amount to R160 per ton. Brokerage is R5 per ton per trade and JSE physical delivery charges are R2 per ton. Ignoring the cost of transporting the wheat from the allocated silo to his mill, the net price he pays per ton is", "statements": [], "options": {"A": "R5 212", "B": "R5 050", "C": "R5 052", "D": "R5 552"}, "answer": "C", "uitleg": "Volg Table 7.8: hy betaal JSE 5 450 - 160 = R5 290, ontvang variation margin van +R250, betaal brokerage R10 en delivery charges R2: 5 290 - 250 + 10 + 2 = R5 052. R5 050 vergeet die R2 delivery charge; R5 212 trek nie die location differential af nie; R5 552 behandel die variation margin as 'n uitgawe. Onthou: vervoer van die toegekende silo na die meule kom nog bo-op.", "book_ref": "7.1.4, Table 7.8, p.150-151", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Follow Table 7.8. He pays the JSE 5 450 - 160 = R5 290. He receives variation margin of +R250. He pays brokerage of R10 and delivery charges of R2. Net: 5 290 - 250 + 10 + 2 = R5 052. R5 050 forgets the R2 delivery charge. R5 212 does not subtract the location differential. R5 552 treats the variation margin as a cost. Remember: transport from the allocated silo to the mill still comes on top.", "note_en": null}, {"paper": "IDK", "n": "P-15", "question": "Which of the following statements regarding basis are correct?", "statements": ["i. Under normal conditions the basis for grain is positive.", "ii. A farmer who has sold futures to hedge his crop is long the basis and profits if the basis strengthens.", "iii. A weakening of the basis benefits a farmer who has sold futures to hedge his crop.", "iv. Basis risk is pronounced if the hedger closes out his futures position well before the expiry date of the futures contract."], "options": {"A": "(i) and (iii) only", "B": "(ii) and (iv) only", "C": "(i), (ii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "(ii) Waar: die short hedger is 'long the basis' en wen as die basis versterk. (iv) Waar: basis risk is groot as die hedge lank voor expiry gesluit word; by expiry is dit feitlik nul. (i) is vals: onder normale toestande is die basis negatief (contango). (iii) is vals: 'n verswakkende basis benadeel die futures seller (hy ontvang minder).", "book_ref": "4.7, p.69-71; 4.7.2, p.73", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "(ii) True: the short hedger is 'long the basis' and gains when the basis strengthens. (iv) True: basis risk is large if the hedge is closed long before expiry; at expiry it is practically zero. (i) is false: under normal conditions the basis is negative (contango). (iii) is false: a weakening basis hurts the futures seller (he receives less).", "note_en": null}, {"paper": "IDK", "n": "P-16", "question": "Which of the following statements regarding import and export parity prices for maize in South Africa are correct?", "statements": ["i. The domestic spot price of maize will normally go no higher than the import parity price.", "ii. The export parity price is the lowest possible domestic price, i.e. a minimum price.", "iii. During surplus periods, the rand price of maize tends to move towards import parity.", "iv. The actual level of the domestic price between the minimum and maximum depends on local supply as well as demand."], "options": {"A": "(i) and (iii) only", "B": "(ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(i), (ii) and (iv) only"}, "answer": "D", "uitleg": "Import parity is die maksimum prys (millers sal invoer by daardie vlak) en export parity die minimum; die werklike vlak tussenin hang af van plaaslike vraag en aanbod. (iii) is vals: in surplus-periodes beweeg die rand prys na EXPORT parity; in tekort-periodes na import parity.", "book_ref": "1.2, p.12; 4.8, p.76", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Import parity is the maximum price, because millers will import at that level. Export parity is the minimum price. Where the actual price sits between them depends on local supply and demand. (iii) is false: in surplus periods the rand price moves towards EXPORT parity; in shortage periods it moves towards import parity.", "note_en": null}, {"paper": "IDK", "n": "P-17", "question": "Maize is in short supply around a particular silo. The current Randfontein spot (delivery month futures) price is R3 940 per ton, the JSE transport differential to the silo is R185 per ton, and a large local buyer is willing to pay an area (basis) premium of R70 per ton. A large producer delivering maize at this silo will receive", "statements": [], "options": {"A": "R3 825 per ton", "B": "R3 685 per ton", "C": "R3 755 per ton", "D": "R4 055 per ton"}, "answer": "A", "uitleg": "Prys ontvang = Randfontein prys - transport differential + area premium = 3 940 - 185 + 70 = R3 825. R3 685 trek die premie af in plaas daarvan om dit by te tel; R3 755 ignoreer die premie; R4 055 tel die differential by in plaas daarvan om dit af te trek.", "book_ref": "4.8, p.76; 4.8.2, p.77", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Price received = Randfontein price - transport differential + area premium = 3 940 - 185 + 70 = R3 825. R3 685 subtracts the premium instead of adding it. R3 755 ignores the premium. R4 055 adds the differential instead of subtracting it.", "note_en": null}, {"paper": "IDK", "n": "P-18", "question": "A swap dealer prices a 9-month fixed-for-floating crude oil swap with three quarterly resets. Using the information in the table and the simple interest method for discounting, the fixed price per barrel that gives the swap a zero value at inception is closest to", "statements": [], "options": {"A": "$74.43", "B": "$72.77", "C": "$74.41", "D": "$76.80"}, "answer": "C", "uitleg": "PV floating = 72.40/1.010 + 74.10/1.022 + 76.80/1.036 = $218.32. Som van diskontofaktore = 0.9901 + 0.9785 + 0.9653 = 2.9338. Fix = 218.32 / 2.9338 = $74.41. $74.43 is net die eenvoudige gemiddeld van die futures pryse (geen diskontering); $72.77 is PV gedeel deur 3 (fixed flows nie verdiskonteer nie); $76.80 is net die laaste futures prys.", "book_ref": "5.7, p.94-96", "topic": "Swaps", "note": null, "data": "Months to reset | WTI futures (USD) | Reference rate (simple, p.a.)\n3 | 72.40 | 4.0%\n6 | 74.10 | 4.4%\n9 | 76.80 | 4.8%", "uitleg_en": "Step 1, PV of the floating leg: 72.40/1.010 + 74.10/1.022 + 76.80/1.036 = $218.32. Step 2, sum of the discount factors: 0.9901 + 0.9785 + 0.9653 = 2.9338. Step 3, fixed price = 218.32 / 2.9338 = $74.41. Wrong options: $74.43 is just the simple average of the futures prices (no discounting); $72.77 is the PV divided by 3 (the fixed flows were not discounted); $76.80 is just the last futures price.", "note_en": null}, {"paper": "IDK", "n": "P-19", "question": "An oil consumer has bought a fixed-for-floating crude oil swap from a swap dealer at a fixed price of $85.00 per barrel on a notional of 50 000 barrels. On a reset date the floating reference price is $81.40 per barrel. On that reset date", "statements": [], "options": {"A": "the dealer pays the consumer $180 000.", "B": "the consumer pays the dealer $180 000.", "C": "the consumer pays the dealer $4 250 000 and the dealer pays the consumer $4 070 000.", "D": "the consumer pays the dealer $18 000."}, "answer": "B", "uitleg": "Die koper van die swap betaal fixed en ontvang floating. Floating (81.40) is laer as fixed (85.00), dus betaal die consumer die verskil: 3.60 x 50 000 = $180 000. In die praktyk word net die verskil betaal (die notional word nooit uitgeruil nie), dus is C verkeerd. Die consumer koop sy olie goedkoper in die spot mark, sodat sy effektiewe koste $85 bly.", "book_ref": "5.2, p.89-90; 5.6, p.93", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "The buyer of the swap pays fixed and receives floating. Floating (81.40) is lower than fixed (85.00), so the consumer pays the difference: 3.60 x 50 000 = $180 000. In practice only the difference is paid; the notional is never exchanged, so C is wrong. The consumer buys his oil more cheaply in the spot market, so his effective cost stays at $85.", "note_en": null}, {"paper": "IDK", "n": "P-20", "question": "Which of the following statements regarding the advantages and disadvantages of commodity swaps are correct?", "statements": ["i. Swaps are not subject to the daily margining requirements of futures, which may, however, bear the possibility of credit risk.", "ii. Because swaps do not culminate in physical delivery, a producer who hedges with a swap carries no production risk.", "iii. Limited liquidity and counterparty risk are disadvantages of commodity swaps.", "iv. Lower transaction cost and customisation are advantages of commodity swaps."], "options": {"A": "(ii) and (iii) only", "B": "(i) and (iv) only", "C": "(i), (ii) and (iii) only", "D": "(i), (iii) and (iv) only"}, "answer": "D", "uitleg": "(i) Waar: geen daaglikse margining nie (buigsaam), maar dit bring moontlike credit risk. (iii) en (iv) kom direk uit die boek se tabel. (ii) is vals: al lewer swaps nie fisies nie, is daar steeds production risk; die boer wat 'n swap teen R4 000/t het en geen oes het nie, moet steeds R1 000/t betaal as die prys na R5 000/t styg.", "book_ref": "5.6, p.93-94", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "(i) True: there is no daily margining (flexible), but this brings possible credit risk. (iii) and (iv) come straight from the book's table. (ii) is false: swaps do not involve physical delivery, but production risk still exists. Example: a farmer with a swap at R4 000/t and no harvest must still pay R1 000/t if the price rises to R5 000/t.", "note_en": null}, {"paper": "IDK", "n": "O-01", "question": "The September wheat futures contract is trading at R3 240 per ton. Which of the following options on September wheat futures are in-the-money or at-the-money as indicated?", "statements": ["i. A R3 200 call is in-the-money.", "ii. A R3 300 put is in-the-money.", "iii. A R3 240 put is at-the-money.", "iv. A R3 280 call is in-the-money."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (iii) and (iv) only"}, "answer": "B", "uitleg": "Call is ITM as futures > strike (3 240 > 3 200); put is ITM as futures < strike (3 240 < 3 300); strike = futures beteken ATM. Die R3 280 call is OTM, want futures (3 240) < strike (3 280), so (iv) is verkeerd.", "book_ref": "6.4.5, p.106-107 (Table 6.1)", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "A call is ITM when futures > strike (3 240 > 3 200). A put is ITM when futures < strike (3 240 < 3 300). Strike = futures means ATM. The R3 280 call is OTM, because futures (3 240) < strike (3 280). So (iv) is wrong and (i), (ii) and (iii) are correct.", "note_en": null}, {"paper": "IDK", "n": "O-02", "question": "A trader buys one December white maize (WMAZ) put option with a strike price of R2 400 per ton at a premium of R95 per ton when the December futures price is R2 330 per ton. One option contract has one futures contract of 100 tons as underlying. What are the intrinsic value and the time value of the option contract respectively?", "statements": [], "options": {"A": "Intrinsic value R2 500; time value R7 000", "B": "Intrinsic value R0; time value R9 500", "C": "Intrinsic value R7 000; time value R2 500", "D": "Intrinsic value R70; time value R25"}, "answer": "C", "uitleg": "Put intrinsic = strike - futures = 2 400 - 2 330 = R70/t; time value = 95 - 70 = R25/t. Per kontrak x 100 t: R7 000 intrinsic en R2 500 time value. Opsie A ruil die twee om; B hanteer dit soos 'n call (geen intrinsic); D is per ton, nie per kontrak nie.", "book_ref": "6.3, p.101; 6.4.4, p.106; 6.7, p.111", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "Put intrinsic value = strike - futures = 2 400 - 2 330 = R70/t. Time value = premium - intrinsic = 95 - 70 = R25/t. Multiply by 100 t per contract: R7 000 intrinsic value and R2 500 time value. Option A swaps the two. B treats the option as a call (no intrinsic value). D gives the per-ton figures, not per contract.", "note_en": null}, {"paper": "IDK", "n": "O-03", "question": "Which of the following statements regarding the rights and obligations of exchange-traded option holders and writers are correct?", "statements": ["i. When a put option is exercised, the writer of the put is assigned a long futures position at the strike price.", "ii. The writer who is assigned the opposite futures position is randomly selected by the exchange trading computer program.", "iii. In the OTC market, option contracts can freely be sold to third parties.", "iv. Offsetting an option before expiration is the only way to recover any remaining time value."], "options": {"A": "(i), (ii) and (iv) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iii) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "A", "uitleg": "Put writer word 'n long futures toegeken; die writer word ewekansig deur die exchange se rekenaarprogram gekies; slegs offset herwin oorblywende time value. (iii) is vals: in die OTC mark kan opsiekontrakte NIE aan derde partye verkoop word nie.", "book_ref": "6.4, p.103; 6.6.1, p.110", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "(i) A put writer is assigned a long futures position. (ii) The writer is chosen at random by the exchange's computer program. (iv) Only offsetting recovers any remaining time value. (iii) is false: in the OTC market, option contracts can NOT be sold to third parties.", "note_en": null}, {"paper": "IDK", "n": "O-04", "question": "Which ONE of the following statements regarding grain options listed on the JSE CDM is correct?", "statements": [], "options": {"A": "Grain options on the JSE CDM are all of the European type and can only be exercised on the expiry date.", "B": "Strike prices of maize and wheat options are set in intervals of R10 per ton.", "C": "Grain options expire on the same day as the underlying futures contract.", "D": "When a JSE CDM option expires in-the-money, it is automatically exercised by the exchange and futures positions are assigned to the buyer and the seller."}, "answer": "D", "uitleg": "Volgens die boek word 'n ITM opsie by expiry outomaties deur die exchange uitgeoefen en futures word aan koper en verkoper toegeken. Die grain options is American (nie European nie), strikes is in R20/t intervalle, en opsies verval 5 business days voor die maand wat die futures expiry-maand voorafgaan, nie op dieselfde dag nie.", "book_ref": "6.3, p.101; 6.6, p.109; 6.6.1, p.111", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "According to the book, an ITM option is automatically exercised by the exchange at expiry, and futures positions are assigned to the buyer and the seller. So D is correct. The other options are wrong because: the grain options are American (not European); strikes are in R20/t intervals; and options expire 5 business days before the month preceding the futures expiry month, not on the same day as the futures.", "note_en": null}, {"paper": "IDK", "n": "O-05", "question": "Which of the following statements regarding the factors that affect an option's premium are correct?", "statements": ["i. Time value is at its highest when an option is at-the-money.", "ii. Higher interest rates, all else being equal, should make options more expensive.", "iii. Time value does not erode on a straight-line basis, but decreases much more rapidly during the last few weeks of the option's life.", "iv. The relationship between time to expiration and the option premium is measured by theta."], "options": {"A": "(i) and (ii) only", "B": "(ii), (iii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "C", "uitleg": "Time value is die hoogste by ATM; time decay volg 'n negatief eksponensiele kurwe en versnel in die laaste weke; theta meet die verband met tyd tot expiry. (ii) is vals: volgens die boek maak hoer rentekoerse (ceteris paribus) opsies GOEDKOPER (rho), want die koper se opportunity cost styg en die writer verdien meer op die premie.", "book_ref": "6.7, p.111-114", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "(i) Time value is highest when the option is ATM. (iii) Time decay follows a negative exponential curve and speeds up in the last few weeks. (iv) Theta measures how the premium relates to time to expiry. These are true. (ii) is false: according to the book, higher interest rates (ceteris paribus) make options CHEAPER (rho). The buyer's opportunity cost rises, and the writer earns more on the premium.", "note_en": null}, {"paper": "IDK", "n": "O-06", "question": "Which ONE of the following statements regarding volatility and option values is correct?", "statements": [], "options": {"A": "The intrinsic value of an in-the-money option increases in direct proportion to an increase in volatility.", "B": "The level of volatility affects the delta of in-the-money and out-of-the-money options, but not that of at-the-money options.", "C": "When purchasing options, an investor is said to be selling volatility.", "D": "The SAVI-White Maize is based on the historical volatility of white maize prices over the past three months."}, "answer": "B", "uitleg": "Die boek se: volatility beinvloed die delta van ITM en OTM opsies, maar nie ATM opsies nie. Intrinsic value word nie direk deur volatility geraak nie; 'n opsie-koper 'koop' volatility (die writer verkoop dit); SAVI-White Maize is forward-looking (implied, ATM vol), nie histories nie.", "book_ref": "6.7(iii), p.113-114; 6.13.1, p.137; 7.3.3, p.163; 7.3.6, p.165", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "The book says: volatility affects the delta of ITM and OTM options, but not of ATM options. Why the others are wrong: intrinsic value is not directly affected by volatility. An option buyer 'buys' volatility (the writer sells it). SAVI-White Maize is forward-looking (implied, ATM vol), not historical.", "note_en": null}, {"paper": "IDK", "n": "O-07", "question": "An option trader has written (sold) 20 July white maize put options. The delta of each put option is -0.35. To be delta neutral, how should the trader initially hedge, and what should the trader do if the futures price then falls and the put delta changes to -0.45?", "statements": [], "options": {"A": "Sell 7 futures contracts; then sell 2 more futures contracts.", "B": "Buy 7 futures contracts; then buy 2 more futures contracts.", "C": "Sell 7 futures contracts; then buy back 2 futures contracts.", "D": "Buy 7 futures contracts; then sell 2 futures contracts."}, "answer": "A", "uitleg": "Short put hedge = sell delta units: 20 x 0.35 = 7 futures verkoop. Met delta -0.45: 20 x 0.45 = 9 nodig, dus verkoop nog 2. Die boek se die put writer verkoop progressief futures as die prys val (hedge vergroot); 'buy' is die hedge vir 'n long put.", "book_ref": "7.3.4, p.164-165; 7.3.7, p.165", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "To hedge a short put, you sell futures equal to the delta. Start: 20 x 0.35 = 7, so sell 7 futures. After the price falls, delta is -0.45: 20 x 0.45 = 9 futures needed, so sell 2 more. The book says the put writer progressively sells more futures as the price falls (the hedge gets bigger). Buying futures would be the hedge for a long put.", "note_en": null}, {"paper": "IDK", "n": "O-08", "question": "A trader holds 10 long WMAZ call options with a delta of 0.6 and 8 short WMAZ put options (option delta -0.3) on the same futures contract (100 tons per contract). If the futures price rises by R4 per ton, the approximate change in the value of the combined option position, based on delta, is", "statements": [], "options": {"A": "+R1 440", "B": "+R33.60", "C": "-R960", "D": "+R3 360"}, "answer": "D", "uitleg": "Long call: +0.6 x R4 x 100 t x 10 = +R2 400. Short put het 'n positiewe position delta (+0.3): +0.3 x R4 x 100 x 8 = +R960. Totaal = +R3 360. A trek die short put verkeerdelik af (teken-fout); B vergeet die 100 t kontrakgrootte.", "book_ref": "7.3.2, p.162-163 (Table 7.15); 7.3.4, p.164", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "Long calls: +0.6 x R4 x 100 t x 10 = +R2 400. Short puts: a put has delta -0.3, so being short the put gives a positive position delta of +0.3. That gives +0.3 x R4 x 100 x 8 = +R960. Total = +R2 400 + R960 = +R3 360. A wrongly subtracts the short put (a sign error). B forgets the 100 t contract size.", "note_en": null}, {"paper": "IDK", "n": "O-09", "question": "In February a maize farmer buys July maize put options with a strike price of R2 600 per ton at a premium of R110 per ton. Commission and other fees amount to R8 per ton, the interest cost of financing the premium is 9% p.a. (simple) for 4 months, and the location differential at his silo is R95 per ton. Ignoring any silo premium, his minimum selling price (MSP) is", "statements": [], "options": {"A": "R2 387.00 per ton", "B": "R2 478.70 per ton", "C": "R2 383.70 per ton", "D": "R2 573.70 per ton"}, "answer": "C", "uitleg": "MSP = strike - premium - interest - commissions - location differential. Rente = 110 x 9% x 4/12 = R3.30. MSP = 2 600 - 110 - 3.30 - 8 - 95 = R2 383.70. A vergeet die rente; B vergeet die location differential; D tel die location differential by in plaas van af.", "book_ref": "6.6, p.109", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "MSP = strike - premium - interest - commissions - location differential. Interest = 110 x 9% x 4/12 = R3.30. MSP = 2 600 - 110 - 3.30 - 8 - 95 = R2 383.70. A forgets the interest. B forgets the location differential. D adds the location differential instead of subtracting it.", "note_en": null}, {"paper": "IDK", "n": "O-10", "question": "A wheat miller buys a September wheat call option with a strike price of R3 500 per ton at a premium of R140 per ton to hedge future purchases. Ignoring basis, interest and commissions, what is the miller's effective purchase price per ton if the September futures price at expiry is (a) R3 900 per ton and (b) R3 300 per ton?", "statements": [], "options": {"A": "(a) R3 500; (b) R3 300", "B": "(a) R3 640; (b) R3 440", "C": "(a) R3 360; (b) R3 160", "D": "(a) R3 640; (b) R3 640"}, "answer": "B", "uitleg": "(a) Oefen uit: long futures by 3 500, wins 400 op futures, koop teen 3 900: 3 900 - 400 + 140 = R3 640 (= strike + premie, die plafon). (b) Laat opsie verval, koop teen 3 300 + 140 = R3 440, so die miller deel in laer pryse. C trek die premie af in plaas van by te tel; A ignoreer die premie.", "book_ref": "6.6, p.109; 6.8 Example #2, p.116", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "(a) Futures at R3 900: the miller exercises the call and gets long futures at 3 500, a profit of 400 on the futures. He buys at 3 900. Effective price = 3 900 - 400 + 140 = R3 640 (= strike + premium, which is his ceiling price). (b) Futures at R3 300: he lets the option expire and buys at 3 300 + 140 premium = R3 440. So the miller still shares in lower prices. Option C subtracts the premium instead of adding it; option A ignores the premium.", "note_en": null}, {"paper": "IDK", "n": "O-11", "question": "A maize farmer with maize in storage (long the underlying) sets up a collar: he buys a put with a strike of R2 200 per ton at R70 per ton and writes a call with the same maturity and a strike of R2 600 per ton at R50 per ton. Ignoring basis and other costs, the net price range he has secured is", "statements": [], "options": {"A": "Minimum R2 200 and maximum R2 600 per ton", "B": "Minimum R2 130 and maximum R2 550 per ton", "C": "Minimum R2 220 and maximum R2 620 per ton", "D": "Minimum R2 180 and maximum R2 580 per ton"}, "answer": "D", "uitleg": "Koste van collar = 70 - 50 = R20. Netto waarde nooit minder as X1 - koste (2 200 - 20 = R2 180) en nooit meer as X2 - koste (2 600 - 20 = R2 580). A ignoreer die koste; B trek die premies apart af; C tel die koste by.", "book_ref": "6.12.4, p.135", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "Cost of the collar = put premium paid - call premium received = 70 - 50 = R20. Net value is never less than X1 - cost (2 200 - 20 = R2 180). It is never more than X2 - cost (2 600 - 20 = R2 580). A ignores the cost. B subtracts each premium separately. C adds the cost instead of subtracting it.", "note_en": null}, {"paper": "IDK", "n": "O-12", "question": "A speculator buys a May WMAZ call with a strike of R2 400 per ton at R120 per ton and simultaneously sells a May WMAZ call with a strike of R2 520 per ton at R60 per ton. What is the profit per ton at expiry if the May futures price is R2 480 per ton, and what is the maximum profit per ton of this strategy?", "statements": [], "options": {"A": "+R20; maximum profit R60", "B": "+R80; maximum profit R120", "C": "-R40; maximum profit R60", "D": "+R20; maximum profit R120"}, "answer": "A", "uitleg": "Bull spread met calls, netto debiet = 120 - 60 = R60. By 2 480: long call = 80, short call = 0, dus 80 - 60 = +R20. Maks wins = (2 520 - 2 400) - 60 = R60 (limited reward). B ignoreer die premies; D vergeet om die netto premie van die maksimum af te trek.", "book_ref": "6.12.2, p.129-130", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "This is a bull spread with calls. Net debit = 120 - 60 = R60. At 2 480: the long call is worth 80 and the short call is worth 0. So profit = 80 - 60 = +R20. Maximum profit = (2 520 - 2 400) - 60 = R60 (limited reward). B ignores the premiums. D forgets to subtract the net premium from the maximum.", "note_en": null}, {"paper": "IDK", "n": "O-13", "question": "Consider European call and put options on soybean futures with the same strike price and maturity. Using put-call parity as applied in the book (simple interest), what is the fair put premium (rounded) given the following data?", "statements": [], "options": {"A": "R560", "B": "R960", "C": "R252", "D": "R1 268"}, "answer": "C", "uitleg": "p = c - S0 + K/(1 + r x t) = 760 - 8 200 + 8 000/(1 + 0.08 x 6/12) = 760 - 8 200 + 7 692 = R252. A ignoreer die verdiskontering (760 - 200); D gebruik die verkeerde teken (c + S0 - PV(K)); B tel die verskil by in plaas van af.", "book_ref": "6.11-6.11.1, p.122-124", "topic": "Option strategies", "note": null, "data": "Current soybean futures price (S0): R8 200\nStrike price (K): R8 000\nTime to maturity: 6 months\nInterest rate: 8% p.a.\nCall option price: R760\nPut option price: ?", "uitleg_en": "Put-call parity (simple interest): p = c - S0 + K/(1 + r x t). Plug in: 760 - 8 200 + 8 000/(1 + 0.08 x 6/12) = 760 - 8 200 + 7 692 = R252. Wrong options: A ignores the discounting (760 - 200); D uses the wrong sign (c + S0 - PV(K)); B adds the difference instead of subtracting it.", "note_en": null}, {"paper": "IDK", "n": "O-14", "question": "Which of the following statements regarding synthetic option positions are correct?", "statements": ["i. Buying a futures contract and writing a call with the same expiration creates a synthetic short put.", "ii. Buying a futures contract and buying a put with the same expiration creates a synthetic long call.", "iii. A producer who has sold futures and buys a call option creates a synthetic long put.", "iv. A covered call writer has a limited risk and an unlimited reward profile."], "options": {"A": "(i) and (iv) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "B", "uitleg": "Covered call (long futures + short call) = synthetic short put; protective put (long futures + long put) = synthetic long call; short futures + long call = synthetic long put (nuttig vir 'n produsent). (iv) is vals: 'n covered call het onbeperkte risiko (as futures skerp val) en beperkte wins (= premie).", "book_ref": "6.12.1, p.126-128", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "(i) Covered call (long futures + short call) = synthetic short put. (ii) Protective put (long futures + long put) = synthetic long call. (iii) Short futures + long call = synthetic long put (useful for a producer). These three are true. (iv) is false: a covered call has unlimited risk (if futures fall sharply) and limited profit (= the premium).", "note_en": null}, {"paper": "IDK", "n": "O-15", "question": "In terms of the definitions in the JSE derivatives rules, a \"trader\" means", "statements": [], "options": {"A": "any person who has passed the JSE CDM Dealers Examination.", "B": "the person appointed by the JSE to supervise, administer and control the daily operations of the JSE trading system.", "C": "the director of the JSE Surveillance department.", "D": "an employee of a trading member authorised by the JSE and registered by the trading member to trade for the trading member's own account or on behalf of clients, or both."}, "answer": "D", "uitleg": "Die definisie: 'n employee van 'n trading member, deur die JSE gemagtig en deur die trading member geregistreer om vir eie rekening en/of namens kliente te handel. Om die eksamen te slaag alleen is nie genoeg nie (rule 3.20 vereistes en registrasie ook). B is die Market Controller; C is die Director: Market Regulation.", "book_ref": "8.2, p.173-174; 8.17 (Table 8.6), p.187-189", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The definition: an employee of a trading member, authorised by the JSE and registered by the trading member, to trade for its own account and/or on behalf of clients. Passing the exam alone is not enough (the rule 3.20 requirements and registration also apply). B describes the Market Controller. C describes the Director: Market Regulation.", "note_en": null}, {"paper": "IDK", "n": "O-16", "question": "The unpublished figures of the National Crop Estimates Committee, which are likely to have a material effect on the white maize futures price, are discussed at a family dinner by a committee member. Which of the following statements are correct?", "statements": ["i. A relative of the committee member who learns these figures is an insider.", "ii. Merely being in possession of this inside information is an offence.", "iii. A JSE trader who knows that the source of the information is the committee member and then deals in WMAZ futures for his own account commits an offence.", "iv. A JSE trader who executes a client's specific instruction to buy WMAZ futures, not knowing that the client is an insider, commits an offence."], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iii) only", "C": "(ii) and (iv) only", "D": "(i), (iii) and (iv) only"}, "answer": "A", "uitleg": "Die ongepubliseerde skatting is inside information en wie daartoe toegang het (bv. 'n familielid) is 'n insider; 'n JSE trader wat weet die bron is 'n insider is ook 'n insider en pleeg 'n oortreding as hy daarop handel. (ii) vals: om insider te wees of die inligting te he is nie 'n oortreding nie. (iv) vals: 'n trader wat op spesifieke kliente-instruksies handel sonder om te weet die klient is 'n insider, is uitgesluit.", "book_ref": "8.6, p.176-178", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "(i) True: the unpublished estimate is inside information, and anyone who has access to it (e.g. a family member) is an insider. (iii) True: a JSE trader who knows the source is an insider is also an insider, and commits an offence if he trades on it. (ii) is false: simply being an insider or having the information is not an offence. (iv) is false: a trader who trades on specific client instructions without knowing the client is an insider is excluded.", "note_en": null}, {"paper": "IDK", "n": "O-17", "question": "A person who contravened section 78 of the FMA (insider trading) is liable to an administrative sanction. Which of the following may form part of this sanction according to the book?", "statements": ["i. The equivalent of the profit made, or loss avoided, through such dealings.", "ii. An amount of up to R1 million or the adjusted value for that particular year.", "iii. Interest.", "iv. An amount equal to three times the profit made through such dealings."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "B", "uitleg": "Die sanksie sluit in: die ekwivalente wins gemaak of verlies vermy, tot R1 miljoen (of aangepaste waarde), rente, en koste van die geding insluitend ondersoekkoste. (iv) 'drie keer die wins' kom nie in die boek voor nie; dit is die ekwivalente wins.", "book_ref": "8.6, p.178", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The sanction can include: the equivalent of the profit made or loss avoided; up to R1 million (or adjusted value); interest; and the costs of the proceedings, including investigation costs. That covers (i), (ii) and (iii). (iv) 'three times the profit' does not appear in the book; the book says the equivalent of the profit.", "note_en": null}, {"paper": "IDK", "n": "O-18", "question": "Which of the following are deemed to be manipulative or deceptive methods of trading in agricultural product securities?", "statements": ["i. Entering orders to buy at successively higher prices for the purpose of unduly influencing the market price.", "ii. Entering an order at or near the close of the market, the primary purpose of which is to change the closing price.", "iii. Entering an order during the pre-opening period and cancelling it immediately prior to market opening to create a false appearance of demand.", "iv. Reporting an exchange for physical (EFP) trade on the ATS where the futures quantity is within 5% of the physical contract quantity and the supporting documents are available on request."], "options": {"A": "(i) and (iv) only", "B": "(ii) and (iii) only", "C": "(i), (ii) and (iii) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "C", "uitleg": "Die reels noem uitdruklik: (i) orders teen opeenvolgend hoer pryse om die prys onbehoorlik te beinvloed, (ii) 'n order naby sluiting met die primere doel om die sluitprys te verander, (iii) pre-opening orders wat net voor opening gekanselleer word om valse vraag te skep. (iv) is 'n wettige EFP: hoeveelhede binne 5% en dokumente beskikbaar.", "book_ref": "8.7.1, p.179-180; 8.10-8.11, p.181", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The rules list these explicitly: (i) orders at successively higher prices to improperly influence the price; (ii) an order near the close with the main purpose of changing the closing price; (iii) pre-opening orders cancelled just before the open to create false demand. (iv) is a legal EFP: the quantities are within 5% and the documents are available.", "note_en": null}, {"paper": "IDK", "n": "O-19", "question": "A speculative client (no hedging positions) holds the following positions in the September WMAZ contract (not the spot month): long 2 600 futures, long 1 000 call options (delta 0.6) and short 500 put options (delta -0.4). Using the 2022 speculative position limits in the book, which ONE of the following statements is correct?", "statements": [], "options": {"A": "The futures equivalent position is 3 400 contracts net long, which exceeds the single month limit.", "B": "The futures equivalent position is 3 000 contracts net long, which does not exceed the single month limit.", "C": "The futures equivalent position is 4 100 contracts net long, which is within the all months combined limit and therefore allowed.", "D": "The position limit only applies to futures, so the client holds 2 600 contracts and is within the limit."}, "answer": "A", "uitleg": "Futures equivalent: +2 600 + (1 000 x 0.6) + (500 x 0.4) = 3 400 netto long, want 'n short put het 'n POSITIEWE delta factor. WMAZ single month limit = 3 000, dus oorskry. B trek die short put verkeerdelik af; C ignoreer delta; D is vals want opsies tel op 'n futures equivalent basis.", "book_ref": "8.15.2, p.185 (speculative position limits table); 8.17 'futures equivalent positions', p.187", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Futures equivalent = +2 600 + (1 000 x 0.6) + (500 x 0.4) = 3 400 net long. The short put is ADDED because a short put has a POSITIVE delta factor. The WMAZ single month limit is 3 000, so the position exceeds it. Wrong options: B wrongly subtracts the short put; C ignores delta; D is false because options count on a futures equivalent basis.", "note_en": null}, {"paper": "IDK", "n": "O-20", "question": "Which of the following statements regarding speculative position limits on the JSE CDM are correct?", "statements": ["i. On receipt of a written request from the JSE, a client must furnish a written statement of its positions within two business days.", "ii. Positions held by two or more persons acting pursuant to an express or implied agreement are treated as if held by a single individual.", "iii. Speculative position limits may be exceeded to the extent that the positions are valid hedging positions.", "iv. The JSE may request information on positions but may not direct a trading member to reduce a client's position."], "options": {"A": "(i) and (iii) only", "B": "(ii) and (iv) only", "C": "(i), (ii) and (iv) only", "D": "(i), (ii) and (iii) only"}, "answer": "D", "uitleg": "Op skriftelike versoek moet 'n verklaring binne twee business days ingedien word; posisies van persone wat volgens 'n ooreenkoms saam optree, word as een persoon behandel; geldige hedging posisies mag die spekulatiewe limiete oorskry. (iv) is vals: die clearing house of gemagtigde persoon KAN opdrag gee om die posisie te likwideer of te verminder.", "book_ref": "8.15.2, p.185", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "(i) On written request, a declaration must be submitted within two business days. (ii) Positions of people acting together under an agreement are treated as one person's position. (iii) Valid hedging positions may exceed the speculative limits. These are true. (iv) is false: the clearing house or an authorised person CAN order the position to be liquidated or reduced.", "note_en": null}, {"paper": "P1", "n": 1, "question": "Which of the following statements about the maize market in South Africa are correct?", "statements": ["i. In South Africa maize is planted primarily in the months of November and December.", "ii. Maize production in South Africa is largely dominated by yellow maize.", "iii. The amount of money payable to a supplier of physical maize will be decreased by about 1% if the consignment's moisture content is 1 percentage point above 12.5%.", "iv. The grading system for white and yellow maize consists of four major grades each."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "(i) is waar: mielies word hoofsaaklik in November en Desember geplant. (iii) is waar: die prys word met ongeveer 1% aangepas vir elke persentasiepunt vog bo of onder 12.5%. (ii) is vals, want produksie is ongeveer gelyk verdeel tussen wit en geel mielies. (iv) is vals, want daar is drie hoofgrade elk (WM1-3, YM1-3).", "book_ref": "1.2, p.6-7", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "(i) is true: maize is mainly planted in November and December. (iii) is true: the price is adjusted by about 1% for every percentage point of moisture above or below 12.5%. (ii) is false: production is split roughly equally between white and yellow maize. (iv) is false: there are three main grades of each (WM1-3, YM1-3).", "note_en": null}, {"paper": "P1", "n": 2, "question": "For sunflower seed delivered in the physical market, the specification regarding moisture content is a", "statements": [], "options": {"A": "maximum of 10%.", "B": "maximum of 12.5%.", "C": "minimum of 10%.", "D": "minimum of 12.5%."}, "answer": "A", "uitleg": "Die boek sê vir sonneblomsaad: 'The maximum amount of moisture allowed is 10%' (Tabel 3: 9% droog, maksimum 10%). 12.5% is die mielie-standaard, en dit is daarom die strikvraag-opsie.", "book_ref": "1.4.1, p.16; Table 3, p.22", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "The book says for sunflower seed: 'The maximum amount of moisture allowed is 10%' (Table 3: 9% dry, maximum 10%). 12.5% is the maize standard, which is why it is the trick option.", "note_en": null}, {"paper": "P1", "n": 3, "question": "Which of the following statements about the South African wheat market are correct?", "statements": ["i. Wheat is generally harvested during November, December and January.", "ii. Currently the South Western Cape is the main wheat producing area in South Africa.", "iii. The harder wheat class tends to have a lower protein content than softer wheat and is more suitable for biscuits than for bread.", "iv. Wheat has much the same storage and perishability qualities as maize."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "(i) is waar, want koring word van November tot Januarie geoes. (iv) is woordeliks uit die boek: 'much the same storage and perishability qualities as maize'. (iii) is vals, want harde koring het MEER proteïen en is vir brood. (ii) is lastig: volgens die boek het die Wes-Kaap in 2020 42% geproduseer (die grootste), maar die memo en die meeste antwoorde kies B.", "book_ref": "1.3.1-1.3.3, p.14", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "(i) is true, because wheat is harvested from November to January. (iv) is word for word from the book: 'much the same storage and perishability qualities as maize'. (iii) is false: hard wheat has MORE protein and is used for bread. (ii) is tricky: the book says the Western Cape produced 42% in 2020 (the largest share), but the memo and most answer keys choose B.", "note_en": null}, {"paper": "P1", "n": 4, "question": "A very important role fulfilled by the agricultural futures markets is to", "statements": ["i. transfer the underlying commodities from one owner to another.", "ii. facilitate price risk management for both sellers and buyers.", "iii. provide speculators with high levels of profits in the market.", "iv. enhance price discovery in the market."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "D", "uitleg": "Die primêre doel van termynmarkte is 'n doeltreffende meganisme vir price risk management (hedging), en hulle speel 'n aktiewe rol in price determination/transparency (price discovery). Hulle is nie bedoel om eienaarskap oor te dra nie; die self-test sê ook spesifiek dat die doel nie is om spekulante 'n platform te gee nie.", "book_ref": "2.4, p.27; 2.6 self-test, p.29", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "The main purpose of futures markets is to provide an efficient mechanism for price risk management (hedging) (ii). They also play an active role in price determination and transparency (price discovery) (iv). They are not meant to transfer ownership. The self-test also says specifically that their purpose is not to give speculators a platform.", "note_en": null}, {"paper": "P1", "n": 5, "question": "The prerequisites for successful trading in agricultural futures and options contracts include the fact that any such underlying commodity should", "statements": [], "options": {"A": "always be available for visible inspection by the buyer.", "B": "be a heterogeneous commodity.", "C": "not easily trade in the cash or spot market.", "D": "be exposed to frequent price variation."}, "answer": "D", "uitleg": "Die boek lys: homogeen en graderbaar (dus nie heterogeen nie), stoorbaar en vervoerbaar, 'n goed funksionerende cash market, en 'exposed to frequent price variations', want sonder prysrisiko is daar geen behoefte aan hedging nie. Standaardisering beteken juis dat kopers die produk NIE hoef te sien nie.", "book_ref": "2.5, p.28", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "The book lists these prerequisites: the commodity is homogeneous and gradable (so not heterogeneous), storable and transportable, has a well-functioning cash market, and is 'exposed to frequent price variations'. Without price risk there is no need to hedge. Also, standardisation means buyers do NOT need to see the product.", "note_en": null}, {"paper": "P1", "n": 6, "question": "Which of the following are considered disadvantages of forward contracts?", "statements": ["i. Because the price is fixed the farmer is excluded from the benefits of a market rally.", "ii. Such contracts cannot be easily unwound by settling in cash before the delivery date.", "iii. Buyer cannot estimate cash flow before delivery as profits and losses are realised daily.", "iv. If production is less than anticipated the buyer may be unable to pay the seller."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "(i) staan in die boek se lys van nadele. (ii) klop met Tabel 4.1: by forwards is 'no closing possible before maturity'. (iii) beskryf futures (daily MTM), nie forwards nie; forwards het selde kontantvloei voor aflewering. (iv) meng twee risiko's deurmekaar: swak produksie is die produsent se nie-leweringsrisiko, nie die koper se onvermoë om te betaal nie. Net A sluit (iii) uit.", "book_ref": "3.1.2, p.31; Table 4.1, p.42-43", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "(i) is in the book's list of disadvantages. (ii) matches Table 4.1: with forwards there is 'no closing possible before maturity'. (iii) describes futures (daily MTM), not forwards; forwards rarely have cash flows before delivery. (iv) mixes up two risks: poor production is the producer's risk of not delivering, not the buyer's inability to pay. Only A leaves out (iii).", "note_en": null}, {"paper": "P1", "n": 7, "question": "If the spot price of maize is R1 150 per ton; the interest rate is 6.5% per annum, quarterly compounded; storage cost is R69 per ton payable after 9 months; and the convenience yield is 2.75% of the spot price, the 9-month forward price of a maize contract will be", "statements": [], "options": {"A": "R1 249.85 per ton.", "B": "R1 250.26 per ton.", "C": "R1 274.62 per ton.", "D": "R1 275.98 per ton."}, "answer": "B", "uitleg": "Formule 3.5: F0 = (S0 + PV(U))(1 + (i-y)/f)^(nf). PV(U) = 69 x (1 + 0.065/4)^-3 = R65.74. F0 = (1150 + 65.74) x (1 + (0.065 - 0.0275)/4)^3 = 1215.74 x 1.02840 = R1 250.26. D (R1 275.98) is die strik: dit ignoreer die convenience yield.", "book_ref": "3.2, formulas 3.4-3.5, p.35-36", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "Use Formula 3.5: F0 = (S0 + PV(U))(1 + (i-y)/f)^(nf). Step 1: PV(U) = 69 x (1 + 0.065/4)^-3 = R65.74. Step 2: F0 = (1150 + 65.74) x (1 + (0.065 - 0.0275)/4)^3 = 1215.74 x 1.02840 = R1 250.26. D (R1 275.98) is the trap: it ignores the convenience yield.", "note_en": null}, {"paper": "P1", "n": 8, "question": "Which of the following attributes constitute the characteristics of agricultural futures contracts?", "statements": ["i. They are standardised, transferable, exchange traded instruments.", "ii. The risk is shared equally by buyers and sellers.", "iii. In a futures contract the seller has an obligation to take delivery of the product.", "iv. In principle, futures contracts are also forward contracts."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek: 'standardised, transferable, exchange-traded contract'. Die risiko is simmetries, want wins en verlies is gelyk en teenoorgesteld (zero-sum). 'Futures contracts are also forward contracts' in beginsel. (iii) is vals: die verkoper (short) moet LEWER (make delivery); die koper neem lewering.", "book_ref": "4.1.1 & 4.1.3, p.40-41", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "The book describes a futures contract as a 'standardised, transferable, exchange-traded contract'. The risk is symmetric: gains and losses are equal and opposite (zero-sum). In principle, 'futures contracts are also forward contracts'. (iii) is false: the seller (short) must MAKE delivery; the buyer takes delivery.", "note_en": null}, {"paper": "P1", "n": 9, "question": "In the agricultural commodities market, futures contracts specifically differ from forward contracts in the sense that", "statements": ["i. forward contracts are not guaranteed but futures are.", "ii. the price of a futures contract is negotiated between buyer and seller.", "iii. a forward contract usually settles through physical delivery of the product while most futures are cash settled.", "iv. the buying party in a futures contract is usually known to the selling party, which is not the case with forwards."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Volgens Tabel 4.1 het forwards geen waarborg nie, terwyl futures deur die clearinghouse gewaarborg word, en forwards eindig gewoonlik met fisiese aflewering terwyl futures meestal voor verstryking uitgeskakel word. (ii) en (iv) is omgekeerd: forward-pryse word privaat onderhandel, en by forwards ken die partye mekaar (by futures nie).", "book_ref": "4.2, Table 4.1, p.42-43", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "According to Table 4.1: (i) forwards have no guarantee, while futures are guaranteed by the clearing house. (iii) Forwards usually end in physical delivery, while futures are mostly closed out before expiry. (ii) and (iv) are the wrong way round: forward prices are negotiated privately, and with forwards the parties know each other (with futures they do not).", "note_en": null}, {"paper": "P1", "n": 10, "question": "A large bread baker wants to hedge his future input costs and enters into a wheat futures contract at R2 600 per ton. He would typically enter into a", "statements": [], "options": {"A": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "B": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "C": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton.", "D": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton."}, "answer": "D", "uitleg": "'n Bakker wil hom teen stygende insetkoste beskerm en neem dus 'n long position (koop futures). 'n Long position maak wins as die prys styg: by R2 700 is die wins R100/ton op die termynmark.", "book_ref": "4.3 & 3.1, p.30, 43", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "A baker wants protection against rising input costs, so he takes a long position (buys futures). A long position profits when the price rises. At R2 700, the profit is R100/ton on the futures market.", "note_en": null}, {"paper": "P1", "n": 11, "question": "Which of the following statements about price discovery in the agricultural markets are correct?", "statements": ["i. For wheat the old-crop/new-crop price spread is represented by the price difference between the September and December futures contracts.", "ii. For maize the old-crop/new-crop price spread is represented by the price difference between the May and July futures contracts.", "iii. To avoid large swings in contract prices the JSE has introduced daily price limits for each commodity except for the spot month contract.", "iv. In order to prevent excessive price fluctuations, the price limits for each commodity on the JSE remain unchanged for the duration of an entire season."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Die boek: vir koring is die old-crop/new-crop spread September teenoor Desember, en vir mielies Maart teenoor Mei (nie Mei/Julie nie). Prysperke geld vir alle hedging months 'excluding the spot month'. (iv) is vals, want extended limits (150%) kan geaktiveer word en perke verander van tyd tot tyd.", "book_ref": "4.4, p.47; 8.14, p.182-183", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "From the book: for wheat, the old-crop/new-crop spread is September versus December; for maize it is March versus May (not May/July). Price limits apply to all hedging months 'excluding the spot month'. (iv) is false, because extended limits (150%) can be triggered and the limits change from time to time. So only (i) and (iii) are correct.", "note_en": null}, {"paper": "P1", "n": 12, "question": "In terms of futures contracts listed on SAFEX, the fact that maize is physically deliverable at expiry means that", "statements": [], "options": {"A": "a specific quantity of maize will be delivered to the JSE.", "B": "a specific quantity of maize will be available in a JSE approved silo.", "C": "a futures position in the July contract can be delivered against from the second last business day in June.", "D": "the producer guarantees the quality of his maize in a JSE approved silo."}, "answer": "B", "uitleg": "Fisiese aflewering beteken nie dat mielies na die JSE gery word nie; 'n JSE silo receipt verteenwoordig 'n spesifieke hoeveelheid in 'n geregistreerde silo. C is vals, want die Julie-kontrak kan net in Julie gelewer word. D is vals, want die storage operator (nie die produsent nie) waarborg kwaliteit en hoeveelheid.", "book_ref": "4.5, p.50", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "Physical delivery does not mean the maize is driven to the JSE. A JSE silo receipt represents a specific quantity of maize in a registered silo. C is false, because the July contract can only be delivered in July. D is false, because the storage operator (not the producer) guarantees quality and quantity.", "note_en": null}, {"paper": "P1", "n": 13, "question": "Which of the following statements with regard to the various ways in which physical delivery for grain can be executed on the JSE are correct?", "statements": ["i. Market participants wishing to exchange a short futures position for a spot position would buy an Exchange for Physical transaction.", "ii. An Exchange for Physical transaction is agreed upon off-exchange but is reported in writing to the JSE.", "iii. All deliveries flagged as an Exchange for Physical transaction are made available for auction on the silo receipt basis premium platform.", "iv. Silo receipt auction bids for a registered delivery point at a preferred premium are only permitted if the physical grain is on offer."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Die miller met 'n long future VERKOOP 'n EFP; die boer met die short future KOOP die EFP, dus is (i) waar. 'n EFP word privaat (off-exchange) onderhandel en daarna by die JSE aangemeld, dus is (ii) waar. (iii) is omgekeerd: deliveries wat NIE as EFP gemerk is nie, gaan na die basis premium platform. (iv) is vals, want enige geregistreerde kliënt mag 'n premie bie of aanbied.", "book_ref": "4.5 (i)-(ii), p.51-52; 8.11, p.181", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "(i) is true: the miller with a long future SELLS an EFP, and the farmer with the short future BUYS the EFP. (ii) is true: an EFP is negotiated privately (off-exchange) and then reported to the JSE. (iii) is the wrong way round: deliveries NOT marked as EFP go to the basis premium platform. (iv) is false: any registered client may bid or offer a premium.", "note_en": null}, {"paper": "P1", "n": 14, "question": "In the case of illiquid contracts, the marked-to-market (MTM) price will be decided using a random sample in the last 5 minutes of trade. The bid will be used as the MTM price if the bid is", "statements": [], "options": {"A": "higher than the average traded price.", "B": "lower than the average traded price.", "C": "higher than the last traded price.", "D": "lower than the last traded price."}, "answer": "C", "uitleg": "Die boek: 'If the bid is higher than the last traded price, the bid will be used as the MTM price', en 'n offer laer as die laaste transaksie word gebruik. 'Average traded price' (VWAP) geld net vir liquid contracts.", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "The book says: 'If the bid is higher than the last traded price, the bid will be used as the MTM price.' Likewise, an offer lower than the last trade is used. The 'average traded price' (VWAP) only applies to liquid contracts.", "note_en": null}, {"paper": "P1", "n": 16, "question": "On SAFEX, the first day on which a holder of a short future may notify the JSE of his intention to deliver the commodity is known as the first", "statements": [], "options": {"A": "position day.", "B": "notice day.", "C": "delivery day.", "D": "intent day."}, "answer": "A", "uitleg": "Die boek definieer 'First position day' as die eerste dag waarop die short position holder die JSE in kennis mag stel van sy voorneme om te lewer (4 besigheidsdae voor die eerste delivery day). First notice day is die dag waarop die delivery notice self ingedien word; die self-test bevestig A.", "book_ref": "4.5 trading calendar, p.58; self-test Q5, p.205-206", "topic": "Delivery", "note": null, "data": nul
