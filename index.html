null, "data": null}, {"paper": "IDK", "n": "O-09", "question": "In February a maize farmer buys July maize put options with a strike price of R2 600 per ton at a premium of R110 per ton. Commission and other fees amount to R8 per ton, the interest cost of financing the premium is 9% p.a. (simple) for 4 months, and the location differential at his silo is R95 per ton. Ignoring any silo premium, his minimum selling price (MSP) is", "statements": [], "options": {"A": "R2 387.00 per ton", "B": "R2 478.70 per ton", "C": "R2 383.70 per ton", "D": "R2 573.70 per ton"}, "answer": "C", "uitleg": "MSP = strike - premium - interest - commissions - location differential. Rente = 110 x 9% x 4/12 = R3.30. MSP = 2 600 - 110 - 3.30 - 8 - 95 = R2 383.70. A vergeet die rente; B vergeet die location differential; D tel die location differential by in plaas van af.", "book_ref": "6.6, p.109", "topic": "Option strategies", "note": null, "data": null}, {"paper": "IDK", "n": "O-10", "question": "A wheat miller buys a September wheat call option with a strike price of R3 500 per ton at a premium of R140 per ton to hedge future purchases. Ignoring basis, interest and commissions, what is the miller's effective purchase price per ton if the September futures price at expiry is (a) R3 900 per ton and (b) R3 300 per ton?", "statements": [], "options": {"A": "(a) R3 500; (b) R3 300", "B": "(a) R3 640; (b) R3 440", "C": "(a) R3 360; (b) R3 160", "D": "(a) R3 640; (b) R3 640"}, "answer": "B", "uitleg": "(a) Oefen uit: long futures by 3 500, wins 400 op futures, koop teen 3 900: 3 900 - 400 + 140 = R3 640 (= strike + premie, die plafon). (b) Laat opsie verval, koop teen 3 300 + 140 = R3 440, so die miller deel in laer pryse. C trek die premie af in plaas van by te tel; A ignoreer die premie.", "book_ref": "6.6, p.109; 6.8 Example #2, p.116", "topic": "Option strategies", "note": null, "data": null}, {"paper": "IDK", "n": "O-11", "question": "A maize farmer with maize in storage (long the underlying) sets up a collar: he buys a put with a strike of R2 200 per ton at R70 per ton and writes a call with the same maturity and a strike of R2 600 per ton at R50 per ton. Ignoring basis and other costs, the net price range he has secured is", "statements": [], "options": {"A": "Minimum R2 200 and maximum R2 600 per ton", "B": "Minimum R2 130 and maximum R2 550 per ton", "C": "Minimum R2 220 and maximum R2 620 per ton", "D": "Minimum R2 180 and maximum R2 580 per ton"}, "answer": "D", "uitleg": "Koste van collar = 70 - 50 = R20. Netto waarde nooit minder as X1 - koste (2 200 - 20 = R2 180) en nooit meer as X2 - koste (2 600 - 20 = R2 580). A ignoreer die koste; B trek die premies apart af; C tel die koste by.", "book_ref": "6.12.4, p.135", "topic": "Option strategies", "note": null, "data": null}, {"paper": "IDK", "n": "O-12", "question": "A speculator buys a May WMAZ call with a strike of R2 400 per ton at R120 per ton and simultaneously sells a May WMAZ call with a strike of R2 520 per ton at R60 per ton. What is the profit per ton at expiry if the May futures price is R2 480 per ton, and what is the maximum profit per ton of this strategy?", "statements": [], "options": {"A": "+R20; maximum profit R60", "B": "+R80; maximum profit R120", "C": "-R40; maximum profit R60", "D": "+R20; maximum profit R120"}, "answer": "A", "uitleg": "Bull spread met calls, netto debiet = 120 - 60 = R60. By 2 480: long call = 80, short call = 0, dus 80 - 60 = +R20. Maks wins = (2 520 - 2 400) - 60 = R60 (limited reward). B ignoreer die premies; D vergeet om die netto premie van die maksimum af te trek.", "book_ref": "6.12.2, p.129-130", "topic": "Option strategies", "note": null, "data": null}, {"paper": "IDK", "n": "O-13", "question": "Consider European call and put options on soybean futures with the same strike price and maturity. Using put-call parity as applied in the book (simple interest), what is the fair put premium (rounded) given the following data?", "statements": [], "options": {"A": "R560", "B": "R960", "C": "R252", "D": "R1 268"}, "answer": "C", "uitleg": "p = c - S0 + K/(1 + r x t) = 760 - 8 200 + 8 000/(1 + 0.08 x 6/12) = 760 - 8 200 + 7 692 = R252. A ignoreer die verdiskontering (760 - 200); D gebruik die verkeerde teken (c + S0 - PV(K)); B tel die verskil by in plaas van af.", "book_ref": "6.11-6.11.1, p.122-124", "topic": "Option strategies", "note": null, "data": "Current soybean futures price (S0): R8 200\nStrike price (K): R8 000\nTime to maturity: 6 months\nInterest rate: 8% p.a.\nCall option price: R760\nPut option price: ?"}, {"paper": "IDK", "n": "O-14", "question": "Which of the following statements regarding synthetic option positions are correct?", "statements": ["i. Buying a futures contract and writing a call with the same expiration creates a synthetic short put.", "ii. Buying a futures contract and buying a put with the same expiration creates a synthetic long call.", "iii. A producer who has sold futures and buys a call option creates a synthetic long put.", "iv. A covered call writer has a limited risk and an unlimited reward profile."], "options": {"A": "(i) and (iv) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "B", "uitleg": "Covered call (long futures + short call) = synthetic short put; protective put (long futures + long put) = synthetic long call; short futures + long call = synthetic long put (nuttig vir 'n produsent). (iv) is vals: 'n covered call het onbeperkte risiko (as futures skerp val) en beperkte wins (= premie).", "book_ref": "6.12.1, p.126-128", "topic": "Option strategies", "note": null, "data": null}, {"paper": "IDK", "n": "O-15", "question": "In terms of the definitions in the JSE derivatives rules, a \"trader\" means", "statements": [], "options": {"A": "any person who has passed the JSE CDM Dealers Examination.", "B": "the person appointed by the JSE to supervise, administer and control the daily operations of the JSE trading system.", "C": "the director of the JSE Surveillance department.", "D": "an employee of a trading member authorised by the JSE and registered by the trading member to trade for the trading member's own account or on behalf of clients, or both."}, "answer": "D", "uitleg": "Die definisie: 'n employee van 'n trading member, deur die JSE gemagtig en deur die trading member geregistreer om vir eie rekening en/of namens kliente te handel. Om die eksamen te slaag alleen is nie genoeg nie (rule 3.20 vereistes en registrasie ook). B is die Market Controller; C is die Director: Market Regulation.", "book_ref": "8.2, p.173-174; 8.17 (Table 8.6), p.187-189", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "IDK", "n": "O-16", "question": "The unpublished figures of the National Crop Estimates Committee, which are likely to have a material effect on the white maize futures price, are discussed at a family dinner by a committee member. Which of the following statements are correct?", "statements": ["i. A relative of the committee member who learns these figures is an insider.", "ii. Merely being in possession of this inside information is an offence.", "iii. A JSE trader who knows that the source of the information is the committee member and then deals in WMAZ futures for his own account commits an offence.", "iv. A JSE trader who executes a client's specific instruction to buy WMAZ futures, not knowing that the client is an insider, commits an offence."], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iii) only", "C": "(ii) and (iv) only", "D": "(i), (iii) and (iv) only"}, "answer": "A", "uitleg": "Die ongepubliseerde skatting is inside information en wie daartoe toegang het (bv. 'n familielid) is 'n insider; 'n JSE trader wat weet die bron is 'n insider is ook 'n insider en pleeg 'n oortreding as hy daarop handel. (ii) vals: om insider te wees of die inligting te he is nie 'n oortreding nie. (iv) vals: 'n trader wat op spesifieke kliente-instruksies handel sonder om te weet die klient is 'n insider, is uitgesluit.", "book_ref": "8.6, p.176-178", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "IDK", "n": "O-17", "question": "A person who contravened section 78 of the FMA (insider trading) is liable to an administrative sanction. Which of the following may form part of this sanction according to the book?", "statements": ["i. The equivalent of the profit made, or loss avoided, through such dealings.", "ii. An amount of up to R1 million or the adjusted value for that particular year.", "iii. Interest.", "iv. An amount equal to three times the profit made through such dealings."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "B", "uitleg": "Die sanksie sluit in: die ekwivalente wins gemaak of verlies vermy, tot R1 miljoen (of aangepaste waarde), rente, en koste van die geding insluitend ondersoekkoste. (iv) 'drie keer die wins' kom nie in die boek voor nie; dit is die ekwivalente wins.", "book_ref": "8.6, p.178", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "IDK", "n": "O-18", "question": "Which of the following are deemed to be manipulative or deceptive methods of trading in agricultural product securities?", "statements": ["i. Entering orders to buy at successively higher prices for the purpose of unduly influencing the market price.", "ii. Entering an order at or near the close of the market, the primary purpose of which is to change the closing price.", "iii. Entering an order during the pre-opening period and cancelling it immediately prior to market opening to create a false appearance of demand.", "iv. Reporting an exchange for physical (EFP) trade on the ATS where the futures quantity is within 5% of the physical contract quantity and the supporting documents are available on request."], "options": {"A": "(i) and (iv) only", "B": "(ii) and (iii) only", "C": "(i), (ii) and (iii) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "C", "uitleg": "Die reels noem uitdruklik: (i) orders teen opeenvolgend hoer pryse om die prys onbehoorlik te beinvloed, (ii) 'n order naby sluiting met die primere doel om die sluitprys te verander, (iii) pre-opening orders wat net voor opening gekanselleer word om valse vraag te skep. (iv) is 'n wettige EFP: hoeveelhede binne 5% en dokumente beskikbaar.", "book_ref": "8.7.1, p.179-180; 8.10-8.11, p.181", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "IDK", "n": "O-19", "question": "A speculative client (no hedging positions) holds the following positions in the September WMAZ contract (not the spot month): long 2 600 futures, long 1 000 call options (delta 0.6) and short 500 put options (delta -0.4). Using the 2022 speculative position limits in the book, which ONE of the following statements is correct?", "statements": [], "options": {"A": "The futures equivalent position is 3 400 contracts net long, which exceeds the single month limit.", "B": "The futures equivalent position is 3 000 contracts net long, which does not exceed the single month limit.", "C": "The futures equivalent position is 4 100 contracts net long, which is within the all months combined limit and therefore allowed.", "D": "The position limit only applies to futures, so the client holds 2 600 contracts and is within the limit."}, "answer": "A", "uitleg": "Futures equivalent: +2 600 + (1 000 x 0.6) + (500 x 0.4) = 3 400 netto long, want 'n short put het 'n POSITIEWE delta factor. WMAZ single month limit = 3 000, dus oorskry. B trek die short put verkeerdelik af; C ignoreer delta; D is vals want opsies tel op 'n futures equivalent basis.", "book_ref": "8.15.2, p.185 (speculative position limits table); 8.17 'futures equivalent positions', p.187", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "IDK", "n": "O-20", "question": "Which of the following statements regarding speculative position limits on the JSE CDM are correct?", "statements": ["i. On receipt of a written request from the JSE, a client must furnish a written statement of its positions within two business days.", "ii. Positions held by two or more persons acting pursuant to an express or implied agreement are treated as if held by a single individual.", "iii. Speculative position limits may be exceeded to the extent that the positions are valid hedging positions.", "iv. The JSE may request information on positions but may not direct a trading member to reduce a client's position."], "options": {"A": "(i) and (iii) only", "B": "(ii) and (iv) only", "C": "(i), (ii) and (iv) only", "D": "(i), (ii) and (iii) only"}, "answer": "D", "uitleg": "Op skriftelike versoek moet 'n verklaring binne twee business days ingedien word; posisies van persone wat volgens 'n ooreenkoms saam optree, word as een persoon behandel; geldige hedging posisies mag die spekulatiewe limiete oorskry. (iv) is vals: die clearing house of gemagtigde persoon KAN opdrag gee om die posisie te likwideer of te verminder.", "book_ref": "8.15.2, p.185", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 1, "question": "Which of the following statements about the maize market in South Africa are correct?", "statements": ["i. In South Africa maize is planted primarily in the months of November and December.", "ii. Maize production in South Africa is largely dominated by yellow maize.", "iii. The amount of money payable to a supplier of physical maize will be decreased by about 1% if the consignment's moisture content is 1 percentage point above 12.5%.", "iv. The grading system for white and yellow maize consists of four major grades each."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "(i) is waar: mielies word hoofsaaklik in November en Desember geplant. (iii) is waar: die prys word met ongeveer 1% aangepas vir elke persentasiepunt vog bo of onder 12.5%. (ii) is vals, want produksie is ongeveer gelyk verdeel tussen wit en geel mielies. (iv) is vals, want daar is drie hoofgrade elk (WM1-3, YM1-3).", "book_ref": "1.2, p.6-7", "topic": "Physical market", "note": null, "data": null}, {"paper": "P1", "n": 2, "question": "For sunflower seed delivered in the physical market, the specification regarding moisture content is a", "statements": [], "options": {"A": "maximum of 10%.", "B": "maximum of 12.5%.", "C": "minimum of 10%.", "D": "minimum of 12.5%."}, "answer": "A", "uitleg": "Die boek sê vir sonneblomsaad: 'The maximum amount of moisture allowed is 10%' (Tabel 3: 9% droog, maksimum 10%). 12.5% is die mielie-standaard, en dit is daarom die strikvraag-opsie.", "book_ref": "1.4.1, p.16; Table 3, p.22", "topic": "Physical market", "note": null, "data": null}, {"paper": "P1", "n": 3, "question": "Which of the following statements about the South African wheat market are correct?", "statements": ["i. Wheat is generally harvested during November, December and January.", "ii. Currently the South Western Cape is the main wheat producing area in South Africa.", "iii. The harder wheat class tends to have a lower protein content than softer wheat and is more suitable for biscuits than for bread.", "iv. Wheat has much the same storage and perishability qualities as maize."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "(i) is waar, want koring word van November tot Januarie geoes. (iv) is woordeliks uit die boek: 'much the same storage and perishability qualities as maize'. (iii) is vals, want harde koring het MEER proteïen en is vir brood. (ii) is lastig: volgens die boek het die Wes-Kaap in 2020 42% geproduseer (die grootste), maar die memo en die meeste antwoorde kies B.", "book_ref": "1.3.1-1.3.3, p.14", "topic": "Physical market", "note": null, "data": null}, {"paper": "P1", "n": 4, "question": "A very important role fulfilled by the agricultural futures markets is to", "statements": ["i. transfer the underlying commodities from one owner to another.", "ii. facilitate price risk management for both sellers and buyers.", "iii. provide speculators with high levels of profits in the market.", "iv. enhance price discovery in the market."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "D", "uitleg": "Die primêre doel van termynmarkte is 'n doeltreffende meganisme vir price risk management (hedging), en hulle speel 'n aktiewe rol in price determination/transparency (price discovery). Hulle is nie bedoel om eienaarskap oor te dra nie; die self-test sê ook spesifiek dat die doel nie is om spekulante 'n platform te gee nie.", "book_ref": "2.4, p.27; 2.6 self-test, p.29", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "P1", "n": 5, "question": "The prerequisites for successful trading in agricultural futures and options contracts include the fact that any such underlying commodity should", "statements": [], "options": {"A": "always be available for visible inspection by the buyer.", "B": "be a heterogeneous commodity.", "C": "not easily trade in the cash or spot market.", "D": "be exposed to frequent price variation."}, "answer": "D", "uitleg": "Die boek lys: homogeen en graderbaar (dus nie heterogeen nie), stoorbaar en vervoerbaar, 'n goed funksionerende cash market, en 'exposed to frequent price variations', want sonder prysrisiko is daar geen behoefte aan hedging nie. Standaardisering beteken juis dat kopers die produk NIE hoef te sien nie.", "book_ref": "2.5, p.28", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "P1", "n": 6, "question": "Which of the following are considered disadvantages of forward contracts?", "statements": ["i. Because the price is fixed the farmer is excluded from the benefits of a market rally.", "ii. Such contracts cannot be easily unwound by settling in cash before the delivery date.", "iii. Buyer cannot estimate cash flow before delivery as profits and losses are realised daily.", "iv. If production is less than anticipated the buyer may be unable to pay the seller."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "(i) staan in die boek se lys van nadele. (ii) klop met Tabel 4.1: by forwards is 'no closing possible before maturity'. (iii) beskryf futures (daily MTM), nie forwards nie; forwards het selde kontantvloei voor aflewering. (iv) meng twee risiko's deurmekaar: swak produksie is die produsent se nie-leweringsrisiko, nie die koper se onvermoë om te betaal nie. Net A sluit (iii) uit.", "book_ref": "3.1.2, p.31; Table 4.1, p.42-43", "topic": "Forwards", "note": null, "data": null}, {"paper": "P1", "n": 7, "question": "If the spot price of maize is R1 150 per ton; the interest rate is 6.5% per annum, quarterly compounded; storage cost is R69 per ton payable after 9 months; and the convenience yield is 2.75% of the spot price, the 9-month forward price of a maize contract will be", "statements": [], "options": {"A": "R1 249.85 per ton.", "B": "R1 250.26 per ton.", "C": "R1 274.62 per ton.", "D": "R1 275.98 per ton."}, "answer": "B", "uitleg": "Formule 3.5: F0 = (S0 + PV(U))(1 + (i-y)/f)^(nf). PV(U) = 69 x (1 + 0.065/4)^-3 = R65.74. F0 = (1150 + 65.74) x (1 + (0.065 - 0.0275)/4)^3 = 1215.74 x 1.02840 = R1 250.26. D (R1 275.98) is die strik: dit ignoreer die convenience yield.", "book_ref": "3.2, formulas 3.4-3.5, p.35-36", "topic": "Forwards", "note": null, "data": null}, {"paper": "P1", "n": 8, "question": "Which of the following attributes constitute the characteristics of agricultural futures contracts?", "statements": ["i. They are standardised, transferable, exchange traded instruments.", "ii. The risk is shared equally by buyers and sellers.", "iii. In a futures contract the seller has an obligation to take delivery of the product.", "iv. In principle, futures contracts are also forward contracts."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek: 'standardised, transferable, exchange-traded contract'. Die risiko is simmetries, want wins en verlies is gelyk en teenoorgesteld (zero-sum). 'Futures contracts are also forward contracts' in beginsel. (iii) is vals: die verkoper (short) moet LEWER (make delivery); die koper neem lewering.", "book_ref": "4.1.1 & 4.1.3, p.40-41", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P1", "n": 9, "question": "In the agricultural commodities market, futures contracts specifically differ from forward contracts in the sense that", "statements": ["i. forward contracts are not guaranteed but futures are.", "ii. the price of a futures contract is negotiated between buyer and seller.", "iii. a forward contract usually settles through physical delivery of the product while most futures are cash settled.", "iv. the buying party in a futures contract is usually known to the selling party, which is not the case with forwards."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Volgens Tabel 4.1 het forwards geen waarborg nie, terwyl futures deur die clearinghouse gewaarborg word, en forwards eindig gewoonlik met fisiese aflewering terwyl futures meestal voor verstryking uitgeskakel word. (ii) en (iv) is omgekeerd: forward-pryse word privaat onderhandel, en by forwards ken die partye mekaar (by futures nie).", "book_ref": "4.2, Table 4.1, p.42-43", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P1", "n": 10, "question": "A large bread baker wants to hedge his future input costs and enters into a wheat futures contract at R2 600 per ton. He would typically enter into a", "statements": [], "options": {"A": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "B": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "C": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton.", "D": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton."}, "answer": "D", "uitleg": "'n Bakker wil hom teen stygende insetkoste beskerm en neem dus 'n long position (koop futures). 'n Long position maak wins as die prys styg: by R2 700 is die wins R100/ton op die termynmark.", "book_ref": "4.3 & 3.1, p.30, 43", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 11, "question": "Which of the following statements about price discovery in the agricultural markets are correct?", "statements": ["i. For wheat the old-crop/new-crop price spread is represented by the price difference between the September and December futures contracts.", "ii. For maize the old-crop/new-crop price spread is represented by the price difference between the May and July futures contracts.", "iii. To avoid large swings in contract prices the JSE has introduced daily price limits for each commodity except for the spot month contract.", "iv. In order to prevent excessive price fluctuations, the price limits for each commodity on the JSE remain unchanged for the duration of an entire season."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Die boek: vir koring is die old-crop/new-crop spread September teenoor Desember, en vir mielies Maart teenoor Mei (nie Mei/Julie nie). Prysperke geld vir alle hedging months 'excluding the spot month'. (iv) is vals, want extended limits (150%) kan geaktiveer word en perke verander van tyd tot tyd.", "book_ref": "4.4, p.47; 8.14, p.182-183", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "P1", "n": 12, "question": "In terms of futures contracts listed on SAFEX, the fact that maize is physically deliverable at expiry means that", "statements": [], "options": {"A": "a specific quantity of maize will be delivered to the JSE.", "B": "a specific quantity of maize will be available in a JSE approved silo.", "C": "a futures position in the July contract can be delivered against from the second last business day in June.", "D": "the producer guarantees the quality of his maize in a JSE approved silo."}, "answer": "B", "uitleg": "Fisiese aflewering beteken nie dat mielies na die JSE gery word nie; 'n JSE silo receipt verteenwoordig 'n spesifieke hoeveelheid in 'n geregistreerde silo. C is vals, want die Julie-kontrak kan net in Julie gelewer word. D is vals, want die storage operator (nie die produsent nie) waarborg kwaliteit en hoeveelheid.", "book_ref": "4.5, p.50", "topic": "Delivery", "note": null, "data": null}, {"paper": "P1", "n": 13, "question": "Which of the following statements with regard to the various ways in which physical delivery for grain can be executed on the JSE are correct?", "statements": ["i. Market participants wishing to exchange a short futures position for a spot position would buy an Exchange for Physical transaction.", "ii. An Exchange for Physical transaction is agreed upon off-exchange but is reported in writing to the JSE.", "iii. All deliveries flagged as an Exchange for Physical transaction are made available for auction on the silo receipt basis premium platform.", "iv. Silo receipt auction bids for a registered delivery point at a preferred premium are only permitted if the physical grain is on offer."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Die miller met 'n long future VERKOOP 'n EFP; die boer met die short future KOOP die EFP, dus is (i) waar. 'n EFP word privaat (off-exchange) onderhandel en daarna by die JSE aangemeld, dus is (ii) waar. (iii) is omgekeerd: deliveries wat NIE as EFP gemerk is nie, gaan na die basis premium platform. (iv) is vals, want enige geregistreerde kliënt mag 'n premie bie of aanbied.", "book_ref": "4.5 (i)-(ii), p.51-52; 8.11, p.181", "topic": "Delivery", "note": null, "data": null}, {"paper": "P1", "n": 14, "question": "In the case of illiquid contracts, the marked-to-market (MTM) price will be decided using a random sample in the last 5 minutes of trade. The bid will be used as the MTM price if the bid is", "statements": [], "options": {"A": "higher than the average traded price.", "B": "lower than the average traded price.", "C": "higher than the last traded price.", "D": "lower than the last traded price."}, "answer": "C", "uitleg": "Die boek: 'If the bid is higher than the last traded price, the bid will be used as the MTM price', en 'n offer laer as die laaste transaksie word gebruik. 'Average traded price' (VWAP) geld net vir liquid contracts.", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "P1", "n": 16, "question": "On SAFEX, the first day on which a holder of a short future may notify the JSE of his intention to deliver the commodity is known as the first", "statements": [], "options": {"A": "position day.", "B": "notice day.", "C": "delivery day.", "D": "intent day."}, "answer": "A", "uitleg": "Die boek definieer 'First position day' as die eerste dag waarop die short position holder die JSE in kennis mag stel van sy voorneme om te lewer (4 besigheidsdae voor die eerste delivery day). First notice day is die dag waarop die delivery notice self ingedien word; die self-test bevestig A.", "book_ref": "4.5 trading calendar, p.58; self-test Q5, p.205-206", "topic": "Delivery", "note": null, "data": null}, {"paper": "P1", "n": 17, "question": "Which of the following statements about futures contract specifications are correct?", "statements": ["i. The standard contract size for yellow maize is 100 metric tons.", "ii. The underlying commodity for WOPT contracts is second grade white maize from any origin.", "iii. Physical delivery on wheat futures contracts can take place on any day from the first business day to last business day of an expiry month.", "iv. A constant month contract for wheat is introduced 40 business days preceding a non-standard hedging month."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "YMAZ is 100 ton. WOPT is wit mielies van enige oorsprong, graad WM2 of beter. Constant month-kontrakte vir koring word 40 besigheidsdae voor die nuwe maand ingestel. Volgens die trading calendar is die first delivery day die eerste en die last delivery day die laaste besigheidsdag van die maand, dus is (iii) waar en is D (almal) die antwoord.", "book_ref": "4.5 p.58; Table 4.9, p.64-66", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P1", "n": 18, "question": "On 20 March (t1) miller John buys July maize futures at R1 850 per ton when the spot price of maize is R1 800 per ton. On 8 April (t2) the maize spot price moves to R1 810 while the July futures price changes to R1 855. The basis on 8 April is", "statements": [], "options": {"A": "R50 per ton \"under\".", "B": "R50 per ton \"over\".", "C": "R45 per ton \"under\".", "D": "R45 per ton \"over\"."}, "answer": "C", "uitleg": "Basis = spot - futures = 1 810 - 1 855 = -R45, dus R45 'under' (negatief = under). R50 under was die basis op t1 (1 800 - 1 850).", "book_ref": "4.7, p.69", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 19, "question": "A participant who sells a futures contract is said to be ___?___ the basis and will benefit if the basis ___?___.", "statements": [], "options": {"A": "short; weakens", "B": "short; strengthens", "C": "long; strengthens", "D": "long; weakens"}, "answer": "C", "uitleg": "Die boek: die short hedger (verkoper van futures) is 'long the basis', en 'a strengthening of the basis is profitable to the short hedger'. Effektiewe prys = F1 + B2, dus hoe sterker B2, hoe meer ontvang hy. A is verkeerd: dit is die long hedger wat 'short the basis' is en baat as die basis verswak.", "book_ref": "4.7, p.70-71; 4.7.2 p.74", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null}, {"paper": "P1", "n": 20, "question": "On 20 July (t1) miller John buys December wheat futures at R2 970 per ton when the spot price of wheat is R2 905 per ton. On 18 August (t2) the wheat spot price hits R2 900 per ton with the December futures price at R2 975. If he closes out his futures position on 18 August, what will John effectively pay for his wheat?", "statements": [], "options": {"A": "R2 895 per ton", "B": "R3 045 per ton", "C": "R2 910 per ton", "D": "R2 975 per ton"}, "answer": "A", "uitleg": "Effektiewe prys met long hedge = F1 + B2 = 2 970 + (2 900 - 2 975) = 2 970 - 75 = R2 895. Kontrole: hy koop spot teen R2 900 en verdien R5 op futures (2 975 - 2 970), dus netto R2 895.", "book_ref": "4.7, p.70", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 21, "question": "Which ONE of the following statements correctly reflects the characteristics of the local spot price of maize?", "statements": [], "options": {"A": "It should be the same in Randfontein as in Pretoria West.", "B": "It reflects the SAFEX futures price in the delivery month.", "C": "It should normally be higher than the import parity price.", "D": "It is largely dictated by silo owners who control the supply."}, "answer": "B", "uitleg": "Die boek definieer die spot price as die prys van die futures contract in die delivery month ('JSE CDM futures prices are the true market or spot prices for every delivery month'). Pryse verskil per ligging weens location differentials, dus is A vals. Import parity is 'n maksimum, dus is C vals.", "book_ref": "4.8, p.75-76", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "P1", "n": 22, "question": "The time intervals on which the cash flows in commodity swaps are based are known as", "statements": [], "options": {"A": "value periods.", "B": "principal interims.", "C": "reference intervals.", "D": "reset periods."}, "answer": "D", "uitleg": "Die boek: 'These intervals are called reset periods and can vary between one and six months, with quarterly resets the most common.'", "book_ref": "5.2, p.89", "topic": "Swaps", "note": null, "data": null}, {"paper": "P1", "n": 23, "question": "Which ONE of the following statements with regard to commodity swaps is correct?", "statements": [], "options": {"A": "A swap may be seen as a series of physical settled futures contracts for a specific commodity.", "B": "According to international accounting standards, the cash flows in commodity swaps need not be recorded in financial statements.", "C": "Commodity swaps are very popular hedging instruments for South African producers and users.", "D": "The basic principle in pricing a swap is that the swap must have zero value at inception."}, "answer": "D", "uitleg": "Die boek: 'The basic principle in pricing a swap is that the swap must have zero value at inception.' A is vals, want 'n swap is 'n reeks CASH-settling forwards. C is vals, want swaps is 'not very common in the local market' (net wêreldwyd gewild). B (P2-weergawe) is vals, want IFRS vereis dat sulke derivate teen billike waarde op die balansstaat gedra word.", "book_ref": "5.2, p.89; 5.3, p.91; 5.6-5.7, p.93-94", "topic": "Swaps", "note": null, "data": null}, {"paper": "P1", "n": 24, "question": "An investor who bought the right, but not the obligation, to sell an agricultural future at a specified price on a specified date in the future, is referred to as the", "statements": [], "options": {"A": "holder of a call option.", "B": "holder of a put option.", "C": "writer of a call option.", "D": "writer of a put option."}, "answer": "B", "uitleg": "Die reg (nie die verpligting nie) om te VERKOOP is 'n put option, en wie dit koop is die holder (long put). Die writer verkoop die opsie en het die verpligting.", "book_ref": "6.3, p.101", "topic": "Options basics", "note": null, "data": null}, {"paper": "P1", "n": 26, "question": "An investor has taken a long position in an OTM (out-the-money) call option in the December white maize future. What will happen to the option's value if the price of the future decreases?", "statements": [], "options": {"A": "Increase, as the option moves closer to being ITM (in-the-money)", "B": "Increase, as the option moves further OTM", "C": "Decrease, as the option moves closer to being ITM", "D": "Decrease, as the option moves further OTM"}, "answer": "D", "uitleg": "'n Call se waarde is positief verwant aan die futures-prys. As die futures-prys daal, beweeg 'n OTM call nog verder OTM (strike nog verder bo die prys), die kans om ITM te eindig daal en die premie daal. A en B is verkeerd want 'n call se waarde styg nie as die prys daal nie; C is verkeerd want 'n call beweeg weg van ITM as die prys daal.", "book_ref": "6.5, p.108-109; 6.7(i), p.113", "topic": "Options basics", "note": null, "data": null}, {"paper": "P1", "n": 27, "question": "An investor buys a put option on the December white maize contract with a strike price of R850 for R50 per contract. Assuming that the current price for the futures contract is R880, what would the time value and intrinsic value of each option contract be respectively?", "statements": [], "options": {"A": "Time value will be R50 and intrinsic value will be R0", "B": "Time value will be R30 and intrinsic value will be R20", "C": "Time value will be R20 and intrinsic value will be R30", "D": "Time value will be R0 and intrinsic value will be R50"}, "answer": "A", "uitleg": "'n Put het net intrinsic value as die futures-prys ONDER die strike is. Intrinsic = max(0; 850 - 880) = R0, dus is die put OTM. Time value = premie - intrinsic = 50 - 0 = R50. Opsie C (R20/R30) gebruik die verskil 880-850 = 30 asof dit 'n call is; dis die lokval.", "book_ref": "6.3, p.101; 6.4.4, p.106; 6.7, p.111", "topic": "Option pricing & greeks", "note": "Die memo het C gesê, maar volgens die handboek is A reg.", "data": null}, {"paper": "P1", "n": 28, "question": "Consider four individual put options with similar characteristics in terms of size, underlying asset and maturity date. If the market price of the underlying asset is R90, then the option that will proportionally gain the most time value if volatility increases, is the one with the following strike price:", "statements": [], "options": {"A": "R80", "B": "R90", "C": "R100", "D": "R110"}, "answer": "A", "uitleg": "Die boek sê 'n ITM opsie se premie reageer min op volatiliteit (10% vol-verandering = ~2% premie), 'n ATM opsie se prys is direk eweredig aan volatiliteit, en 'n OTM opsie se prys word 'merkbaar' deur volatiliteit beïnvloed. Vir 'n put met onderliggende R90 is strike R80 OTM (R100 en R110 is ITM). Proporsioneel (persentasie) wen die OTM put dus die meeste. Lokval: B (R90, ATM) het die grootste time value in absolute rand, maar nie proporsioneel nie.", "book_ref": "6.7(iii), p.113-114", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P1", "n": 29, "question": "A farmer is concerned that the price of white maize will drop around the time he expects to harvest his crop. According to some of the other farmers in the district, the price of white maize will increase dramatically as they expect adverse weather in other countries to result in a supply shortage. Which ONE of the following positions should the farmer enter into if he is to limit his potential losses, but still wants to share in the profits should prices increase? He should take a", "statements": [], "options": {"A": "Short position in a call option", "B": "Short position in a futures contract", "C": "Long position in a put option", "D": "Long position in a futures contract"}, "answer": "C", "uitleg": "'n Long put gee 'n minimum verkoopprys (beskerming teen dalende pryse) en die maksimum verlies is die premie. As pryse styg, laat hy die put verval en verkoop teen die hoër markprys. Die lokval is B (short future): dit beskerm ook teen 'n prysdaling, maar sluit die prys vas sodat hy nie deel in 'n prysstyging nie.", "book_ref": "6.6, p.109-110; 6.1.3", "topic": "Option strategies", "note": null, "data": null}, {"paper": "P1", "n": 33, "question": "Which ONE of the following statements with regard to hedging is correct?", "statements": [], "options": {"A": "A prudent grain exporter would use the commodity derivatives market to obtain protection against lower prices for grain contracted for future delivery but not yet purchased", "B": "A prudent grain importer would use commodity derivatives contracts to obtain protection against a fall in grain prices after he contracted for future delivery but has not yet received the grain", "C": "Hedging the price of your grain crop on the futures market implies that you will always be better off than the farmer next to you who did not hedge", "D": "A prudent grain exporter would use the commodity derivatives market to obtain protection against higher prices for grain contracted for future delivery but not yet purchased"}, "answer": "D", "uitleg": "Die boek: uitvoerders het beskerming nodig teen HOËR pryse vir graan wat hulle reeds kontrakteer het om te lewer maar nog nie gekoop het nie (hulle is short die fisiese graan). A noem verkeerdelik laer pryse. B: invoerders wil voordeel trek uit laer pryse, nie daarteen beskerm nie. C: verskansing beteken nie dat jy altyd beter af is nie (basis risk, verlore opside).", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 34, "question": "Which of the following are an objective of hedging using a commodity futures contract?", "statements": ["i. Protecting profit margins", "ii. Locking in certain cash flows", "iii. Increase exposure to the commodity", "iv. Diversification (of one's overall position)"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek se redes vir verskansing: protect profit margins, stabilize cash flows (lock in certain cash flows), transfer risk, diversify one's overall position, improve liquidity/reduce transaction costs. (iii) is verkeerd: verskansing VERMINDER blootstelling aan die kommoditeit; om blootstelling te verhoog is spekulasie.", "book_ref": "7.1.1, p.141-142", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 35, "question": "A farmer wishes to hedge against a sudden decrease in maize prices using a maize futures contract. Which ONE of the following hedges should he enter into?", "statements": [], "options": {"A": "A long hedge as he is long of maize", "B": "A long hedge because he is short of maize", "C": "A short hedge because he is long of maize", "D": "A short hedge because he is short of maize"}, "answer": "C", "uitleg": "'n Boer besit (of gaan besit) die mielies, dus is hy long in die kontantmark. Om teen 'n prysdaling te beskerm, verkoop hy futures: 'n short (selling) hedge. 'n Long hedge is vir kopers (meulenaars) wat teen stygende pryse beskerm.", "book_ref": "7.1.1, p.142; 7.8 self-test, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 36, "question": "Lady Brown, a maize farmer in Bethlehem, is worried that the good rains will cause the price of white maize to drop and hedges her estimated crop of 1000 tons by shorting ten July maize contracts in February. Her broker manages to do it at a price level of R2000/ton. Brokerage amounts to R5/ton per trade. Assume the area differential to Bethlehem is R110/ton and handling fees amount to R20/ton, implying a basis of R130 'under'. Lady Brown immediately posts an initial margin of R100/ton and pays the brokerage fees. In July she decides to close her futures position by offsetting and selling her maize on the spot market at the new futures price of R1500/ton. If the basis remains constant, her cash flow position will be as per the table. Should the basis strengthen by R20 per ton in July and she manages to harvest the full 1000 tons, the total net cash flow for her entire crop will change to", "statements": [], "options": {"A": "R1 970 000", "B": "R1 880 000", "C": "R1 840 000", "D": "R1 860 000"}, "answer": "B", "uitleg": "Konstante basis: -100 IM -5 + 500 VM (2000-1500) -5 +100 IM terug + spot (1500-130 = 1370) = R1860/t, dus R1 860 000 (opsie D = die oorspronklike tabel). Basis versterk met R20: -130 word -110, spot = 1500-110 = R1390, netto = R1880/t x 1000 = R1 880 000. 'n Short hedger is 'long the basis' en baat by 'n sterker basis. C (R1 840 000) is die antwoord as die basis VERSWAK.", "book_ref": "7.1.4, p.147-154 (Cash flow 1 and 8)", "topic": "Basis & hedging", "note": "Die memo het C gesê, maar volgens die handboek is B reg.", "data": null}, {"paper": "P1", "n": 37, "question": "Farmer Betty wishes to hedge her exposure to the wheat price decreasing over the next 3 months. The best hedging strategy, with the lowest risk, using options, would be which ONE of the following? She should enter into a", "statements": [], "options": {"A": "Short call on the futures contract because she will ultimately receive the premium if the wheat price falls substantially", "B": "Short put on the futures contract because she will ultimately receive the premium if the wheat price falls substantially", "C": "Long call on the futures contract because she will receive the difference between the strike and the market price if the wheat price falls substantially", "D": "Long put on the futures contract because she will receive the difference between the strike and the market price if the wheat price falls substantially"}, "answer": "D", "uitleg": "Produsente wat teen prysdalings wil 'verseker', KOOP puts. As die prys skerp daal, ontvang sy die verskil tussen strike en markprys, en die risiko is beperk tot die premie. A gee net beperkte beskerming (die premie). B is verkeerd: 'n short put VERLOOR as die prys val. C: 'n long call betaal nie uit as die prys daal nie.", "book_ref": "6.6, p.109; 7.1.5", "topic": "Option strategies", "note": null, "data": null}, {"paper": "P1", "n": 38, "question": "Which ONE of the following represents buying an intra-market spread trade?", "statements": [], "options": {"A": "Taking a long position in March contract and shorting the July contract in the same market", "B": "Taking a long position in March contract and shorting the July contract in different markets", "C": "Shorting the March contract and taking a long position in the July contract in the same market", "D": "Shorting the March contract and taking a long position in the July contract in different markets"}, "answer": "C", "uitleg": "'n Intramarket (calendar) spread is tussen twee maande van DIESELFDE kommoditeit. Volgens die plaaslike konvensie beteken 'buying the spread' 'n long posisie in die far crop (Julie) en 'n short posisie in die near crop (Maart). A is 'selling the spread'; B en D is intermarket.", "book_ref": "7.2.1-7.2.2, p.159-160", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 39, "question": "Which ONE of the following statements with regard to delta hedging is correct?", "statements": [], "options": {"A": "The delta of a short call position in maize will rise if the underlying futures price rises", "B": "In order to be delta neutral the short call position holder should sell delta units of the underlying asset", "C": "The delta of an at-the-money call option is around one", "D": "An increase in volatility will affect the delta of an in-the-money option much more than an at-the-money option"}, "answer": "D", "uitleg": "Die boek: volatiliteit beïnvloed die delta van ITM en OTM opsies, maar nie van ATM opsies nie (dié bly ~0.5). A: 'n short call position delta lê tussen -1 en 0 en word meer negatief (daal) as die prys styg. B: 'n short call word verskans deur delta units te KOOP. C: ATM delta is ~0.5, nie 1 nie.", "book_ref": "7.3.2-7.3.3, p.162-163; 7.3.7, p.165", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P1", "n": 40, "question": "Which combination of the following would best describe the usual role of a producer of wheat in the physical market and his associated position in the (wheat) derivatives market?", "statements": ["i. Hedger", "ii. Speculator", "iii. Long the underlying", "iv. Short the underlying"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "In die fisiese mark is 'n koringprodusent 'n hedger: hy is 'naturally long' (hy besit die oes). Die vraag vra egter sy posisie in die derivatemark, en daar gaan hy short: sy eerste hedge-transaksie is om futures te verkoop (boek p.145: 'their first trade will therefore be to go short').", "book_ref": "7.1.1, p.141-142; 7.8 self-test ('farmer's cash market position is long'), p.170", "topic": "Market roles & prerequisites", "note": "Die twee memo's verskil (getikte memo: A, geskandeerde memo: B). Die vraag vra die posisie in die derivatemark, en daar is die produsent short, so B is die beste antwoord. Leer albei kante: fisies long, futures short.", "data": null}, {"paper": "P1", "n": 41, "question": "The purpose of the derivatives rules and directives is to", "statements": [], "options": {"A": "Maximise capital profits for investments in derivatives products", "B": "Contribute to a stable financial market", "C": "Prevent speculative activities", "D": "Promote healthy hedging practices"}, "answer": "B", "uitleg": "Die reëls en direktiewe moet o.a. die doelwitte van die FMA bereik, waarvan een is om by te dra tot die handhawing van 'n stabiele finansiële markomgewing (en fair, efficient, transparent markte). Die ander opsies kom nie in die boek voor nie; spekulasie word nie verbied nie.", "book_ref": "8.1, p.172-173", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 42, "question": "Which of the following will disqualify an officer of a member from registration as a dealer?", "statements": ["i. Being investigated by the SA Reserve Bank", "ii. Having been dismissed from any employment", "iii. Registration as an officer for a competing local exchange", "iv. Registration as an officer for any foreign exchange"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Reël 3.20.1.4: diskwalifiseer o.a. iemand wat 'the subject of a formal investigation by any regulatory or government agency' is (die SARB, dus i) en iemand wat 'dismissed ... from any office or employment' is (ii). Om as officer by 'n ander plaaslike of buitelandse beurs geregistreer te wees, word nêrens gelys nie, so (iii) en (iv) is nie diskwalifikasies nie.", "book_ref": "8.2 (rule 3.20.1.4.5 and 3.20.1.4.9), p.174", "topic": "Regulation & rules", "note": "Die memo het C gesê, maar volgens die handboek is A reg.", "data": null}, {"paper": "P1", "n": 43, "question": "Which ONE of the following statements regarding the Commodity Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "A member may only access the CDM trading system with the approval of the member's compliance officer", "B": "A member guarantees fulfilment of CDM transactions for client accounts only", "C": "The JSE validates all data submitted to the CDM trading system", "D": "Information received on the CDM trading system is deemed to have been submitted with the member's knowledge"}, "answer": "D", "uitleg": "Reël 7.80.1: 'n trading member is gebonde aan alle offers en entries wat in sy naam op die stelsel gemaak word, al was dit nie gemagtig nie. Dit beteken die inligting word geag met die lid se medewete ingedien te wees. A: toegang vereis goedkeuring van die Market Controller, nie die compliance officer nie. C: die trading member (nie die JSE nie) is verantwoordelik vir die akkuraatheid van data (ch.8 self-test).", "book_ref": "8.3 (rule 7.80), p.174-175; 8.18 self-test, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 44, "question": "Which ONE of the following statements regarding the Commodity Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "The JSE Executive may extend the hours of operation of the CDM trading system to a Saturday or Sunday to ensure proper functioning of the market", "B": "The Market Controller may, in case of system failure, declare a transaction executed on the CDM trading system void", "C": "The JSE Executive may halt trading without prior notice to members", "D": "The Market Controller may cease trading on the CDM trading system if trade in the underlying ceases"}, "answer": "C", "uitleg": "Reël 7.90.3.2: die JSE Executive mag 'without prior notice to any person' die stelsel halt of sluit. A: ure kan net vir 'n 'business day' verleng of verkort word, nie Saterdag/Sondag nie. B: die JSE Executive (nie die Market Controller nie) verklaar transaksies void. D: die JSE Executive (nie die Market Controller nie) oorweeg om handel te staak as die onderliggende ophou verhandel.", "book_ref": "8.4-8.5 (rules 7.90.3, 10.30.3), p.175-176", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 45, "question": "Which of the following actions will be LEGAL in terms of insider trading legislation?", "statements": ["i. Mary, the secretary of the National Crop Estimates Committee (NCEC), emails the national crop estimates to her friend, Julie, not realizing that it contains trade sensitive information", "ii. Julie trades on the information for the benefit of a pension fund she advises", "iii. Mary publishes the national crop estimate in the Landbou Weekblad and the website", "iv. Peter, a farmer, trades on the basis of the information obtained from the Landbou Weekblad"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "C", "uitleg": "Die openbaarmakingsmisdryf geld net vir 'n insider 'who KNOWS that he or she has inside information'. Mary besef dit nie, so (i) is nie 'n misdryf nie. (ii) is onwettig: Julie weet die bron is 'n insider, is dus self 'n insider, en handel vir 'n ander persoon. (iii) en (iv): sodra die inligting gepubliseer is, is dit nie meer inside information nie.", "book_ref": "8.6, p.176-178", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 46, "question": "Which of the following actions with regard to agricultural product securities will be ILLEGAL in terms of market abuse legislation?", "statements": ["i. Publish a statement which may be misleading due to the omission of facts", "ii. Entering orders to sell at market prices", "iii. Entering an order to buy during a pre-opening period and cancelling the order immediately prior to the market opening", "iv. Publishing a misleading statement with regard to securities"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "C", "uitleg": "(iii) is uitdruklik 'n manipulative/deceptive trading method (pre-opening order wat net voor opening gekanselleer word). (i) en (iv): misleidende of onvolledige (weglating van feite) verklarings is market abuse (FMA s81 false/misleading statements). Die boek dek dit nie woordeliks nie, maar dit is in die gees van 8.7. (ii) Gewone verkoopsorders teen markpryse is wettig.", "book_ref": "8.7.1 (rule 7.200, 8.7.1.4(a)(iv)), p.179-180", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 47, "question": "Which of the following statements with regard to maintenance of market integrity by the exchange are correct?", "statements": ["i. A transaction that is declared void is binding on the authorised user and the client", "ii. The consent of both the Director of Surveillance and the CEO of the JSE is required before a transaction may be declared void", "iii. A trader may not delete orders from the Commodities derivatives market system during a trading halt", "iv. The JSE may impose daily price and position limits"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "(i) Reg: 'n void-verklaring is bindend op die trading member en die kliënt. (ii) Verkeerd: die JSE Executive (stelselfout) of die Director: Market Regulation alleen mag 'n transaksie void verklaar. 'In conjunction with the CEO' geld vir 'n trading HALT. (iii) Verkeerd: tydens 'n halt mag mens nie handel nie, maar wel orders delete. (iv) Reg: price limits (8.14) en position limits (8.15).", "book_ref": "8.8, p.180-181; 8.14-8.15, p.182-185", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 48, "question": "Which of the following are requirements when a member wishes to trade with or on behalf of a client?", "statements": ["i. The member must register as a financial services provider at the Financial Services Board", "ii. The member must enter into an agreement with the client", "iii. The member must register the client with the JSE", "iv. The member must confirm the client's financial standing"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Reël 7.60: 'n trading member mag nie met of namens 'n kliënt handel nie, tensy die kliënt 'n client agreement met die lid aangegaan het (ii) EN die lid die kliënt by die JSE geregistreer het (iii). (i) en (iv) word nie in die reël vereis nie.", "book_ref": "8.13, p.182", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 50, "question": "The 'science' of determining whether there is real value in a commodity at a certain price is known as", "statements": [], "options": {"A": "Price analysis", "B": "Technical analysis", "C": "Fundamental analysis", "D": "Demand and supply analysis"}, "answer": "C", "uitleg": "Die boek: 'Fundamental analysis is based more on the fields of economics and accounting where finding real value is the name of the game.' Technical analysis bestudeer prysbewegings en patrone, nie intrinsieke waarde nie.", "book_ref": "9.1, p.192", "topic": "Other", "note": null, "data": null}, {"paper": "P3", "n": 1, "question": "Which of the following statements about the maize market in South Africa are correct?", "statements": ["i. Maize is primarily planted from late May to end August.", "ii. The grading system for white and yellow maize consists of three major grades each.", "iii. The domestic market is strictly regulated because maize is a staple food for many people.", "iv. Genetically modified (GM) maize is increasingly being planted by farmers."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "D", "uitleg": "Mielies word in die somer geplant, hoofsaaklik November en Desember, so (i) is vals. Daar is drie grade elk (WM1-WM3, YM1-YM3) en GM-mielies se aanplanting het dramaties toegeneem, so (ii) en (iv) is waar. Die mieliemark is sedert 1996 volledig gedereguleer, so (iii) is vals.", "book_ref": "1.2.1-1.2.8, pp.6-12", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 2, "question": "Wheat grades are fundamentally determined by the kernels'", "statements": [], "options": {"A": "moisture content and weight.", "B": "protein content and weight.", "C": "moisture content and primary colour.", "D": "protein content and primary colour."}, "answer": "B", "uitleg": "Die boek sê koringgrade word fundamenteel bepaal deur proteïeninhoud en spesifieke gewig (hectolitre mass). Primêre kleur is 'n mielie-graderingskriterium, nie koring nie.", "book_ref": "1.3.1, p.13", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 3, "question": "Which of the following statements about the South African wheat market are correct?", "statements": ["i. Wheat is classified into four classes, A, B, C and D.", "ii. Wheat grades are fundamentally determined by protein content and specific weight.", "iii. As a class, harder wheat has higher protein content than softer wheat and is more suitable for bread than for biscuits.", "iv. Wheat is generally planted around November, December and January."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Koring word geklassifiseer as Bread Wheat en Other Wheat (Super, Graad 1-3), nie klasse A-D nie, so (i) is vals. (ii) en (iii) kom direk uit die boek. Koring word April tot Julie geplant en November tot Januarie geoes, so (iv) verwar plant met oes.", "book_ref": "1.3.1, 1.3.3, p.13", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 4, "question": "Futures markets trade futures contracts that are standardised in respect of", "statements": ["i. price of underlying.", "ii. quality of underlying.", "iii. delivery location.", "iv. quantity of underlying."], "options": {"A": "(i), (ii) and (iii) only", "B": "(ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "D", "uitleg": "Futures is gestandaardiseer t.o.v. kwaliteit, hoeveelheid (contract size) en afleweringsplek/-tyd. Die prys word nie gestandaardiseer nie; dit word deur vraag en aanbod op die beurs ontdek.", "book_ref": "2.5 p.28; 4.2 p.41", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 5, "question": "The prerequisites for successful trading in agricultural futures and options contracts include the fact that any such underlying commodity should", "statements": [], "options": {"A": "always be available for visible inspection by the buyer.", "B": "be a heterogeneous commodity.", "C": "not easily trade in the cash or spot market.", "D": "be exposed to frequent price variation."}, "answer": "D", "uitleg": "Die boek noem as voorvereiste dat die kommoditeit aan gereelde prysvariasies blootgestel moet wees (anders is daar geen behoefte om te hedge nie). Dit moet homogeen wees (nie heterogeen nie), moet op 'n goed funksionerende kontantmark verhandel, en kopers hoef dit juis nie te sien nie.", "book_ref": "2.5, p.28", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "P3", "n": 6, "question": "Which of the following are considered advantages of forward contracts?", "statements": ["i. Buyers can defer payment until delivery.", "ii. They contain no default risk.", "iii. Contracts can be easily unwound by settling in cash before delivery.", "iv. Because the price is fixed upfront, the producer is protected against an unexpected fall in market prices."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "Die boek lys as voordele: koper se betalings word tot aflewering uitgestel, en verkopers is beskerm teen onverwagte prysdalings. Default risk is juis 'n nadeel van forwards, en forwards is moeilik om voor aflewering te unwind.", "book_ref": "3.1.1-3.1.2, p.31", "topic": "Forwards", "note": null, "data": null}, {"paper": "P3", "n": 7, "question": "If the spot price of maize is R1 100 per ton; the interest rate is 7.5% per annum, quarterly compounded; storage cost is R75 per ton payable after 9 months; and the convenience yield is 2.5% of the spot price, the 9-month forward price of a maize contract will be", "statements": [], "options": {"A": "R1 181.89", "B": "R1 204.43", "C": "R1 215.40", "D": "R1 218.53"}, "answer": "C", "uitleg": "Formule (3.5): F0 = (S0 + U)(1 + (i-y)/f)^(n·f). U = 75 × (1+0.075/4)^-3 = R70.93. F0 = (1 100 + 70.93) × (1 + 0.05/4)^3 = 1 170.93 × 1.03797 = R1 215.40.", "book_ref": "3.2, formula 3.5, pp.35-36", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "P3", "n": 8, "question": "Which of the following statements about agricultural futures contracts are true?", "statements": ["i. These contracts can be closed out before the delivery date.", "ii. The buyer of a futures contract enters into a commitment to make delivery of the underlying commodity.", "iii. Open interest refers to the total number of futures contracts that have not yet been fulfilled.", "iv. The vast majority of futures positions are fulfilled by physical delivery at maturity."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Futures kan voor aflewering uitgekanselleer (closed out) word, en open interest is die totale aantal kontrakte wat nog uitstaande/nie vervul is nie. Die koper neem aflewering (die verkoper maak aflewering), en die meeste posisies word uitgekanselleer, nie fisies afgelewer nie.", "book_ref": "4.1, pp.41-42", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 9, "question": "In the agricultural commodities market, futures contracts specifically differ from forward contracts in the sense that", "statements": ["i. futures contracts are subject to daily cash flows.", "ii. speculators prefer futures contracts to forwards.", "iii. the market for forwards is more deep and liquid than the futures market.", "iv. credit risk is much higher in futures contracts than in forward contracts."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Futures word daagliks marked-to-market (daaglikse kontantvloei) en is vir spekulante aantrekliker weens likiditeit en maklike close-out. Forwards is minder likied, en die clearing house verminder credit risk by futures, so (iii) en (iv) is omgekeerd.", "book_ref": "4.2, pp.42-43", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 10, "question": "A large bread baker wants to hedge his future input costs and enters into a wheat futures contract at R2 600 per ton. He would typically enter into a", "statements": [], "options": {"A": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "B": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "C": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton.", "D": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton."}, "answer": "D", "uitleg": "Die bakker koop koring, so hy vrees prysstygings en neem 'n long position (long hedge). 'n Long position maak wins as die prys styg, dus by R2 700 (R100/t wins).", "book_ref": "4.9 (hedging/basis), pp.69-71", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 11, "question": "Which of the following statements about price discovery in the agricultural markets are correct?", "statements": ["i. For wheat the old-crop/new-crop price spread is represented by the price difference between the September and December futures contracts.", "ii. For maize the old-crop/new-crop price spread is represented by the price difference between the May and July futures contracts.", "iii. To avoid large swings in contract prices the JSE has introduced daily price limits for each commodity except for the spot month contract.", "iv. In order to prevent excessive price fluctuations, the price limits for each commodity on the JSE remain unchanged for the duration of an entire season."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Koring se old-crop/new-crop spread is September vs Desember (waar); vir mielies is dit Maart vs Mei, nie Mei vs Julie nie. Price limits geld vir alle hedging months behalwe die spot month (waar). Limiete verander wel, bv. extended limits (150%) word geaktiveer, so (iv) is vals.", "book_ref": "4.3, p.47; 8.14, p.182", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "P3", "n": 12, "question": "A SAFEX silo receipt issued by a JSE approved silo owner", "statements": [], "options": {"A": "is only issued to a soybean producer after he has delivered 100 tons of soybeans.", "B": "is only issued to a wheat producer after he has delivered 100 tons of wheat.", "C": "is only issued to a sunflower producer after he has delivered 100 tons of sunflower seed.", "D": "is only issued to a white maize producer after he has delivered 100 tons of maize."}, "answer": "D", "uitleg": "'n JSE silo receipt verteenwoordig een kontrak se hoeveelheid. Slegs mielies (wit en geel) se kontrakgrootte is 100 ton; koring, sonneblom en sojabone is 50 ton. Dus is slegs D konsekwent.", "book_ref": "4.5, pp.49-50; Table 4.3, p.54", "topic": "Delivery", "note": null, "data": null}, {"paper": "P3", "n": 13, "question": "Which of the following statements with regard to the various ways in which physical delivery for grain can be executed on the JSE are correct?", "statements": ["i. Market participants wishing to exchange a long futures position for a spot position would sell an Exchange for Physicals contract.", "ii. The JSE can process the actual delivery in an Exchange for Physical transaction should the counterparties prefer this.", "iii. The JSE processes an Exchange for Physical transaction at the marked-to-market price as on transaction date.", "iv. A participant offering grain on a silo receipt auction should have access to the physical product as represented on the silo receipt."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek sê letterlik: 'n meulenaar wat sy long futures vir spot ruil, 'sells an EFP' (i); 'The JSE can process the actual physical delivery should the two counterparties prefer this' (ii); en die EFP 'is processed at the current MTM value' (iii). Memo C sluit (ii) uit, wat direk teen die boek se teks gaan. Stelling (iv) word nie in die boek genoem nie.", "book_ref": "4.5 (i) EFP, pp.51-52", "topic": "Delivery", "note": "Die memo het C gesê, maar volgens die handboek is B reg.", "data": null}, {"paper": "P3", "n": 14, "question": "In the case of illiquid contracts, the marked-to-market (MTM) price will be decided using a random sample in the last 5 minutes of trade. The offer will be used as the MTM price if the offer is", "statements": [], "options": {"A": "higher than the last traded price.", "B": "lower than the last traded price.", "C": "higher than the average traded price.", "D": "lower than the average traded price."}, "answer": "B", "uitleg": "Vir illiquid contracts: as die bid hoër as die laaste verhandelde prys is, word die bid gebruik; as die offer laer as die laaste verhandelde prys is, word die offer die MTM. Liquid contracts gebruik VWAP.", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "P3", "n": 16, "question": "On SAFEX, the futures expiry date of a futures contract coincides with the last", "statements": [], "options": {"A": "position day.", "B": "notice day.", "C": "delivery day.", "D": "trading day."}, "answer": "D", "uitleg": "In die kontrakspesifikasies staan 'Expiry Dates & Times (Last Trading Day)': die expiry date is die laaste handelsdag (12h00 op die sesde laaste besigheidsdag van die maand). Die laaste notice day is die tweede laaste besigheidsdag, en dit is iets anders.", "book_ref": "Contract specs, p.66; definitions p.59", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 17, "question": "Which of the following statements about futures contract specifications are correct?", "statements": ["i. The standard contract size for yellow maize is 100 metric tons.", "ii. The underlying commodity for WOPT contracts is second grade white maize from any origin.", "iii. Physical delivery on wheat futures contracts can take place on any day from the first business day to last business day of an expiry month.", "iv. A constant month contract for wheat is introduced 40 business days preceding a non-standard hedging month."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "YMAZ is 100 ton (i waar), WOPT is WM2 of beter van enige oorsprong (ii waar), en constant months word 40 besigheidsdae vooraf ingestel (iv waar). Die memo se C kan nie reg wees nie, want (i) is volgens die boek waar. (iii) is dubbelsinnig: die teks op p.49-50 sê aflewering kan op enige besigheidsdag in die maand plaasvind (ook die laaste), maar die spesifikasietabel sê eerste tot 4de laaste besigheidsdag.", "book_ref": "4.5 p.50; contract specs pp.61-66", "topic": "Delivery", "note": "Die vraag is swak opgestel: stelling (iii) bots met die spesifikasietabel (aflewering tot die 4de laaste besigheidsdag). D is die enigste opsie wat werk, want (i), (ii) en (iv) is beslis waar. Die memo het C gesê.", "data": null}, {"paper": "P3", "n": 18, "question": "On 20 March (t1) miller John buys July maize futures at R1 850 per ton when the spot price of maize is R1 800 per ton. On 8 April (t2) the maize spot price moves to R1 810 while the July futures price changes to R1 855. The basis on 8 April is", "statements": [], "options": {"A": "R50 per ton \"under\".", "B": "R50 per ton \"over\".", "C": "R45 per ton \"under\".", "D": "R45 per ton \"over\"."}, "answer": "C", "uitleg": "Basis = spot - futures. Op 8 April: 1 810 - 1 855 = -R45, dus R45 'under'. R50 under (memo A) is die basis op 20 Maart (t1), nie 8 April nie.", "book_ref": "4.9, p.69", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null}, {"paper": "P3", "n": 19, "question": "A participant who sells a futures contract is said to be ____ the basis and will benefit if the basis ____.", "statements": [], "options": {"A": "short; weakens", "B": "short; strengthens", "C": "long; strengthens", "D": "long; weakens"}, "answer": "C", "uitleg": "Die boek: die short hedger (wat futures verkoop) is 'long the basis' en baat by 'n basis wat versterk (strengthen/narrow). Die long hedger (koper van futures) is 'short the basis' en baat as die basis verswak. Memo A is die beskrywing van die koper, nie die verkoper nie.", "book_ref": "4.9, p.71", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null}, {"paper": "P3", "n": 20, "question": "On 20 July (t1) miller John buys December wheat futures at R2 970 per ton when the spot price of wheat is R2 905 per ton. On 18 August (t2) the wheat spot price hits R2 900 per ton with the December futures price at R2 975. If he closes out his futures position on 18 August, what will John effectively pay for his wheat?", "statements": [], "options": {"A": "R2 895 per ton", "B": "R3 045 per ton", "C": "R2 910 per ton", "D": "R2 975 per ton"}, "answer": "A", "uitleg": "Futures-wins: 2 975 - 2 970 = +R5/t. Hy koop fisies teen R2 900, so effektief 2 900 - 5 = R2 895/t. Of: F1 + B2 = 2 970 + (2 900 - 2 975) = R2 895. R3 045 (memo B) is 2 970 + 75, waar die basis met die verkeerde teken bygetel is.", "book_ref": "4.9, pp.69-71", "topic": "Basis & hedging", "note": "Die memo het B gesê, maar volgens die handboek is A reg.", "data": null}, {"paper": "P3", "n": 21, "question": "Which ONE of the following statements correctly reflects the characteristics of the local spot price of maize?", "statements": [], "options": {"A": "It should be the same in Randfontein as in Pretoria West.", "B": "It reflects the SAFEX futures price in the delivery month.", "C": "It should normally be higher than the import parity price.", "D": "It is largely dictated by silo owners who control the supply."}, "answer": "B", "uitleg": "Die boek sê die JSE CDM futures prys vir die afleweringsmaand is die werklike spot prys (Randfontein-gebaseer). Spot pryse verskil per ligging weens location differentials, en import parity is die maksimum, nie 'n vloer nie.", "book_ref": "4.8, pp.75-76", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 22, "question": "The amount on which the magnitude of the fixed and floating cash flows in a swap is calculated is called the", "statements": [], "options": {"A": "primary total.", "B": "notional principal.", "C": "basis amount.", "D": "reference value."}, "answer": "B", "uitleg": "Die boek definieer die notional principal as die bedrag waarop die grootte van die vaste en vlottende kontantvloei bereken word. Dit word self nooit uitgeruil nie.", "book_ref": "5.2, p.89", "topic": "Swaps", "note": null, "data": null}, {"paper": "P3", "n": 23, "question": "Which ONE of the following statements with regard to commodity swaps is correct?", "statements": [], "options": {"A": "Generally commodity swaps are settled by exchanging the physical underlying commodity on each reset date.", "B": "Locally, some large grain consumers avoid using cash settling swaps to hedge as they have to comply with complex international accounting standards.", "C": "Since commodity swaps are exchange traded, they are considered very liquid hedging instruments.", "D": "The basic principle in pricing a swap is that the swap must have a positive value at inception."}, "answer": "B", "uitleg": "Groot graanverbruikers verkies OTC forwards bo cash-settling swaps weens IFRS-vereistes (fair value op die balansstaat, wisselvallige verdienste). Swaps word in kontant vereffen, is OTC (nie exchange traded nie), en moet by aanvang 'n waarde van nul hê.", "book_ref": "5.3, p.91; 5.7, p.94", "topic": "Swaps", "note": null, "data": null}, {"paper": "P3", "n": 24, "question": "An investor who originally sold the right to buy an agricultural future at a specified price on a specified date in the future, is referred to as the", "statements": [], "options": {"A": "holder of a call option.", "B": "holder of a put option.", "C": "writer of a call option.", "D": "writer of a put option."}, "answer": "C", "uitleg": "Die reg om te koop is 'n call option. Wie die reg verkoop het, is die writer (short), dus die writer of a call option.", "book_ref": "6.1-6.3, pp.99-101", "topic": "Options basics", "note": null, "data": null}, {"paper": "P3", "n": 26, "question": "An investor has taken a long position in an OTM (out-the-money) call option in the December White Maize future. What will happen to the option's value if the price of the future decreases?", "statements": [], "options": {"A": "Increase, as the option moves closer to being ITM (in-the-money).", "B": "Increase, as the option moves further OTM.", "C": "Decrease, as the option moves closer to being ITM.", "D": "Decrease, as the option moves further OTM."}, "answer": "D", "uitleg": "'n Call se waarde is positief verwant aan die futures-prys (delta > 0). As die futures-prys daal, beweeg die OTM call verder OTM en die waarskynlikheid om ITM te eindig daal, dus daal die waarde. 'n Call beweeg nader aan ITM net as die prys styg.", "book_ref": "6.4.5 p.106; 6.7 p.112", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P3", "n": 27, "question": "An investor buys a call option on the December white maize contract, with a strike price of R800, for R50 per contract. Assuming that the current price for the futures contract is R820, what would the time value and intrinsic value of each option contract be respectively?", "statements": [], "options": {"A": "Time value will be R50 and intrinsic value will be R30.", "B": "Time value will be R30 and intrinsic value will be R50.", "C": "Time value will be R30 and intrinsic value will be R20.", "D": "Time value will be R20 and intrinsic value will be R30."}, "answer": "C", "uitleg": "Intrinsic value van 'n call = max(0, F - K) = 820 - 800 = R20. Time value = premie - intrinsic value = 50 - 20 = R30. Let op die volgorde: time value eerste (R30), dan intrinsic (R20); D ruil dit om.", "book_ref": "6.4.4 p.106", "topic": "Options basics", "note": null, "data": null}, {"paper": "P3", "n": 28, "question": "Consider four individual call options with similar characteristics in terms of size, underlying asset and maturity date. If the market price of the underlying asset is R100, then the option that will proportionally gain the most time value if volatility increases, is the one with the following strike price:", "statements": [], "options": {"A": "R80", "B": "R90", "C": "R100", "D": "R110"}, "answer": "D", "uitleg": "Die boek sê 'n ATM opsie se prys verander met dieselfde persentasie as volatility, maar 'n verandering in volatility het 'n 'marked effect' op die prys van 'n out-of-the-money opsie (dit word net winsgewend as volatility toeneem). Proporsioneel (persentasie) wen die OTM call (strike R110) dus die meeste. In absolute rand het die ATM opsie (R100) die grootste vega - dis die lokval.", "book_ref": "6.7 (iii), p.113-114", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P3", "n": 29, "question": "A farmer is concerned that the price of white maize will drop around the time he expects to harvest his crop. Accor
