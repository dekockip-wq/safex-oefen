l, "uitleg_en": "The book defines 'First position day' as the first day on which the holder of a short position may notify the JSE of his intention to deliver. This is 4 business days before the first delivery day. First notice day is the day the delivery notice itself is submitted. The self-test confirms A.", "note_en": null}, {"paper": "P1", "n": 17, "question": "Which of the following statements about futures contract specifications are correct?", "statements": ["i. The standard contract size for yellow maize is 100 metric tons.", "ii. The underlying commodity for WOPT contracts is second grade white maize from any origin.", "iii. Physical delivery on wheat futures contracts can take place on any day from the first business day to last business day of an expiry month.", "iv. A constant month contract for wheat is introduced 40 business days preceding a non-standard hedging month."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "YMAZ is 100 ton. WOPT is wit mielies van enige oorsprong, graad WM2 of beter. Constant month-kontrakte vir koring word 40 besigheidsdae voor die nuwe maand ingestel. Volgens die trading calendar is die first delivery day die eerste en die last delivery day die laaste besigheidsdag van die maand, dus is (iii) waar en is D (almal) die antwoord.", "book_ref": "4.5 p.58; Table 4.9, p.64-66", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "(i) YMAZ is 100 tons. (ii) WOPT is white maize of any origin, grade WM2 or better. (iv) Constant month contracts for wheat are introduced 40 business days before the new month. (iii) According to the trading calendar, the first delivery day is the first business day of the month and the last delivery day is the last business day. So (iii) is true, and D (all of them) is the answer.", "note_en": null}, {"paper": "P1", "n": 18, "question": "On 20 March (t1) miller John buys July maize futures at R1 850 per ton when the spot price of maize is R1 800 per ton. On 8 April (t2) the maize spot price moves to R1 810 while the July futures price changes to R1 855. The basis on 8 April is", "statements": [], "options": {"A": "R50 per ton \"under\".", "B": "R50 per ton \"over\".", "C": "R45 per ton \"under\".", "D": "R45 per ton \"over\"."}, "answer": "C", "uitleg": "Basis = spot - futures = 1 810 - 1 855 = -R45, dus R45 'under' (negatief = under). R50 under was die basis op t1 (1 800 - 1 850).", "book_ref": "4.7, p.69", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Basis = spot - futures = 1 810 - 1 855 = -R45. A negative basis is called 'under', so the basis is R45 'under'. R50 under was the basis on t1 (1 800 - 1 850), not on 8 April.", "note_en": null}, {"paper": "P1", "n": 19, "question": "A participant who sells a futures contract is said to be ___?___ the basis and will benefit if the basis ___?___.", "statements": [], "options": {"A": "short; weakens", "B": "short; strengthens", "C": "long; strengthens", "D": "long; weakens"}, "answer": "C", "uitleg": "Die boek: die short hedger (verkoper van futures) is 'long the basis', en 'a strengthening of the basis is profitable to the short hedger'. Effektiewe prys = F1 + B2, dus hoe sterker B2, hoe meer ontvang hy. A is verkeerd: dit is die long hedger wat 'short the basis' is en baat as die basis verswak.", "book_ref": "4.7, p.70-71; 4.7.2 p.74", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null, "uitleg_en": "The book says the short hedger (seller of futures) is 'long the basis', and 'a strengthening of the basis is profitable to the short hedger'. His effective price = F1 + B2, so the stronger B2 is, the more he receives. A is wrong: it is the long hedger who is 'short the basis' and benefits when the basis weakens.", "note_en": "The memo gave A, but according to the textbook C is correct."}, {"paper": "P1", "n": 20, "question": "On 20 July (t1) miller John buys December wheat futures at R2 970 per ton when the spot price of wheat is R2 905 per ton. On 18 August (t2) the wheat spot price hits R2 900 per ton with the December futures price at R2 975. If he closes out his futures position on 18 August, what will John effectively pay for his wheat?", "statements": [], "options": {"A": "R2 895 per ton", "B": "R3 045 per ton", "C": "R2 910 per ton", "D": "R2 975 per ton"}, "answer": "A", "uitleg": "Effektiewe prys met long hedge = F1 + B2 = 2 970 + (2 900 - 2 975) = 2 970 - 75 = R2 895. Kontrole: hy koop spot teen R2 900 en verdien R5 op futures (2 975 - 2 970), dus netto R2 895.", "book_ref": "4.7, p.70", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Effective price for a long hedge = F1 + B2. B2 = 2 900 - 2 975 = -75. So 2 970 - 75 = R2 895. Check: he buys spot at R2 900 and earns R5 on futures (2 975 - 2 970). Net R2 895.", "note_en": null}, {"paper": "P1", "n": 21, "question": "Which ONE of the following statements correctly reflects the characteristics of the local spot price of maize?", "statements": [], "options": {"A": "It should be the same in Randfontein as in Pretoria West.", "B": "It reflects the SAFEX futures price in the delivery month.", "C": "It should normally be higher than the import parity price.", "D": "It is largely dictated by silo owners who control the supply."}, "answer": "B", "uitleg": "Die boek definieer die spot price as die prys van die futures contract in die delivery month ('JSE CDM futures prices are the true market or spot prices for every delivery month'). Pryse verskil per ligging weens location differentials, dus is A vals. Import parity is 'n maksimum, dus is C vals.", "book_ref": "4.8, p.75-76", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "The book defines the spot price as the price of the futures contract in the delivery month ('JSE CDM futures prices are the true market or spot prices for every delivery month'). A is false: prices differ by location because of location differentials. C is false: import parity is a maximum, not the spot price.", "note_en": null}, {"paper": "P1", "n": 22, "question": "The time intervals on which the cash flows in commodity swaps are based are known as", "statements": [], "options": {"A": "value periods.", "B": "principal interims.", "C": "reference intervals.", "D": "reset periods."}, "answer": "D", "uitleg": "Die boek: 'These intervals are called reset periods and can vary between one and six months, with quarterly resets the most common.'", "book_ref": "5.2, p.89", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "The book says: 'These intervals are called reset periods and can vary between one and six months, with quarterly resets the most common.'", "note_en": null}, {"paper": "P1", "n": 23, "question": "Which ONE of the following statements with regard to commodity swaps is correct?", "statements": [], "options": {"A": "A swap may be seen as a series of physical settled futures contracts for a specific commodity.", "B": "According to international accounting standards, the cash flows in commodity swaps need not be recorded in financial statements.", "C": "Commodity swaps are very popular hedging instruments for South African producers and users.", "D": "The basic principle in pricing a swap is that the swap must have zero value at inception."}, "answer": "D", "uitleg": "Die boek: 'The basic principle in pricing a swap is that the swap must have zero value at inception.' A is vals, want 'n swap is 'n reeks CASH-settling forwards. C is vals, want swaps is 'not very common in the local market' (net wêreldwyd gewild). B (P2-weergawe) is vals, want IFRS vereis dat sulke derivate teen billike waarde op die balansstaat gedra word.", "book_ref": "5.2, p.89; 5.3, p.91; 5.6-5.7, p.93-94", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "The book says: 'The basic principle in pricing a swap is that the swap must have zero value at inception.' A is false: a swap is a series of CASH-settling forwards. C is false: swaps are 'not very common in the local market' (they are only popular worldwide). B (P2 version) is false: IFRS requires such derivatives to be carried on the balance sheet at fair value.", "note_en": null}, {"paper": "P1", "n": 24, "question": "An investor who bought the right, but not the obligation, to sell an agricultural future at a specified price on a specified date in the future, is referred to as the", "statements": [], "options": {"A": "holder of a call option.", "B": "holder of a put option.", "C": "writer of a call option.", "D": "writer of a put option."}, "answer": "B", "uitleg": "Die reg (nie die verpligting nie) om te VERKOOP is 'n put option, en wie dit koop is die holder (long put). Die writer verkoop die opsie en het die verpligting.", "book_ref": "6.3, p.101", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "The right (but not the obligation) to SELL is a put option. The person who buys that right is the holder (long put). The writer is the one who sells the option and carries the obligation.", "note_en": null}, {"paper": "P1", "n": 26, "question": "An investor has taken a long position in an OTM (out-the-money) call option in the December white maize future. What will happen to the option's value if the price of the future decreases?", "statements": [], "options": {"A": "Increase, as the option moves closer to being ITM (in-the-money)", "B": "Increase, as the option moves further OTM", "C": "Decrease, as the option moves closer to being ITM", "D": "Decrease, as the option moves further OTM"}, "answer": "D", "uitleg": "'n Call se waarde is positief verwant aan die futures-prys. As die futures-prys daal, beweeg 'n OTM call nog verder OTM (strike nog verder bo die prys), die kans om ITM te eindig daal en die premie daal. A en B is verkeerd want 'n call se waarde styg nie as die prys daal nie; C is verkeerd want 'n call beweeg weg van ITM as die prys daal.", "book_ref": "6.5, p.108-109; 6.7(i), p.113", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "A call's value rises and falls with the futures price. If the futures price falls, an OTM call moves even further OTM (the strike is now even further above the price). The chance of it ending ITM falls, so the premium falls. A and B are wrong because a call's value does not rise when the price falls. C is wrong because a call moves away from ITM when the price falls.", "note_en": null}, {"paper": "P1", "n": 27, "question": "An investor buys a put option on the December white maize contract with a strike price of R850 for R50 per contract. Assuming that the current price for the futures contract is R880, what would the time value and intrinsic value of each option contract be respectively?", "statements": [], "options": {"A": "Time value will be R50 and intrinsic value will be R0", "B": "Time value will be R30 and intrinsic value will be R20", "C": "Time value will be R20 and intrinsic value will be R30", "D": "Time value will be R0 and intrinsic value will be R50"}, "answer": "A", "uitleg": "'n Put het net intrinsic value as die futures-prys ONDER die strike is. Intrinsic = max(0; 850 - 880) = R0, dus is die put OTM. Time value = premie - intrinsic = 50 - 0 = R50. Opsie C (R20/R30) gebruik die verskil 880-850 = 30 asof dit 'n call is; dis die lokval.", "book_ref": "6.3, p.101; 6.4.4, p.106; 6.7, p.111", "topic": "Option pricing & greeks", "note": "Die memo het C gesê, maar volgens die handboek is A reg.", "data": null, "uitleg_en": "A put only has intrinsic value when the futures price is BELOW the strike. Intrinsic = max(0; 850 - 880) = R0, so the put is OTM. Time value = premium - intrinsic = 50 - 0 = R50. Option C (R20/R30) is the trap: it uses the difference 880-850 = 30 as if this were a call.", "note_en": "The memo said C, but according to the textbook A is correct."}, {"paper": "P1", "n": 28, "question": "Consider four individual put options with similar characteristics in terms of size, underlying asset and maturity date. If the market price of the underlying asset is R90, then the option that will proportionally gain the most time value if volatility increases, is the one with the following strike price:", "statements": [], "options": {"A": "R80", "B": "R90", "C": "R100", "D": "R110"}, "answer": "A", "uitleg": "Die boek sê 'n ITM opsie se premie reageer min op volatiliteit (10% vol-verandering = ~2% premie), 'n ATM opsie se prys is direk eweredig aan volatiliteit, en 'n OTM opsie se prys word 'merkbaar' deur volatiliteit beïnvloed. Vir 'n put met onderliggende R90 is strike R80 OTM (R100 en R110 is ITM). Proporsioneel (persentasie) wen die OTM put dus die meeste. Lokval: B (R90, ATM) het die grootste time value in absolute rand, maar nie proporsioneel nie.", "book_ref": "6.7(iii), p.113-114", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "The book says: an ITM option's premium reacts little to volatility (a 10% change in volatility gives about a 2% change in premium); an ATM option's price is directly proportional to volatility; an OTM option's price is 'noticeably' affected by volatility. For a put with the underlying at R90, a strike of R80 is OTM (R100 and R110 are ITM). So in proportional (percentage) terms, the OTM put gains the most. Trap: B (R90, ATM) has the biggest time value in absolute rand, but not proportionally.", "note_en": null}, {"paper": "P1", "n": 29, "question": "A farmer is concerned that the price of white maize will drop around the time he expects to harvest his crop. According to some of the other farmers in the district, the price of white maize will increase dramatically as they expect adverse weather in other countries to result in a supply shortage. Which ONE of the following positions should the farmer enter into if he is to limit his potential losses, but still wants to share in the profits should prices increase? He should take a", "statements": [], "options": {"A": "Short position in a call option", "B": "Short position in a futures contract", "C": "Long position in a put option", "D": "Long position in a futures contract"}, "answer": "C", "uitleg": "'n Long put gee 'n minimum verkoopprys (beskerming teen dalende pryse) en die maksimum verlies is die premie. As pryse styg, laat hy die put verval en verkoop teen die hoër markprys. Die lokval is B (short future): dit beskerm ook teen 'n prysdaling, maar sluit die prys vas sodat hy nie deel in 'n prysstyging nie.", "book_ref": "6.6, p.109-110; 6.1.3", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "A long put gives the farmer a minimum selling price (protection against falling prices), and his maximum loss is the premium. If prices rise, he lets the put expire and sells at the higher market price. The trap is B (short future): it also protects against a price drop, but it locks in the price, so he would not share in a price rise.", "note_en": null}, {"paper": "P1", "n": 33, "question": "Which ONE of the following statements with regard to hedging is correct?", "statements": [], "options": {"A": "A prudent grain exporter would use the commodity derivatives market to obtain protection against lower prices for grain contracted for future delivery but not yet purchased", "B": "A prudent grain importer would use commodity derivatives contracts to obtain protection against a fall in grain prices after he contracted for future delivery but has not yet received the grain", "C": "Hedging the price of your grain crop on the futures market implies that you will always be better off than the farmer next to you who did not hedge", "D": "A prudent grain exporter would use the commodity derivatives market to obtain protection against higher prices for grain contracted for future delivery but not yet purchased"}, "answer": "D", "uitleg": "Die boek: uitvoerders het beskerming nodig teen HOËR pryse vir graan wat hulle reeds kontrakteer het om te lewer maar nog nie gekoop het nie (hulle is short die fisiese graan). A noem verkeerdelik laer pryse. B: invoerders wil voordeel trek uit laer pryse, nie daarteen beskerm nie. C: verskansing beteken nie dat jy altyd beter af is nie (basis risk, verlore opside).", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "The book says exporters need protection against HIGHER prices for grain they have already contracted to deliver but have not yet bought (they are short the physical grain). A wrongly says lower prices. B: importers want to benefit from lower prices, not protect against them. C: hedging does not mean you are always better off (basis risk, lost upside).", "note_en": null}, {"paper": "P1", "n": 34, "question": "Which of the following are an objective of hedging using a commodity futures contract?", "statements": ["i. Protecting profit margins", "ii. Locking in certain cash flows", "iii. Increase exposure to the commodity", "iv. Diversification (of one's overall position)"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek se redes vir verskansing: protect profit margins, stabilize cash flows (lock in certain cash flows), transfer risk, diversify one's overall position, improve liquidity/reduce transaction costs. (iii) is verkeerd: verskansing VERMINDER blootstelling aan die kommoditeit; om blootstelling te verhoog is spekulasie.", "book_ref": "7.1.1, p.141-142", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "The book's reasons for hedging are: protect profit margins, stabilize cash flows (lock in certain cash flows), transfer risk, diversify one's overall position, and improve liquidity/reduce transaction costs. (iii) is wrong: hedging REDUCES exposure to the commodity. Increasing exposure is speculation.", "note_en": null}, {"paper": "P1", "n": 35, "question": "A farmer wishes to hedge against a sudden decrease in maize prices using a maize futures contract. Which ONE of the following hedges should he enter into?", "statements": [], "options": {"A": "A long hedge as he is long of maize", "B": "A long hedge because he is short of maize", "C": "A short hedge because he is long of maize", "D": "A short hedge because he is short of maize"}, "answer": "C", "uitleg": "'n Boer besit (of gaan besit) die mielies, dus is hy long in die kontantmark. Om teen 'n prysdaling te beskerm, verkoop hy futures: 'n short (selling) hedge. 'n Long hedge is vir kopers (meulenaars) wat teen stygende pryse beskerm.", "book_ref": "7.1.1, p.142; 7.8 self-test, p.170", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "A farmer owns (or will own) the maize, so he is long in the cash market. To protect against a price drop, he sells futures: a short (selling) hedge. A long hedge is for buyers (such as millers) who want protection against rising prices.", "note_en": null}, {"paper": "P1", "n": 36, "question": "Lady Brown, a maize farmer in Bethlehem, is worried that the good rains will cause the price of white maize to drop and hedges her estimated crop of 1000 tons by shorting ten July maize contracts in February. Her broker manages to do it at a price level of R2000/ton. Brokerage amounts to R5/ton per trade. Assume the area differential to Bethlehem is R110/ton and handling fees amount to R20/ton, implying a basis of R130 'under'. Lady Brown immediately posts an initial margin of R100/ton and pays the brokerage fees. In July she decides to close her futures position by offsetting and selling her maize on the spot market at the new futures price of R1500/ton. If the basis remains constant, her cash flow position will be as per the table. Should the basis strengthen by R20 per ton in July and she manages to harvest the full 1000 tons, the total net cash flow for her entire crop will change to", "statements": [], "options": {"A": "R1 970 000", "B": "R1 880 000", "C": "R1 840 000", "D": "R1 860 000"}, "answer": "B", "uitleg": "Konstante basis: -100 IM -5 + 500 VM (2000-1500) -5 +100 IM terug + spot (1500-130 = 1370) = R1860/t, dus R1 860 000 (opsie D = die oorspronklike tabel). Basis versterk met R20: -130 word -110, spot = 1500-110 = R1390, netto = R1880/t x 1000 = R1 880 000. 'n Short hedger is 'long the basis' en baat by 'n sterker basis. C (R1 840 000) is die antwoord as die basis VERSWAK.", "book_ref": "7.1.4, p.147-154 (Cash flow 1 and 8)", "topic": "Basis & hedging", "note": "Die memo het C gesê, maar volgens die handboek is B reg.", "data": null, "uitleg_en": "Constant basis, per ton: -100 IM, -5 brokerage, +500 VM (2000-1500), -5 brokerage, +100 IM returned, plus spot sale (1500-130 = 1370). Total = R1860/t, so R1 860 000 (option D = the original table). Now the basis strengthens by R20: -130 becomes -110. Spot = 1500-110 = R1390. Net = R1880/t x 1000 = R1 880 000. A short hedger is 'long the basis' and benefits from a stronger basis. C (R1 840 000) would be the answer if the basis WEAKENED.", "note_en": "The memo said C, but according to the textbook B is correct."}, {"paper": "P1", "n": 37, "question": "Farmer Betty wishes to hedge her exposure to the wheat price decreasing over the next 3 months. The best hedging strategy, with the lowest risk, using options, would be which ONE of the following? She should enter into a", "statements": [], "options": {"A": "Short call on the futures contract because she will ultimately receive the premium if the wheat price falls substantially", "B": "Short put on the futures contract because she will ultimately receive the premium if the wheat price falls substantially", "C": "Long call on the futures contract because she will receive the difference between the strike and the market price if the wheat price falls substantially", "D": "Long put on the futures contract because she will receive the difference between the strike and the market price if the wheat price falls substantially"}, "answer": "D", "uitleg": "Produsente wat teen prysdalings wil 'verseker', KOOP puts. As die prys skerp daal, ontvang sy die verskil tussen strike en markprys, en die risiko is beperk tot die premie. A gee net beperkte beskerming (die premie). B is verkeerd: 'n short put VERLOOR as die prys val. C: 'n long call betaal nie uit as die prys daal nie.", "book_ref": "6.6, p.109; 7.1.5", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "Producers who want 'insurance' against price falls BUY puts. If the price falls sharply, Betty receives the difference between the strike and the market price, and her risk is limited to the premium. A gives only limited protection (just the premium received). B is wrong: a short put LOSES when the price falls. C is wrong: a long call does not pay out when the price falls.", "note_en": null}, {"paper": "P1", "n": 38, "question": "Which ONE of the following represents buying an intra-market spread trade?", "statements": [], "options": {"A": "Taking a long position in March contract and shorting the July contract in the same market", "B": "Taking a long position in March contract and shorting the July contract in different markets", "C": "Shorting the March contract and taking a long position in the July contract in the same market", "D": "Shorting the March contract and taking a long position in the July contract in different markets"}, "answer": "C", "uitleg": "'n Intramarket (calendar) spread is tussen twee maande van DIESELFDE kommoditeit. Volgens die plaaslike konvensie beteken 'buying the spread' 'n long posisie in die far crop (Julie) en 'n short posisie in die near crop (Maart). A is 'selling the spread'; B en D is intermarket.", "book_ref": "7.2.1-7.2.2, p.159-160", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "An intramarket (calendar) spread is between two months of the SAME commodity. By local convention, 'buying the spread' means going long the far crop (July) and short the near crop (March). A is 'selling the spread'. B and D are intermarket spreads.", "note_en": null}, {"paper": "P1", "n": 39, "question": "Which ONE of the following statements with regard to delta hedging is correct?", "statements": [], "options": {"A": "The delta of a short call position in maize will rise if the underlying futures price rises", "B": "In order to be delta neutral the short call position holder should sell delta units of the underlying asset", "C": "The delta of an at-the-money call option is around one", "D": "An increase in volatility will affect the delta of an in-the-money option much more than an at-the-money option"}, "answer": "D", "uitleg": "Die boek: volatiliteit beïnvloed die delta van ITM en OTM opsies, maar nie van ATM opsies nie (dié bly ~0.5). A: 'n short call position delta lê tussen -1 en 0 en word meer negatief (daal) as die prys styg. B: 'n short call word verskans deur delta units te KOOP. C: ATM delta is ~0.5, nie 1 nie.", "book_ref": "7.3.2-7.3.3, p.162-163; 7.3.7, p.165", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "The book says volatility affects the delta of ITM and OTM options, but not of ATM options (these stay at ~0.5). A: a short call position's delta lies between -1 and 0 and becomes more negative (falls) as the price rises. B: a short call is hedged by BUYING delta units. C: ATM delta is ~0.5, not 1.", "note_en": null}, {"paper": "P1", "n": 40, "question": "Which combination of the following would best describe the usual role of a producer of wheat in the physical market and his associated position in the (wheat) derivatives market?", "statements": ["i. Hedger", "ii. Speculator", "iii. Long the underlying", "iv. Short the underlying"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "In die fisiese mark is 'n koringprodusent 'n hedger: hy is 'naturally long' (hy besit die oes). Die vraag vra egter sy posisie in die derivatemark, en daar gaan hy short: sy eerste hedge-transaksie is om futures te verkoop (boek p.145: 'their first trade will therefore be to go short').", "book_ref": "7.1.1, p.141-142; 7.8 self-test ('farmer's cash market position is long'), p.170", "topic": "Market roles & prerequisites", "note": "Die twee memo's verskil (getikte memo: A, geskandeerde memo: B). Die vraag vra die posisie in die derivatemark, en daar is die produsent short, so B is die beste antwoord. Leer albei kante: fisies long, futures short.", "data": null, "uitleg_en": "In the physical market a wheat producer is a hedger: he is 'naturally long' because he owns the crop. But the question asks for his position in the derivatives market, and there he goes short. His first hedging trade is to sell futures (book p.145: 'their first trade will therefore be to go short').", "note_en": "The two memos disagree (typed memo: A, scanned memo: B). The question asks for the position in the derivatives market, where a producer is short (he sells futures), so B is the best answer. Remember both sides: long physical, short futures."}, {"paper": "P1", "n": 41, "question": "The purpose of the derivatives rules and directives is to", "statements": [], "options": {"A": "Maximise capital profits for investments in derivatives products", "B": "Contribute to a stable financial market", "C": "Prevent speculative activities", "D": "Promote healthy hedging practices"}, "answer": "B", "uitleg": "Die reëls en direktiewe moet o.a. die doelwitte van die FMA bereik, waarvan een is om by te dra tot die handhawing van 'n stabiele finansiële markomgewing (en fair, efficient, transparent markte). Die ander opsies kom nie in die boek voor nie; spekulasie word nie verbied nie.", "book_ref": "8.1, p.172-173", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Among other things, the rules and directives must achieve the objectives of the FMA. One of these is to help maintain a stable financial market environment (and fair, efficient, transparent markets). The other options do not appear in the book, and speculation is not prohibited.", "note_en": null}, {"paper": "P1", "n": 42, "question": "Which of the following will disqualify an officer of a member from registration as a dealer?", "statements": ["i. Being investigated by the SA Reserve Bank", "ii. Having been dismissed from any employment", "iii. Registration as an officer for a competing local exchange", "iv. Registration as an officer for any foreign exchange"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Reël 3.20.1.4: diskwalifiseer o.a. iemand wat 'the subject of a formal investigation by any regulatory or government agency' is (die SARB, dus i) en iemand wat 'dismissed ... from any office or employment' is (ii). Om as officer by 'n ander plaaslike of buitelandse beurs geregistreer te wees, word nêrens gelys nie, so (iii) en (iv) is nie diskwalifikasies nie.", "book_ref": "8.2 (rule 3.20.1.4.5 and 3.20.1.4.9), p.174", "topic": "Regulation & rules", "note": "Die memo het C gesê, maar volgens die handboek is A reg.", "data": null, "uitleg_en": "Rule 3.20.1.4 disqualifies, among others, someone who is 'the subject of a formal investigation by any regulatory or government agency' (the SARB, so (i)), and someone who was 'dismissed ... from any office or employment' (ii). Being registered as an officer at another local or foreign exchange is not listed anywhere. So (iii) and (iv) are not disqualifications.", "note_en": "The memo said C, but according to the textbook A is correct."}, {"paper": "P1", "n": 43, "question": "Which ONE of the following statements regarding the Commodity Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "A member may only access the CDM trading system with the approval of the member's compliance officer", "B": "A member guarantees fulfilment of CDM transactions for client accounts only", "C": "The JSE validates all data submitted to the CDM trading system", "D": "Information received on the CDM trading system is deemed to have been submitted with the member's knowledge"}, "answer": "D", "uitleg": "Reël 7.80.1: 'n trading member is gebonde aan alle offers en entries wat in sy naam op die stelsel gemaak word, al was dit nie gemagtig nie. Dit beteken die inligting word geag met die lid se medewete ingedien te wees. A: toegang vereis goedkeuring van die Market Controller, nie die compliance officer nie. C: die trading member (nie die JSE nie) is verantwoordelik vir die akkuraatheid van data (ch.8 self-test).", "book_ref": "8.3 (rule 7.80), p.174-175; 8.18 self-test, p.190", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Rule 7.80.1: a trading member is bound by all offers and entries made in its name on the system, even if they were not authorised. This means the information is deemed to have been submitted with the member's knowledge, so D is correct. A is wrong: access requires approval from the Market Controller, not the compliance officer. C is wrong: the trading member (not the JSE) is responsible for the accuracy of the data (ch.8 self-test).", "note_en": null}, {"paper": "P1", "n": 44, "question": "Which ONE of the following statements regarding the Commodity Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "The JSE Executive may extend the hours of operation of the CDM trading system to a Saturday or Sunday to ensure proper functioning of the market", "B": "The Market Controller may, in case of system failure, declare a transaction executed on the CDM trading system void", "C": "The JSE Executive may halt trading without prior notice to members", "D": "The Market Controller may cease trading on the CDM trading system if trade in the underlying ceases"}, "answer": "C", "uitleg": "Reël 7.90.3.2: die JSE Executive mag 'without prior notice to any person' die stelsel halt of sluit. A: ure kan net vir 'n 'business day' verleng of verkort word, nie Saterdag/Sondag nie. B: die JSE Executive (nie die Market Controller nie) verklaar transaksies void. D: die JSE Executive (nie die Market Controller nie) oorweeg om handel te staak as die onderliggende ophou verhandel.", "book_ref": "8.4-8.5 (rules 7.90.3, 10.30.3), p.175-176", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Rule 7.90.3.2: the JSE Executive may halt or close the system 'without prior notice to any person'. A is wrong: trading hours can only be extended or shortened for a 'business day', not a Saturday or Sunday. B is wrong: the JSE Executive (not the Market Controller) declares transactions void. D is wrong: the JSE Executive (not the Market Controller) considers stopping trading if the underlying stops trading.", "note_en": null}, {"paper": "P1", "n": 45, "question": "Which of the following actions will be LEGAL in terms of insider trading legislation?", "statements": ["i. Mary, the secretary of the National Crop Estimates Committee (NCEC), emails the national crop estimates to her friend, Julie, not realizing that it contains trade sensitive information", "ii. Julie trades on the information for the benefit of a pension fund she advises", "iii. Mary publishes the national crop estimate in the Landbou Weekblad and the website", "iv. Peter, a farmer, trades on the basis of the information obtained from the Landbou Weekblad"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "C", "uitleg": "Die openbaarmakingsmisdryf geld net vir 'n insider 'who KNOWS that he or she has inside information'. Mary besef dit nie, so (i) is nie 'n misdryf nie. (ii) is onwettig: Julie weet die bron is 'n insider, is dus self 'n insider, en handel vir 'n ander persoon. (iii) en (iv): sodra die inligting gepubliseer is, is dit nie meer inside information nie.", "book_ref": "8.6, p.176-178", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The disclosure offence only applies to an insider 'who KNOWS that he or she has inside information'. Mary does not realise this, so (i) is not an offence. (ii) is illegal: Julie knows the source is an insider, so she is an insider herself, and she trades for another person. (iii) and (iv): once the information has been published, it is no longer inside information.", "note_en": null}, {"paper": "P1", "n": 46, "question": "Which of the following actions with regard to agricultural product securities will be ILLEGAL in terms of market abuse legislation?", "statements": ["i. Publish a statement which may be misleading due to the omission of facts", "ii. Entering orders to sell at market prices", "iii. Entering an order to buy during a pre-opening period and cancelling the order immediately prior to the market opening", "iv. Publishing a misleading statement with regard to securities"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "C", "uitleg": "(iii) is uitdruklik 'n manipulative/deceptive trading method (pre-opening order wat net voor opening gekanselleer word). (i) en (iv): misleidende of onvolledige (weglating van feite) verklarings is market abuse (FMA s81 false/misleading statements). Die boek dek dit nie woordeliks nie, maar dit is in die gees van 8.7. (ii) Gewone verkoopsorders teen markpryse is wettig.", "book_ref": "8.7.1 (rule 7.200, 8.7.1.4(a)(iv)), p.179-180", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "(iii) is explicitly a manipulative/deceptive trading method (a pre-opening order that is cancelled just before the opening). (i) and (iv): misleading or incomplete statements (leaving out facts) are market abuse (FMA s81, false/misleading statements). The book does not cover this word for word, but it is in the spirit of 8.7. (ii) is legal: ordinary sell orders at market prices are allowed.", "note_en": null}, {"paper": "P1", "n": 47, "question": "Which of the following statements with regard to maintenance of market integrity by the exchange are correct?", "statements": ["i. A transaction that is declared void is binding on the authorised user and the client", "ii. The consent of both the Director of Surveillance and the CEO of the JSE is required before a transaction may be declared void", "iii. A trader may not delete orders from the Commodities derivatives market system during a trading halt", "iv. The JSE may impose daily price and position limits"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "(i) Reg: 'n void-verklaring is bindend op die trading member en die kliënt. (ii) Verkeerd: die JSE Executive (stelselfout) of die Director: Market Regulation alleen mag 'n transaksie void verklaar. 'In conjunction with the CEO' geld vir 'n trading HALT. (iii) Verkeerd: tydens 'n halt mag mens nie handel nie, maar wel orders delete. (iv) Reg: price limits (8.14) en position limits (8.15).", "book_ref": "8.8, p.180-181; 8.14-8.15, p.182-185", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "(i) Correct: a declaration that a trade is void binds both the trading member and the client. (ii) Wrong: only the JSE Executive (for a system error) or the Director: Market Regulation alone may declare a transaction void. 'In conjunction with the CEO' applies to a trading HALT, not to voiding. (iii) Wrong: during a halt you may not trade, but you may delete orders. (iv) Correct: price limits (8.14) and position limits (8.15).", "note_en": null}, {"paper": "P1", "n": 48, "question": "Which of the following are requirements when a member wishes to trade with or on behalf of a client?", "statements": ["i. The member must register as a financial services provider at the Financial Services Board", "ii. The member must enter into an agreement with the client", "iii. The member must register the client with the JSE", "iv. The member must confirm the client's financial standing"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Reël 7.60: 'n trading member mag nie met of namens 'n kliënt handel nie, tensy die kliënt 'n client agreement met die lid aangegaan het (ii) EN die lid die kliënt by die JSE geregistreer het (iii). (i) en (iv) word nie in die reël vereis nie.", "book_ref": "8.13, p.182", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Rule 7.60: a trading member may not trade with or on behalf of a client unless the client has entered into a client agreement with the member (ii) AND the member has registered the client with the JSE (iii). (i) and (iv) are not required by the rule.", "note_en": null}, {"paper": "P1", "n": 50, "question": "The 'science' of determining whether there is real value in a commodity at a certain price is known as", "statements": [], "options": {"A": "Price analysis", "B": "Technical analysis", "C": "Fundamental analysis", "D": "Demand and supply analysis"}, "answer": "C", "uitleg": "Die boek: 'Fundamental analysis is based more on the fields of economics and accounting where finding real value is the name of the game.' Technical analysis bestudeer prysbewegings en patrone, nie intrinsieke waarde nie.", "book_ref": "9.1, p.192", "topic": "Other", "note": null, "data": null, "uitleg_en": "The book says: 'Fundamental analysis is based more on the fields of economics and accounting where finding real value is the name of the game.' Technical analysis studies price movements and patterns, not intrinsic value.", "note_en": null}, {"paper": "P3", "n": 1, "question": "Which of the following statements about the maize market in South Africa are correct?", "statements": ["i. Maize is primarily planted from late May to end August.", "ii. The grading system for white and yellow maize consists of three major grades each.", "iii. The domestic market is strictly regulated because maize is a staple food for many people.", "iv. Genetically modified (GM) maize is increasingly being planted by farmers."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "D", "uitleg": "Mielies word in die somer geplant, hoofsaaklik November en Desember, so (i) is vals. Daar is drie grade elk (WM1-WM3, YM1-YM3) en GM-mielies se aanplanting het dramaties toegeneem, so (ii) en (iv) is waar. Die mieliemark is sedert 1996 volledig gedereguleer, so (iii) is vals.", "book_ref": "1.2.1-1.2.8, pp.6-12", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "Maize is planted in summer, mainly in November and December, so (i) is false. There are three grades of each (WM1-WM3, YM1-YM3), and plantings of GM maize have increased dramatically, so (ii) and (iv) are true. The maize market has been fully deregulated since 1996, so (iii) is false.", "note_en": null}, {"paper": "P3", "n": 2, "question": "Wheat grades are fundamentally determined by the kernels'", "statements": [], "options": {"A": "moisture content and weight.", "B": "protein content and weight.", "C": "moisture content and primary colour.", "D": "protein content and primary colour."}, "answer": "B", "uitleg": "Die boek sê koringgrade word fundamenteel bepaal deur proteïeninhoud en spesifieke gewig (hectolitre mass). Primêre kleur is 'n mielie-graderingskriterium, nie koring nie.", "book_ref": "1.3.1, p.13", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "The book says wheat grades are fundamentally determined by protein content and specific weight (hectolitre mass). Primary colour is a grading criterion for maize, not wheat.", "note_en": null}, {"paper": "P3", "n": 3, "question": "Which of the following statements about the South African wheat market are correct?", "statements": ["i. Wheat is classified into four classes, A, B, C and D.", "ii. Wheat grades are fundamentally determined by protein content and specific weight.", "iii. As a class, harder wheat has higher protein content than softer wheat and is more suitable for bread than for biscuits.", "iv. Wheat is generally planted around November, December and January."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Koring word geklassifiseer as Bread Wheat en Other Wheat (Super, Graad 1-3), nie klasse A-D nie, so (i) is vals. (ii) en (iii) kom direk uit die boek. Koring word April tot Julie geplant en November tot Januarie geoes, so (iv) verwar plant met oes.", "book_ref": "1.3.1, 1.3.3, p.13", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "(i) is false: wheat is classified as Bread Wheat and Other Wheat (Super, Grade 1-3), not classes A-D. (ii) and (iii) come straight from the book. (iv) is false: wheat is planted from April to July and harvested from November to January, so (iv) mixes up planting and harvesting.", "note_en": null}, {"paper": "P3", "n": 4, "question": "Futures markets trade futures contracts that are standardised in respect of", "statements": ["i. price of underlying.", "ii. quality of underlying.", "iii. delivery location.", "iv. quantity of underlying."], "options": {"A": "(i), (ii) and (iii) only", "B": "(ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "D", "uitleg": "Futures is gestandaardiseer t.o.v. kwaliteit, hoeveelheid (contract size) en afleweringsplek/-tyd. Die prys word nie gestandaardiseer nie; dit word deur vraag en aanbod op die beurs ontdek.", "book_ref": "2.5 p.28; 4.2 p.41", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "Futures are standardised for quality, quantity (contract size) and place/time of delivery. The price is not standardised; it is discovered on the exchange through supply and demand.", "note_en": null}, {"paper": "P3", "n": 5, "question": "The prerequisites for successful trading in agricultural futures and options contracts include the fact that any such underlying commodity should", "statements": [], "options": {"A": "always be available for visible inspection by the buyer.", "B": "be a heterogeneous commodity.", "C": "not easily trade in the cash or spot market.", "D": "be exposed to frequent price variation."}, "answer": "D", "uitleg": "Die boek noem as voorvereiste dat die kommoditeit aan gereelde prysvariasies blootgestel moet wees (anders is daar geen behoefte om te hedge nie). Dit moet homogeen wees (nie heterogeen nie), moet op 'n goed funksionerende kontantmark verhandel, en kopers hoef dit juis nie te sien nie.", "book_ref": "2.5, p.28", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "The book lists as a prerequisite that the commodity must be exposed to frequent price variation (otherwise there is no need to hedge). Why the others are wrong: it must be homogeneous (not heterogeneous), it must trade in a well-functioning cash market, and buyers specifically do NOT need to see it.", "note_en": null}, {"paper": "P3", "n": 6, "question": "Which of the following are considered advantages of forward contracts?", "statements": ["i. Buyers can defer payment until delivery.", "ii. They contain no default risk.", "iii. Contracts can be easily unwound by settling in cash before delivery.", "iv. Because the price is fixed upfront, the producer is protected against an unexpected fall in market prices."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "Die boek lys as voordele: koper se betalings word tot aflewering uitgestel, en verkopers is beskerm teen onverwagte prysdalings. Default risk is juis 'n nadeel van forwards, en forwards is moeilik om voor aflewering te unwind.", "book_ref": "3.1.1-3.1.2, p.31", "topic": "Forwards", "note": null, "data": null, "uitleg_en": "The book lists these advantages of forwards: the buyer's payments are deferred until delivery, and sellers are protected against unexpected price falls. Default risk is a disadvantage of forwards, and forwards are hard to unwind before delivery. So only (i) and (iv) are advantages.", "note_en": null}, {"paper": "P3", "n": 7, "question": "If the spot price of maize is R1 100 per ton; the interest rate is 7.5% per annum, quarterly compounded; storage cost is R75 per ton payable after 9 months; and the convenience yield is 2.5% of the spot price, the 9-month forward price of a maize contract will be", "statements": [], "options": {"A": "R1 181.89", "B": "R1 204.43", "C": "R1 215.40", "D": "R1 218.53"}, "answer": "C", "uitleg": "Formule (3.5): F0 = (S0 + U)(1 + (i-y)/f)^(n·f). U = 75 × (1+0.075/4)^-3 = R70.93. F0 = (1 100 + 70.93) × (1 + 0.05/4)^3 = 1 170.93 × 1.03797 = R1 215.40.", "book_ref": "3.2, formula 3.5, pp.35-36", "topic": "Futures pricing", "note": null, "data": null, "uitleg_en": "Use formula (3.5): F0 = (S0 + U)(1 + (i-y)/f)^(n·f). Step 1: U = 75 × (1+0.075/4)^-3 = R70.93. Step 2: i - y = 0.075 - 0.025 = 0.05. Step 3: F0 = (1 100 + 70.93) × (1 + 0.05/4)^3 = 1 170.93 × 1.03797 = R1 215.40.", "note_en": null}, {"paper": "P3", "n": 8, "question": "Which of the following statements about agricultural futures contracts are true?", "statements": ["i. These contracts can be closed out before the delivery date.", "ii. The buyer of a futures contract enters into a commitment to make delivery of the underlying commodity.", "iii. Open interest refers to the total number of futures contracts that have not yet been fulfilled.", "iv. The vast majority of futures positions are fulfilled by physical delivery at maturity."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Futures kan voor aflewering uitgekanselleer (closed out) word, en open interest is die totale aantal kontrakte wat nog uitstaande/nie vervul is nie. Die koper neem aflewering (die verkoper maak aflewering), en die meeste posisies word uitgekanselleer, nie fisies afgelewer nie.", "book_ref": "4.1, pp.41-42", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "(i) Futures can be closed out before delivery. (iii) Open interest is the total number of contracts still outstanding (not yet fulfilled). Why the others are wrong: the buyer takes delivery (the seller makes delivery), and most positions are closed out, not physically delivered.", "note_en": null}, {"paper": "P3", "n": 9, "question": "In the agricultural commodities market, futures contracts specifically differ from forward contracts in the sense that", "statements": ["i. futures contracts are subject to daily cash flows.", "ii. speculators prefer futures contracts to forwards.", "iii. the market for forwards is more deep and liquid than the futures market.", "iv. credit risk is much higher in futures contracts than in forward contracts."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Futures word daagliks marked-to-market (daaglikse kontantvloei) en is vir spekulante aantrekliker weens likiditeit en maklike close-out. Forwards is minder likied, en die clearing house verminder credit risk by futures, so (iii) en (iv) is omgekeerd.", "book_ref": "4.2, pp.42-43", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "Futures are marked-to-market daily (daily cash flows), and they are more attractive to speculators because they are liquid and easy to close out. So (i) and (ii) are correct. (iii) and (iv) have it the wrong way round: forwards are the less liquid ones, and the clearing house reduces credit risk for futures.", "note_en": null}, {"paper": "P3", "n": 10, "question": "A large bread baker wants to hedge his future input costs and enters into a wheat futures contract at R2 600 per ton. He would typically enter into a", "statements": [], "options": {"A": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "B": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "C": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton.", "D": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton."}, "answer": "D", "uitleg": "Die bakker koop koring, so hy vrees prysstygings en neem 'n long position (long hedge). 'n Long position maak wins as die prys styg, dus by R2 700 (R100/t wins).", "book_ref": "4.9 (hedging/basis), pp.69-71", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "The baker buys wheat, so he fears price rises. He takes a long position (a long hedge). A long position makes a profit when the price rises, so at R2 700 he makes R100/t.", "note_en": null}, {"paper": "P3", "n": 11, "question": "Which of the following statements about price discovery in the agricultural markets are correct?", "statements": ["i. For wheat the old-crop/new-crop price spread is represented by the price difference between the September and December futures contracts.", "ii. For maize the old-crop/new-crop price spread is represented by the price difference between the May and July futures contracts.", "iii. To avoid large swings in contract prices the JSE has introduced daily price limits for each commodity except for the spot month contract.", "iv. In order to prevent excessive price fluctuations, the price limits for each commodity on the JSE remain unchanged for the duration of an entire season."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Koring se old-crop/new-crop spread is September vs Desember (waar); vir mielies is dit Maart vs Mei, nie Mei vs Julie nie. Price limits geld vir alle hedging months behalwe die spot month (waar). Limiete verander wel, bv. extended limits (150%) word geaktiveer, so (iv) is vals.", "book_ref": "4.3, p.47; 8.14, p.182", "topic": "Price discovery & limits", "note": null, "data": null, "uitleg_en": "(i) True: wheat's old-crop/new-crop spread is September vs December. For maize it is March vs May, not May vs July. (iii) True: price limits apply to all hedging months except the spot month. (iv) is false: limits do change, for example extended limits (150%) can be activated.", "note_en": null}, {"paper": "P3", "n": 12, "question": "A SAFEX silo receipt issued by a JSE approved silo owner", "statements": [], "options": {"A": "is only issued to a soybean producer after he has delivered 100 tons of soybeans.", "B": "is only issued to a wheat producer after he has delivered 100 tons of wheat.", "C": "is only issued to a sunflower producer after he has delivered 100 tons of sunflower seed.", "D": "is only issued to a white maize producer after he has delivered 100 tons of maize."}, "answer": "D", "uitleg": "'n JSE silo receipt verteenwoordig een kontrak se hoeveelheid. Slegs mielies (wit en geel) se kontrakgrootte is 100 ton; koring, sonneblom en sojabone is 50 ton. Dus is slegs D konsekwent.", "book_ref": "4.5, pp.49-50; Table 4.3, p.54", "topic": "Delivery", "note": null, "data": null, "uitleg_en": "A JSE silo receipt represents the quantity of one contract. Only maize (white and yellow) has a contract size of 100 tons; wheat, sunflower seed and soybeans are 50 tons. So only D is consistent.", "note_en": null}, {"paper": "P3", "n": 13, "question": "Which of the following statements with regard to the various ways in which physical delivery for grain can be executed on the JSE are correct?", "statements": ["i. Market participants wishing to exchange a long futures position for a spot position would sell an Exchange for Physicals contract.", "ii. The JSE can process the actual delivery in an Exchange for Physical transaction should the counterparties prefer this.", "iii. The JSE processes an Exchange for Physical transaction at the marked-to-market price as on transaction date.", "iv. A participant offering grain on a silo receipt auction should have access to the physical product as represented on the silo receipt."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek sê letterlik: 'n meulenaar wat sy long futures vir spot ruil, 'sells an EFP' (i); 'The JSE can process the actual physical delivery should the two counterparties prefer this' (ii); en die EFP 'is processed at the current MTM value' (iii). Memo C sluit (ii) uit, wat direk teen die boek se teks gaan. Stelling (iv) word nie in die boek genoem nie.", "book_ref": "4.5 (i) EFP, pp.51-52", "topic": "Delivery", "note": "Die memo het C gesê, maar volgens die handboek is B reg.", "data": null, "uitleg_en": "The book says literally: (i) a miller who swaps his long futures for spot 'sells an EFP'; (ii) 'The JSE can process the actual physical delivery should the two counterparties prefer this'; and (iii) the EFP 'is processed at the current MTM value'. The memo's answer C leaves out (ii), which directly contradicts the book's text. Statement (iv) is not mentioned in the book.", "note_en": "The memo gave C, but according to the textbook B is correct."}, {"paper": "P3", "n": 14, "question": "In the case of illiquid contracts, the marked-to-market (MTM) price will be decided using a random sample in the last 5 minutes of trade. The offer will be used as the MTM price if the offer is", "statements": [], "options": {"A": "higher than the last traded price.", "B": "lower than the last traded price.", "C": "higher than the average traded price.", "D": "lower than the average traded price."}, "answer": "B", "uitleg": "Vir illiquid contracts: as die bid hoër as die laaste verhandelde prys is, word die bid gebruik; as die offer laer as die laaste verhandelde prys is, word die offer die MTM. Liquid contracts gebruik VWAP.", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null, "uitleg_en": "For illiquid contracts: if the bid is higher than the last traded price, the bid is used. If the offer is lower than the last traded price, the offer becomes the MTM price. Liquid contracts use VWAP.", "note_en": null}, {"paper": "P3", "n": 16, "question": "On SAFEX, the futures expiry date of a futures contract coincides with the last", "statements": [], "options": {"A": "position day.", "B": "notice day.", "C": "delivery day.", "D": "trading day."}, "answer": "D", "uitleg": "In die kontrakspesifikasies staan 'Expiry Dates & Times (Last Trading Day)': die expiry date is die laaste handelsdag (12h00 op die sesde laaste besigheidsdag van die maand). Die laaste notice day is die tweede laaste besigheidsdag, en dit is iets anders.", "book_ref": "Contract specs, p.66; definitions p.59", "topic": "Futures basics", "note": null, "data": null, "uitleg_en": "The contract specifications say 'Expiry Dates & Times (Last Trading Day)'. So the expiry date is the last trading day (12h00 on the sixth last business day of the month). The last notice day is the second last business day, which is something different.", "note_en": null}, {"paper": "P3", "n": 17, "question": "Which of the following statements about futures contract specifications are correct?", "statements": ["i. The standard contract size for yellow maize is 100 metric tons.", "ii. The underlying commodity for WOPT contracts is second grade white maize from any origin.", "iii. Physical delivery on wheat futures contracts can take place on any day from the first business day to last business day of an expiry month.", "iv. A constant month contract for wheat is introduced 40 business days preceding a non-standard hedging month."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "YMAZ is 100 ton (i waar), WOPT is WM2 of beter van enige oorsprong (ii waar), en constant months word 40 besigheidsdae vooraf ingestel (iv waar). Die memo se C kan nie reg wees nie, want (i) is volgens die boek waar. (iii) is dubbelsinnig: die teks op p.49-50 sê aflewering kan op enige besigheidsdag in die maand plaasvind (ook die laaste), maar die spesifikasietabel sê eerste tot 4de laaste besigheidsdag.", "book_ref": "4.5 p.50; contract specs pp.61-66", "topic": "Delivery", "note": "Die vraag is swak opgestel: stelling (iii) bots met die spesifikasietabel (aflewering tot die 4de laaste besigheidsdag). D is die enigste opsie wat werk, want (i), (ii) en (iv) is beslis waar. Die memo het C gesê.", "data": null, "uitleg_en": "YMAZ is 100 tons, so (i) is true. WOPT is WM2 or better of any origin, so (ii) is true. Constant months are set 40 business days in advance, so (iv) is true. The memo's answer C cannot be right, because the book says (i) is true. (iii) is ambiguous: the text on p.49-50 says delivery can take place on any business day in the month (including the last), but the specification table says from the first to the 4th-last business day.", "note_en": "The question is poorly set: statement (iii) conflicts with the specification table (delivery up to the 4th-last business day). D is the only option that works, because (i), (ii) and (iv) are definitely true. The memo gave C."}, {"paper": "P3", "n": 18, "question": "On 20 March (t1) miller John buys July maize futures at R1 850 per ton when the spot price of maize is R1 800 per ton. On 8 April (t2) the maize spot price moves to R1 810 while the July futures price changes to R1 855. The basis on 8 April is", "statements": [], "options": {"A": "R50 per ton \"under\".", "B": "R50 per ton \"over\".", "C": "R45 per ton \"under\".", "D": "R45 per ton \"over\"."}, "answer": "C", "uitleg": "Basis = spot - futures. Op 8 April: 1 810 - 1 855 = -R45, dus R45 'under'. R50 under (memo A) is die basis op 20 Maart (t1), nie 8 April nie.", "book_ref": "4.9, p.69", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null, "uitleg_en": "Basis = spot - futures. On 8 April: 1 810 - 1 855 = -R45, so R45 'under'. R50 under (memo answer A) is the basis on 20 March (t1), not on 8 April.", "note_en": "The memo said A, but according to the textbook C is correct."}, {"paper": "P3", "n": 19, "question": "A participant who sells a futures contract is said to be ____ the basis and will benefit if the basis ____.", "statements": [], "options": {"A": "short; weakens", "B": "short; strengthens", "C": "long; strengthens", "D": "long; weakens"}, "answer": "C", "uitleg": "Die boek: die short hedger (wat futures verkoop) is 'long the basis' en baat by 'n basis wat versterk (strengthen/narrow). Die long hedger (koper van futures) is 'short the basis' en baat as die basis verswak. Memo A is die beskrywing van die koper, nie die verkoper nie.", "book_ref": "4.9, p.71", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null, "uitleg_en": "The book says the short hedger (who sells futures) is 'long the basis' and benefits when the basis strengthens (strengthen/narrow). The long hedger (who buys futures) is 'short the basis' and benefits when the basis weakens. Memo answer A describes the buyer, not the seller.", "note_en": "The memo said A, but according to the textbook C is correct."}, {"paper": "P3", "n": 20, "question": "On 20 July (t1) miller John buys December wheat futures at R2 970 per ton when the spot price of wheat is R2 905 per ton. On 18 August (t2) the wheat spot price hits R2 900 per ton with the December futures price at R2 975. If he closes out his futures position on 18 August, what will John effectively pay for his wheat?", "statements": [], "options": {"A": "R2 895 per ton", "B": "R3 045 per ton", "C": "R2 910 per ton", "D": "R2 975 per ton"}, "answer": "A", "uitleg": "Futures-wins: 2 975 - 2 970 = +R5/t. Hy koop fisies teen R2 900, so effektief 2 900 - 5 = R2 895/t. Of: F1 + B2 = 2 970 + (2 900 - 2 975) = R2 895. R3 045 (memo B) is 2 970 + 75, waar die basis met die verkeerde teken bygetel is.", "book_ref": "4.9, pp.69-71", "topic": "Basis & hedging", "note": "Die memo het B gesê, maar volgens die handboek is A reg.", "data": null, "uitleg_en": "Futures profit: 2 975 - 2 970 = +R5/t. He buys the physical wheat at R2 900, so he effectively pays 2 900 - 5 = R2 895/t. Or, using the formula: F1 + B2 = 2 970 + (2 900 - 2 975) = R2 895. R3 045 (memo answer B) is 2 970 + 75: the basis was added with the wrong sign.", "note_en": "The memo gave B, but according to the textbook A is correct."}, {"paper": "P3", "n": 21, "question": "Which ONE of the following statements correctly reflects the characteristics of the local spot price of maize?", "statements": [], "options": {"A": "It should be the same in Randfontein as in Pretoria West.", "B": "It reflects the SAFEX futures price in the delivery month.", "C": "It should normally be higher than the import parity price.", "D": "It is largely dictated by silo owners who control the supply."}, "answer": "B", "uitleg": "Die boek sê die JSE CDM futures prys vir die afleweringsmaand is die werklike spot prys (Randfontein-gebaseer). Spot pryse verskil per ligging weens location differentials, en import parity is die maksimum, nie 'n vloer nie.", "book_ref": "4.8, pp.75-76", "topic": "Physical market", "note": null, "data": null, "uitleg_en": "The book says the JSE CDM futures price for the delivery month is the actual spot price (Randfontein-based). Why the others are wrong: spot prices differ by location because of location differentials, and import parity is the maximum (ceiling), not a floor.", "note_en": null}, {"paper": "P3", "n": 22, "question": "The amount on which the magnitude of the fixed and floating cash flows in a swap is calculated is called the", "statements": [], "options": {"A": "primary total.", "B": "notional principal.", "C": "basis amount.", "D": "reference value."}, "answer": "B", "uitleg": "Die boek definieer die notional principal as die bedrag waarop die grootte van die vaste en vlottende kontantvloei bereken word. Dit word self nooit uitgeruil nie.", "book_ref": "5.2, p.89", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "The book defines the notional principal as the amount on which the size of the fixed and floating cash flows is calculated. The notional principal itself is never exchanged.", "note_en": null}, {"paper": "P3", "n": 23, "question": "Which ONE of the following statements with regard to commodity swaps is correct?", "statements": [], "options": {"A": "Generally commodity swaps are settled by exchanging the physical underlying commodity on each reset date.", "B": "Locally, some large grain consumers avoid using cash settling swaps to hedge as they have to comply with complex international accounting standards.", "C": "Since commodity swaps are exchange traded, they are considered very liquid hedging instruments.", "D": "The basic principle in pricing a swap is that the swap must have a positive value at inception."}, "answer": "B", "uitleg": "Groot graanverbruikers verkies OTC forwards bo cash-settling swaps weens IFRS-vereistes (fair value op die balansstaat, wisselvallige verdienste). Swaps word in kontant vereffen, is OTC (nie exchange traded nie), en moet by aanvang 'n waarde van nul hê.", "book_ref": "5.3, p.91; 5.7, p.94", "topic": "Swaps", "note": null, "data": null, "uitleg_en": "Large grain consumers prefer OTC forwards over cash-settling swaps because of IFRS requirements (fair value on the balance sheet, which makes earnings volatile). The other statements are wrong because swaps are settled in cash, are OTC (not exchange traded), and must have a value of zero at inception.", "note_en": null}, {"paper": "P3", "n": 24, "question": "An investor who originally sold the right to buy an agricultural future at a specified price on a specified date in the future, is referred to as the", "statements": [], "options": {"A": "holder of a call option.", "B": "holder of a put option.", "C": "writer of a call option.", "D": "writer of a put option."}, "answer": "C", "uitleg": "Die reg om te koop is 'n call option. Wie die reg verkoop het, is die writer (short), dus die writer of a call option.", "book_ref": "6.1-6.3, pp.99-101", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "The right to buy is a call option. The person who sold that right is the writer (short). So this is the writer of a call option.", "note_en": null}, {"paper": "P3", "n": 26, "question": "An investor has taken a long position in an OTM (out-the-money) call option in the December White Maize future. What will happen to the option's value if the price of the future decreases?", "statements": [], "options": {"A": "Increase, as the option moves closer to being ITM (in-the-money).", "B": "Increase, as the option moves further OTM.", "C": "Decrease, as the option moves closer to being ITM.", "D": "Decrease, as the option moves further OTM."}, "answer": "D", "uitleg": "'n Call se waarde is positief verwant aan die futures-prys (delta > 0). As die futures-prys daal, beweeg die OTM call verder OTM en die waarskynlikheid om ITM te eindig daal, dus daal die waarde. 'n Call beweeg nader aan ITM net as die prys styg.", "book_ref": "6.4.5 p.106; 6.7 p.112", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "A call's value moves in the same direction as the futures price (delta > 0). If the futures price falls, the OTM call moves further OTM, and the chance of ending ITM falls. So its value decreases. A call only moves closer to ITM when the price rises.", "note_en": null}, {"paper": "P3", "n": 27, "question": "An investor buys a call option on the December white maize contract, with a strike price of R800, for R50 per contract. Assuming that the current price for the futures contract is R820, what would the time value and intrinsic value of each option contract be respectively?", "statements": [], "options": {"A": "Time value will be R50 and intrinsic value will be R30.", "B": "Time value will be R30 and intrinsic value will be R50.", "C": "Time value will be R30 and intrinsic value will be R20.", "D": "Time value will be R20 and intrinsic value will be R30."}, "answer": "C", "uitleg": "Intrinsic value van 'n call = max(0, F - K) = 820 - 800 = R20. Time value = premie - intrinsic value = 50 - 20 = R30. Let op die volgorde: time value eerste (R30), dan intrinsic (R20); D ruil dit om.", "book_ref": "6.4.4 p.106", "topic": "Options basics", "note": null, "data": null, "uitleg_en": "Intrinsic value of a call = max(0, F - K) = 820 - 800 = R20. Time value = premium - intrinsic value = 50 - 20 = R30. Watch the order in the question: time value first (R30), then intrinsic value (R20). D swaps them.", "note_en": null}, {"paper": "P3", "n": 28, "question": "Consider four individual call options with similar characteristics in terms of size, underlying asset and maturity date. If the market price of the underlying asset is R100, then the option that will proportionally gain the most time value if volatility increases, is the one with the following strike price:", "statements": [], "options": {"A": "R80", "B": "R90", "C": "R100", "D": "R110"}, "answer": "D", "uitleg": "Die boek sê 'n ATM opsie se prys verander met dieselfde persentasie as volatility, maar 'n verandering in volatility het 'n 'marked effect' op die prys van 'n out-of-the-money opsie (dit word net winsgewend as volatility toeneem). Proporsioneel (persentasie) wen die OTM call (strike R110) dus die meeste. In absolute rand het die ATM opsie (R100) die grootste vega - dis die lokval.", "book_ref": "6.7 (iii), p.113-114", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "The book says an ATM option's price changes by the same percentage as volatility. But a change in volatility has a 'marked effect' on the price of an out-of-the-money option (it only becomes profitable if volatility increases). So in proportional (percentage) terms, the OTM call (strike R110) gains the most. In absolute rand terms the ATM option (R100) has the largest vega - that is the trap.", "note_en": null}, {"paper": "P3", "n": 29, "question": "A farmer is concerned that the price of white maize will drop around the time he expects to harvest his crop. According to some of the other farmers in the district, the price of White Maize will increase dramatically as they expect adverse weather in other countries to result in a supply shortage. Which ONE of the following positions should the farmer enter into if he is to limit his potential losses, but still wants to share in the profits should prices increase? He should take a", "statements": [], "options": {"A": "short position in a call option.", "B": "short position in a futures contract.", "C": "long position in a put option.", "D": "long position in a futures contract."}, "answer": "C", "uitleg": "'n Long put gee die boer 'n vloerprys (beperk verliese as pryse daal) terwyl hy steeds voordeel trek as pryse styg; hy verloor net die premie. 'n Short futures beskerm ook, maar sluit die opside uit. 'n Short call beskerm nie teen 'n groot prysdaling nie.", "book_ref": "6.2 p.100; 7.1.5 p.156", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "A long put gives the farmer a floor price, which limits his losses if prices fall. He still benefits if prices rise; all he loses is the premium. A short futures position also protects him, but it takes away the upside. A short call does not protect against a large price fall.", "note_en": null}, {"paper": "P3", "n": 33, "question": "A prudent grain elevator owner would use the commodity derivatives market to obtain protection against", "statements": [], "options": {"A": "a decrease in price before purchasing the maize.", "B": "a decrease in price during its maize holding period.", "C": "an increase in price during its maize holding period.", "D": "an increase in price after selling the maize."}, "answer": "B", "uitleg": "Die boek noem 'merchandisers, elevators' as hedgers wat beskerming nodig het teen laer pryse gedurende hul mielie-houperiode. Hulle besit die voorraad (long physical), so 'n prysdaling is die risiko. 'n Prysstyging tydens die houperiode is juis voordelig vir hulle.", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "The book lists 'merchandisers, elevators' as hedgers who need protection against lower prices during their maize holding period. They own the stock (long physical), so a price drop is their risk. A price rise during the holding period actually benefits them.", "note_en": null}, {"paper": "P3", "n": 34, "question": "Which of the following are an objective of hedging using a commodity futures contract?", "statements": ["(i) Protecting profit margins.", "(ii) Locking in certain cash flows.", "(iii) Increase exposure to the commodity.", "(iv) Diversification of one's overall position."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek lys redes vir hedging: protect profit margins, stabilise (lock in) cash flows, transfer risk, diversify en improve liquidity. 'Increase exposure to the commodity' is spekulasie, nie hedging nie - hedging verminder blootstelling.", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "The book lists reasons for hedging: protect profit margins, stabilise (lock in) cash flows, transfer risk, diversify and improve liquidity. 'Increase exposure to the commodity' is speculation, not hedging - hedging reduces exposure.", "note_en": null}, {"paper": "P3", "n": 35, "question": "A long hedge may be defined as taking a", "statements": [], "options": {"A": "short position in the futures contract to hedge an existing short position.", "B": "short position in the futures contract to hedge an existing long position.", "C": "long position in the futures contract to hedge an existing short physical position.", "D": "long position in the futures contract to hedge an existing long position."}, "answer": "C", "uitleg": "'n Long (buying) hedge: iemand wat die produk nodig het (bv. 'n meulenaar) is 'short' in die fisiese mark en koop futures (long) om teen stygende pryse te beskerm. B is die definisie van 'n short hedge.", "book_ref": "7.1.2, p.142-143", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "A long (buying) hedge: someone who needs the product (e.g. a miller) is 'short' in the physical market. He buys futures (goes long) to protect himself against rising prices. B is the definition of a short hedge.", "note_en": null}, {"paper": "P3", "n": 36, "question": "Baker John Motsepe from Bela Bela is concerned that the price of wheat may rise due to poor crop conditions experienced in America and in Australia. He would like to hedge his exposure to 2 000 tons of wheat that he will need during December. He phones his broker and instructs him to buy (go long) 40 December wheat contracts at R2 000/ton. Brokerage also amounts to R5/t per trade. Location differential and handling fees for Bela Bela amount to R100/ton and this basis (which is R100 'under') also remains constant. During December, baker Motsepe exits his entire futures position by offsetting at the new futures price of R1 600/ton and buys the wheat in the spot market. If the basis remains constant, his cash flow position will be as per the table. Should the basis strengthen by R15 per ton in December, the total net cash flow for Baker Motsepe will change to", "statements": [], "options": {"A": "-R3 850 000", "B": "-R3 830 000", "C": "-R3 820 000", "D": "-R3 790 000"}, "answer": "A", "uitleg": "Long hedge: effective price paid = F1 + B2 + brokerage. Konstante basis: 2 000 - 100 + 2×5 = R1 910/t → -R3 820 000 (dis opsie C, die tabel se bedrag). Basis versterk met R15 → B2 = -85: 2 000 - 85 + 10 = R1 925/t × 2 000 t = -R3 850 000. Die boek: 'n versterking van die basis is ongunstig vir die long hedger (short the basis), dus betaal hy meer, nie minder nie (D gaan verkeerdelik die ander kant toe).", "book_ref": "4.7, p.70; 7.1.2, p.142", "topic": "Basis & hedging", "note": "Die memo het D gesê, maar volgens die handboek is A reg.", "data": null, "uitleg_en": "Long hedge: effective price paid = F1 + B2 + brokerage. With a constant basis: 2 000 - 100 + 2×5 = R1 910/t, giving -R3 820 000 (that is option C, the amount in the table). If the basis strengthens by R15, B2 = -85: 2 000 - 85 + 10 = R1 925/t × 2 000 t = -R3 850 000. The book says a strengthening basis is unfavourable for the long hedger (who is short the basis), so he pays more, not less. D wrongly moves in the other direction.", "note_en": "The memo gave D, but according to the textbook A is correct."}, {"paper": "P3", "n": 37, "question": "A farmer knows that he needs to receive at least R850/ton of maize when he harvests his crop in 3 months' time. He is of the opinion that maize prices will drop over the next few months and wishes to lock in the price at which he may sell his produce. He is convinced that an option would be a better hedging instrument than a futures contract. Which ONE of the following statements makes the most sense? The farmer should take a", "statements": [], "options": {"A": "long call position which will have limited downside potential, as opposed to a future's unlimited downside potential.", "B": "short call position where he will receive the option premium upfront in order to supplement his profits.", "C": "long put position which will provide limited downside potential as opposed to a future's unlimited downside potential.", "D": "short put position where he will receive the option premium upfront in order to supplement his profits."}, "answer": "C", "uitleg": "Die boer is bang vir dalende pryse en wil 'n vloerprys vasmaak: hy koop 'n put (long put). Sy maksimum verlies is die premie, terwyl hy steeds voordeel trek as pryse styg. 'n Short call/short put gee net premie-inkomste en geen vloer teen 'n groot prysdaling nie.", "book_ref": "7.1.5, p.156; 6.2 p.100", "topic": "Option strategies", "note": null, "data": null, "uitleg_en": "The farmer is afraid of falling prices and wants to lock in a floor price. So he buys a put (long put). His maximum loss is the premium, and he still benefits if prices rise. A short call or short put only gives premium income and no floor against a big price drop.", "note_en": null}, {"paper": "P3", "n": 38, "question": "Which of the following is true about spread trading in commodity futures?", "statements": [], "options": {"A": "An intra-market spread requires slightly more initial margin than an outright futures contract.", "B": "Spreads, in general, trend more often than outright futures.", "C": "Spreads contain more risk than is the case with outright futures positions.", "D": "Buying the spread implies a long position in the near crop combined with a short position in the far crop."}, "answer": "B", "uitleg": "Uitskakeling volgens die boek: spreads vereis minder initial margin (A vals), bevat minder risiko as outright futures (C vals), en 'buying the spread' = long far crop en short near crop (D is omgekeerd). B bly oor; dat spreads meer dikwels 'trend' word nie in die boek gestel nie, maar is 'n bekende voordeel in spread-literatuur.", "bo
