e primêre doel van 'n futures market is 'n doeltreffende meganisme vir price risk management (en price discovery), nie 'n platform vir spekulante nie.", "book_ref": "2.6 Self-test quiz, p.29", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-1", "question": "Forward contracts are marked to market on a daily basis.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Futures contracts word daagliks marked to market; forwards is OTC-kontrakte wat eers op vervaldatum vereffen word.", "book_ref": "3 Self-test quiz, p.38", "topic": "Forwards", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-3", "question": "The cost of carry includes both storage cost and convenience yields.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Carry costs = cost of funds + storage cost - convenience yield, dus is albei deel van die cost of carry.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-4", "question": "Financing cost is seen as a cost of carry.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Carrying costs sluit storage, insurance, transport en financing costs in.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-5", "question": "Time value of money is ignored in determining forward prices.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die tyd tot vervaldatum is deel van die berekening: F0 = (S0+U)(1+i/f)^(n·f), dus word die toekomstige waarde saamgestel.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-1", "question": "Basis can be affected by:", "statements": [], "options": {"A": "Storage and transportation costs", "B": "Local supply and demand", "C": "Quality", "D": "All of the above"}, "answer": "D", "uitleg": "Al die faktore beïnvloed basis (spot price - futures price): stoor- en vervoerkoste, plaaslike vraag en aanbod, en kwaliteit.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-2", "question": "Agricultural futures markets participants include:", "statements": [], "options": {"A": "Commodity sellers", "B": "Commodity buyers", "C": "Speculators", "D": "All of the above"}, "answer": "D", "uitleg": "Kopers, verkopers (hedgers) en spekulante neem almal deel; arbitrage traders is ook deel van die markdeelnemers.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-3", "question": "Hedgers include:", "statements": [], "options": {"A": "Commodity buyers who want to protect against the risk of higher prices", "B": "Commodity sellers who want to protect against the risk of higher prices", "C": "Speculators seeking to make a profit", "D": "Both A and B"}, "answer": "A", "uitleg": "Kopers hedge teen hoër pryse. Verkopers wil hulle teen laer pryse (nie hoër nie) beskerm, so B is verkeerd en daarom ook D; spekulante het nie fisiese voorraad nie.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-4", "question": "Which of the following is FALSE:", "statements": [], "options": {"A": "The objective of speculators is to make a profit.", "B": "Speculators add liquidity to the marketplace.", "C": "Speculators buy or sell futures to offset their spot market exposure.", "D": "Although it mimics the dollar price of gold, the rand price of a gold quanto future traded on JSE CDM is not affected by the rand-dollar exchange rate."}, "answer": "C", "uitleg": "Spekulante het nie, en beoog ook nie, fisiese voorraad nie, so hulle het geen spot market exposure om t arket, but to make physical delivery on the futures contract. Do you...", "statements": [], "options": {"A": "Deliver the maize to the JSE in Johannesburg and wait around for the JSE to pay you for your maize?", "B": "Inform your JSE CDM member to arrange for a transporter to come and collect the maize at your farm?", "C": "Deliver the maize to any silo and inform your broker as to the location thereof?", "D": "Deliver your maize to a JSE approved delivery station, request a silo receipt, notify your JSE CDM member accordingly and follow the designated procedure?"}, "answer": "D", "uitleg": "Aflewering gebeur by 'n JSE-goedgekeurde delivery station (silo): jy vra 'n silo receipt, stel jou JSE CDM member in kennis en volg die voorgeskrewe prosedure. Enige silo is nie goed genoeg nie.", "book_ref": "4.13 Self-test quiz, p.88", "topic": "Delivery", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-8", "question": "Which one of the following is true?", "statements": [], "options": {"A": "SA farmers can hedge against sharp rises in fuel prices by selling foreign referenced crude oil futures listed on the JSE.", "B": "The minimum contract size for a NYMEX crude oil futures contract listed on the JSE CDM is 1,000 US barrels.", "C": "The minimum contract size for a COMEX gold futures contract listed on the JSE CDM is 10 troy ounces.", "D": "The US corn contract listed on the JSE CDM has to be cash settled in US dollars."}, "answer": "C", "uitleg": "Goud (en platinum) op die JSE CDM: 1 kontrak = 10 troy ounces. A is verkeerd (teen stygende brandstofpryse koop jy, nie verkoop nie); B: die JSE-kontrak is 100 barrels (1 000 is New York); D: dit word in rand vereffen.", "book_ref": "4.13 Self-test quiz, p.88", "topic": "Futures basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch5-1", "question": "A swap is an agreement between two companies/individuals to exchange commodities in the future.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n Swap ruil kontantvloeie (cash flows) in die toekoms uit, nie die kommoditeit self nie; commodity swaps word altyd kontant vereffen.", "book_ref": "5.8 Self-test quiz, p.96", "topic": "Swaps", "note": null, "data": null}, {"paper": "BOOK", "n": "ch5-2", "question": "Large South African grain-consuming companies commonly use commodity swaps.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Groot graanverbruikers verkies fixed-price delivery contracts bo cash-settling swaps.", "book_ref": "5.8 Self-test quiz, p.97", "topic": "Swaps", "note": null, "data": null}, {"paper": "BOOK", "n": "ch5-3", "question": "Farmers can utilize swaps as a hedging tool.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. In beginsel kan swaps boere help om prysrisiko te hedge, ook vir bates wat nie op 'n beurs verhandel word nie.", "book_ref": "5.8 Self-test quiz, p.97", "topic": "Swaps", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-1", "question": "A ____ option conveys the right to buy without an obligation.", "statements": [], "options": {"A": "put", "B": "call"}, "answer": "B", "uitleg": "'n Call option gee die reg, maar nie die verpligting nie, om die onderliggende bate te koop.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-2", "question": "A ____ option conveys the right to sell.", "statements": [], "options": {"A": "put", "B": "call"}, "answer": "A", "uitleg": "'n Put option gee die reg, maar nie die verpligting nie, om die onderliggende bate te verkoop.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-3", "question": "If a long put is exercised, a ____ futures is assigned to the option holder.", "statements": [], "options": {"A": "long", "B": "short"}, "answer": "B", "uitleg": "Wanneer 'n put uitgeoefen word, kry die put-koper 'n short futures position (reg om te verkoop) en die skrywer 'n long position.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-4", "question": "If a long call is exercised, a ____ futures is assigned to the option holder.", "statements": [], "options": {"A": "long", "B": "short"}, "answer": "A", "uitleg": "Wanneer 'n call uitgeoefen word, kry die call-koper 'n long futures position en die call-skrywer 'n short futures position.", "book_ref": "6.15 Self-test quiz, p.138-139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-5", "question": "The maximum that a long call holder can gain on his position is the premium.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die premie is die maksimum wat 'n long call holder kan verloor; sy wins is teoreties onbeperk.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-6", "question": "When an in-the-money long call expires the owner of the call option has no further obligation.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n In-the-money opsie word met verval outomaties deur die Exchange uitgeoefen en 'n long futures position word aan die houer toegeken.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-7", "question": "A long put on white maize may be exercised any time until option expiry.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Opsies op die JSE CDM is American-type en kan enige tyd tot die vervaldatum uitgeoefen word.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-8", "question": "During the months of January to March volatility as indicated by the SAVI-White Maize is normally quite low.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Volatiliteit ('vrees') styg juis in die kritieke weermaande Jan-Mrt wanneer opvolgreëns nodig is vir 'n goeie oes.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-1", "question": "You successfully hedged your position against a price rise by trading futures contracts at a level which covered your breakeven buying price and locked in a return on your investment. You close out your position at a price of the futures contract which reflects the expected shortage of maize on the market at around the expiry time of the contracts you traded. The money in your margin account is repaid to you. Your margin account would reflect –", "statements": [], "options": {"A": "Only the initial margin paid by yourself.", "B": "The initial margin paid by yourself plus the variation margin paid into your account by the seller or short position holder.", "C": "The initial margin paid by yourself minus the variation margin paid by yourself into the account of the seller or short position holder.", "D": "That portion of the margin account proportionately representing the movement of the futures price as against the price movement on the actual physical or spot market."}, "answer": "B", "uitleg": "Jy is long (hedge teen prysstyging) en die futures-prys het gestyg, so jou rekening is daagliks met variation margin van die short-houer gekrediteer. Jy kry dus initial margin plus variation margin terug.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-2", "question": "The premise that makes hedging possible is cash and futures prices –", "statements": [], "options": {"A": "move in opposite directions.", "B": "move upward and downward by identical amounts.", "C": "generally, change in the same direction by similar amounts.", "D": "are regulated by the exchange."}, "answer": "C", "uitleg": "Cash- en futures-pryse beweeg oor die algemeen saam op en af, nie noodwendig met presies dieselfde bedrag nie (dis basis risk), maar naby genoeg om met teenoorgestelde posisies te hedge.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-3", "question": "To hedge against an increase in prices, you would –", "statements": [], "options": {"A": "purchase futures contracts.", "B": "sell futures contracts."}, "answer": "A", "uitleg": "Beskerming teen stygende pryse = long hedge: koop futures contracts. Teen dalende pryse verkoop jy futures.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-4", "question": "A farmer's crop is still in the field. Their cash market position is-", "statements": [], "options": {"A": "long", "B": "short", "C": "neither, since the crop hasn't been harvested", "D": "neutral, because they have no position in the futures market"}, "answer": "A", "uitleg": "Die boer is soos iemand wat die oes besit en stoor: hy wen as pryse styg en verloor as dit daal, dus is sy cash position long.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-5", "question": "Arbitrage traders manipulate markets, and this results in mispriced instruments.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Arbitrageurs koop en verkoop in verskillende markte en verseker juis dat wanprysing verdwyn.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-6", "question": "An intermarket spread can be accomplished by going long on futures in one market, and on short futures of the same month in the same market.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n Intermarket spread is long futures in een mark en short futures van dieselfde maand in 'n ANDER mark.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-7", "question": "Assuming that your local physical market price is generally below the value of the authorized futures contract (reference point) and that the basis tends to fluctuate as a result of demand and supply factors in the area where you deliver and because of changes in transportation rates. You have hedged your maize crop by selling futures contracts. Which ONE of the following actions do you follow to maximize your realization if you choose to deliver your maize?", "statements": [], "options": {"A": "You lift your hedge when the basis weakens.", "B": "You lift your hedge when the price in the physical market is at its peak.", "C": "You do not worry about the basis because once you have hedged as it makes no difference.", "D": "You lift your hedge when the basis strengthens."}, "answer": "D", "uitleg": "'n Short hedger se effektiewe prys = F1 + B2, dus baat hy as die basis versterk (cash price styg relatief tot futures). Lig die hedge wanneer die basis sterk is.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-1", "question": "The directives are binding on all members and officers and employees of members and any person using the services of member or who concludes a transaction with a member in the course of that member's JSE regulated activities.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die directives bind net trading members, hul officers en employees. Die rules (nie directives nie) bind ook persone wat 'n member se dienste gebruik of met hom transaksies sluit.", "book_ref": "8.18 Self-test quiz, p.190; 8.1 p.173", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-3", "question": "The Market Controller is responsible for identifying the origin and the accuracy, integrity, and validity of all data submitted to the JSE trading system by or on behalf of that trading member.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die trading member self is verantwoordelik vir die oorsprong, akkuraatheid, integriteit en geldigheid van data wat deur of namens hom in die JSE trading system ingevoer word.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-4", "question": "Who may reduce or extend the hours of operation of the JSE trading system for any particular business day?", "statements": [], "options": {"A": "Market Controller", "B": "JSE Executive", "C": "Director: Market Regulation"}, "answer": "B", "uitleg": "Die JSE Executive mag die bedryfsure van die JSE trading system vir 'n spesifieke besigheidsdag verkort of verleng.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-5", "question": "Insider trading offences only apply to transactions in listed companies and therefore exclude transactions in agricultural product securities.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Insider trading offences geld vir enige transaksies in securities wat op 'n regulated market genoteer is, insluitend agricultural product securities.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-6", "question": "Who may declare a trading halt in an agricultural product security?", "statements": [], "options": {"A": "Chief Executive Officer, in conjunction with the JSE Executive", "B": "The Market Controller, in conjunction with the Director: Market Regulation", "C": "The Director: Market Regulation, in conjunction with the Chief Executive Officer"}, "answer": "C", "uitleg": "Die Director: Market Regulation, saam met die Chief Executive Officer, mag 'n trading halt in 'n agricultural product security verklaar.", "book_ref": "8.18 Self-test quiz, p.191", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-9", "question": "The CDM operates on every calendar day.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die CDM werk op elke business day, nie elke kalenderdag nie.", "book_ref": "8.18 Self-test quiz, p.191", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch9-1", "question": "Fundamental analysis is rooted in the basic premise that:", "statements": [], "options": {"A": "Price behaviour in the financial markets is random.", "B": "Price behaviour in the financial markets moves in trends", "C": "Price behaviour in the financial markets can only be understood by analysis of the underlying economic conditions surrounding the markets.", "D": "Price behaviour in the financial markets is cyclically based."}, "answer": "C", "uitleg": "Fundamental analysis glo pryse kan net verstaan word deur die onderliggende ekonomiese toestande te ontleed (top-down: ekonomie, bedryf, kommoditeit). 'Pryse beweeg in trends' (B) is 'n aanname van technical analysis.", "book_ref": "9.4 Self-test quiz, p.202", "topic": "Other", "note": null, "data": null}, {"paper": "BOOK", "n": "ch9-3", "question": "All commodity prices are equally sensitive to changes in demand as to changes in supply.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Sommige markte is meer sensitief vir aanbodfaktore, ander reageer meer op vraagveranderinge.", "book_ref": "9.4 Self-test quiz, p.203", "topic": "Other", "note": null, "data": null}, {"paper": "BOOK", "n": "ch9-5", "question": "Import parity prices reflect the lowest / highest level of the South African domestic price.", "statements": [], "options": {"A": "lowest", "B": "highest"}, "answer": "B", "uitleg": "Import parity is die internasionale prys plus alle koste om in te voer. Plaaslike pryse styg selde daarbo, want meulenaars voer dan eerder in. Import parity is dus die plafon (highest), en export parity is die vloer (lowest).", "book_ref": "9.4 Self-test quiz, p.203; cf. p.76, 9.1.1 p.198", "topic": "Physical market", "note": "Die boek se self-toets sê 'lowest', maar die boek se teks (p.76 en p.198) sê import parity is die maksimum prys.", "data": null}, {"paper": "BOOK", "n": "exam-1", "question": "On average, how much grain can be produced for each millimetre of water consumed?", "statements": [], "options": {"A": "10kg", "B": "15kg", "C": "20kg", "D": "25kg"}, "answer": "B", "uitleg": "Volgens die boek kan gemiddeld ongeveer 15 kg graan geproduseer word vir elke millimeter water wat verbruik word (mielies benodig 450-600 mm per seisoen).", "book_ref": "Exam Q1 p.204, answers p.208; 1.x p.8", "topic": "Physical market", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-2", "question": "Which of the following statements regarding the futures market and formal futures exchanges are correct?", "statements": ["i. Futures markets trade futures contracts where the commodity, quality, quantity, location and delivery period are customised.", "ii. Futures markets trade futures contracts where the commodity, quality, quantity, location and delivery period are standardised.", "iii. Commitments to make or accept delivery can be offset against each other so that actual physical delivery of the underlying does not take place.", "iv. Commitments to make or accept delivery may not be offset against each other and actual physical delivery of the underlying must take place."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Futures contracts is gestandaardiseer (commodity, quality, quantity, location en delivery period), nie customised nie, dus (ii). Verpligtinge kan teen mekaar ge-offset word, sodat fisiese aflewering meestal nie plaasvind nie, dus (iii).", "book_ref": "Exam Q2 p.204, answers p.208; 2.2 p.26", "topic": "Futures basics", "note": "Die boek se memo (p.208) sê A, maar dit weerspreek die boek se eie teks in 2.2. C is reg.", "data": null}, {"paper": "BOOK", "n": "exam-3", "question": "Which of the following is considered an advantage of forward contracts?", "statements": [], "options": {"A": "Because prices are locked in buyers can benefit from a sudden fall in prices", "B": "There is no default risk.", "C": "For the seller, income is deferred until delivery.", "D": "Contracts are flexible in terms of the size, quality and delivery time."}, "answer": "D", "uitleg": "Forwards is buigsaam wat grootte, kwaliteit en afleweringstyd betref. A is verkeerd (ingeslote pryse beteken kopers kan NIE baat by 'n prysdaling nie), B (default risk bestaan wel) en C is nadele.", "book_ref": "Exam Q3 p.204, answers p.208; 3.1.1-3.1.2 p.31", "topic": "Forwards", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-4", "question": "Calculate the present value of the storage cost on a 9-month forward contract on maize given the following information: Spot maize price R2 500 per ton; Interest rate 12.5% p.a.; Interest accrual quarterly compounded basis; Storage cost R160/ton payable after nine months; Convenience yield 5% of the spot price.", "statements": [], "options": {"A": "R125.00", "B": "R145.89", "C": "R146.49", "D": "R193.75"}, "answer": "B", "uitleg": "PVU = U(1+i/f)^(-n·f) = 160 × (1 + 0.125/4)^(-0.75×4) = 160 × 1.03125^(-3) = 160 / 1.09670 = R145.89. Die spotprys en convenience yield is afleiers.", "book_ref": "Exam Q4 p.205, answers p.208; formula 3.4", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-5", "question": "The first day on which a short position holder may notify the JSE of its intention to deliver the commodity is referred to as:", "statements": [], "options": {"A": "First position day", "B": "First notice day", "C": "First delivery day", "D": "First allocation day"}, "answer": "A", "uitleg": "First position day is die eerste dag waarop die short-houer die JSE van sy voorneme om te lewer in kennis mag stel (4 besigheidsdae voor eerste afleweringsdag, die dag voor first notice day). First notice day is wanneer die delivery notice self ingedien word.", "book_ref": "Exam Q5 p.205, answers p.208; trading calendar p.58", "topic": "Delivery", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-6", "question": "Which of the following statements regarding clearing are correct?", "statements": ["i. Bilateral clearing involves the clearing of transactions by the participants.", "ii. Standard OTC derivatives are usually between two financial institutions and are cleared through the Central Counterparty (CCP).", "iii. In the OTC derivatives market, collateral posted within a transaction is often referred to as margin.", "iv. Non-standard transactions are cleared bilaterally but are subject to regulation on the amount of collateral required."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Al vier stellings kom direk uit die boek: bilateral clearing deur die deelnemers self, standard OTC derivatives deur die CCP, collateral word margin genoem, en non-standard transaksies word bilateraal ge-clear maar met gereguleerde collateral.", "book_ref": "Exam Q6 p.205, answers p.208; 5.x p.91-92", "topic": "Other", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-7", "question": "An option where the holder has the right to purchase at any time during the life of the contract is called an –", "statements": [], "options": {"A": "European call option", "B": "European put option", "C": "American call option", "D": "American put option"}, "answer": "C", "uitleg": "Reg om te koop = call; enige tyd uitoefenbaar = American. European opsies kan net op vervaldatum uitgeoefen word.", "book_ref": "Exam Q7 p.206, answers p.208; 6.1.1 p.99", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-8", "question": "What does this diagram represent? (Diagram: profit on the vertical axis vs asset price at expiry; the line starts high on the left, slopes downward as the price rises, crosses zero and then runs flat below zero to the right.)", "statements": [], "options": {"A": "Basic payoff profile of a long put option", "B": "Basic payoff profile of a short put option", "C": "Basic payoff profile of a long call option", "D": "Basic payoff profile of a short call option"}, "answer": "A", "uitleg": "Wins styg soos die prys daal en die verlies is beperk (plat lyn onder nul = premie betaal) bo die strike. Dit is die payoff van 'n long put.", "book_ref": "Exam Q8 p.206 (diagram), answers p.208", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-9", "question": "Who are the JSE Derivatives Rules binding on?", "statements": ["i. All members.", "ii. All officers of members.", "iii. All employees of members.", "iv. Any person who concludes a transaction with a member during the course of that member's business."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Die rules bind alle trading members, officers en employees, asook enige persoon wat 'n member se dienste gebruik of met hom 'n transaksie sluit. (Die directives bind net members, officers en employees.)", "book_ref": "Exam Q9 p.206, answers p.208; 8.1 p.173", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-10", "question": "Which of the following statements regarding the general requirements of officers of members are correct? An officer -", "statements": ["i. must be of full legal capacity.", "ii. may not be an unrehabilitated insolvent.", "iii. may not have been disqualified by a court from acting as a director of a company.", "iv. must comply with the criteria of good character and integrity, as deemed fit by the JSE."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Rule 3.20 vereis almal: volle regsbevoegdheid, nie 'n ongerehabiliteerde insolvent nie, nie deur 'n hof as direkteur gediskwalifiseer nie, en goeie karakter en integriteit soos die JSE goedvind.", "book_ref": "Exam Q10 p.207, answers p.208; 8.2 rule 3.20 p.173-174", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 1, "question": "Which of the following statements about the maize market in South Africa are correct?", "statements": ["i. In South Africa maize is planted primarily in the months of November and December.", "ii. Maize production in South Africa is largely dominated by yellow maize.", "iii. The amount of money payable to a supplier of physical maize will be decreased by about 1% if the consignment's moisture content is 1 percentage point above 12.5%.", "iv. The grading system for white and yellow maize consists of four major grades each."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "(i) is waar: mielies word hoofsaaklik in November en Desember geplant. (iii) is waar: die prys word met ongeveer 1% aangepas vir elke persentasiepunt vog bo of onder 12.5%. (ii) is vals, want produksie is ongeveer gelyk verdeel tussen wit en geel mielies. (iv) is vals, want daar is drie hoofgrade elk (WM1-3, YM1-3).", "book_ref": "1.2, p.6-7", "topic": "Physical market", "note": null, "data": null}, {"paper": "P1", "n": 2, "question": "For sunflower seed delivered in the physical market, the specification regarding moisture content is a", "statements": [], "options": {"A": "maximum of 10%.", "B": "maximum of 12.5%.", "C": "minimum of 10%.", "D": "minimum of 12.5%."}, "answer": "A", "uitleg": "Die boek sê vir sonneblomsaad: 'The maximum amount of moisture allowed is 10%' (Tabel 3: 9% droog, maksimum 10%). 12.5% is die mielie-standaard, en dit is daarom die strikvraag-opsie.", "book_ref": "1.4.1, p.16; Table 3, p.22", "topic": "Physical market", "note": null, "data": null}, {"paper": "P1", "n": 3, "question": "Which of the following statements about the South African wheat market are correct?", "statements": ["i. Wheat is generally harvested during November, December and January.", "ii. Currently the South Western Cape is the main wheat producing area in South Africa.", "iii. The harder wheat class tends to have a lower protein content than softer wheat and is more suitable for biscuits than for bread.", "iv. Wheat has much the same storage and perishability qualities as maize."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "(i) is waar, want koring word van November tot Januarie geoes. (iv) is woordeliks uit die boek: 'much the same storage and perishability qualities as maize'. (iii) is vals, want harde koring het MEER proteïen en is vir brood. (ii) is lastig: volgens die boek het die Wes-Kaap in 2020 42% geproduseer (die grootste), maar die memo en die meeste antwoorde kies B.", "book_ref": "1.3.1-1.3.3, p.14", "topic": "Physical market", "note": null, "data": null}, {"paper": "P1", "n": 4, "question": "A very important role fulfilled by the agricultural futures markets is to", "statements": ["i. transfer the underlying commodities from one owner to another.", "ii. facilitate price risk management for both sellers and buyers.", "iii. provide speculators with high levels of profits in the market.", "iv. enhance price discovery in the market."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "D", "uitleg": "Die primêre doel van termynmarkte is 'n doeltreffende meganisme vir price risk management (hedging), en hulle speel 'n aktiewe rol in price determination/transparency (price discovery). Hulle is nie bedoel om eienaarskap oor te dra nie; die self-test sê ook spesifiek dat die doel nie is om spekulante 'n platform te gee nie.", "book_ref": "2.4, p.27; 2.6 self-test, p.29", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "P1", "n": 5, "question": "The prerequisites for successful trading in agricultural futures and options contracts include the fact that any such underlying commodity should", "statements": [], "options": {"A": "always be available for visible inspection by the buyer.", "B": "be a heterogeneous commodity.", "C": "not easily trade in the cash or spot market.", "D": "be exposed to frequent price variation."}, "answer": "D", "uitleg": "Die boek lys: homogeen en graderbaar (dus nie heterogeen nie), stoorbaar en vervoerbaar, 'n goed funksionerende cash market, en 'exposed to frequent price variations', want sonder prysrisiko is daar geen behoefte aan hedging nie. Standaardisering beteken juis dat kopers die produk NIE hoef te sien nie.", "book_ref": "2.5, p.28", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "P1", "n": 6, "question": "Which of the following are considered disadvantages of forward contracts?", "statements": ["i. Because the price is fixed the farmer is excluded from the benefits of a market rally.", "ii. Such contracts cannot be easily unwound by settling in cash before the delivery date.", "iii. Buyer cannot estimate cash flow before delivery as profits and losses are realised daily.", "iv. If production is less than anticipated the buyer may be unable to pay the seller."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "(i) staan in die boek se lys van nadele. (ii) klop met Tabel 4.1: by forwards is 'no closing possible before maturity'. (iii) beskryf futures (daily MTM), nie forwards nie; forwards het selde kontantvloei voor aflewering. (iv) meng twee risiko's deurmekaar: swak produksie is die produsent se nie-leweringsrisiko, nie die koper se onvermoë om te betaal nie. Net A sluit (iii) uit.", "book_ref": "3.1.2, p.31; Table 4.1, p.42-43", "topic": "Forwards", "note": null, "data": null}, {"paper": "P1", "n": 7, "question": "If the spot price of maize is R1 150 per ton; the interest rate is 6.5% per annum, quarterly compounded; storage cost is R69 per ton payable after 9 months; and the convenience yield is 2.75% of the spot price, the 9-month forward price of a maize contract will be", "statements": [], "options": {"A": "R1 249.85 per ton.", "B": "R1 250.26 per ton.", "C": "R1 274.62 per ton.", "D": "R1 275.98 per ton."}, "answer": "B", "uitleg": "Formule 3.5: F0 = (S0 + PV(U))(1 + (i-y)/f)^(nf). PV(U) = 69 x (1 + 0.065/4)^-3 = R65.74. F0 = (1150 + 65.74) x (1 + (0.065 - 0.0275)/4)^3 = 1215.74 x 1.02840 = R1 250.26. D (R1 275.98) is die strik: dit ignoreer die convenience yield.", "book_ref": "3.2, formulas 3.4-3.5, p.35-36", "topic": "Forwards", "note": null, "data": null}, {"paper": "P1", "n": 8, "question": "Which of the following attributes constitute the characteristics of agricultural futures contracts?", "statements": ["i. They are standardised, transferable, exchange traded instruments.", "ii. The risk is shared equally by buyers and sellers.", "iii. In a futures contract the seller has an obligation to take delivery of the product.", "iv. In principle, futures contracts are also forward contracts."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek: 'standardised, transferable, exchange-traded contract'. Die risiko is simmetries, want wins en verlies is gelyk en teenoorgesteld (zero-sum). 'Futures contracts are also forward contracts' in beginsel. (iii) is vals: die verkoper (short) moet LEWER (make delivery); die koper neem lewering.", "book_ref": "4.1.1 & 4.1.3, p.40-41", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P1", "n": 9, "question": "In the agricultural commodities market, futures contracts specifically differ from forward contracts in the sense that", "statements": ["i. forward contracts are not guaranteed but futures are.", "ii. the price of a futures contract is negotiated between buyer and seller.", "iii. a forward contract usually settles through physical delivery of the product while most futures are cash settled.", "iv. the buying party in a futures contract is usually known to the selling party, which is not the case with forwards."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Volgens Tabel 4.1 het forwards geen waarborg nie, terwyl futures deur die clearinghouse gewaarborg word, en forwards eindig gewoonlik met fisiese aflewering terwyl futures meestal voor verstryking uitgeskakel word. (ii) en (iv) is omgekeerd: forward-pryse word privaat onderhandel, en by forwards ken die partye mekaar (by futures nie).", "book_ref": "4.2, Table 4.1, p.42-43", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P1", "n": 10, "question": "A large bread baker wants to hedge his future input costs and enters into a wheat futures contract at R2 600 per ton. He would typically enter into a", "statements": [], "options": {"A": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "B": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "C": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton.", "D": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton."}, "answer": "D", "uitleg": "'n Bakker wil hom teen stygende insetkoste beskerm en neem dus 'n long position (koop futures). 'n Long position maak wins as die prys styg: by R2 700 is die wins R100/ton op die termynmark.", "book_ref": "4.3 & 3.1, p.30, 43", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 11, "question": "Which of the following statements about price discovery in the agricultural markets are correct?", "statements": ["i. For wheat the old-crop/new-crop price spread is represented by the price difference between the September and December futures contracts.", "ii. For maize the old-crop/new-crop price spread is represented by the price difference between the May and July futures contracts.", "iii. To avoid large swings in contract prices the JSE has introduced daily price limits for each commodity except for the spot month contract.", "iv. In order to prevent excessive price fluctuations, the price limits for each commodity on the JSE remain unchanged for the duration of an entire season."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Die boek: vir koring is die old-crop/new-crop spread September teenoor Desember, en vir mielies Maart teenoor Mei (nie Mei/Julie nie). Prysperke geld vir alle hedging months 'excluding the spot month'. (iv) is vals, want extended limits (150%) kan geaktiveer word en perke verander van tyd tot tyd.", "book_ref": "4.4, p.47; 8.14, p.182-183", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "P1", "n": 12, "question": "In terms of futures contracts listed on SAFEX, the fact that maize is physically deliverable at expiry means that", "statements": [], "options": {"A": "a specific quantity of maize will be delivered to the JSE.", "B": "a specific quantity of maize will be available in a JSE approved silo.", "C": "a futures position in the July contract can be delivered against from the second last business day in June.", "D": "the producer guarantees the quality of his maize in a JSE approved silo."}, "answer": "B", "uitleg": "Fisiese aflewering beteken nie dat mielies na die JSE gery word nie; 'n JSE silo receipt verteenwoordig 'n spesifieke hoeveelheid in 'n geregistreerde silo. C is vals, want die Julie-kontrak kan net in Julie gelewer word. D is vals, want die storage operator (nie die produsent nie) waarborg kwaliteit en hoeveelheid.", "book_ref": "4.5, p.50", "topic": "Delivery", "note": null, "data": null}, {"paper": "P1", "n": 13, "question": "Which of the following statements with regard to the various ways in which physical delivery for grain can be executed on the JSE are correct?", "statements": ["i. Market participants wishing to exchange a short futures position for a spot position would buy an Exchange for Physical transaction.", "ii. An Exchange for Physical transaction is agreed upon off-exchange but is reported in writing to the JSE.", "iii. All deliveries flagged as an Exchange for Physical transaction are made available for auction on the silo receipt basis premium platform.", "iv. Silo receipt auction bids for a registered delivery point at a preferred premium are only permitted if the physical grain is on offer."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Die miller met 'n long future VERKOOP 'n EFP; die boer met die short future KOOP die EFP, dus is (i) waar. 'n EFP word privaat (off-exchange) onderhandel en daarna by die JSE aangemeld, dus is (ii) waar. (iii) is omgekeerd: deliveries wat NIE as EFP gemerk is nie, gaan na die basis premium platform. (iv) is vals, want enige geregistreerde kliënt mag 'n premie bie of aanbied.", "book_ref": "4.5 (i)-(ii), p.51-52; 8.11, p.181", "topic": "Delivery", "note": null, "data": null}, {"paper": "P1", "n": 14, "question": "In the case of illiquid contracts, the marked-to-market (MTM) price will be decided using a random sample in the last 5 minutes of trade. The bid will be used as the MTM price if the bid is", "statements": [], "options": {"A": "higher than the average traded price.", "B": "lower than the average traded price.", "C": "higher than the last traded price.", "D": "lower than the last traded price."}, "answer": "C", "uitleg": "Die boek: 'If the bid is higher than the last traded price, the bid will be used as the MTM price', en 'n offer laer as die laaste transaksie word gebruik. 'Average traded price' (VWAP) geld net vir liquid contracts.", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "P1", "n": 16, "question": "On SAFEX, the first day on which a holder of a short future may notify the JSE of his intention to deliver the commodity is known as the first", "statements": [], "options": {"A": "position day.", "B": "notice day.", "C": "delivery day.", "D": "intent day."}, "answer": "A", "uitleg": "Die boek definieer 'First position day' as die eerste dag waarop die short position holder die JSE in kennis mag stel van sy voorneme om te lewer (4 besigheidsdae voor die eerste delivery day). First notice day is die dag waarop die delivery notice self ingedien word; die self-test bevestig A.", "book_ref": "4.5 trading calendar, p.58; self-test Q5, p.205-206", "topic": "Delivery", "note": null, "data": null}, {"paper": "P1", "n": 17, "question": "Which of the following statements about futures contract specifications are correct?", "statements": ["i. The standard contract size for yellow maize is 100 metric tons.", "ii. The underlying commodity for WOPT contracts is second grade white maize from any origin.", "iii. Physical delivery on wheat futures contracts can take place on any day from the first business day to last business day of an expiry month.", "iv. A constant month contract for wheat is introduced 40 business days preceding a non-standard hedging month."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "YMAZ is 100 ton. WOPT is wit mielies van enige oorsprong, graad WM2 of beter. Constant month-kontrakte vir koring word 40 besigheidsdae voor die nuwe maand ingestel. Volgens die trading calendar is die first delivery day die eerste en die last delivery day die laaste besigheidsdag van die maand, dus is (iii) waar en is D (almal) die antwoord.", "book_ref": "4.5 p.58; Table 4.9, p.64-66", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P1", "n": 18, "question": "On 20 March (t1) miller John buys July maize futures at R1 850 per ton when the spot price of maize is R1 800 per ton. On 8 April (t2) the maize spot price moves to R1 810 while the July futures price changes to R1 855. The basis on 8 April is", "statements": [], "options": {"A": "R50 per ton \"under\".", "B": "R50 per ton \"over\".", "C": "R45 per ton \"under\".", "D": "R45 per ton \"over\"."}, "answer": "C", "uitleg": "Basis = spot - futures = 1 810 - 1 855 = -R45, dus R45 'under' (negatief = under). R50 under was die basis op t1 (1 800 - 1 850).", "book_ref": "4.7, p.69", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 19, "question": "A participant who sells a futures contract is said to be ___?___ the basis and will benefit if the basis ___?___.", "statements": [], "options": {"A": "short; weakens", "B": "short; strengthens", "C": "long; strengthens", "D": "long; weakens"}, "answer": "C", "uitleg": "Die boek: die short hedger (verkoper van futures) is 'long the basis', en 'a strengthening of the basis is profitable to the short hedger'. Effektiewe prys = F1 + B2, dus hoe sterker B2, hoe meer ontvang hy. A is verkeerd: dit is die long hedger wat 'short the basis' is en baat as die basis verswak.", "book_ref": "4.7, p.70-71; 4.7.2 p.74", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null}, {"paper": "P1", "n": 20, "question": "On 20 July (t1) miller John buys December wheat futures at R2 970 per ton when the spot price of wheat is R2 905 per ton. On 18 August (t2) the wheat spot price hits R2 900 per ton with the December futures price at R2 975. If he closes out his futures position on 18 August, what will John effectively pay for his wheat?", "statements": [], "options": {"A": "R2 895 per ton", "B": "R3 045 per ton", "C": "R2 910 per ton", "D": "R2 975 per ton"}, "answer": "A", "uitleg": "Effektiewe prys met long hedge = F1 + B2 = 2 970 + (2 900 - 2 975) = 2 970 - 75 = R2 895. Kontrole: hy koop spot teen R2 900 en verdien R5 op futures (2 975 - 2 970), dus netto R2 895.", "book_ref": "4.7, p.70", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 21, "question": "Which ONE of the following statements correctly reflects the characteristics of the local spot price of maize?", "statements": [], "options": {"A": "It should be the same in Randfontein as in Pretoria West.", "B": "It reflects the SAFEX futures price in the delivery month.", "C": "It should normally be higher than the import parity price.", "D": "It is largely dictated by silo owners who control the supply."}, "answer": "B", "uitleg": "Die boek definieer die spot price as die prys van die futures contract in die delivery month ('JSE CDM futures prices are the true market or spot prices for every delivery month'). Pryse verskil per ligging weens location differentials, dus is A vals. Import parity is 'n maksimum, dus is C vals.", "book_ref": "4.8, p.75-76", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "P1", "n": 22, "question": "The time intervals on which the cash flows in commodity swaps are based are known as", "statements": [], "options": {"A": "value periods.", "B": "principal interims.", "C": "reference intervals.", "D": "reset periods."}, "answer": "D", "uitleg": "Die boek: 'These intervals are called reset periods and can vary between one and six months, with quarterly resets the most common.'", "book_ref": "5.2, p.89", "topic": "Swaps", "note": null, "data": null}, {"paper": "P1", "n": 23, "question": "Which ONE of the following statements with regard to commodity swaps is correct?", "statements": [], "options": {"A": "A swap may be seen as a series of physical settled futures contracts for a specific commodity.", "B": "According to international accounting standards, the cash flows in commodity swaps need not be recorded in financial statements.", "C": "Commodity swaps are very popular hedging instruments for South African producers and users.", "D": "The basic principle in pricing a swap is that the swap must have zero value at inception."}, "answer": "D", "uitleg": "Die boek: 'The basic principle in pricing a swap is that the swap must have zero value at inception.' A is vals, want 'n swap is 'n reeks CASH-settling forwards. C is vals, want swaps is 'not very common in the local market' (net wêreldwyd gewild). B (P2-weergawe) is vals, want IFRS vereis dat sulke derivate teen billike waarde op die balansstaat gedra word.", "book_ref": "5.2, p.89; 5.3, p.91; 5.6-5.7, p.93-94", "topic": "Swaps", "note": null, "data": null}, {"paper": "P1", "n": 24, "question": "An investor who bought the right, but not the obligation, to sell an agricultural future at a specified price on a specified date in the future, is referred to as the", "statements": [], "options": {"A": "holder of a call option.", "B": "holder of a put option.", "C": "writer of a call option.", "D": "writer of a put option."}, "answer": "B", "uitleg": "Die reg (nie die verpligting nie) om te VERKOOP is 'n put option, en wie dit koop is die holder (long put). Die writer verkoop die opsie en het die verpligting.", "book_ref": "6.3, p.101", "topic": "Options basics", "note": null, "data": null}, {"paper": "P1", "n": 26, "question": "An investor has taken a long position in an OTM (out-the-money) call option in the December white maize future. What will happen to the option's value if the price of the future decreases?", "statements": [], "options": {"A": "Increase, as the option moves closer to being ITM (in-the-money)", "B": "Increase, as the option moves further OTM", "C": "Decrease, as the option moves closer to being ITM", "D": "Decrease, as the option moves further OTM"}, "answer": "D", "uitleg": "'n Call se waarde is positief verwant aan die futures-prys. As die futures-prys daal, beweeg 'n OTM call nog verder OTM (strike nog verder bo die prys), die kans om ITM te eindig daal en die premie daal. A en B is verkeerd want 'n call se waarde styg nie as die prys daal nie; C is verkeerd want 'n call beweeg weg van ITM as die prys daal.", "book_ref": "6.5, p.108-109; 6.7(i), p.113", "topic": "Options basics", "note": null, "data": null}, {"paper": "P1", "n": 27, "question": "An investor buys a put option on the December white maize contract with a strike price of R850 for R50 per contract. Assuming that the current price for the futures contract is R880, what would the time value and intrinsic value of each option contract be respectively?", "statements": [], "options": {"A": "Time value will be R50 and intrinsic value will be R0", "B": "Time value will be R30 and intrinsic value will be R20", "C": "Time value will be R20 and intrinsic value will be R30", "D": "Time value will be R0 and intrinsic value will be R50"}, "answer": "A", "uitleg": "'n Put het net intrinsic value as die futures-prys ONDER die strike is. Intrinsic = max(0; 850 - 880) = R0, dus is die put OTM. Time value = premie - intrinsic = 50 - 0 = R50. Opsie C (R20/R30) gebruik die verskil 880-850 = 30 asof dit 'n call is; dis die lokval.", "book_ref": "6.3, p.101; 6.4.4, p.106; 6.7, p.111", "topic": "Option pricing & greeks", "note": "Die memo het C gesê, maar volgens die handboek is A reg.", "data": null}, {"paper": "P1", "n": 28, "question": "Consider four individual put options with similar characteristics in terms of size, underlying asset and maturity date. If the market price of the underlying asset is R90, then the option that will proportionally gain the most time value if volatility increases, is the one with the following strike price:", "statements": [], "options": {"A": "R80", "B": "R90", "C": "R100", "D": "R110"}, "answer": "A", "uitleg": "Die boek sê 'n ITM opsie se premie reageer min op volatiliteit (10% vol-verandering = ~2% premie), 'n ATM opsie se prys is direk eweredig aan volatiliteit, en 'n OTM opsie se prys word 'merkbaar' deur volatiliteit beïnvloed. Vir 'n put met onderliggende R90 is strike R80 OTM (R100 en R110 is ITM). Proporsioneel (persentasie) wen die OTM put dus die meeste. Lokval: B (R90, ATM) het die grootste time value in absolute rand, maar nie proporsioneel nie.", "book_ref": "6.7(iii), p.113-114", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P1", "n": 29, "question": "A farmer is concerned that the price of white maize will drop around the time he expects to harvest his crop. According to some of the other farmers in the district, the price of white maize will increase dramatically as they expect adverse weather in other countries to result in a supply shortage. Which ONE of the following positions should the farmer enter into if he is to limit his potential losses, but still wants to share in the profits should prices increase? He should take a", "statements": [], "options": {"A": "Short position in a call option", "B": "Short position in a futures contract", "C": "Long position in a put option", "D": "Long position in a futures contract"}, "answer": "C", "uitleg": "'n Long put gee 'n minimum verkoopprys (beskerming teen dalende pryse) en die maksimum verlies is die premie. As pryse styg, laat hy die put verval en verkoop teen die hoër markprys. Die lokval is B (short future): dit beskerm ook teen 'n prysdaling, maar sluit die prys vas sodat hy nie deel in 'n prysstyging nie.", "book_ref": "6.6, p.109-110; 6.1.3", "topic": "Option strategies", "note": null, "data": null}, {"paper": "P1", "n": 33, "question": "Which ONE of the following statements with regard to hedging is correct?", "statements": [], "options": {"A": "A prudent grain exporter would use the commodity derivatives market to obtain protection against lower prices for grain contracted for future delivery but not yet purchased", "B": "A prudent grain importer would use commodity derivatives contracts to obtain protection against a fall in grain prices after he contracted for future delivery but has not yet received the grain", "C": "Hedging the price of your grain crop on the futures market implies that you will always be better off than the farmer next to you who did not hedge", "D": "A prudent grain exporter would use the commodity derivatives market to obtain protection against higher prices for grain contracted for future delivery but not yet purchased"}, "answer": "D", "uitleg": "Die boek: uitvoerders het beskerming nodig teen HOËR pryse vir graan wat hulle reeds kontrakteer het om te lewer maar nog nie gekoop het nie (hulle is short die fisiese graan). A noem verkeerdelik laer pryse. B: invoerders wil voordeel trek uit laer pryse, nie daarteen beskerm nie. C: verskansing beteken nie dat jy altyd beter af is nie (basis risk, verlore opside).", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 34, "question": "Which of the following are an objective of hedging using a commodity futures contract?", "statements": ["i. Protecting profit margins", "ii. Locking in certain cash flows", "iii. Increase exposure to the commodity", "iv. Diversification (of one's overall position)"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek se redes vir verskansing: protect profit margins, stabilize cash flows (lock in certain cash flows), transfer risk, diversify one's overall position, improve liquidity/reduce transaction costs. (iii) is verkeerd: verskansing VERMINDER blootstelling aan die kommoditeit; om blootstelling te verhoog is spekulasie.", "book_ref": "7.1.1, p.141-142", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 35, "question": "A farmer wishes to hedge against a sudden decrease in maize prices using a maize futures contract. Which ONE of the following hedges should he enter into?", "statements": [], "options": {"A": "A long hedge as he is long of maize", "B": "A long hedge because he is short of maize", "C": "A short hedge because he is long of maize", "D": "A short hedge because he is short of maize"}, "answer": "C", "uitleg": "'n Boer besit (of gaan besit) die mielies, dus is hy long in die kontantmark. Om teen 'n prysdaling te beskerm, verkoop hy futures: 'n short (selling) hedge. 'n Long hedge is vir kopers (meulenaars) wat teen stygende pryse beskerm.", "book_ref": "7.1.1, p.142; 7.8 self-test, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 36, "question": "Lady Brown, a maize farmer in Bethlehem, is worried that the good rains will cause the price of white maize to drop and hedges her estimated crop of 1000 tons by shorting ten July maize contracts in February. Her broker manages to do it at a price level of R2000/ton. Brokerage amounts to R5/ton per trade. Assume the area differential to Bethlehem is R110/ton and handling fees amount to R20/ton, implying a basis of R130 'under'. Lady Brown immediately posts an initial margin of R100/ton and pays the brokerage fees. In July she decides to close her futures position by offsetting and selling her maize on the spot market at the new futures price of R1500/ton. If the basis remains constant, her cash flow position will be as per the table. Should the basis strengthen by R20 per ton in July and she manages to harvest the full 1000 tons, the total net cash flow for her entire crop will change to", "statements": [], "options": {"A": "R1 970 000", "B": "R1 880 000", "C": "R1 840 000", "D": "R1 860 000"}, "answer": "B", "uitleg": "Konstante basis: -100 IM -5 + 500 VM (2000-1500) -5 +100 IM terug + spot (1500-130 = 1370) = R1860/t, dus R1 860 000 (opsie D = die oorspronklike tabel). Basis versterk met R20: -130 word -110, spot = 1500-110 = R1390, netto = R1880/t x 1000 = R1 880 000. 'n Short hedger is 'long the basis' en baat by 'n sterker basis. C (R1 840 000) is die antwoord as die basis VERSWAK.", "book_ref": "7.1.4, p.147-154 (Cash flow 1 and 8)", "topic": "Basis & hedging", "note": "Die memo het C gesê, maar volgens die handboek is B reg.", "data": null}, {"paper": "P1", "n": 37, "question": "Farmer Betty wishes to hedge her exposure to the wheat price decreasing over the next 3 months. The best hedging strategy, with the lowest risk, using options, would be which ONE of the following? She should enter into a", "statements": [], "options": {"A": "Short call on the futures contract because she will ultimately receive the premium if the wheat price falls substantially", "B": "Short put on the futures contract because she will ultimately receive the premium if the wheat price falls substantially", "C": "Long call on the futures contract because she will receive the difference between the strike and the market price if the wheat price falls substantially", "D": "Long put on the futures contract because she will receive the difference between the strike and the market price if the wheat price falls substantially"}, "answer": "D", "uitleg": "Produsente wat teen prysdalings wil 'verseker', KOOP puts. As die prys skerp daal, ontvang sy die verskil tussen strike en markprys, en die risiko is beperk tot die premie. A gee net beperkte beskerming (die premie). B is verkeerd: 'n short put VERLOOR as die prys val. C: 'n long call betaal nie uit as die prys daal nie.", "book_ref": "6.6, p.109; 7.1.5", "topic": "Option strategies", "note": null, "data": null}, {"paper": "P1", "n": 38, "question": "Which ONE of the following represents buying an intra-market spread trade?", "statements": [], "options": {"A": "Taking a long position in March contract and shorting the July contract in the same market", "B": "Taking a long position in March contract and shorting the July contract in different markets", "C": "Shorting the March contract and taking a long position in the July contract in the same market", "D": "Shorting the March contract and taking a long position in the July contract in different markets"}, "answer": "C", "uitleg": "'n Intramarket (calendar) spread is tussen twee maande van DIESELFDE kommoditeit. Volgens die plaaslike konvensie beteken 'buying the spread' 'n long posisie in die far crop (Julie) en 'n short posisie in die near crop (Maart). A is 'selling the spread'; B en D is intermarket.", "book_ref": "7.2.1-7.2.2, p.159-160", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P1", "n": 39, "question": "Which ONE of the following statements with regard to delta hedging is correct?", "statements": [], "options": {"A": "The delta of a short call position in maize will rise if the underlying futures price rises", "B": "In order to be delta neutral the short call position holder should sell delta units of the underlying asset", "C": "The delta of an at-the-money call option is around one", "D": "An increase in volatility will affect the delta of an in-the-money option much more than an at-the-money option"}, "answer": "D", "uitleg": "Die boek: volatiliteit beïnvloed die delta van ITM en OTM opsies, maar nie van ATM opsies nie (dié bly ~0.5). A: 'n short call position delta lê tussen -1 en 0 en word meer negatief (daal) as die prys styg. B: 'n short call word verskans deur delta units te KOOP. C: ATM delta is ~0.5, nie 1 nie.", "book_ref": "7.3.2-7.3.3, p.162-163; 7.3.7, p.165", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P1", "n": 40, "question": "Which combination of the following would best describe the usual role of a producer of wheat in the physical market and his associated position in the (wheat) derivatives market?", "statements": ["i. Hedger", "ii. Speculator", "iii. Long the underlying", "iv. Short the underlying"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "In die fisiese mark is 'n koringprodusent 'n hedger: hy is 'naturally long' (hy besit die oes). Die vraag vra egter sy posisie in die derivatemark, en daar gaan hy short: sy eerste hedge-transaksie is om futures te verkoop (boek p.145: 'their first trade will therefore be to go short').", "book_ref": "7.1.1, p.141-142; 7.8 self-test ('farmer's cash market position is long'), p.170", "topic": "Market roles & prerequisites", "note": "Die twee memo's verskil (getikte memo: A, geskandeerde memo: B). Die vraag vra die posisie in die derivatemark, en daar is die produsent short, so B is die beste antwoord. Leer albei kante: fisies long, futures short.", "data": null}, {"paper": "P1", "n": 41, "question": "The purpose of the derivatives rules and directives is to", "statements": [], "options": {"A": "Maximise capital profits for investments in derivatives products", "B": "Contribute to a stable financial market", "C": "Prevent speculative activities", "D": "Promote healthy hedging practices"}, "answer": "B", "uitleg": "Die reëls en direktiewe moet o.a. die doelwitte van die FMA bereik, waarvan een is om by te dra tot die handhawing van 'n stabiele finansiële markomgewing (en fair, efficient, transparent markte). Die ander opsies kom nie in die boek voor nie; spekulasie word nie verbied nie.", "book_ref": "8.1, p.172-173", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 42, "question": "Which of the following will disqualify an officer of a member from registration as a dealer?", "statements": ["i. Being investigated by the SA Reserve Bank", "ii. Having been dismissed from any employment", "iii. Registration as an officer for a competing local exchange", "iv. Registration as an officer for any foreign exchange"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Reël 3.20.1.4: diskwalifiseer o.a. iemand wat 'the subject of a formal investigation by any regulatory or government agency' is (die SARB, dus i) en iemand wat 'dismissed ... from any office or employment' is (ii). Om as officer by 'n ander plaaslike of buitelandse beurs geregistreer te wees, word nêrens gelys nie, so (iii) en (iv) is nie diskwalifikasies nie.", "book_ref": "8.2 (rule 3.20.1.4.5 and 3.20.1.4.9), p.174", "topic": "Regulation & rules", "note": "Die memo het C gesê, maar volgens die handboek is A reg.", "data": null}, {"paper": "P1", "n": 43, "question": "Which ONE of the following statements regarding the Commodity Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "A member may only access the CDM trading system with the approval of the member's compliance officer", "B": "A member guarantees fulfilment of CDM transactions for client accounts only", "C": "The JSE validates all data submitted to the CDM trading system", "D": "Information received on the CDM trading system is deemed to have been submitted with the member's knowledge"}, "answer": "D", "uitleg": "Reël 7.80.1: 'n trading member is gebonde aan alle offers en entries wat in sy naam op die stelsel gemaak word, al was dit nie gemagtig nie. Dit beteken die inligting word geag met die lid se medewete ingedien te wees. A: toegang vereis goedkeuring van die Market Controller, nie die compliance officer nie. C: die trading member (nie die JSE nie) is verantwoordelik vir die akkuraatheid van data (ch.8 self-test).", "book_ref": "8.3 (rule 7.80), p.174-175; 8.18 self-test, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 44, "question": "Which ONE of the following statements regarding the Commodity Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "The JSE Executive may extend the hours of operation of the CDM trading system to a Saturday or Sunday to ensure proper functioning of the market", "B": "The Market Controller may, in case of system failure, declare a transaction executed on the CDM trading system void", "C": "The JSE Executive may halt trading without prior notice to members", "D": "The Market Controller may cease trading on the CDM trading system if trade in the underlying ceases"}, "answer": "C", "uitleg": "Reël 7.90.3.2: die JSE Executive mag 'without prior notice to any person' die stelsel halt of sluit. A: ure kan net vir 'n 'business day' verleng of verkort word, nie Saterdag/Sondag nie. B: die JSE Executive (nie die Market Controller nie) verklaar transaksies void. D: die JSE Executive (nie die Market Controller nie) oorweeg om handel te staak as die onderliggende ophou verhandel.", "book_ref": "8.4-8.5 (rules 7.90.3, 10.30.3), p.175-176", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 45, "question": "Which of the following actions will be LEGAL in terms of insider trading legislation?", "statements": ["i. Mary, the secretary of the National Crop Estimates Committee (NCEC), emails the national crop estimates to her friend, Julie, not realizing that it contains trade sensitive information", "ii. Julie trades on the information for the benefit of a pension fund she advises", "iii. Mary publishes the national crop estimate in the Landbou Weekblad and the website", "iv. Peter, a farmer, trades on the basis of the information obtained from the Landbou Weekblad"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "C", "uitleg": "Die openbaarmakingsmisdryf geld net vir 'n insider 'who KNOWS that he or she has inside information'. Mary besef dit nie, so (i) is nie 'n misdryf nie. (ii) is onwettig: Julie weet die bron is 'n insider, is dus self 'n insider, en handel vir 'n ander persoon. (iii) en (iv): sodra die inligting gepubliseer is, is dit nie meer inside information nie.", "book_ref": "8.6, p.176-178", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 46, "question": "Which of the following actions with regard to agricultural product securities will be ILLEGAL in terms of market abuse legislation?", "statements": ["i. Publish a statement which may be misleading due to the omission of facts", "ii. Entering orders to sell at market prices", "iii. Entering an order to buy during a pre-opening period and cancelling the order immediately prior to the market opening", "iv. Publishing a misleading statement with regard to securities"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "C", "uitleg": "(iii) is uitdruklik 'n manipulative/deceptive trading method (pre-opening order wat net voor opening gekanselleer word). (i) en (iv): misleidende of onvolledige (weglating van feite) verklarings is market abuse (FMA s81 false/misleading statements). Die boek dek dit nie woordeliks nie, maar dit is in die gees van 8.7. (ii) Gewone verkoopsorders teen markpryse is wettig.", "book_ref": "8.7.1 (rule 7.200, 8.7.1.4(a)(iv)), p.179-180", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 47, "question": "Which of the following statements with regard to maintenance of market integrity by the exchange are correct?", "statements": ["i. A transaction that is declared void is binding on the authorised user and the client", "ii. The consent of both the Director of Surveillance and the CEO of the JSE is required before a transaction may be declared void", "iii. A trader may not delete orders from the Commodities derivatives market system during a trading halt", "iv. The JSE may impose daily price and position limits"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "(i) Reg: 'n void-verklaring is bindend op die trading member en die kliënt. (ii) Verkeerd: die JSE Executive (stelselfout) of die Director: Market Regulation alleen mag 'n transaksie void verklaar. 'In conjunction with the CEO' geld vir 'n trading HALT. (iii) Verkeerd: tydens 'n halt mag mens nie handel nie, maar wel orders delete. (iv) Reg: price limits (8.14) en position limits (8.15).", "book_ref": "8.8, p.180-181; 8.14-8.15, p.182-185", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 48, "question": "Which of the following are requirements when a member wishes to trade with or on behalf of a client?", "statements": ["i. The member must register as a financial services provider at the Financial Services Board", "ii. The member must enter into an agreement with the client", "iii. The member must register the client with the JSE", "iv. The member must confirm the client's financial standing"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Reël 7.60: 'n trading member mag nie met of namens 'n kliënt handel nie, tensy die kliënt 'n client agreement met die lid aangegaan het (ii) EN die lid die kliënt by die JSE geregistreer het (iii). (i) en (iv) word nie in die reël vereis nie.", "book_ref": "8.13, p.182", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "P1", "n": 50, "question": "The 'science' of determining whether there is real value in a commodity at a certain price is known as", "statements": [], "options": {"A": "Price analysis", "B": "Technical analysis", "C": "Fundamental analysis", "D": "Demand and supply analysis"}, "answer": "C", "uitleg": "Die boek: 'Fundamental analysis is based more on the fields of economics and accounting where finding real value is the name of the game.' Technical analysis bestudeer prysbewegings en patrone, nie intrinsieke waarde nie.", "book_ref": "9.1, p.192", "topic": "Other", "note": null, "data": null}, {"paper": "P3", "n": 1, "question": "Which of the following statements about the maize market in South Africa are correct?", "statements": ["i. Maize is primarily planted from late May to end August.", "ii. The grading system for white and yellow maize consists of three major grades each.", "iii. The domestic market is strictly regulated because maize is a staple food for many people.", "iv. Genetically modified (GM) maize is increasingly being planted by farmers."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "D", "uitleg": "Mielies word in die somer geplant, hoofsaaklik November en Desember, so (i) is vals. Daar is drie grade elk (WM1-WM3, YM1-YM3) en GM-mielies se aanplanting het dramaties toegeneem, so (ii) en (iv) is waar. Die mieliemark is sedert 1996 volledig gedereguleer, so (iii) is vals.", "book_ref": "1.2.1-1.2.8, pp.6-12", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 2, "question": "Wheat grades are fundamentally determined by the kernels'", "statements": [], "options": {"A": "moisture content and weight.", "B": "protein content and weight.", "C": "moisture content and primary colour.", "D": "protein content and primary colour."}, "answer": "B", "uitleg": "Die boek sê koringgrade word fundamenteel bepaal deur proteïeninhoud en spesifieke gewig (hectolitre mass). Primêre kleur is 'n mielie-graderingskriterium, nie koring nie.", "book_ref": "1.3.1, p.13", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 3, "question": "Which of the following statements about the South African wheat market are correct?", "statements": ["i. Wheat is classified into four classes, A, B, C and D.", "ii. Wheat grades are fundamentally determined by protein content and specific weight.", "iii. As a class, harder wheat has higher protein content than softer wheat and is more suitable for bread than for biscuits.", "iv. Wheat is generally planted around November, December and January."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Koring word geklassifiseer as Bread Wheat en Other Wheat (Super, Graad 1-3), nie klasse A-D nie, so (i) is vals. (ii) en (iii) kom direk uit die boek. Koring word April tot Julie geplant en November tot Januarie geoes, so (iv) verwar plant met oes.", "book_ref": "1.3.1, 1.3.3, p.13", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 4, "question": "Futures markets trade futures contracts that are standardised in respect of", "statements": ["i. price of underlying.", "ii. quality of underlying.", "iii. delivery location.", "iv. quantity of underlying."], "options": {"A": "(i), (ii) and (iii) only", "B": "(ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "D", "uitleg": "Futures is gestandaardiseer t.o.v. kwaliteit, hoeveelheid (contract size) en afleweringsplek/-tyd. Die prys word nie gestandaardiseer nie; dit word deur vraag en aanbod op die beurs ontdek.", "book_ref": "2.5 p.28; 4.2 p.41", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 5, "question": "The prerequisites for successful trading in agricultural futures and options contracts include the fact that any such underlying commodity should", "statements": [], "options": {"A": "always be available for visible inspection by the buyer.", "B": "be a heterogeneous commodity.", "C": "not easily trade in the cash or spot market.", "D": "be exposed to frequent price variation."}, "answer": "D", "uitleg": "Die boek noem as voorvereiste dat die kommoditeit aan gereelde prysvariasies blootgestel moet wees (anders is daar geen behoefte om te hedge nie). Dit moet homogeen wees (nie heterogeen nie), moet op 'n goed funksionerende kontantmark verhandel, en kopers hoef dit juis nie te sien nie.", "book_ref": "2.5, p.28", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "P3", "n": 6, "question": "Which of the following are considered advantages of forward contracts?", "statements": ["i. Buyers can defer payment until delivery.", "ii. They contain no default risk.", "iii. Contracts can be easily unwound by settling in cash before delivery.", "iv. Because the price is fixed upfront, the producer is protected against an unexpected fall in market prices."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "Die boek lys as voordele: koper se betalings word tot aflewering uitgestel, en verkopers is beskerm teen onverwagte prysdalings. Default risk is juis 'n nadeel van forwards, en forwards is moeilik om voor aflewering te unwind.", "book_ref": "3.1.1-3.1.2, p.31", "topic": "Forwards", "note": null, "data": null}, {"paper": "P3", "n": 7, "question": "If the spot price of maize is R1 100 per ton; the interest rate is 7.5% per annum, quarterly compounded; storage cost is R75 per ton payable after 9 months; and the convenience yield is 2.5% of the spot price, the 9-month forward price of a maize contract will be", "statements": [], "options": {"A": "R1 181.89", "B": "R1 204.43", "C": "R1 215.40", "D": "R1 218.53"}, "answer": "C", "uitleg": "Formule (3.5): F0 = (S0 + U)(1 + (i-y)/f)^(n·f). U = 75 × (1+0.075/4)^-3 = R70.93. F0 = (1 100 + 70.93) × (1 + 0.05/4)^3 = 1 170.93 × 1.03797 = R1 215.40.", "book_ref": "3.2, formula 3.5, pp.35-36", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "P3", "n": 8, "question": "Which of the following statements about agricultural futures contracts are true?", "statements": ["i. These contracts can be closed out before the delivery date.", "ii. The buyer of a futures contract enters into a commitment to make delivery of the underlying commodity.", "iii. Open interest refers to the total number of futures contracts that have not yet been fulfilled.", "iv. The vast majority of futures positions are fulfilled by physical delivery at maturity."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Futures kan voor aflewering uitgekanselleer (closed out) word, en open interest is die totale aantal kontrakte wat nog uitstaande/nie vervul is nie. Die koper neem aflewering (die verkoper maak aflewering), en die meeste posisies word uitgekanselleer, nie fisies afgelewer nie.", "book_ref": "4.1, pp.41-42", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 9, "question": "In the agricultural commodities market, futures contracts specifically differ from forward contracts in the sense that", "statements": ["i. futures contracts are subject to daily cash flows.", "ii. speculators prefer futures contracts to forwards.", "iii. the market for forwards is more deep and liquid than the futures market.", "iv. credit risk is much higher in futures contracts than in forward contracts."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "A", "uitleg": "Futures word daagliks marked-to-market (daaglikse kontantvloei) en is vir spekulante aantrekliker weens liki
