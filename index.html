e primêre doel van 'n futures market is 'n doeltreffende meganisme vir price risk management (en price discovery), nie 'n platform vir spekulante nie.", "book_ref": "2.6 Self-test quiz, p.29", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-1", "question": "Forward contracts are marked to market on a daily basis.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Futures contracts word daagliks marked to market; forwards is OTC-kontrakte wat eers op vervaldatum vereffen word.", "book_ref": "3 Self-test quiz, p.38", "topic": "Forwards", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-3", "question": "The cost of carry includes both storage cost and convenience yields.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Carry costs = cost of funds + storage cost - convenience yield, dus is albei deel van die cost of carry.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-4", "question": "Financing cost is seen as a cost of carry.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Carrying costs sluit storage, insurance, transport en financing costs in.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "ch3-5", "question": "Time value of money is ignored in determining forward prices.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die tyd tot vervaldatum is deel van die berekening: F0 = (S0+U)(1+i/f)^(n·f), dus word die toekomstige waarde saamgestel.", "book_ref": "3 Self-test quiz, p.38", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-1", "question": "Basis can be affected by:", "statements": [], "options": {"A": "Storage and transportation costs", "B": "Local supply and demand", "C": "Quality", "D": "All of the above"}, "answer": "D", "uitleg": "Al die faktore beïnvloed basis (spot price - futures price): stoor- en vervoerkoste, plaaslike vraag en aanbod, en kwaliteit.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-2", "question": "Agricultural futures markets participants include:", "statements": [], "options": {"A": "Commodity sellers", "B": "Commodity buyers", "C": "Speculators", "D": "All of the above"}, "answer": "D", "uitleg": "Kopers, verkopers (hedgers) en spekulante neem almal deel; arbitrage traders is ook deel van die markdeelnemers.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-3", "question": "Hedgers include:", "statements": [], "options": {"A": "Commodity buyers who want to protect against the risk of higher prices", "B": "Commodity sellers who want to protect against the risk of higher prices", "C": "Speculators seeking to make a profit", "D": "Both A and B"}, "answer": "A", "uitleg": "Kopers hedge teen hoër pryse. Verkopers wil hulle teen laer pryse (nie hoër nie) beskerm, so B is verkeerd en daarom ook D; spekulante het nie fisiese voorraad nie.", "book_ref": "4.13 Self-test quiz, p.86", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-4", "question": "Which of the following is FALSE:", "statements": [], "options": {"A": "The objective of speculators is to make a profit.", "B": "Speculators add liquidity to the marketplace.", "C": "Speculators buy or sell futures to offset their spot market exposure.", "D": "Although it mimics the dollar price of gold, the rand price of a gold quanto future traded on JSE CDM is not affected by the rand-dollar exchange rate."}, "answer": "C", "uitleg": "Spekulante het nie, en beoog ook nie, fisiese voorraad nie, so hulle het geen spot market exposure om t arket, but to make physical delivery on the futures contract. Do you...", "statements": [], "options": {"A": "Deliver the maize to the JSE in Johannesburg and wait around for the JSE to pay you for your maize?", "B": "Inform your JSE CDM member to arrange for a transporter to come and collect the maize at your farm?", "C": "Deliver the maize to any silo and inform your broker as to the location thereof?", "D": "Deliver your maize to a JSE approved delivery station, request a silo receipt, notify your JSE CDM member accordingly and follow the designated procedure?"}, "answer": "D", "uitleg": "Aflewering gebeur by 'n JSE-goedgekeurde delivery station (silo): jy vra 'n silo receipt, stel jou JSE CDM member in kennis en volg die voorgeskrewe prosedure. Enige silo is nie goed genoeg nie.", "book_ref": "4.13 Self-test quiz, p.88", "topic": "Delivery", "note": null, "data": null}, {"paper": "BOOK", "n": "ch4-8", "question": "Which one of the following is true?", "statements": [], "options": {"A": "SA farmers can hedge against sharp rises in fuel prices by selling foreign referenced crude oil futures listed on the JSE.", "B": "The minimum contract size for a NYMEX crude oil futures contract listed on the JSE CDM is 1,000 US barrels.", "C": "The minimum contract size for a COMEX gold futures contract listed on the JSE CDM is 10 troy ounces.", "D": "The US corn contract listed on the JSE CDM has to be cash settled in US dollars."}, "answer": "C", "uitleg": "Goud (en platinum) op die JSE CDM: 1 kontrak = 10 troy ounces. A is verkeerd (teen stygende brandstofpryse koop jy, nie verkoop nie); B: die JSE-kontrak is 100 barrels (1 000 is New York); D: dit word in rand vereffen.", "book_ref": "4.13 Self-test quiz, p.88", "topic": "Futures basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch5-1", "question": "A swap is an agreement between two companies/individuals to exchange commodities in the future.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n Swap ruil kontantvloeie (cash flows) in die toekoms uit, nie die kommoditeit self nie; commodity swaps word altyd kontant vereffen.", "book_ref": "5.8 Self-test quiz, p.96", "topic": "Swaps", "note": null, "data": null}, {"paper": "BOOK", "n": "ch5-2", "question": "Large South African grain-consuming companies commonly use commodity swaps.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Groot graanverbruikers verkies fixed-price delivery contracts bo cash-settling swaps.", "book_ref": "5.8 Self-test quiz, p.97", "topic": "Swaps", "note": null, "data": null}, {"paper": "BOOK", "n": "ch5-3", "question": "Farmers can utilize swaps as a hedging tool.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. In beginsel kan swaps boere help om prysrisiko te hedge, ook vir bates wat nie op 'n beurs verhandel word nie.", "book_ref": "5.8 Self-test quiz, p.97", "topic": "Swaps", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-1", "question": "A ____ option conveys the right to buy without an obligation.", "statements": [], "options": {"A": "put", "B": "call"}, "answer": "B", "uitleg": "'n Call option gee die reg, maar nie die verpligting nie, om die onderliggende bate te koop.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-2", "question": "A ____ option conveys the right to sell.", "statements": [], "options": {"A": "put", "B": "call"}, "answer": "A", "uitleg": "'n Put option gee die reg, maar nie die verpligting nie, om die onderliggende bate te verkoop.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-3", "question": "If a long put is exercised, a ____ futures is assigned to the option holder.", "statements": [], "options": {"A": "long", "B": "short"}, "answer": "B", "uitleg": "Wanneer 'n put uitgeoefen word, kry die put-koper 'n short futures position (reg om te verkoop) en die skrywer 'n long position.", "book_ref": "6.15 Self-test quiz, p.138", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-4", "question": "If a long call is exercised, a ____ futures is assigned to the option holder.", "statements": [], "options": {"A": "long", "B": "short"}, "answer": "A", "uitleg": "Wanneer 'n call uitgeoefen word, kry die call-koper 'n long futures position en die call-skrywer 'n short futures position.", "book_ref": "6.15 Self-test quiz, p.138-139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-5", "question": "The maximum that a long call holder can gain on his position is the premium.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die premie is die maksimum wat 'n long call holder kan verloor; sy wins is teoreties onbeperk.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-6", "question": "When an in-the-money long call expires the owner of the call option has no further obligation.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n In-the-money opsie word met verval outomaties deur die Exchange uitgeoefen en 'n long futures position word aan die houer toegeken.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-7", "question": "A long put on white maize may be exercised any time until option expiry.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "A", "uitleg": "Waar. Opsies op die JSE CDM is American-type en kan enige tyd tot die vervaldatum uitgeoefen word.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "ch6-8", "question": "During the months of January to March volatility as indicated by the SAVI-White Maize is normally quite low.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Volatiliteit ('vrees') styg juis in die kritieke weermaande Jan-Mrt wanneer opvolgreëns nodig is vir 'n goeie oes.", "book_ref": "6.15 Self-test quiz, p.139", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-1", "question": "You successfully hedged your position against a price rise by trading futures contracts at a level which covered your breakeven buying price and locked in a return on your investment. You close out your position at a price of the futures contract which reflects the expected shortage of maize on the market at around the expiry time of the contracts you traded. The money in your margin account is repaid to you. Your margin account would reflect –", "statements": [], "options": {"A": "Only the initial margin paid by yourself.", "B": "The initial margin paid by yourself plus the variation margin paid into your account by the seller or short position holder.", "C": "The initial margin paid by yourself minus the variation margin paid by yourself into the account of the seller or short position holder.", "D": "That portion of the margin account proportionately representing the movement of the futures price as against the price movement on the actual physical or spot market."}, "answer": "B", "uitleg": "Jy is long (hedge teen prysstyging) en die futures-prys het gestyg, so jou rekening is daagliks met variation margin van die short-houer gekrediteer. Jy kry dus initial margin plus variation margin terug.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-2", "question": "The premise that makes hedging possible is cash and futures prices –", "statements": [], "options": {"A": "move in opposite directions.", "B": "move upward and downward by identical amounts.", "C": "generally, change in the same direction by similar amounts.", "D": "are regulated by the exchange."}, "answer": "C", "uitleg": "Cash- en futures-pryse beweeg oor die algemeen saam op en af, nie noodwendig met presies dieselfde bedrag nie (dis basis risk), maar naby genoeg om met teenoorgestelde posisies te hedge.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-3", "question": "To hedge against an increase in prices, you would –", "statements": [], "options": {"A": "purchase futures contracts.", "B": "sell futures contracts."}, "answer": "A", "uitleg": "Beskerming teen stygende pryse = long hedge: koop futures contracts. Teen dalende pryse verkoop jy futures.", "book_ref": "7.8 Self-test quiz, p.169", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-4", "question": "A farmer's crop is still in the field. Their cash market position is-", "statements": [], "options": {"A": "long", "B": "short", "C": "neither, since the crop hasn't been harvested", "D": "neutral, because they have no position in the futures market"}, "answer": "A", "uitleg": "Die boer is soos iemand wat die oes besit en stoor: hy wen as pryse styg en verloor as dit daal, dus is sy cash position long.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-5", "question": "Arbitrage traders manipulate markets, and this results in mispriced instruments.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Arbitrageurs koop en verkoop in verskillende markte en verseker juis dat wanprysing verdwyn.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Market roles & prerequisites", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-6", "question": "An intermarket spread can be accomplished by going long on futures in one market, and on short futures of the same month in the same market.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. 'n Intermarket spread is long futures in een mark en short futures van dieselfde maand in 'n ANDER mark.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch7-7", "question": "Assuming that your local physical market price is generally below the value of the authorized futures contract (reference point) and that the basis tends to fluctuate as a result of demand and supply factors in the area where you deliver and because of changes in transportation rates. You have hedged your maize crop by selling futures contracts. Which ONE of the following actions do you follow to maximize your realization if you choose to deliver your maize?", "statements": [], "options": {"A": "You lift your hedge when the basis weakens.", "B": "You lift your hedge when the price in the physical market is at its peak.", "C": "You do not worry about the basis because once you have hedged as it makes no difference.", "D": "You lift your hedge when the basis strengthens."}, "answer": "D", "uitleg": "'n Short hedger se effektiewe prys = F1 + B2, dus baat hy as die basis versterk (cash price styg relatief tot futures). Lig die hedge wanneer die basis sterk is.", "book_ref": "7.8 Self-test quiz, p.170", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-1", "question": "The directives are binding on all members and officers and employees of members and any person using the services of member or who concludes a transaction with a member in the course of that member's JSE regulated activities.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die directives bind net trading members, hul officers en employees. Die rules (nie directives nie) bind ook persone wat 'n member se dienste gebruik of met hom transaksies sluit.", "book_ref": "8.18 Self-test quiz, p.190; 8.1 p.173", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-3", "question": "The Market Controller is responsible for identifying the origin and the accuracy, integrity, and validity of all data submitted to the JSE trading system by or on behalf of that trading member.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die trading member self is verantwoordelik vir die oorsprong, akkuraatheid, integriteit en geldigheid van data wat deur of namens hom in die JSE trading system ingevoer word.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-4", "question": "Who may reduce or extend the hours of operation of the JSE trading system for any particular business day?", "statements": [], "options": {"A": "Market Controller", "B": "JSE Executive", "C": "Director: Market Regulation"}, "answer": "B", "uitleg": "Die JSE Executive mag die bedryfsure van die JSE trading system vir 'n spesifieke besigheidsdag verkort of verleng.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-5", "question": "Insider trading offences only apply to transactions in listed companies and therefore exclude transactions in agricultural product securities.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Insider trading offences geld vir enige transaksies in securities wat op 'n regulated market genoteer is, insluitend agricultural product securities.", "book_ref": "8.18 Self-test quiz, p.190", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-6", "question": "Who may declare a trading halt in an agricultural product security?", "statements": [], "options": {"A": "Chief Executive Officer, in conjunction with the JSE Executive", "B": "The Market Controller, in conjunction with the Director: Market Regulation", "C": "The Director: Market Regulation, in conjunction with the Chief Executive Officer"}, "answer": "C", "uitleg": "Die Director: Market Regulation, saam met die Chief Executive Officer, mag 'n trading halt in 'n agricultural product security verklaar.", "book_ref": "8.18 Self-test quiz, p.191", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch8-9", "question": "The CDM operates on every calendar day.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Die CDM werk op elke business day, nie elke kalenderdag nie.", "book_ref": "8.18 Self-test quiz, p.191", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "ch9-1", "question": "Fundamental analysis is rooted in the basic premise that:", "statements": [], "options": {"A": "Price behaviour in the financial markets is random.", "B": "Price behaviour in the financial markets moves in trends", "C": "Price behaviour in the financial markets can only be understood by analysis of the underlying economic conditions surrounding the markets.", "D": "Price behaviour in the financial markets is cyclically based."}, "answer": "C", "uitleg": "Fundamental analysis glo pryse kan net verstaan word deur die onderliggende ekonomiese toestande te ontleed (top-down: ekonomie, bedryf, kommoditeit). 'Pryse beweeg in trends' (B) is 'n aanname van technical analysis.", "book_ref": "9.4 Self-test quiz, p.202", "topic": "Other", "note": null, "data": null}, {"paper": "BOOK", "n": "ch9-3", "question": "All commodity prices are equally sensitive to changes in demand as to changes in supply.", "statements": [], "options": {"A": "True", "B": "False"}, "answer": "B", "uitleg": "Vals. Sommige markte is meer sensitief vir aanbodfaktore, ander reageer meer op vraagveranderinge.", "book_ref": "9.4 Self-test quiz, p.203", "topic": "Other", "note": null, "data": null}, {"paper": "BOOK", "n": "ch9-5", "question": "Import parity prices reflect the lowest / highest level of the South African domestic price.", "statements": [], "options": {"A": "lowest", "B": "highest"}, "answer": "B", "uitleg": "Import parity is die internasionale prys plus alle koste om in te voer. Plaaslike pryse styg selde daarbo, want meulenaars voer dan eerder in. Import parity is dus die plafon (highest), en export parity is die vloer (lowest).", "book_ref": "9.4 Self-test quiz, p.203; cf. p.76, 9.1.1 p.198", "topic": "Physical market", "note": "Die boek se self-toets sê 'lowest', maar die boek se teks (p.76 en p.198) sê import parity is die maksimum prys.", "data": null}, {"paper": "BOOK", "n": "exam-1", "question": "On average, how much grain can be produced for each millimetre of water consumed?", "statements": [], "options": {"A": "10kg", "B": "15kg", "C": "20kg", "D": "25kg"}, "answer": "B", "uitleg": "Volgens die boek kan gemiddeld ongeveer 15 kg graan geproduseer word vir elke millimeter water wat verbruik word (mielies benodig 450-600 mm per seisoen).", "book_ref": "Exam Q1 p.204, answers p.208; 1.x p.8", "topic": "Physical market", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-2", "question": "Which of the following statements regarding the futures market and formal futures exchanges are correct?", "statements": ["i. Futures markets trade futures contracts where the commodity, quality, quantity, location and delivery period are customised.", "ii. Futures markets trade futures contracts where the commodity, quality, quantity, location and delivery period are standardised.", "iii. Commitments to make or accept delivery can be offset against each other so that actual physical delivery of the underlying does not take place.", "iv. Commitments to make or accept delivery may not be offset against each other and actual physical delivery of the underlying must take place."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "C", "uitleg": "Futures contracts is gestandaardiseer (commodity, quality, quantity, location en delivery period), nie customised nie, dus (ii). Verpligtinge kan teen mekaar ge-offset word, sodat fisiese aflewering meestal nie plaasvind nie, dus (iii).", "book_ref": "Exam Q2 p.204, answers p.208; 2.2 p.26", "topic": "Futures basics", "note": "Die boek se memo (p.208) sê A, maar dit weerspreek die boek se eie teks in 2.2. C is reg.", "data": null}, {"paper": "BOOK", "n": "exam-3", "question": "Which of the following is considered an advantage of forward contracts?", "statements": [], "options": {"A": "Because prices are locked in buyers can benefit from a sudden fall in prices", "B": "There is no default risk.", "C": "For the seller, income is deferred until delivery.", "D": "Contracts are flexible in terms of the size, quality and delivery time."}, "answer": "D", "uitleg": "Forwards is buigsaam wat grootte, kwaliteit en afleweringstyd betref. A is verkeerd (ingeslote pryse beteken kopers kan NIE baat by 'n prysdaling nie), B (default risk bestaan wel) en C is nadele.", "book_ref": "Exam Q3 p.204, answers p.208; 3.1.1-3.1.2 p.31", "topic": "Forwards", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-4", "question": "Calculate the present value of the storage cost on a 9-month forward contract on maize given the following information: Spot maize price R2 500 per ton; Interest rate 12.5% p.a.; Interest accrual quarterly compounded basis; Storage cost R160/ton payable after nine months; Convenience yield 5% of the spot price.", "statements": [], "options": {"A": "R125.00", "B": "R145.89", "C": "R146.49", "D": "R193.75"}, "answer": "B", "uitleg": "PVU = U(1+i/f)^(-n·f) = 160 × (1 + 0.125/4)^(-0.75×4) = 160 × 1.03125^(-3) = 160 / 1.09670 = R145.89. Die spotprys en convenience yield is afleiers.", "book_ref": "Exam Q4 p.205, answers p.208; formula 3.4", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-5", "question": "The first day on which a short position holder may notify the JSE of its intention to deliver the commodity is referred to as:", "statements": [], "options": {"A": "First position day", "B": "First notice day", "C": "First delivery day", "D": "First allocation day"}, "answer": "A", "uitleg": "First position day is die eerste dag waarop die short-houer die JSE van sy voorneme om te lewer in kennis mag stel (4 besigheidsdae voor eerste afleweringsdag, die dag voor first notice day). First notice day is wanneer die delivery notice self ingedien word.", "book_ref": "Exam Q5 p.205, answers p.208; trading calendar p.58", "topic": "Delivery", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-6", "question": "Which of the following statements regarding clearing are correct?", "statements": ["i. Bilateral clearing involves the clearing of transactions by the participants.", "ii. Standard OTC derivatives are usually between two financial institutions and are cleared through the Central Counterparty (CCP).", "iii. In the OTC derivatives market, collateral posted within a transaction is often referred to as margin.", "iv. Non-standard transactions are cleared bilaterally but are subject to regulation on the amount of collateral required."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Al vier stellings kom direk uit die boek: bilateral clearing deur die deelnemers self, standard OTC derivatives deur die CCP, collateral word margin genoem, en non-standard transaksies word bilateraal ge-clear maar met gereguleerde collateral.", "book_ref": "Exam Q6 p.205, answers p.208; 5.x p.91-92", "topic": "Other", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-7", "question": "An option where the holder has the right to purchase at any time during the life of the contract is called an –", "statements": [], "options": {"A": "European call option", "B": "European put option", "C": "American call option", "D": "American put option"}, "answer": "C", "uitleg": "Reg om te koop = call; enige tyd uitoefenbaar = American. European opsies kan net op vervaldatum uitgeoefen word.", "book_ref": "Exam Q7 p.206, answers p.208; 6.1.1 p.99", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-8", "question": "What does this diagram represent? (Diagram: profit on the vertical axis vs asset price at expiry; the line starts high on the left, slopes downward as the price rises, crosses zero and then runs flat below zero to the right.)", "statements": [], "options": {"A": "Basic payoff profile of a long put option", "B": "Basic payoff profile of a short put option", "C": "Basic payoff profile of a long call option", "D": "Basic payoff profile of a short call option"}, "answer": "A", "uitleg": "Wins styg soos die prys daal en die verlies is beperk (plat lyn onder nul = premie betaal) bo die strike. Dit is die payoff van 'n long put.", "book_ref": "Exam Q8 p.206 (diagram), answers p.208", "topic": "Options basics", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-9", "question": "Who are the JSE Derivatives Rules binding on?", "statements": ["i. All members.", "ii. All officers of members.", "iii. All employees of members.", "iv. Any person who concludes a transaction with a member during the course of that member's business."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Die rules bind alle trading members, officers en employees, asook enige persoon wat 'n member se dienste gebruik of met hom 'n transaksie sluit. (Die directives bind net members, officers en employees.)", "book_ref": "Exam Q9 p.206, answers p.208; 8.1 p.173", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "BOOK", "n": "exam-10", "question": "Which of the following statements regarding the general requirements of officers of members are correct? An officer -", "statements": ["i. must be of full legal capacity.", "ii. may not be an unrehabilitated insolvent.", "iii. may not have been disqualified by a court from acting as a director of a company.", "iv. must comply with the criteria of good character and integrity, as deemed fit by the JSE."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Rule 3.20 vereis almal: volle regsbevoegdheid, nie 'n ongerehabiliteerde insolvent nie, nie deur 'n hof as direkteur gediskwalifiseer nie, en goeie karakter en integriteit soos die JSE goedvind.", "book_ref": "Exam Q10 p.207, answers p.208; 8.2 rule 3.20 p.173-174", "topic": "Regulation & rules", "note": null, "data": null}, {"paper": "IDK", "n": "F-01", "question": "A client sells 6 wheat futures contracts at R5 800 per ton. Assume the initial margin is calculated as 6.46% of the contract value, in line with Table 4.3. The total initial margin the client must deposit is", "statements": [], "options": {"A": "R224 808", "B": "R112 404", "C": "R18 734", "D": "R134 850"}, "answer": "B", "uitleg": "Wheat is 50 ton per contract: 6 x 50 x R5 800 x 6.46% = R112 404. R224 808 gebruik verkeerdelik 100 ton (die maize contract size); R18 734 is net een contract; R134 850 gebruik die white maize persentasie van 7.75%.", "book_ref": "4.6, Table 4.3, p.54", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "IDK", "n": "F-02", "question": "On Monday morning a feed manufacturer buys 4 yellow maize (YMAZ) futures contracts at R3 215 per ton. The marked-to-market (MTM) prices are shown in the table. The variation margin cash flow for the feed manufacturer on Wednesday is", "statements": [], "options": {"A": "+R10 400", "B": "-R17 200", "C": "+R17 200", "D": "+R4 300"}, "answer": "C", "uitleg": "VM op dag t = (MTM_t - MTM_t-1) x contract size x aantal contracts = (3 241 - 3 198) x 100 x 4 = +R17 200; long wen as prys styg. +R10 400 vergelyk verkeerdelik met die trade price (R3 215) i.p.v. Dinsdag se MTM; +R4 300 vergeet die 4 contracts; -R17 200 het die verkeerde teken.", "book_ref": "4.6, Table 4.4 and note, p.55-56", "topic": "Margining & MTM", "note": null, "data": "Day        MTM price (R/ton)\nMonday     3 230\nTuesday    3 198\nWednesday  3 241\nThursday   3 236"}, {"paper": "IDK", "n": "F-03", "question": "A trader sells 2 white maize futures contracts at R3 000 per ton on Day 1 and deposits an initial margin of R15 000 per contract (R30 000 in total), which must be maintained as the minimum balance in his margin account. The MTM prices are given in the table. Ignoring interest and fees, the total amount of margin top-up payments the trader must make over Days 2 to 4 is", "statements": [], "options": {"A": "R14 000", "B": "R4 000", "C": "R10 000", "D": "R6 000"}, "answer": "D", "uitleg": "Short 2 x 100 t. Dag 2: +R8 000 VM -> balans R38 000. Dag 3: -R10 000 -> R28 000, top-up R2 000 -> R30 000. Dag 4: -R4 000 -> R26 000, top-up R4 000. Totaal top-ups = R6 000. R14 000 tel al die verliese as top-ups en ignoreer die surplus van R8 000 wat op dag 2 ontvang is (net soos die buyer in Table 4.4 net die tekort bo die initial margin inbetaal).", "book_ref": "4.6, Table 4.4, p.55-57", "topic": "Margining & MTM", "note": null, "data": "Day    MTM price (R/ton)\nDay 1  3 000\nDay 2  2 960\nDay 3  3 010\nDay 4  3 030"}, {"paper": "IDK", "n": "F-04", "question": "A soya bean futures contract trades at R8 000 per ton and the initial margin is R26 400 per contract. If the price moves by R120 per ton, this movement represents approximately what percentage of the total contract value and of the initial margin respectively?", "statements": [], "options": {"A": "1.5% and 22.7%", "B": "3.0% and 45.5%", "C": "22.7% and 1.5%", "D": "1.5% and 0.45%"}, "answer": "A", "uitleg": "Soya is 50 ton: contract value = 50 x R8 000 = R400 000; beweging = R120 x 50 = R6 000. R6 000/R400 000 = 1.5% en R6 000/R26 400 = 22.7%: dit is gearing. 3.0%/45.5% gebruik 100 ton vir die beweging; 0.45% deel net R120 (per ton) deur die margin en vergeet die contract size.", "book_ref": "4.6 (gearing), p.57", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "IDK", "n": "F-05", "question": "Which of the following statements regarding the determination of the daily marked-to-market (MTM) price of futures contracts on the JSE CDM are correct?", "statements": ["i. A volume weighted average price (VWAP) is used to calculate the MTM for all liquid contracts", "ii. A liquid futures contract is defined as any expiry that trades 100 or more contracts in the last half hour of trading", "iii. The settlement (MTM) price for the day is chosen at random by the exchange anytime during the final five minutes of trading", "iv. For illiquid contracts, the offer will be used as the MTM price if the offer is higher than the last traded price"], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "B", "uitleg": "Volgens die boek word VWAP vir liquid contracts gebruik, 'n liquid contract handel 100 of meer contracts in die laaste halfuur, en die settlement price word ewekansig in die laaste vyf minute gekies. (iv) is vals: by 'n illiquid contract word die offer net gebruik as dit LAER as die laaste trade is (die bid as dit hoer is).", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "IDK", "n": "F-06", "question": "Which ONE of the following statements regarding margin on the JSE CDM is INCORRECT?", "statements": [], "options": {"A": "Only cash is accepted as margin", "B": "Margins are required from all participants to cover, on an ongoing basis, two days' worth of the market risk of their unsettled positions", "C": "In times of extreme volatility only the clearing members, and never the exchange or the clearing house, may make an intra-day margin call", "D": "Failure to honour a variation margin call within the prescribed time will result in the position being closed out by the member immediately"}, "answer": "C", "uitleg": "Die boek se: in tye van uiterste volatility kan BEIDE die exchange en die clearing house 'n intra-day margin call maak vir onmiddellike top-up. Die ander drie stellings kom woordeliks uit 4.6: slegs kontant, twee dae se market risk, en posisies word gesluit as 'n VM call nie betyds betaal word nie.", "book_ref": "4.6, p.54 and p.57", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "IDK", "n": "F-07", "question": "Which of the following statements regarding the JSE risk management structure and the clearing of futures are correct?", "statements": ["i. Once a trade has been matched and confirmed, JSE Clear becomes the counterparty to each trade, a process referred to as novation", "ii. Each trading member will carry its client's losses if the client defaults", "iii. Clearing members are responsible to guarantee against the default risk of the trading members for whom they clear", "iv. Because of novation, JSE Clear carries the default risk of every individual client directly, so trading members carry no risk for their clients"], "options": {"A": "(i), (ii) and (iii) only", "B": "(i) and (iv) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "A", "uitleg": "Novation beteken JSE Clear word die counterparty sodra 'n trade gematch en bevestig is; 'You stand good for your client': die trading member dra die klient se verliese en die clearing member staan in vir sy trading members. (iv) is vals: JSE Clear se risiko is dat 'n clearing member in default gaan; die onus le by clearing members wat dit na trading members deurgee.", "book_ref": "4.6, p.52-54", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "IDK", "n": "F-08", "question": "A speculator buys 3 white maize futures contracts at R3 400 per ton and pays an initial margin of R12 000 per contract. During the following days he receives and pays variation margin, including R4 000 in margin top-up payments. He then closes out the position at R3 365 per ton and his remaining margin balance (including the initial margin) is repaid. Ignoring interest and fees, his total net cash flow over the period is", "statements": [], "options": {"A": "+R10 500", "B": "-R14 500", "C": "-R46 500", "D": "-R10 500"}, "answer": "D", "uitleg": "Die totaal van alle margin-kontantvloei moet gelyk wees aan die totale wins/verlies: (3 365 - 3 400) x 100 x 3 = -R10 500. Initial margin en top-ups kom terug saam met die surplus balans, so hulle is nie ekstra verliese nie (-R14 500 tel die top-up dubbel). -R46 500 vergeet dat die R36 000 initial margin terugbetaal word.", "book_ref": "4.6, Table 4.4, p.56-57", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "IDK", "n": "F-09", "question": "Assume the everyday price limit for wheat is R240/ton and the extended limit is R360/ton. September is the spot month, while December, March, May and July are hedging months with open interest. The MTM price movements over four days are given in the table. On which day will the extended limits first apply?", "statements": [], "options": {"A": "Day 2", "B": "Day 3", "C": "Day 4", "D": "Day 5"}, "answer": "C", "uitleg": "Extended limits word getrigger as twee of meer hedging months vir twee opeenvolgende dae in dieselfde rigting by die everyday limit MTM word; die spot month (Sep) tel nie. Dag 1: net Dec (1 hedging month). Dag 2: Dec en May; Dag 3: Mar en May -> twee dae agtereenvolgens, so extended limits geld vanaf Dag 4. Dag 3 is die lokval as jy Sep op Dag 1 meetel.", "book_ref": "8.14.1-8.14.2, Table 8.1, p.182-183", "topic": "Price discovery & limits", "note": null, "data": "Day    Sep(spot)  Dec    Mar    May    Jul\nDay 1  -R240      -R240  -R150  -R100  -R90\nDay 2  -R200      -R240  -R180  -R240  -R120\nDay 3  -R240      -R200  -R240  -R240  -R100\nDay 4  -R180      -R250  -R300  -R210  -R160"}, {"paper": "IDK", "n": "F-10", "question": "Extended price limits currently apply to white maize (everyday limit R150/ton, extended limit R225/ton). On a specific day the MTM price movements are: July (spot month) +R60, September +R180, December +R150, March +R120, May +R200 and July (next year) +R100. Which ONE of the following statements is correct?", "statements": [], "options": {"A": "Everyday limits return the next day because more than 50% of the hedging months were MTM at or below the everyday limit", "B": "Extended limits remain in place because only 60% of the hedging months were MTM at or below the everyday limit", "C": "Everyday limits return the next day because the spot month was MTM below the everyday limit", "D": "Extended limits remain in place because at least one hedging month was MTM above the everyday limit"}, "answer": "B", "uitleg": "Die spot month tel nie. Van die 5 hedging months is Dec (R150), Mar (R120) en Jul (R100) gelyk aan of onder R150: 3/5 = 60%. 'n Majority word gedefinieer as MEER as 65%, so extended limits bly. A gebruik die gewone 50%-meerderheid; D is vals want nie alle maande hoef onder die limit te wees nie.", "book_ref": "8.14.3, p.183", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "IDK", "n": "F-11", "question": "Which of the following statements regarding daily price limits on the JSE CDM are correct?", "statements": ["i. Price limits and triggers apply to all hedging months where open interest exists, excluding the spot month", "ii. Extended limits are set at 150% of the original (everyday) limit", "iii. Extended price limits result in increased initial margin requirements for the periods when they apply", "iv. When a contract trades at its maximum limit, liquidity improves because both buyers and sellers are attracted to the market"], "options": {"A": "(i) and (ii) only", "B": "(ii), (iii) and (iv) only", "C": "(i) and (iv) only", "D": "(i), (ii) and (iii) only"}, "answer": "D", "uitleg": "Limits geld vir hedging months met open interest, uitgesluit die spot month; extended limits is 150% van die oorspronklike limit (bv. R150 -> R225 vir WMAZ) en lei tot hoer initial margin. (iv) is vals: as die mark by die limit handel, wil kopers of verkopers nie handel nie en die contract kan totaal illiquid raak.", "book_ref": "4.4, p.47-48; 4.6, p.55; 8.14.1, p.182", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "IDK", "n": "F-12", "question": "During January the March white maize futures contract trades at R4 350/ton while the May contract trades at R3 980/ton. Which ONE of the following BEST describes this situation?", "statements": [], "options": {"A": "A normal old-crop/new-crop inversion: March reflects old crop that may be in short supply, while May reflects the incoming new crop", "B": "A carrying-charge (contango) market, as May includes storage and finance costs", "C": "A guaranteed arbitrage opportunity, since the later month must always trade higher than the earlier month", "D": "A breach of the daily price limit, which the JSE must correct by suspending trading in the March contract"}, "answer": "A", "uitleg": "Vir maize word die old-crop/new-crop spread deur die March en May contracts verteenwoordig; March (laaste maand van die bemarkingseisoen) kan hoer as May wees omdat ou oes skaars is en die nuwe oes pryse druk. Dit is 'n inverted mark, nie contango nie (B), en die boek noem dit 'n gereelde 'normal inversion', nie arbitrage nie.", "book_ref": "4.4, p.47", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "IDK", "n": "F-13", "question": "In November the March white maize futures trades at R4 100/ton and the May futures at R3 900/ton. A trader expects the (far crop minus near crop) spread to decrease further and trades 5 contracts on each leg accordingly. In February he closes both legs when March trades at R4 180/ton and May at R3 920/ton. Which position did he take and what is his total profit or loss?", "statements": [], "options": {"A": "Bought the spread (long May, short March); profit of R30 000", "B": "Sold the spread (short May, long March); profit of R30 000", "C": "Sold the spread (short May, long March); profit of R15 000", "D": "Bought the spread (long May, short March); profit of R40 000"}, "answer": "B", "uitleg": "Spread = far - near; om te wen as dit daal, verkoop jy die spread: short far (May), long near (March). Long March: +R80/t; short May: -R20/t; netto +R60/t x 100 t x 5 = R30 000 (spread het van -R200 na -R260 gedaal). R15 000 gebruik 50 ton; om die spread te koop sou 'n verlies van R30 000 gee.", "book_ref": "7.2.1, p.159-160; 4.4, p.47", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "IDK", "n": "F-14", "question": "The December yellow maize contract is illiquid: only 40 contracts traded in the last half hour of trading. The last trade was at R3 450/ton. At the random sample taken in the last five minutes of trade the best bid is R3 462/ton and the best offer is R3 470/ton, with no further trades. The MTM price will be", "statements": [], "options": {"A": "R3 450", "B": "R3 466", "C": "R3 470", "D": "R3 462"}, "answer": "D", "uitleg": "Minder as 100 contracts in die laaste halfuur = illiquid. As die bid HOER as die laaste trade is, word die bid die MTM: R3 462. Die offer (R3 470) word net gebruik as dit LAER as die laaste trade is; die midpoint R3 466 en VWAP-gebaseerde antwoorde geld nie vir illiquid contracts nie.", "book_ref": "4.6, p.56", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "IDK", "n": "F-15", "question": "A newly listed futures expiry has no open positions at the start of the day. During the day the following trades occur, in this order: (1) A buys 10 contracts from B, both opening new positions; (2) C buys 4 contracts from D, both opening new positions; (3) D buys 6 contracts from A. What are the open interest and the trading volume at the end of the day?", "statements": [], "options": {"A": "Open interest 20; volume 20", "B": "Open interest 14; volume 20", "C": "Open interest 10; volume 20", "D": "Open interest 10; volume 40"}, "answer": "C", "uitleg": "Open interest = aantal long (of short) posisies wat nog oop is. Na trade 3: A long 4, C long 4, D long 2 (was short 4, koop 6) = 10 long; B short 10. Volume = 10 + 4 + 6 = 20 contracts. 14 vergeet dat trade 3 posisies sluit; 40 tel elke kant van die trade apart.", "book_ref": "4.1.3, p.41-42", "topic": "Futures basics", "note": null, "data": null}, {"paper": "IDK", "n": "F-16", "question": "The spot (delivery month) price of white maize is R3 600/ton while the December futures contract trades at R3 450/ton. Which ONE of the following statements is correct?", "statements": [], "options": {"A": "The market is in backwardation, which can be caused by a negative cost of carry due to a high convenience yield", "B": "The market is in contango because the futures price includes financing and storage costs", "C": "The market is in backwardation because storage and financing costs exceed the convenience yield", "D": "The market is in contango because the net cost of carry is positive"}, "answer": "A", "uitleg": "Futures onder spot = backwardation; dit gebeur by 'n negatiewe net cost of carry weens 'n hoe convenience yield. Contango (B, D) is wanneer futures bo spot is met 'n positiewe cost of carry. C is verkeerd om: as storage en finansiering die convenience yield oorskry, is cost of carry positief (contango).", "book_ref": "4.1.2, p.41", "topic": "Futures basics", "note": null, "data": null}, {"paper": "IDK", "n": "F-17", "question": "Speculator Pietie buys 8 wheat futures contracts at R6 100/ton, expecting prices to rise. Shortly before expiry he offsets his position at R5 940/ton. Ignoring fees, his total profit or loss on the position is", "statements": [], "options": {"A": "-R128 000", "B": "+R64 000", "C": "-R1 280", "D": "-R64 000"}, "answer": "D", "uitleg": "(R5 940 - R6 100) x 50 t x 8 contracts = -R64 000; 'n long verloor as die prys daal. -R128 000 gebruik 100 ton (maize se size); -R1 280 vergeet die contract size; +R64 000 het die verkeerde teken.", "book_ref": "4.3.2, p.45; Table 4.9, p.65", "topic": "Futures basics", "note": null, "data": null}, {"paper": "IDK", "n": "F-18", "question": "Which of the following statements regarding JSE silo receipts are correct?", "statements": ["i. A silo receipt is a transferable but non-negotiable document that certifies the quantity and quality of stock in a registered silo", "ii. A silo receipt is only finally cancelled when it is given back to a storage employee for the actual product's outloading", "iii. The producer who delivered the grain into the silo guarantees the quality and quantity of the stock covered by the receipt", "iv. After receiving physical delivery through the JSE, the long position holder has three months to access the delivery from the storage operator or take steps to ensure that a good delivery was made"], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "B", "uitleg": "'n Silo receipt is transferable maar non-negotiable, en word eers finaal gekanselleer wanneer dit vir outloading aan die storage employee teruggegee word; die long het drie maande om die aflewering te kontroleer. (iii) is vals: die approved storage operator (nie die producer nie) waarborg die kwaliteit en hoeveelheid.", "book_ref": "4.5.2, p.49-51", "topic": "Delivery", "note": null, "data": null}, {"paper": "IDK", "n": "F-19", "question": "A short position holder in the July white maize contract submits a valid delivery notice, including the electronic silo receipt, to the exchange at 13h30 on Tuesday 14 July. Which ONE of the following statements is correct?", "statements": [], "options": {"A": "The contracts are closed at Wednesday's MTM price and delivery takes place on Wednesday", "B": "The contracts are closed at the original trade price and delivery takes place on Tuesday", "C": "The contracts are closed at Tuesday's MTM price, adjusted for items such as outstanding storage costs and location differentials, and delivery takes place on Wednesday", "D": "The contracts are closed at Tuesday's MTM price and delivery takes place on the last business day of July"}, "answer": "C", "uitleg": "Physical delivery loop oor twee besigheidsdae: notice day (kennisgewing voor 14h15) en dan delivery day (volgende besigheidsdag). Die contracts word gesluit teen die closing MTM price op notice day, aangepas vir storage costs, VAT (waar van toepassing), location differentials, grade premiums/discounts en basis premiums. Woensdag se MTM (A) is verkeerd want die prys word op notice day vasgestel.", "book_ref": "4.5.2, p.50", "topic": "Delivery", "note": null, "data": null}, {"paper": "IDK", "n": "F-20", "question": "Which of the following statements regarding exchange for physical (EFP) transactions on the JSE CDM are correct?", "statements": ["i. The delivery months in the physical contract and the expiry month of the futures contract must be within two months of each other", "ii. Quantities of the EFP futures contracts must be within 5% of the quantities specified in the physical contract", "iii. A farmer who buys an EFP from a miller is buying a futures contract while simultaneously selling physical grain", "iv. The physical delivery resulting from an EFP is randomly allocated to long position holders by the JSE's allocation algorithm"], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(iii) and (iv) only", "D": "(i) and (iv) only"}, "answer": "A", "uitleg": "By 'n EFP moet die delivery month van die physical contract en die futures expiry binne twee maande van mekaar wees, en die futures hoeveelheid binne 5% van die physical contract. Die boer wat die EFP koop, koop futures en verkoop fisiese maize. (iv) is vals: die aflewering word juis vooraf aan 'n spesifieke long holder toegeken, nie random allocated nie.", "book_ref": "8.10-8.11, p.181; 4.5.2, p.51", "topic": "Delivery", "note": null, "data": null}, {"paper": "IDK", "n": "P-01", "question": "Consider a 6-month forward contract on wheat. The spot price is R3 200 per ton, the interest rate is 9% per annum compounded monthly, storage cost of R120 per ton is payable after six months, and the convenience yield is 3% of the spot price. The theoretical 6-month forward price is closest to", "statements": [], "options": {"A": "R3 420.85 per ton", "B": "R3 466.73 per ton", "C": "R3 415.43 per ton", "D": "R3 518.66 per ton"}, "answer": "C", "uitleg": "Eers PV van storage: 120 x (1 + 0.09/12)^-6 = R114.74. Dan F0 = (3 200 + 114.74)(1 + (0.09 - 0.03)/12)^6 = 3 314.74 x 1.0304 = R3 415.43. R3 420.85 vergeet om die storage cost te verdiskonteer; R3 466.73 ignoreer die convenience yield; R3 518.66 tel die convenience yield by in plaas daarvan om dit af te trek.", "book_ref": "3.2, formulas 3.4 and 3.5, p.35-36", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "IDK", "n": "P-02", "question": "The spot price of gold is R1 800 per gram and the interest rate is 9% per annum, compounded quarterly. A 6-month forward contract on gold (no storage cost, no income) is quoted in the market at R1 900 per gram. Assuming equal borrowing and lending rates, which ONE of the following describes the arbitrage opportunity correctly?", "statements": [], "options": {"A": "Borrow R1 800, buy the gold spot and sell it 6 months forward at R1 900, making a risk-free profit of about R18.09 per gram.", "B": "Sell the gold spot, invest the proceeds and buy it 6 months forward at R1 900, making a risk-free profit of about R18.09 per gram.", "C": "Borrow R1 800, buy the gold spot and sell it 6 months forward at R1 900, making a risk-free profit of exactly R19.00 per gram.", "D": "Borrow R1 800, buy the gold spot and sell it 6 months forward at R1 900, making a risk-free profit of R100 per gram."}, "answer": "A", "uitleg": "Fair value = 1 800 x (1 + 0.09/4)^2 = R1 881.91. Die mark-prys van R1 900 is te hoog, dus cash-and-carry: leen, koop spot, verkoop forward; wins = 1 900 - 1 881.91 = R18.09. R19.00 gebruik simple interest (1 800 x 1.045) in plaas van kwartaallikse compounding; R100 ignoreer die rente-koste heeltemal.", "book_ref": "3.2 (arbitrage example), p.34; 4.9, p.77-78", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "IDK", "n": "P-03", "question": "Which of the following statements regarding contango and backwardation are correct?", "statements": ["i. If the net cost of carry is positive, the futures price will exceed the spot price and the market is said to be in contango.", "ii. Backwardation can occur where a high convenience yield causes a negative cost of carry.", "iii. In a backwardation market the basis (spot minus futures) is negative.", "iv. Backwardation is usually only associated with commodities such as oil and agricultural products, because the convenience yield for investment assets is always zero."], "options": {"A": "(i) and (ii) only", "B": "(ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(i), (ii) and (iv) only"}, "answer": "D", "uitleg": "(i), (ii) en (iv) kom direk uit die boek: positiewe net cost of carry gee contango; hoë convenience yield kan negatiewe carry en backwardation veroorsaak; backwardation word met commodities geassosieer omdat convenience yield vir investment assets nul is. (iii) is vals: in backwardation is St > Ft, dus is basis = S - F positief, nie negatief nie.", "book_ref": "4.1.2, p.41; 3.2, p.37; 4.7.1, p.71", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "IDK", "n": "P-04", "question": "All else being equal, which ONE of the following changes will LOWER the theoretical forward price of a storable agricultural commodity?", "statements": [], "options": {"A": "An increase in the applicable interest rate.", "B": "An increase in the storage cost payable at maturity.", "C": "An increase in the convenience yield of holding the commodity.", "D": "An increase in the spot price of the commodity."}, "answer": "C", "uitleg": "Carry costs = cost of funds + storage cost - convenience yield, en F0 = (S0 + U)(1 + (i - y)/f)^nf. 'n Hoër convenience yield (y) verlaag die net carry en dus die forward prys. Hoër rente, hoër storage en 'n hoër spot prys verhoog almal die forward prys.", "book_ref": "3.2, formulas 3.3 and 3.5, p.34-36", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "IDK", "n": "P-05", "question": "Consider a 9-month forward contract on maize. The spot price is R2 800 per ton, the interest rate is 10% per annum compounded quarterly, and storage cost of R90 per ton is payable after nine months. Because of expected shortages, millers are stockpiling and the convenience yield has risen to 18% of the spot price. The theoretical forward price and the resulting market condition are", "statements": [], "options": {"A": "R2 714.00 per ton; contango.", "B": "R2 714.00 per ton; backwardation.", "C": "R2 720.04 per ton; backwardation.", "D": "R3 105.29 per ton; contango."}, "answer": "B", "uitleg": "PV storage = 90 x (1.025)^-3 = R83.57. F0 = (2 800 + 83.57)(1 + (0.10 - 0.18)/4)^3 = 2 883.57 x 0.98^3 = R2 714.00. Omdat die forward prys onder die spot prys van R2 800 is, is dit backwardation. R2 720.04 vergeet om storage te verdiskonteer; R3 105.29 ignoreer die convenience yield.", "book_ref": "3.2, formula 3.5 and backwardation example, p.36-37; 4.1.2, p.41", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "IDK", "n": "P-06", "question": "Which of the following statements regarding the calculation of forward (and futures) prices are correct?", "statements": ["i. Using continuous compounding at the same nominal rate produces a slightly higher forward price than using monthly compounding.", "ii. The study book prescribes the continuous compounding convention for all forward price calculations.", "iii. The interest rate convention to be used is arbitrary and depends on the convention used in the particular carry cost market.", "iv. Storage cost is treated as a negative income, and its present value is added to the spot price."], "options": {"A": "(i), (iii) and (iv) only", "B": "(i), (ii) and (iii) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "A", "uitleg": "(i) Waar: continuous compounding gee 'n effens hoër prys (R264.14 teenoor R264.07 in die boek se voorbeeld). (iii) Waar: die konvensie is arbitrêr en hang af van die carry cost mark (bv. NACM as die banklening maandeliks compound). (iv) Waar: storage word as negatiewe inkomste hanteer en die PV word by S0 getel. (ii) is vals: die boek sê uitdruklik dat dit NIE continuous compounding gebruik nie.", "book_ref": "3.2, p.33-34", "topic": "Futures pricing", "note": null, "data": null}, {"paper": "IDK", "n": "P-07", "question": "Which of the following statements regarding forward contracts are correct?", "statements": ["i. A forward contract is an OTC agreement negotiated between two parties, known as counterparties.", "ii. A forward contract is a standardised contract that must be traded on a formal exchange.", "iii. Should one party default, the counterparty's only form of recourse is the normal remedies provided by the legal system.", "iv. Because a forward contract is a legal contract, it eliminates the risk of default by the other party."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i) and (iii) only", "C": "(ii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "B", "uitleg": "(i) en (iii) is waar: 'n forward is 'n OTC ooreenkoms tussen twee counterparties, en by default is die enigste verhaal die normale regsprosesse (tyd en geld). (ii) is vals: forwards is nie gestandaardiseer of noodwendig op 'n formele exchange verhandel nie. (iv) is vals: al is dit 'n regskontrak, elimineer dit nie default risk nie.", "book_ref": "3.1, p.30", "topic": "Forwards", "note": null, "data": null}, {"paper": "IDK", "n": "P-08", "question": "A feedlot owner enters into a forward contract with a farmer to buy 80 tons of yellow maize at R3 500 per ton for delivery at the end of August. At the end of August the spot price of yellow maize is R3 650 per ton. Compared to buying in the spot market at that time, the feedlot owner's forward position has resulted in a", "statements": [], "options": {"A": "loss of R12 000.", "B": "profit of R292 000.", "C": "loss of R280 000.", "D": "profit of R12 000."}, "answer": "D", "uitleg": "Die feedlot owner is long die forward. Die long party maak wins as die werklike prys hoër is as die kontrakprys: (3 650 - 3 500) x 80 = R12 000 wins. 'Loss of R12 000' is die perspektief van die short party (die boer). R292 000 en R280 000 is net die totale waarde teen spot of teen kontrakprys, nie die wins of verlies nie.", "book_ref": "3.1, p.30", "topic": "Forwards", "note": null, "data": null}, {"paper": "IDK", "n": "P-09", "question": "Which ONE of the following statements regarding cash-settling and physically delivered forwards is correct?", "statements": [], "options": {"A": "If the buyer and seller of a forward contract only exchange cash payments on the maturity date instead of the physical product, the contract is regarded as a cash-settling instrument and as a swap.", "B": "Fixed-price physical delivery forwards must be marked to market in the income statement in the same way as swaps and futures.", "C": "Accounting standards do not require companies to indicate whether a forward transaction is aimed at transferring ownership or only price risk.", "D": "A cash-settling forward involves the exchange of the physical commodity, with only the price difference settled in cash."}, "answer": "A", "uitleg": "Die boek sê 'n forward waar net kontant op maturity uitgeruil word, is 'n cash-settling instrument en word as 'n swap beskou (some practitioners noem dit 'n one period swap). B is vals: fixed-price physical delivery forwards hoef nie in die income statement marked to market te word nie. C is vals: IFRS vereis juis dat die intent (ownership vs price risk) aangedui word.", "book_ref": "3.3, p.37; 5.4, p.91", "topic": "Forwards", "note": null, "data": null}, {"paper": "IDK", "n": "P-10", "question": "Which ONE of the following statements regarding the difference between forwards and futures is correct?", "statements": [], "options": {"A": "The sum of the daily mark-to-market price movements over the life of a futures contract will always exceed the overall price movement of a forward with the same maturity.", "B": "Forward contracts are marked to market daily, while futures are settled once on the expiration day.", "C": "Because futures mark-to-market profits (losses) are carried at the risk-free rate until expiry, the time value of a futures position at expiry may be greater or less than the terminal value of the equivalent forward position.", "D": "Basis risk is more prominent in forward contracts than in futures trading, because forwards can be offset early."}, "answer": "C", "uitleg": "Volgens die boek word futures MTM winste/verliese teen die risk-free rate belê tot expiry, dus kan die tydwaarde groter of kleiner wees as die forward s'n, afhangend van die prys-pad. A is vals: die som van die daaglikse MTM bewegings is GELYK aan die forward se totale beweging. B draai forwards en futures om. D is vals: basis risk is minder prominent by forwards, want daar is geen early offset nie.", "book_ref": "3.2, p.37; 4.7.2, p.75", "topic": "Forwards", "note": null, "data": null}, {"paper": "IDK", "n": "P-11", "question": "On t1 the spot price of maize at a local silo is R3 120 per ton and the nearby futures price is R3 230 per ton. On t2 the spot price is R3 180 per ton and the futures price is R3 255 per ton. From t1 to t2 the basis has", "statements": [], "options": {"A": "weakened by R35 per ton, which benefits a short hedger.", "B": "strengthened by R35 per ton, which benefits a short hedger.", "C": "strengthened by R35 per ton, which benefits a long hedger.", "D": "weakened by R35 per ton, which benefits a long hedger."}, "answer": "B", "uitleg": "B1 = 3 120 - 3 230 = -R110; B2 = 3 180 - 3 255 = -R75. Die basis het minder negatief geword, dus versterk (narrowed) met R35. Die short hedger is 'long the basis' en baat by versterking (ontvang F1 + B2). Die long hedger is 'short the basis' en verloor as die basis versterk, want hy betaal F1 + B2.", "book_ref": "4.7, p.69-71", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "IDK", "n": "P-12", "question": "A maize farmer hedges 600 tons by selling 6 July white maize futures contracts at R3 400 per ton. Brokerage is R5 per ton per trade. Just before expiry he offsets his futures position when the July futures price is R3 260 per ton and sells his maize in the local spot market at R3 150 per ton. His total net cash flow (ignoring initial margin, which is returned) is", "statements": [], "options": {"A": "R1 974 000", "B": "R2 100 000", "C": "R1 800 000", "D": "R1 968 000"}, "answer": "D", "uitleg": "Effektiewe prys = F1 + B2 - brokerage = 3 400 + (3 150 - 3 260) - 10 = R3 280 per ton (of S2 + variation margin = 3 150 + 140 - 10). Vir 600 t (6 kontrakte x 100 t) = R1 968 000. R1 974 000 vergeet die brokerage op albei trades; R2 100 000 trek die basis af in plaas daarvan om dit by te tel; R1 800 000 het die teken van die variation margin verkeerd.", "book_ref": "4.7, p.69-70; 7.1.4, Table 7.3, p.148", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "IDK", "n": "P-13", "question": "A miller buys 20 December wheat futures contracts at R5 200 per ton to hedge 1 000 tons. Brokerage is R5 per ton per trade. In December he offsets his futures position at R5 450 per ton and buys the wheat in his local spot market at R5 300 per ton. The effective net price he pays per ton is", "statements": [], "options": {"A": "R5 060", "B": "R5 040", "C": "R5 050", "D": "R5 310"}, "answer": "A", "uitleg": "Long hedger betaal F1 + B2 plus brokerage: B2 = 5 300 - 5 450 = -R150, dus 5 200 - 150 + 10 = R5 060. Of: spot R5 300 minus variation margin wins R250 plus R10 brokerage. R5 050 vergeet brokerage; R5 040 trek brokerage af in plaas daarvan om dit by te tel; R5 310 ignoreer die futures wins.", "book_ref": "4.7, p.70; 7.1.4, Table 7.7, p.150", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "IDK", "n": "P-14", "question": "A miller is long 20 December wheat futures contracts (1 000 tons) bought at R5 200 per ton and decides to take delivery. Before delivery the futures position is closed at R5 450 per ton. He is allocated wheat at a silo where the location differential and handling fees amount to R160 per ton. Brokerage is R5 per ton per trade and JSE physical delivery charges are R2 per ton. Ignoring the cost of transporting the wheat from the allocated silo to his mill, the net price he pays per ton is", "statements": [], "options": {"A": "R5 212", "B": "R5 050", "C": "R5 052", "D": "R5 552"}, "answer": "C", "uitleg": "Volg Table 7.8: hy betaal JSE 5 450 - 160 = R5 290, ontvang variation margin van +R250, betaal brokerage R10 en delivery charges R2: 5 290 - 250 + 10 + 2 = R5 052. R5 050 vergeet die R2 delivery charge; R5 212 trek nie die location differential af nie; R5 552 behandel die variation margin as 'n uitgawe. Onthou: vervoer van die toegekende silo na die meule kom nog bo-op.", "book_ref": "7.1.4, Table 7.8, p.150-151", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "IDK", "n": "P-15", "question": "Which of the following statements regarding basis are correct?", "statements": ["i. Under normal conditions the basis for grain is positive.", "ii. A farmer who has sold futures to hedge his crop is long the basis and profits if the basis strengthens.", "iii. A weakening of the basis benefits a farmer who has sold futures to hedge his crop.", "iv. Basis risk is pronounced if the hedger closes out his futures position well before the expiry date of the futures contract."], "options": {"A": "(i) and (iii) only", "B": "(ii) and (iv) only", "C": "(i), (ii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "(ii) Waar: die short hedger is 'long the basis' en wen as die basis versterk. (iv) Waar: basis risk is groot as die hedge lank voor expiry gesluit word; by expiry is dit feitlik nul. (i) is vals: onder normale toestande is die basis negatief (contango). (iii) is vals: 'n verswakkende basis benadeel die futures seller (hy ontvang minder).", "book_ref": "4.7, p.69-71; 4.7.2, p.73", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "IDK", "n": "P-16", "question": "Which of the following statements regarding import and export parity prices for maize in South Africa are correct?", "statements": ["i. The domestic spot price of maize will normally go no higher than the import parity price.", "ii. The export parity price is the lowest possible domestic price, i.e. a minimum price.", "iii. During surplus periods, the rand price of maize tends to move towards import parity.", "iv. The actual level of the domestic price between the minimum and maximum depends on local supply as well as demand."], "options": {"A": "(i) and (iii) only", "B": "(ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(i), (ii) and (iv) only"}, "answer": "D", "uitleg": "Import parity is die maksimum prys (millers sal invoer by daardie vlak) en export parity die minimum; die werklike vlak tussenin hang af van plaaslike vraag en aanbod. (iii) is vals: in surplus-periodes beweeg die rand prys na EXPORT parity; in tekort-periodes na import parity.", "book_ref": "1.2, p.12; 4.8, p.76", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "IDK", "n": "P-17", "question": "Maize is in short supply around a particular silo. The current Randfontein spot (delivery month futures) price is R3 940 per ton, the JSE transport differential to the silo is R185 per ton, and a large local buyer is willing to pay an area (basis) premium of R70 per ton. A large producer delivering maize at this silo will receive", "statements": [], "options": {"A": "R3 825 per ton", "B": "R3 685 per ton", "C": "R3 755 per ton", "D": "R4 055 per ton"}, "answer": "A", "uitleg": "Prys ontvang = Randfontein prys - transport differential + area premium = 3 940 - 185 + 70 = R3 825. R3 685 trek die premie af in plaas daarvan om dit by te tel; R3 755 ignoreer die premie; R4 055 tel die differential by in plaas daarvan om dit af te trek.", "book_ref": "4.8, p.76; 4.8.2, p.77", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "IDK", "n": "P-18", "question": "A swap dealer prices a 9-month fixed-for-floating crude oil swap with three quarterly resets. Using the information in the table and the simple interest method for discounting, the fixed price per barrel that gives the swap a zero value at inception is closest to", "statements": [], "options": {"A": "$74.43", "B": "$72.77", "C": "$74.41", "D": "$76.80"}, "answer": "C", "uitleg": "PV floating = 72.40/1.010 + 74.10/1.022 + 76.80/1.036 = $218.32. Som van diskontofaktore = 0.9901 + 0.9785 + 0.9653 = 2.9338. Fix = 218.32 / 2.9338 = $74.41. $74.43 is net die eenvoudige gemiddeld van die futures pryse (geen diskontering); $72.77 is PV gedeel deur 3 (fixed flows nie verdiskonteer nie); $76.80 is net die laaste futures prys.", "book_ref": "5.7, p.94-96", "topic": "Swaps", "note": null, "data": "Months to reset | WTI futures (USD) | Reference rate (simple, p.a.)\n3 | 72.40 | 4.0%\n6 | 74.10 | 4.4%\n9 | 76.80 | 4.8%"}, {"paper": "IDK", "n": "P-19", "question": "An oil consumer has bought a fixed-for-floating crude oil swap from a swap dealer at a fixed price of $85.00 per barrel on a notional of 50 000 barrels. On a reset date the floating reference price is $81.40 per barrel. On that reset date", "statements": [], "options": {"A": "the dealer pays the consumer $180 000.", "B": "the consumer pays the dealer $180 000.", "C": "the consumer pays the dealer $4 250 000 and the dealer pays the consumer $4 070 000.", "D": "the consumer pays the dealer $18 000."}, "answer": "B", "uitleg": "Die koper van die swap betaal fixed en ontvang floating. Floating (81.40) is laer as fixed (85.00), dus betaal die consumer die verskil: 3.60 x 50 000 = $180 000. In die praktyk word net die verskil betaal (die notional word nooit uitgeruil nie), dus is C verkeerd. Die consumer koop sy olie goedkoper in die spot mark, sodat sy effektiewe koste $85 bly.", "book_ref": "5.2, p.89-90; 5.6, p.93", "topic": "Swaps", "note": null, "data": null}, {"paper": "IDK", "n": "P-20", "question": "Which of the following statements regarding the advantages and disadvantages of commodity swaps are correct?", "statements": ["i. Swaps are not subject to the daily margining requirements of futures, which may, however, bear the possibility of credit risk.", "ii. Because swaps do not culminate in physical delivery, a producer who hedges with a swap carries no production risk.", "iii. Limited liquidity and counterparty risk are disadvantages of commodity swaps.", "iv. Lower transaction cost and customisation are advantages of commodity swaps."], "options": {"A": "(ii) and (iii) only", "B": "(i) and (iv) only", "C": "(i), (ii) and (iii) only", "D": "(i), (iii) and (iv) only"}, "answer": "D", "uitleg": "(i) Waar: geen daaglikse margining nie (buigsaam), maar dit bring moontlike credit risk. (iii) en (iv) kom direk uit die boek se tabel. (ii) is vals: al lewer swaps nie fisies nie, is daar steeds production risk; die boer wat 'n swap teen R4 000/t het en geen oes het nie, moet steeds R1 000/t betaal as die prys na R5 000/t styg.", "book_ref": "5.6, p.93-94", "topic": "Swaps", "note": null, "data": null}, {"paper": "IDK", "n": "O-01", "question": "The September wheat futures contract is trading at R3 240 per ton. Which of the following options on September wheat futures are in-the-money or at-the-money as indicated?", "statements": ["i. A R3 200 call is in-the-money.", "ii. A R3 300 put is in-the-money.", "iii. A R3 240 put is at-the-money.", "iv. A R3 280 call is in-the-money."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(ii), (iii) and (iv) only", "D": "(i), (iii) and (iv) only"}, "answer": "B", "uitleg": "Call is ITM as futures > strike (3 240 > 3 200); put is ITM as futures < strike (3 240 < 3 300); strike = futures beteken ATM. Die R3 280 call is OTM, want futures (3 240) < strike (3 280), so (iv) is verkeerd.", "book_ref": "6.4.5, p.106-107 (Table 6.1)", "topic": "Options basics", "note": null, "data": null}, {"paper": "IDK", "n": "O-02", "question": "A trader buys one December white maize (WMAZ) put option with a strike price of R2 400 per ton at a premium of R95 per ton when the December futures price is R2 330 per ton. One option contract has one futures contract of 100 tons as underlying. What are the intrinsic value and the time value of the option contract respectively?", "statements": [], "options": {"A": "Intrinsic value R2 500; time value R7 000", "B": "Intrinsic value R0; time value R9 500", "C": "Intrinsic value R7 000; time value R2 500", "D": "Intrinsic value R70; time value R25"}, "answer": "C", "uitleg": "Put intrinsic = strike - futures = 2 400 - 2 330 = R70/t; time value = 95 - 70 = R25/t. Per kontrak x 100 t: R7 000 intrinsic en R2 500 time value. Opsie A ruil die twee om; B hanteer dit soos 'n call (geen intrinsic); D is per ton, nie per kontrak nie.", "book_ref": "6.3, p.101; 6.4.4, p.106; 6.7, p.111", "topic": "Options basics", "note": null, "data": null}, {"paper": "IDK", "n": "O-03", "question": "Which of the following statements regarding the rights and obligations of exchange-traded option holders and writers are correct?", "statements": ["i. When a put option is exercised, the writer of the put is assigned a long futures position at the strike price.", "ii. The writer who is assigned the opposite futures position is randomly selected by the exchange trading computer program.", "iii. In the OTC market, option contracts can freely be sold to third parties.", "iv. Offsetting an option before expiration is the only way to recover any remaining time value."], "options": {"A": "(i), (ii) and (iv) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iii) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "A", "uitleg": "Put writer word 'n long futures toegeken; die writer word ewekansig deur die exchange se rekenaarprogram gekies; slegs offset herwin oorblywende time value. (iii) is vals: in die OTC mark kan opsiekontrakte NIE aan derde partye verkoop word nie.", "book_ref": "6.4, p.103; 6.6.1, p.110", "topic": "Options basics", "note": null, "data": null}, {"paper": "IDK", "n": "O-04", "question": "Which ONE of the following statements regarding grain options listed on the JSE CDM is correct?", "statements": [], "options": {"A": "Grain options on the JSE CDM are all of the European type and can only be exercised on the expiry date.", "B": "Strike prices of maize and wheat options are set in intervals of R10 per ton.", "C": "Grain options expire on the same day as the underlying futures contract.", "D": "When a JSE CDM option expires in-the-money, it is automatically exercised by the exchange and futures positions are assigned to the buyer and the seller."}, "answer": "D", "uitleg": "Volgens die boek word 'n ITM opsie by expiry outomaties deur die exchange uitgeoefen en futures word aan koper en verkoper toegeken. Die grain options is American (nie European nie), strikes is in R20/t intervalle, en opsies verval 5 business days voor die maand wat die futures expiry-maand voorafgaan, nie op dieselfde dag nie.", "book_ref": "6.3, p.101; 6.6, p.109; 6.6.1, p.111", "topic": "Options basics", "note": null, "data": null}, {"paper": "IDK", "n": "O-05", "question": "Which of the following statements regarding the factors that affect an option's premium are correct?", "statements": ["i. Time value is at its highest when an option is at-the-money.", "ii. Higher interest rates, all else being equal, should make options more expensive.", "iii. Time value does not erode on a straight-line basis, but decreases much more rapidly during the last few weeks of the option's life.", "iv. The relationship between time to expiration and the option premium is measured by theta."], "options": {"A": "(i) and (ii) only", "B": "(ii), (iii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "C", "uitleg": "Time value is die hoogste by ATM; time decay volg 'n negatief eksponensiele kurwe en versnel in die laaste weke; theta meet die verband met tyd tot expiry. (ii) is vals: volgens die boek maak hoer rentekoerse (ceteris paribus) opsies GOEDKOPER (rho), want die koper se opportunity cost styg en die writer verdien meer op die premie.", "book_ref": "6.7, p.111-114", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "IDK", "n": "O-06", "question": "Which ONE of the following statements regarding volatility and option values is correct?", "statements": [], "options": {"A": "The intrinsic value of an in-the-money option increases in direct proportion to an increase in volatility.", "B": "The level of volatility affects the delta of in-the-money and out-of-the-money options, but not that of at-the-money options.", "C": "When purchasing options, an investor is said to be selling volatility.", "D": "The SAVI-White Maize is based on the historical volatility of white maize prices over the past three months."}, "answer": "B", "uitleg": "Die boek se: volatility beinvloed die delta van ITM en OTM opsies, maar nie ATM opsies nie. Intrinsic value word nie direk deur volatility geraak nie; 'n opsie-koper 'koop' volatility (die writer verkoop dit); SAVI-White Maize is forward-looking (implied, ATM vol), nie histories nie.", "book_ref": "6.7(iii), p.113-114; 6.13.1, p.137; 7.3.3, p.163; 7.3.6, p.165", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "IDK", "n": "O-07", "question": "An option trader has written (sold) 20 July white maize put options. The delta of each put option is -0.35. To be delta neutral, how should the trader initially hedge, and what should the trader do if the futures price then falls and the put delta changes to -0.45?", "statements": [], "options": {"A": "Sell 7 futures contracts; then sell 2 more futures contracts.", "B": "Buy 7 futures contracts; then buy 2 more futures contracts.", "C": "Sell 7 futures contracts; then buy back 2 futures contracts.", "D": "Buy 7 futures contracts; then sell 2 futures contracts."}, "answer": "A", "uitleg": "Short put hedge = sell delta units: 20 x 0.35 = 7 futures verkoop. Met delta -0.45: 20 x 0.45 = 9 nodig, dus verkoop nog 2. Die boek se die put writer verkoop progressief futures as die prys val (hedge vergroot); 'buy' is die hedge vir 'n long put.", "book_ref": "7.3.4, p.164-165; 7.3.7, p.165", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "IDK", "n": "O-08", "question": "A trader holds 10 long WMAZ call options with a delta of 0.6 and 8 short WMAZ put options (option delta -0.3) on the same futures contract (100 tons per contract). If the futures price rises by R4 per ton, the approximate change in the value of the combined option position, based on delta, is", "statements": [], "options": {"A": "+R1 440", "B": "+R33.60", "C": "-R960", "D": "+R3 360"}, "answer": "D", "uitleg": "Long call: +0.6 x R4 x 100 t x 10 = +R2 400. Short put het 'n positiewe position delta (+0.3): +0.3 x R4 x 100 x 8 = +R960. Totaal = +R3 360. A trek die short put verkeerdelik af (teken-fout); B vergeet die 100 t kontrakgrootte.", "book_ref": "7.3.2, p.162-163 (Table 7.15); 7.3.4, p.164", "topic": "Option pricing & greeks", "note":
