diteit en maklike close-out. Forwards is minder likied, en die clearing house verminder credit risk by futures, so (iii) en (iv) is omgekeerd.", "book_ref": "4.2, pp.42-43", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 10, "question": "A large bread baker wants to hedge his future input costs and enters into a wheat futures contract at R2 600 per ton. He would typically enter into a", "statements": [], "options": {"A": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "B": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 500 per ton.", "C": "short position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton.", "D": "long position and he would make a profit on the futures market if the wheat price at expiry hits R2 700 per ton."}, "answer": "D", "uitleg": "Die bakker koop koring, so hy vrees prysstygings en neem 'n long position (long hedge). 'n Long position maak wins as die prys styg, dus by R2 700 (R100/t wins).", "book_ref": "4.9 (hedging/basis), pp.69-71", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 11, "question": "Which of the following statements about price discovery in the agricultural markets are correct?", "statements": ["i. For wheat the old-crop/new-crop price spread is represented by the price difference between the September and December futures contracts.", "ii. For maize the old-crop/new-crop price spread is represented by the price difference between the May and July futures contracts.", "iii. To avoid large swings in contract prices the JSE has introduced daily price limits for each commodity except for the spot month contract.", "iv. In order to prevent excessive price fluctuations, the price limits for each commodity on the JSE remain unchanged for the duration of an entire season."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "Koring se old-crop/new-crop spread is September vs Desember (waar); vir mielies is dit Maart vs Mei, nie Mei vs Julie nie. Price limits geld vir alle hedging months behalwe die spot month (waar). Limiete verander wel, bv. extended limits (150%) word geaktiveer, so (iv) is vals.", "book_ref": "4.3, p.47; 8.14, p.182", "topic": "Price discovery & limits", "note": null, "data": null}, {"paper": "P3", "n": 12, "question": "A SAFEX silo receipt issued by a JSE approved silo owner", "statements": [], "options": {"A": "is only issued to a soybean producer after he has delivered 100 tons of soybeans.", "B": "is only issued to a wheat producer after he has delivered 100 tons of wheat.", "C": "is only issued to a sunflower producer after he has delivered 100 tons of sunflower seed.", "D": "is only issued to a white maize producer after he has delivered 100 tons of maize."}, "answer": "D", "uitleg": "'n JSE silo receipt verteenwoordig een kontrak se hoeveelheid. Slegs mielies (wit en geel) se kontrakgrootte is 100 ton; koring, sonneblom en sojabone is 50 ton. Dus is slegs D konsekwent.", "book_ref": "4.5, pp.49-50; Table 4.3, p.54", "topic": "Delivery", "note": null, "data": null}, {"paper": "P3", "n": 13, "question": "Which of the following statements with regard to the various ways in which physical delivery for grain can be executed on the JSE are correct?", "statements": ["i. Market participants wishing to exchange a long futures position for a spot position would sell an Exchange for Physicals contract.", "ii. The JSE can process the actual delivery in an Exchange for Physical transaction should the counterparties prefer this.", "iii. The JSE processes an Exchange for Physical transaction at the marked-to-market price as on transaction date.", "iv. A participant offering grain on a silo receipt auction should have access to the physical product as represented on the silo receipt."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iii) only", "C": "(i), (iii) and (iv) only", "D": "(iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek sê letterlik: 'n meulenaar wat sy long futures vir spot ruil, 'sells an EFP' (i); 'The JSE can process the actual physical delivery should the two counterparties prefer this' (ii); en die EFP 'is processed at the current MTM value' (iii). Memo C sluit (ii) uit, wat direk teen die boek se teks gaan. Stelling (iv) word nie in die boek genoem nie.", "book_ref": "4.5 (i) EFP, pp.51-52", "topic": "Delivery", "note": "Die memo het C gesê, maar volgens die handboek is B reg.", "data": null}, {"paper": "P3", "n": 14, "question": "In the case of illiquid contracts, the marked-to-market (MTM) price will be decided using a random sample in the last 5 minutes of trade. The offer will be used as the MTM price if the offer is", "statements": [], "options": {"A": "higher than the last traded price.", "B": "lower than the last traded price.", "C": "higher than the average traded price.", "D": "lower than the average traded price."}, "answer": "B", "uitleg": "Vir illiquid contracts: as die bid hoër as die laaste verhandelde prys is, word die bid gebruik; as die offer laer as die laaste verhandelde prys is, word die offer die MTM. Liquid contracts gebruik VWAP.", "book_ref": "4.6, p.56", "topic": "Margining & MTM", "note": null, "data": null}, {"paper": "P3", "n": 16, "question": "On SAFEX, the futures expiry date of a futures contract coincides with the last", "statements": [], "options": {"A": "position day.", "B": "notice day.", "C": "delivery day.", "D": "trading day."}, "answer": "D", "uitleg": "In die kontrakspesifikasies staan 'Expiry Dates & Times (Last Trading Day)': die expiry date is die laaste handelsdag (12h00 op die sesde laaste besigheidsdag van die maand). Die laaste notice day is die tweede laaste besigheidsdag, en dit is iets anders.", "book_ref": "Contract specs, p.66; definitions p.59", "topic": "Futures basics", "note": null, "data": null}, {"paper": "P3", "n": 17, "question": "Which of the following statements about futures contract specifications are correct?", "statements": ["i. The standard contract size for yellow maize is 100 metric tons.", "ii. The underlying commodity for WOPT contracts is second grade white maize from any origin.", "iii. Physical delivery on wheat futures contracts can take place on any day from the first business day to last business day of an expiry month.", "iv. A constant month contract for wheat is introduced 40 business days preceding a non-standard hedging month."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "YMAZ is 100 ton (i waar), WOPT is WM2 of beter van enige oorsprong (ii waar), en constant months word 40 besigheidsdae vooraf ingestel (iv waar). Die memo se C kan nie reg wees nie, want (i) is volgens die boek waar. (iii) is dubbelsinnig: die teks op p.49-50 sê aflewering kan op enige besigheidsdag in die maand plaasvind (ook die laaste), maar die spesifikasietabel sê eerste tot 4de laaste besigheidsdag.", "book_ref": "4.5 p.50; contract specs pp.61-66", "topic": "Delivery", "note": "Die vraag is swak opgestel: stelling (iii) bots met die spesifikasietabel (aflewering tot die 4de laaste besigheidsdag). D is die enigste opsie wat werk, want (i), (ii) en (iv) is beslis waar. Die memo het C gesê.", "data": null}, {"paper": "P3", "n": 18, "question": "On 20 March (t1) miller John buys July maize futures at R1 850 per ton when the spot price of maize is R1 800 per ton. On 8 April (t2) the maize spot price moves to R1 810 while the July futures price changes to R1 855. The basis on 8 April is", "statements": [], "options": {"A": "R50 per ton \"under\".", "B": "R50 per ton \"over\".", "C": "R45 per ton \"under\".", "D": "R45 per ton \"over\"."}, "answer": "C", "uitleg": "Basis = spot - futures. Op 8 April: 1 810 - 1 855 = -R45, dus R45 'under'. R50 under (memo A) is die basis op 20 Maart (t1), nie 8 April nie.", "book_ref": "4.9, p.69", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null}, {"paper": "P3", "n": 19, "question": "A participant who sells a futures contract is said to be ____ the basis and will benefit if the basis ____.", "statements": [], "options": {"A": "short; weakens", "B": "short; strengthens", "C": "long; strengthens", "D": "long; weakens"}, "answer": "C", "uitleg": "Die boek: die short hedger (wat futures verkoop) is 'long the basis' en baat by 'n basis wat versterk (strengthen/narrow). Die long hedger (koper van futures) is 'short the basis' en baat as die basis verswak. Memo A is die beskrywing van die koper, nie die verkoper nie.", "book_ref": "4.9, p.71", "topic": "Basis & hedging", "note": "Die memo het A gesê, maar volgens die handboek is C reg.", "data": null}, {"paper": "P3", "n": 20, "question": "On 20 July (t1) miller John buys December wheat futures at R2 970 per ton when the spot price of wheat is R2 905 per ton. On 18 August (t2) the wheat spot price hits R2 900 per ton with the December futures price at R2 975. If he closes out his futures position on 18 August, what will John effectively pay for his wheat?", "statements": [], "options": {"A": "R2 895 per ton", "B": "R3 045 per ton", "C": "R2 910 per ton", "D": "R2 975 per ton"}, "answer": "A", "uitleg": "Futures-wins: 2 975 - 2 970 = +R5/t. Hy koop fisies teen R2 900, so effektief 2 900 - 5 = R2 895/t. Of: F1 + B2 = 2 970 + (2 900 - 2 975) = R2 895. R3 045 (memo B) is 2 970 + 75, waar die basis met die verkeerde teken bygetel is.", "book_ref": "4.9, pp.69-71", "topic": "Basis & hedging", "note": "Die memo het B gesê, maar volgens die handboek is A reg.", "data": null}, {"paper": "P3", "n": 21, "question": "Which ONE of the following statements correctly reflects the characteristics of the local spot price of maize?", "statements": [], "options": {"A": "It should be the same in Randfontein as in Pretoria West.", "B": "It reflects the SAFEX futures price in the delivery month.", "C": "It should normally be higher than the import parity price.", "D": "It is largely dictated by silo owners who control the supply."}, "answer": "B", "uitleg": "Die boek sê die JSE CDM futures prys vir die afleweringsmaand is die werklike spot prys (Randfontein-gebaseer). Spot pryse verskil per ligging weens location differentials, en import parity is die maksimum, nie 'n vloer nie.", "book_ref": "4.8, pp.75-76", "topic": "Physical market", "note": null, "data": null}, {"paper": "P3", "n": 22, "question": "The amount on which the magnitude of the fixed and floating cash flows in a swap is calculated is called the", "statements": [], "options": {"A": "primary total.", "B": "notional principal.", "C": "basis amount.", "D": "reference value."}, "answer": "B", "uitleg": "Die boek definieer die notional principal as die bedrag waarop die grootte van die vaste en vlottende kontantvloei bereken word. Dit word self nooit uitgeruil nie.", "book_ref": "5.2, p.89", "topic": "Swaps", "note": null, "data": null}, {"paper": "P3", "n": 23, "question": "Which ONE of the following statements with regard to commodity swaps is correct?", "statements": [], "options": {"A": "Generally commodity swaps are settled by exchanging the physical underlying commodity on each reset date.", "B": "Locally, some large grain consumers avoid using cash settling swaps to hedge as they have to comply with complex international accounting standards.", "C": "Since commodity swaps are exchange traded, they are considered very liquid hedging instruments.", "D": "The basic principle in pricing a swap is that the swap must have a positive value at inception."}, "answer": "B", "uitleg": "Groot graanverbruikers verkies OTC forwards bo cash-settling swaps weens IFRS-vereistes (fair value op die balansstaat, wisselvallige verdienste). Swaps word in kontant vereffen, is OTC (nie exchange traded nie), en moet by aanvang 'n waarde van nul hê.", "book_ref": "5.3, p.91; 5.7, p.94", "topic": "Swaps", "note": null, "data": null}, {"paper": "P3", "n": 24, "question": "An investor who originally sold the right to buy an agricultural future at a specified price on a specified date in the future, is referred to as the", "statements": [], "options": {"A": "holder of a call option.", "B": "holder of a put option.", "C": "writer of a call option.", "D": "writer of a put option."}, "answer": "C", "uitleg": "Die reg om te koop is 'n call option. Wie die reg verkoop het, is die writer (short), dus die writer of a call option.", "book_ref": "6.1-6.3, pp.99-101", "topic": "Options basics", "note": null, "data": null}, {"paper": "P3", "n": 26, "question": "An investor has taken a long position in an OTM (out-the-money) call option in the December White Maize future. What will happen to the option's value if the price of the future decreases?", "statements": [], "options": {"A": "Increase, as the option moves closer to being ITM (in-the-money).", "B": "Increase, as the option moves further OTM.", "C": "Decrease, as the option moves closer to being ITM.", "D": "Decrease, as the option moves further OTM."}, "answer": "D", "uitleg": "'n Call se waarde is positief verwant aan die futures-prys (delta > 0). As die futures-prys daal, beweeg die OTM call verder OTM en die waarskynlikheid om ITM te eindig daal, dus daal die waarde. 'n Call beweeg nader aan ITM net as die prys styg.", "book_ref": "6.4.5 p.106; 6.7 p.112", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P3", "n": 27, "question": "An investor buys a call option on the December white maize contract, with a strike price of R800, for R50 per contract. Assuming that the current price for the futures contract is R820, what would the time value and intrinsic value of each option contract be respectively?", "statements": [], "options": {"A": "Time value will be R50 and intrinsic value will be R30.", "B": "Time value will be R30 and intrinsic value will be R50.", "C": "Time value will be R30 and intrinsic value will be R20.", "D": "Time value will be R20 and intrinsic value will be R30."}, "answer": "C", "uitleg": "Intrinsic value van 'n call = max(0, F - K) = 820 - 800 = R20. Time value = premie - intrinsic value = 50 - 20 = R30. Let op die volgorde: time value eerste (R30), dan intrinsic (R20); D ruil dit om.", "book_ref": "6.4.4 p.106", "topic": "Options basics", "note": null, "data": null}, {"paper": "P3", "n": 28, "question": "Consider four individual call options with similar characteristics in terms of size, underlying asset and maturity date. If the market price of the underlying asset is R100, then the option that will proportionally gain the most time value if volatility increases, is the one with the following strike price:", "statements": [], "options": {"A": "R80", "B": "R90", "C": "R100", "D": "R110"}, "answer": "D", "uitleg": "Die boek sê 'n ATM opsie se prys verander met dieselfde persentasie as volatility, maar 'n verandering in volatility het 'n 'marked effect' op die prys van 'n out-of-the-money opsie (dit word net winsgewend as volatility toeneem). Proporsioneel (persentasie) wen die OTM call (strike R110) dus die meeste. In absolute rand het die ATM opsie (R100) die grootste vega - dis die lokval.", "book_ref": "6.7 (iii), p.113-114", "topic": "Option pricing & greeks", "note": null, "data": null}, {"paper": "P3", "n": 29, "question": "A farmer is concerned that the price of white maize will drop around the time he expects to harvest his crop. According to some of the other farmers in the district, the price of White Maize will increase dramatically as they expect adverse weather in other countries to result in a supply shortage. Which ONE of the following positions should the farmer enter into if he is to limit his potential losses, but still wants to share in the profits should prices increase? He should take a", "statements": [], "options": {"A": "short position in a call option.", "B": "short position in a futures contract.", "C": "long position in a put option.", "D": "long position in a futures contract."}, "answer": "C", "uitleg": "'n Long put gee die boer 'n vloerprys (beperk verliese as pryse daal) terwyl hy steeds voordeel trek as pryse styg; hy verloor net die premie. 'n Short futures beskerm ook, maar sluit die opside uit. 'n Short call beskerm nie teen 'n groot prysdaling nie.", "book_ref": "6.2 p.100; 7.1.5 p.156", "topic": "Option strategies", "note": null, "data": null}, {"paper": "P3", "n": 33, "question": "A prudent grain elevator owner would use the commodity derivatives market to obtain protection against", "statements": [], "options": {"A": "a decrease in price before purchasing the maize.", "B": "a decrease in price during its maize holding period.", "C": "an increase in price during its maize holding period.", "D": "an increase in price after selling the maize."}, "answer": "B", "uitleg": "Die boek noem 'merchandisers, elevators' as hedgers wat beskerming nodig het teen laer pryse gedurende hul mielie-houperiode. Hulle besit die voorraad (long physical), so 'n prysdaling is die risiko. 'n Prysstyging tydens die houperiode is juis voordelig vir hulle.", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 34, "question": "Which of the following are an objective of hedging using a commodity futures contract?", "statements": ["(i) Protecting profit margins.", "(ii) Locking in certain cash flows.", "(iii) Increase exposure to the commodity.", "(iv) Diversification of one's overall position."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek lys redes vir hedging: protect profit margins, stabilise (lock in) cash flows, transfer risk, diversify en improve liquidity. 'Increase exposure to the commodity' is spekulasie, nie hedging nie - hedging verminder blootstelling.", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 35, "question": "A long hedge may be defined as taking a", "statements": [], "options": {"A": "short position in the futures contract to hedge an existing short position.", "B": "short position in the futures contract to hedge an existing long position.", "C": "long position in the futures contract to hedge an existing short physical position.", "D": "long position in the futures contract to hedge an existing long position."}, "answer": "C", "uitleg": "'n Long (buying) hedge: iemand wat die produk nodig het (bv. 'n meulenaar) is 'short' in die fisiese mark en koop futures (long) om teen stygende pryse te beskerm. B is die definisie van 'n short hedge.", "book_ref": "7.1.2, p.142-143", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 36, "question": "Baker John Motsepe from Bela Bela is concerned that the price of wheat may rise due to poor crop conditions experienced in America and in Australia. He would like to hedge his exposure to 2 000 tons of wheat that he will need during December. He phones his broker and instructs him to buy (go long) 40 December wheat contracts at R2 000/ton. Brokerage also amounts to R5/t per trade. Location differential and handling fees for Bela Bela amount to R100/ton and this basis (which is R100 'under') also remains constant. During December, baker Motsepe exits his entire futures position by offsetting at the new futures price of R1 600/ton and buys the wheat in the spot market. If the basis remains constant, his cash flow position will be as per the table. Should the basis strengthen by R15 per ton in December, the total net cash flow for Baker Motsepe will change to", "statements": [], "options": {"A": "-R3 850 000", "B": "-R3 830 000", "C": "-R3 820 000", "D": "-R3 790 000"}, "ans const STORE = "safex-oefen-v1";

QUESTIONS.forEach(q => { q.id = q.paper + "-" + q.n; });
const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));

// stats[id] = {seen, right, streak}; wrong ids leave the review list after 2 right in a row
let state = load();
function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || { stats: {}, exams: [] }; }
  catch { return { stats: {}, exams: [] }; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
function record(q, ok) {
  const s = state.stats[q.id] || (state.stats[q.id] = { seen: 0, right: 0, streak: 0, review: false });
  s.seen++;
  if (ok) { s.right++; s.streak++; if (s.streak >= 2) s.review = false; }
  else { s.streak = 0; s.review = true; }
  save();
}
const reviewIds = () => QUESTIONS.filter(q => state.stats[q.id]?.review).map(q => q.id);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
const topics = [...new Set(QUESTIONS.map(q => q.topic))].sort();

// ---------- home ----------

  stopTimer();

  const seen = Object.values(state.stats).filter(s => s.seen).length;

    <div class="card">
      <p><b>${seen}</b> / ${QUESTIONS.length} vrae al gesien · <b>${rev}</b> om te herhaal${last ? ` · laaste eksamen: <b class="${last.pct >= 70 ? "pass" : "fail"}">${last.pct}%</b>` : ""}</p>
    </div>
    ${rev ? `<button class="primary" onclick="startPractice(reviewIds(), 'Herhaal foute')">🔁 Herhaal my foute (${rev})</button>` : ""}
    <button ${rev ? "" : 'class="primary"'} onclick="startPractice(QUESTIONS.map(q=>q.id), 'Alles geskommel')">🎯 Oefen: alles geskommel</button>
    <button onclick="startExam()">⏱️ Eksamenmodus: 50 vrae, 60 minute</button>

    <h2>Per onderwerp</h2>

    <p class="muted" style="margin-top:20px">Vordering bly op hierdie foon gestoor.
      <button class="small" onclick="if(confirm('Vee alle vordering uit?')){state={stats:{},exams:[]};save();home()}">Begin oor</button></p>`;
}

// ---------- practice ----------
let P = null;
function startPractice(ids, title, inOrder) {
  if (!ids.length) return;
  P = { title, queue: inOrder ? ids.slice() : shuffle(ids), done: 0, right: 0, total: ids.length, answered: null };
  showPractice();
}
function qHtml(q) {
  return `
    <div><span class="tag">${esc(SOURCES[q.paper] || q.paper)} · V${esc(q.n)}</span><span class="tag">${esc(q.topic)}</span></div>
    <p style="margin-top:10px"><b>${esc(q.question)}</b></p>
    ${q.data ? `<pre class="data">${esc(q.data)}</pre>` : ""}
    ${q.statements?.length ? `<ul class="stmts">${q.statements.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}`;
}
function showPractice() {
  const id = P.queue[0];
  if (!id) return practiceDone();
  const q = byId[id];
  P.answered = null;
  app.innerHTML = `
    <div class="bar"><button class="small" onclick="home()">← Tuis</button><span>${esc(P.title)} · ${P.done}/${P.total} · ✅ ${P.right}</span></div>
    <div class="progress"><div style="width:${100 * P.done / P.total}%"></div></div>
    ${qHtml(q)}
    <div id="opts">${Object.entries(q.options).map(([k, v]) =>
      `<button class="opt" data-k="${k}" onclick="answerPractice('${k}')"><b>${k}</b><span>${esc(v)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  window.scrollTo(0, 0);
}
function feedbackHtml(q, ok) {
  return `<div class="card feedback ${ok ? "" : "bad"}">
    <p><b>${ok ? "✅ Reg!" : `❌ Die antwoord is ${q.answer}.`}</b></p>
    <p>${esc(q.uitleg)}</p>
    ${q.book_ref ? `<p class="muted">📖 Handboek: ${esc(q.book_ref)}</p>` : ""}
    ${q.note ? `<p class="flag">⚠️ ${esc(q.note)}</p>` : ""}
  </div>`;
}
function answerPractice(k) {
  if (P.answered) return;
  const q = byId[P.queue[0]];
  const ok = k === q.answer;
  P.answered = k;
  record(q, ok);
  document.querySelectorAll("#opts .opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.k === q.answer) b.classList.add("correct");
    else if (b.dataset.k === k) b.classList.add("wrong");
  });
  P.queue.shift();
  if (ok) { P.done++; P.right++; }
  else P.queue.splice(Math.min(3, P.queue.length), 0, q.id); // comes back 3 questions later
  document.getElementById("fb").innerHTML = feedbackHtml(q, ok) +
    `<button class="primary" onclick="showPractice()">Volgende →</button>`;
  document.getElementById("fb").scrollIntoView({ behavior: "smooth", block: "start" });
}
function practiceDone() {
  app.innerHTML = `<h1>Klaar! 🎉</h1>
    <div class="card"><p>${esc(P.title)}: al ${P.total} vrae reg beantwoord.</p>
    <p class="muted">Vrae wat jy verkeerd gehad het, het teruggekom totdat jy hulle reg gehad het.</p></div>
    <button class="primary" onclick="home()">Terug tuis</button>`;
}

// ---------- exam ----------
let E = null, timer = null;
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function startExam() {
  // the papers share many questions; skip repeats of the same stem
  const seen = new Set();
  const ids = shuffle(QUESTIONS).filter(q => {
    const key = q.question.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 80);
    return !seen.has(key) && seen.add(key);
  }).slice(0, 50).map(q => q.id);
  E = { ids, picks: {}, i: 0, end: Date.now() + 60 * 60 * 1000 };
  stopTimer();
  timer = setInterval(() => {
    const el = document.getElementById("clock");
    const left = E.end - Date.now();
    if (left <= 0) return finishExam();
    if (el) el.textContent = fmt(left);
  }, 1000);
  showExam();
}
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function showExam() {
  const q = byId[E.ids[E.i]];
  const answered = Object.keys(E.picks).length;
  app.innerHTML = `
    <div class="bar"><span>Vraag ${E.i + 1}/${E.ids.length} · ${answered} beantwoord</span><b id="clock">${fmt(E.end - Date.now())}</b></div>
    <div class="grid">${E.ids.map((id, i) =>
      `<button class="${E.picks[id] ? "done" : ""} ${i === E.i ? "cur" : ""}" onclick="E.i=${i};showExam()">${i + 1}</button>`).join("")}</div>
    <div class="card">${qHtml(q).replace(/<span class="tag">[^<]*<\/span><span class="tag">[^<]*<\/span>/, "")}
    ${Object.entries(q.options).map(([k, v]) =>
      `<button class="opt ${E.picks[q.id] === k ? "picked" : ""}" onclick="E.picks['${q.id}']='${k}';${E.i < E.ids.length - 1 ? "E.i++;" : ""}showExam()"><b>${k}</b><span>${esc(v)}</span></button>`).join("")}</div>
    <div class="bar">
      <button class="small" ${E.i ? "" : "disabled"} onclick="E.i--;showExam()">← Vorige</button>
      <button class="small" ${E.i < E.ids.length - 1 ? "" : "disabled"} onclick="E.i++;showExam()">Volgende →</button>
    </div>
    <button class="primary" onclick="if(confirm('Handig in? ${E.ids.length - answered} onbeantwoord.'))finishExam()">Handig in</button>
    <button class="small" onclick="if(confirm('Los die eksamen?'))home()">Los</button>`;
  window.scrollTo(0, 0);
}
function finishExam() {
  stopTimer();
  let right = 0;
  E.ids.forEach(id => { const q = byId[id]; const k = E.picks[id]; const ok = k === q.answer; if (ok) right++; record(q, ok); });
  const pct = Math.round(100 * right / E.ids.length);
  state.exams.push({ at: Date.now(), pct }); save();
  const perTopic = {};
  E.ids.forEach(id => { const q = byId[id]; const t = perTopic[q.topic] || (perTopic[q.topic] = [0, 0]); t[1]++; if (E.picks[id] === q.answer) t[0]++; });
  app.innerHTML = `
    <h1>Uitslag</h1>
    <div class="card"><div class="big ${pct >= 70 ? "pass" : "fail"}">${pct}%</div>
      <p>${right}/${E.ids.length} reg · ${pct >= 70 ? "✅ Geslaag!" : "❌ Nog nie. 70% nodig (35/50)."}</p></div>
    <h2>Per onderwerp</h2>
    <table>${Object.entries(perTopic).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([t, [r, n]]) =>
      `<tr><td>${esc(t)}</td><td class="num ${r / n >= .7 ? "pass" : "fail"}">${r}/${n}</td></tr>`).join("")}</table>
    <h2>Foute</h2>
    ${E.ids.filter(id => E.picks[id] !== byId[id].answer).map(id => {
      const q = byId[id];
      return `<div class="card">${qHtml(q)}
        ${Object.entries(q.options).map(([k, v]) => `<div class="opt ${k === q.answer ? "correct" : k === E.picks[id] ? "wrong" : ""}" style="padding:6px;border-radius:8px;border:1px solid transparent"><b>${k}</b> <span>${esc(v)}</span></div>`).join("")}
        <p class="muted">Jy: ${E.picks[id] || "niks"} · Reg: ${q.answer}</p>${feedbackHtml(q, false).replace(/<p><b>.*?<\/b><\/p>/, "")}</div>`;
    }).join("") || "<p>Geen foute nie! 🔥</p>"}
    <button class="primary" onclick="home()">Terug tuis</button>`;
  window.scrollTo(0, 0);
}

home();
</script>
</body>
