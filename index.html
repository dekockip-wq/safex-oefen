ok_ref": "7.2.1, p.159; 7.2.4, p.161", "topic": "Basis & hedging", "note": null, "data": null, "uitleg_en": "Use elimination based on the book: A is false (spreads require less initial margin); C is false (spreads carry less risk than outright futures); D is reversed ('buying the spread' = long the far crop and short the near crop). B is what is left. The book does not state that spreads 'trend' more often, but it is a known advantage in spread trading literature.", "note_en": null}, {"paper": "P3", "n": 39, "question": "Which ONE of the following statements with regard to delta hedging is correct?", "statements": [], "options": {"A": "The delta of a long call position in maize will rise if the underlying futures price rises.", "B": "An increase in volatility will affect the delta of an at-the-money option much more than an in-the-money option.", "C": "In order to be delta neutral the long call position holder should buy delta units of the underlying asset.", "D": "The delta of an at-the-money call option is around zero."}, "answer": "A", "uitleg": "As die futures-prys styg, beweeg 'n call dieper ITM en sy delta styg (na 1). B is vals: volatility raak net ITM/OTM deltas, nie ATM nie. C is vals: 'n long call (positiewe delta) moet delta eenhede van die onderliggende verkoop. D is vals: ATM delta is ongeveer 0.50.", "book_ref": "7.3.3, p.163", "topic": "Option pricing & greeks", "note": null, "data": null, "uitleg_en": "When the futures price rises, a call moves deeper ITM and its delta rises (towards 1). B is false: volatility only affects ITM/OTM deltas, not ATM deltas. C is false: a long call (positive delta) must be hedged by selling delta units of the underlying. D is false: ATM delta is about 0.50.", "note_en": null}, {"paper": "P3", "n": 40, "question": "Which combination of the following would best describe the usual role of a user of wheat in the physical market and his position in the wheat derivatives market?", "statements": ["(i) Hedger", "(ii) Speculator", "(iii) Long the underlying", "(iv) Short the underlying"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "A", "uitleg": "'n Gebruiker van koring (bv. meulenaar of bakker) is 'n hedger wat die produk nodig het (short in die fisiese mark) en daarom futures koop - hy is long die onderliggende in die derivatemark (long hedge). Hy is nie 'n spekulant nie, en short futures sou sy risiko vergroot.", "book_ref": "7.1.2, p.142-143", "topic": "Market roles & prerequisites", "note": null, "data": null, "uitleg_en": "A user of wheat (e.g. a miller or baker) is a hedger who needs the product. He is short in the physical market, so he buys futures - he is long the underlying in the derivatives market (long hedge). He is not a speculator, and short futures would increase his risk.", "note_en": "Exam questions like this ask for the position in the DERIVATIVES market. A wheat user is short in the physical market but goes long futures to hedge, so (i) hedger + (iii) long = A."}, {"paper": "P3", "n": 41, "question": "The purpose of the derivatives rules and directives is to", "statements": [], "options": {"A": "maximise capital profits for investments in derivatives products.", "B": "contribute to a stable financial market.", "C": "prevent speculative activities.", "D": "promote healthy hedging practices."}, "answer": "B", "uitleg": "Die reëls en direktiewe moet o.a. die doelwitte van die FMA bereik, wat insluit om by te dra tot 'n stabiele finansiële markomgewing en billike, doeltreffende markte. Dit is nie om spekulasie te voorkom of wins te maksimeer nie.", "book_ref": "8.1, p.172-173", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Among other things, the rules and directives must achieve the objectives of the FMA. These include contributing to a stable financial market environment and to fair, efficient markets. Their purpose is not to prevent speculation or to maximise profit.", "note_en": null}, {"paper": "P3", "n": 42, "question": "Officers of members must comply with which of the following requirements?", "statements": ["(i) Must be of full legal capacity", "(ii) Must have assets exceeding liabilities to a prescribed sum", "(iii) May not be registered as an officer of a foreign exchange", "(iv) May not have a criminal record"], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "Reël 3.20: officers moet van volle regsbevoegdheid wees en mag nie skuldig bevind wees aan 'n kriminele oortreding (bedrog, diefstal, oneerlikheid, market abuse) nie. Daar is geen vereiste van bates bo laste of verbod op registrasie by 'n buitelandse beurs nie (net nie onrehabiliteerde insolvent nie).", "book_ref": "8.2, p.174", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Rule 3.20: officers must have full legal capacity and must not have been convicted of a criminal offence (fraud, theft, dishonesty, market abuse). There is no requirement for assets to exceed liabilities, and no ban on registering with a foreign exchange. The only related requirement is not being an unrehabilitated insolvent.", "note_en": null}, {"paper": "P3", "n": 43, "question": "Which ONE of the following statements regarding the Commodities Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "The JSE Executive must give notice to members before halting trade in agricultural product securities.", "B": "A member must ensure that data sent to the CDM Trading System does not interfere with the JSE systems.", "C": "A commercial bank must guarantee fulfilment of agricultural product securities transactions.", "D": "The compliance officer lays down the procedure for accessing the CDM trading system."}, "answer": "B", "uitleg": "Reël 7.80.2: 'n trading member moet die hulpbronne hê om te verseker dat data wat na/van JSE-stelsels gestuur word nie die doeltreffendheid en integriteit van die mark of JSE-stelsels belemmer nie. A is vals: die JSE Executive kan sonder vooraf kennisgewing halt. D is vals: toegang is met goedkeuring van die Market Controller.", "book_ref": "8.3, p.174-175; 8.4 p.175", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Rule 7.80.2: a trading member must have the resources to ensure that data sent to or from JSE systems does not hinder the efficiency and integrity of the market or the JSE systems. A is false: the JSE Executive can halt without prior notice. D is false: access is with the approval of the Market Controller.", "note_en": null}, {"paper": "P3", "n": 44, "question": "Which ONE of the following statements regarding the Commodities Derivatives Market (CDM) trading system is correct?", "statements": [], "options": {"A": "The JSE Executive may extend the hours of operation of the CDM trading system to a Saturday or Sunday to ensure proper functioning of the market.", "B": "The Market Controller may, in case of system failure, declare a transaction executed on the CDM Trading system void.", "C": "The JSE Executive may halt trading without prior notice to members.", "D": "The Market Controller may cease trading on the CDM Trading System if trade in the underlying ceases."}, "answer": "C", "uitleg": "Reël 7.90.3.2: die JSE Executive mag sonder vooraf kennisgewing aan enige persoon die stelsel halt of sluit. A is vals (ure net verleng vir 'n 'business day'), B is vals (dis die JSE Executive, nie die Market Controller, wat transaksies void verklaar), D is vals (die JSE Executive oorweeg staking van handel as die onderliggende ophou handel).", "book_ref": "8.4, p.175; 8.5, p.176", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Rule 7.90.3.2: the JSE Executive may halt or close the system without prior notice to any person, so C is correct. A is false (hours can only be extended for a 'business day'). B is false (it is the JSE Executive, not the Market Controller, that declares transactions void). D is false (it is the JSE Executive that considers halting trading if the underlying stops trading).", "note_en": null}, {"paper": "P3", "n": 45, "question": "Which of the following actions will be LEGAL in terms of insider trading legislation?", "statements": ["(i) The Chairman of the National Crop Estimates Committee (NCEC) asks his secretary, Mary, to type the minutes containing the crop estimates prior to publication.", "(ii) Mary emails the minutes to her broker, Dave, and instructs him to trade for her.", "(iii) Dave transacts for Mary as well as on own account based on the crop estimate.", "(iv) Mary e-mails the minutes to the other members of the NCEC to check for correctness."], "options": {"A": "(i) and (iii) only", "B": "(i) and (iv) only", "C": "(ii) and (iii) only", "D": "(ii) and (iv) only"}, "answer": "B", "uitleg": "Dis nie 'n oortreding om 'n insider te wees of inside information te hê nie; openbaarmaking is wettig as dit nodig is vir die behoorlike uitvoering van werk/amp (sekretaris tik notule; notule aan NCEC-lede vir korrektheid). Om die notule aan 'n makelaar te stuur en op grond daarvan te handel (ii, iii) is insider trading.", "book_ref": "8.6, p.176-177", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "It is not an offence to be an insider or to have inside information. Disclosure is legal if it is needed to properly carry out your job or office. So (i) the secretary typing the minutes and (iv) sending the minutes to NCEC members to check them are legal. Sending the minutes to a broker and trading on them (ii, iii) is insider trading.", "note_en": null}, {"paper": "P3", "n": 46, "question": "Which of the following actions with regard to agricultural product securities will be ILLEGAL in terms of market abuse legislation?", "statements": ["(i) Making a false statement with regard to a material fact.", "(ii) Maintaining the price at an artificial level.", "(iii) Making an order to buy near the close of business to maintain the closing price.", "(iv) Entering a client trade in terms of a mandate."], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i) and (iii) only", "D": "(ii), (iii) and (iv) only"}, "answer": "A", "uitleg": "Prohibited practices (FMA a.80 / reël 7.200): om die prys op 'n kunsmatige vlak te handhaaf en 'n bestelling naby sluiting om die sluitingsprys te verander/handhaaf is manipulasie; 'n vals verklaring oor 'n wesenlike feit is ook market abuse (misleidende verklarings). 'n Kliënt-trade ingevolge 'n mandaat is normale wettige besigheid.", "book_ref": "8.7.1, p.179-180", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "Prohibited practices (FMA s.80 / rule 7.200): (i) keeping the price at an artificial level and (ii) placing an order near the close to change or maintain the closing price are manipulation. (iii) A false statement about a material fact is also market abuse (misleading statements). A client trade under a mandate is normal, legal business.", "note_en": null}, {"paper": "P3", "n": 47, "question": "Which of the following statements with regard to maintenance of market integrity by the exchange are correct?", "statements": ["(i) The declaration to void a transaction is binding on a client.", "(ii) A trader may complete incomplete transactions during a trading halt.", "(iii) The JSE may declare a transaction void if an unreasonable volume of transactions take place due to inside information.", "(iv) The JSE may halt trading if trading activity is being influenced by a manipulative practice."], "options": {"A": "(i) and (iii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "C", "uitleg": "(i) waar: die void-verklaring is bindend op die member én die kliënte. (iv) waar: 'n trading halt kan verklaar word as handel deur manipulerende praktyke beïnvloed word. (ii) vals: tydens 'n halt mag 'n member nie handel nie, net bestellings uitvee. Dit laat net C (wat ook (iii) insluit) oor.", "book_ref": "8.8, p.180-181", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "(i) True: a declaration that a trade is void is binding on the member and on its clients. (iv) True: a trading halt can be declared if trading is affected by manipulative practices. (ii) False: during a halt a member may not trade; it may only delete orders. That leaves only C, which also includes (iii).", "note_en": null}, {"paper": "P3", "n": 48, "question": "The JSE will only facilitate an exchange for risk transaction if the transaction (inter alia) meets which of the following minimum requirements?", "statements": ["(i) An application must be made to the Market Controller", "(ii) The member must provide all the details of the client to whom the position will be allocated", "(iii) All other details of the off-market transaction must be supplied.", "(iv) The clearing member of the client must agree to clear the transaction"], "options": {"A": "(i), (ii) and (iii) only", "B": "(i), (iii) and (iv) only", "C": "(ii) and (iv) only", "D": "(i), (ii), (iii) and (iv)"}, "answer": "D", "uitleg": "Die vraag is gebaseer op ou reëls waarvolgens 'n EFR via 'n aansoek by die Market Controller gefasiliteer is, met volle besonderhede van die kliënt en die off-market transaksie, en die clearing member moes instem om te clear - dus al vier. Die huidige boek sê members rapporteer EFP/EFR nou self direk op die ATS sonder vooraf verwysing na die beurs, met stawende dokumente en clearing member-goedkeuring as die prys buite parameters val.", "book_ref": "8.9-8.12, p.181-182", "topic": "Regulation & rules", "note": null, "data": null, "uitleg_en": "The question is based on old rules. Under those rules an EFR was facilitated through an application to the Market Controller, with full details of the client and the off-market transaction, and the clearing member had to agree to clear it. So all four statements applied. The current book says members now report EFP/EFR trades themselves, directly on the ATS, without first referring them to the exchange. Supporting documents and clearing member approval are needed if the price falls outside the parameters.", "note_en": null}, {"paper": "P3", "n": 50, "question": "The 'science' of determining whether there is real value in a commodity at a certain price is known as", "statements": [], "options": {"A": "price analysis.", "B": "technical analysis.", "C": "fundamental analysis.", "D": "demand and supply analysis."}, "answer": "C", "uitleg": "Die boek: fundamental analysis is gebaseer op ekonomie en rekeningkunde 'where finding real value is the name of the game' - jy besluit of daar waarde teen 'n sekere prys is. Technical analysis bestudeer prysbewegings en grafieke (die boek noem dit 'a science on its own', vandaar die lokval), maar soek nie 'real value' nie.", "book_ref": "9.1, p.192; 9.3 p.200", "topic": "Other", "note": "Die memo het B gesê, maar volgens die handboek is C reg.", "data": null, "uitleg_en": "The book says fundamental analysis is based on economics and accounting, 'where finding real value is the name of the game' - you decide whether there is value at a certain price. Technical analysis studies price movements and charts (the book calls it 'a science on its own', hence the trap), but it does not look for 'real value'.", "note_en": "The memo said B, but according to the textbook C is correct."}];
const LESSONS = [{"chapter": 1, "title": "The agricultural market in SA and the products traded", "intro": "The exam opens with 2-3 'which statements are correct' questions on maize, wheat and sunflower. They're free marks if you know the grades, moisture limits, planting/harvest months and main areas.", "cards": [{"title": "From SAFEX to the JSE CDM", "body": "<p>SA's grain derivatives started on <b>SAFEX<\/b> (South African Futures Exchange): founded <b>1988<\/b>, officially opened <b>1990<\/b>. The <b>JSE acquired SAFEX<\/b> and today commodities trade on the JSE's <b>Commodity Derivatives Market (CDM)<\/b>.<\/p><p>In <b>2008<\/b> foreign commodity derivatives were added, so participants can trade hard and soft commodities internationally. The CDM gives two things: <b>price risk management<\/b> and <b>price discovery<\/b>, using futures and options.<\/p><p>Chapter 1 runs through four crops (white/yellow maize, wheat, sunflower seed, soya beans), each covering grading, planting and harvest times, storage, main areas, yields and market structure.<\/p>", "example": null, "remember": ["SAFEX founded 1988, officially opened 1990", "Grains now trade on the JSE Commodity Derivatives Market (CDM)", "Foreign commodity derivatives added in 2008"], "trap": "Chapter 1 says the JSE acquired SAFEX in 2009, but chapter 2 dates the buyout to 2001 (2009 is the CDM rebranding). Chapter 2's self-test marks 'SAFEX was incorporated into the JSE in 2009' as FALSE, so go with 2001 for the buyout.", "check": {"q": "What two functions does the CDM provide for grain markets?", "a": "Price risk management and price discovery, through futures and options."}, "ref": "1.1, p.6"}, {"title": "Maize grades and the 12.5% moisture rule", "body": "<p>SA maize is roughly <b>60% white<\/b> (human food) and <b>40% yellow<\/b> (animal feed). The JSE trades <b>three grades of each<\/b>: <b>WM1, WM2, WM3<\/b> and <b>YM1, YM2, YM3<\/b>. WM1/YM1 are the top grades. (Government regulations from 2016 list 19 maize products, e.g. samp and maize meal, but the CDM still trades only the three grades of each colour.)<\/p><p>Grading depends on colour plus the % of <b>defective kernels<\/b>, <b>kernels of another colour<\/b> and <b>foreign matter<\/b>.<\/p><p>The <b>standard moisture is 12.5%<\/b>, with a <b>maximum of 14%<\/b>. The price is adjusted by about <b>1% per 1 percentage point<\/b> above or below 12.5%. Mass is converted to 12.5% moisture with:<\/p><p><code>(100% - delivery%) / (100% - standard%)<\/code><\/p><p>The maize must not smell musty or sour, carry live insects, or have wet, caked patches.<\/p>", "example": "<p>A farmer delivers 20 000 kg of white maize at 13.5% moisture to a silo in Randfontein.<\/p><ul><li>Factor = (100 - 13.5) / (100 - 12.5) = 86.5 / 87.5 = <b>0.9886<\/b><\/li><li>Paid mass = 20 000 kg x 0.9886 = <b>19 772 kg<\/b> at 12.5% moisture<\/li><\/ul><p>One point of extra water costs him about 1% of his mass.<\/p>", "remember": ["3 grades each: WM1-3 and YM1-3", "Moisture: standard 12.5%, max 14%", "About 1% price adjustment per 1 percentage point of moisture away from 12.5%", "About 60% white, 40% yellow"], "trap": "Distractors: 'four major grades' or 'production dominated by yellow maize'. Both false: three grades, and white is about 60%.", "check": {"q": "Maize arrives at 14.5% moisture. Roughly how much is the payment adjusted?", "a": "Down about 2%: it is 2 percentage points above the 12.5% standard, at about 1% per point."}, "ref": "1.2.1-1.2.2, pp.6-8"}, {"title": "Maize calendar, areas and farming facts", "body": "<p><b>Planting:<\/b> mainly <b>November and December<\/b>, from late October to January depending on rain.<\/p><p><b>Harvest:<\/b> mostly <b>June and July<\/b>, from late May to end August. Maize dries in the field in sunny winter weather, so SA maize usually has <b>lower moisture than imported maize<\/b>.<\/p><p><b>Marketing season:<\/b> <b>1 May to 30 April<\/b>. The 2021/22 crop is marketed in 2022/23.<\/p><p><b>Main areas:<\/b> <b>Free State, Mpumalanga and North-West<\/b> grow over 80% of the crop (2020/21: FS 7 016, MP 3 543, NW 2 693 thousand tons).<\/p><p><b>Other facts:<\/b> about 90% is dryland and 10% irrigated. Irrigated yields are higher and steadier. GM maize adoption is about <b>85%<\/b> and growing. The crop is 10 to 17 million tons a year, and yields average just under 2 to about 3 t/ha. Prices peak just before harvest, then fall as supply arrives.<\/p>", "example": null, "remember": ["Plant Nov-Dec, harvest Jun-Jul", "Marketing season 1 May - 30 April", "FS, MP and NW produce over 80%", "GM maize is increasingly planted (about 85% adoption)"], "trap": "'Maize is planted from late May to end August' is wrong: that is the harvest window. Also wrong: 'the market is strictly regulated' (deregulated since 1996).", "check": {"q": "When does the 2024/25 maize crop get marketed?", "a": "In the 2025/26 marketing season (from 1 May 2025). Production lags marketing by one year."}, "ref": "1.2.2-1.2.8, pp.7-11"}, {"title": "Maize market structure: parity prices, FOB/CIF and bushels", "body": "<p>Maize has been <b>fully deregulated since 1996<\/b>, and SA is normally a <b>net exporter<\/b>.<\/p><ul><li><b>Shortage<\/b>: the price moves toward <b>import parity<\/b> = international price <b>plus<\/b> transport and costs, x exchange rate.<\/li><li><b>Surplus<\/b>: the price moves toward <b>export parity<\/b> = international price <b>minus<\/b> transport and costs, x exchange rate.<\/li><\/ul><p><b>FOB<\/b>: transit risk and transport cost are the <b>buyer's<\/b>. <b>CIF<\/b>: cost, insurance and freight are the <b>seller's<\/b>.<\/p><p>White maize goes to dry milling (maize meal, samp, maize rice). The by-product, <b>maize bran ('hominy chop')<\/b>, feeds livestock. Wet milling makes starch and glucose. In shortages, yellow maize is sometimes mixed into white for food.<\/p><p>US prices are quoted per <b>bushel<\/b>: 1 ton = <b>39.37 bushels<\/b>. The maize import tariff uses the <b>21-day US FOB price<\/b>. A market access rebate allows <b>269 000 t<\/b> at full duty less 10%.<\/p>", "example": null, "remember": ["Deregulated 1996, normally a net exporter", "Shortage: import parity. Surplus: export parity", "FOB = buyer carries the transit risk; CIF = seller pays cost, insurance and freight", "1 ton maize = 39.37 bushels"], "trap": "Don't swap the parities: import parity ADDS transport costs (the price ceiling in a shortage), export parity SUBTRACTS them (the floor in a surplus).", "check": {"q": "A drought hits the Free State. Which parity does the white maize price move toward, and why?", "a": "Import parity: a shortage means we must import, so the local price rises toward the world price plus transport costs, times the exchange rate."}, "ref": "1.2.9, pp.12-13"}, {"title": "Wheat: grades, protein and the winter crop", "body": "<p>Nearly all SA wheat is <b>bread wheat<\/b>, with a little durum. The regulations split wheat into <b>Bread Wheat<\/b> (Super Grade, Grade 1, 2, 3) and <b>Other Wheat<\/b> (no grades).<\/p><p>Grades depend mainly on <b>protein content<\/b> and <b>specific weight (hectolitre mass)<\/b>. The <b>Hagberg falling number<\/b>, foreign matter and damaged kernels also count.<\/p><p><b>Hard wheat<\/b> has <b>higher protein<\/b> and is used for <b>bread<\/b>. <b>Soft wheat<\/b> suits <b>biscuits and confectionery<\/b>.<\/p><p><b>Planting:<\/b> mid-April to mid-June in the Western Cape (winter rainfall), and mid-May to end July in the Eastern Free State (summer rainfall). <b>Harvest: November to January.<\/b> The marketing season starts on <b>1 October<\/b>.<\/p><p><b>Areas (2020):<\/b> Western Cape 42%, Free State 21%, Northern Cape 17%. About 75% is dryland and 25% irrigated. Storage is like maize, but different qualities must be stored separately.<\/p>", "example": null, "remember": ["Grades: protein content + specific weight (hectolitre mass)", "Hard wheat: high protein, bread. Soft wheat: biscuits", "Harvest Nov-Jan; marketing season starts 1 October", "Top areas: Western Cape, Free State, Northern Cape"], "trap": "Wheat is NOT planted in Nov-Jan (that is maize planting and wheat harvest). Wheat is NOT 'four classes A, B, C, D'. Grades are NOT set by moisture or colour. Gauteng is NOT a major wheat area.", "check": {"q": "A biscuit factory wants wheat. Hard or soft, and why?", "a": "Soft wheat. It has lower protein, which suits biscuits and confectionery; hard, high-protein wheat is for bread."}, "ref": "1.3.1-1.3.3, pp.13-14"}, {"title": "Wheat market: SA is a net importer", "body": "<p>Wheat was <b>deregulated on 1 November 1997<\/b>. The <b>only government intervention is the import tariff<\/b>.<\/p><p>SA is a <b>net importer<\/b> of wheat, so local prices are tied to <b>import parity<\/b> and the tariff. That is the reverse of maize. SA is still the biggest wheat producer in sub-Saharan Africa, followed by Ethiopia.<\/p><p>Production is <b>1.5 to 2.1 million tons<\/b> a year (2020/21: 2 120 000 t, 23% above the 10-year average of 1 721 300 t). Yields rose from 1.2 t/ha in the early 1970s to <b>4.16 t/ha<\/b> in 2020/21.<\/p><p>About <b>85%<\/b> of bread wheat is milled into flour for baking. Gauteng has the most mills, then the Western Cape. Wheat contributes 9.8% of field-crop value, third after maize (46.7%) and sugar cane (13.3%).<\/p>", "example": null, "remember": ["Deregulated 1 November 1997; the import tariff is the only intervention", "SA is a net importer, so prices track import parity", "Yield 4.16 t/ha (2020/21)"], "trap": "Self-test trap: 'There are no government interventions in the wheat market' is FALSE because of the import tariff.", "check": {"q": "Why does the local wheat price usually sit near import parity while maize often doesn't?", "a": "SA imports wheat (net importer), so the marginal ton comes from overseas. SA usually exports maize."}, "ref": "1.3.4-1.3.6, pp.14-15"}, {"title": "Sunflower seed: FH, FS and a 10% moisture cap", "body": "<p>Sunflower is an oilseed and SA's <b>second largest summer crop<\/b> after maize. It has low input costs and a short season.<\/p><p><b>Classes:<\/b> <b>FH<\/b> (at least 80% high-oil cultivar), <b>FS<\/b> (at least 80% low-oil cultivar) and <b>Other<\/b>. FH and FS have one grade only (<b>Grade 1<\/b>); Other has none.<\/p><p><b>Moisture: maximum 10%<\/b> (the summary table shows 9% dry). No musty, sour or <b>khaki bush<\/b> smell is allowed.<\/p><p><b>Planting:<\/b> October to January, as late as end January in warm areas, so it is a fallback when rain is too late for maize. Harvest is about 3 months later, January to June/July. The <b>marketing season runs March to February<\/b>.<\/p><p><b>Areas:<\/b> North-West and Free State give about <b>87%<\/b>. About <b>99%<\/b> is crushed for <b>oil and oilcake<\/b>. SA is a <b>net importer<\/b>. Storage is under 12 months, and there are no statutory levies.<\/p>", "example": null, "remember": ["Moisture: maximum 10%", "Classes FH and FS (Grade 1 only) and Other (no grades)", "NW + FS about 87%; about 99% goes to oil and oilcake", "Marketing season March to February"], "trap": "The options will offer 12.5% (that's maize) or 'minimum'. Sunflower is a MAXIMUM of 10%. Also, 'can have a khaki bush odour' is FALSE.", "check": {"q": "A farmer couldn't plant maize because the rains came late in January. What might he plant instead?", "a": "Sunflower. It can go in as late as end January in warmer areas and needs only about 3 months to harvest."}, "ref": "1.4, pp.15-18"}, {"title": "Soya beans: SB1, 13% moisture and a levy", "body": "<p>Soya beans are grown mainly for <b>soya bean meal<\/b> (animal feed), with <b>oil<\/b> second. Processing goes: crack, dehull, roll into flakes, extract the oil with solvent, then dry into defatted flakes for meal, soy flour or textured vegetable protein (TVP).<\/p><p><b>Classes:<\/b> <b>Class SB<\/b> (graded <b>SB1<\/b>) and <b>Class Other<\/b>. <b>Moisture: maximum 13%.<\/b><\/p><p><b>Planting<\/b> is November-December and <b>harvest<\/b> comes <b>120 to 130 days later<\/b>, when moisture is below 15%. They are mostly dryland, grown in the Free State (42%), Mpumalanga (33%) and KZN (8%).<\/p><p><b>Yield<\/b> is under 2 t/ha against about 3.5 t/ha in the USA. Use: oil and oilcake 67.8%, animal feed 15.29%, human 2.67%. Biodiesel demand is growing. A <b>statutory levy<\/b> runs to 28 Feb 2025 to fund breeding technology (R92/t for 2024/25).<\/p>", "example": null, "remember": ["Class SB, Grade SB1; moisture max 13%", "Harvest 120-130 days after a Nov-Dec planting", "Main areas: Free State, Mpumalanga, KZN", "Statutory levy until 28 Feb 2025 (R92/t in 2024/25)"], "trap": "'Maximum moisture for soya beans is 9%' is FALSE (it's 13%). Don't mix up the crops: sunflower has NO statutory levy, soya does.", "check": {"q": "Which oilseed carries a statutory levy, and what is it for?", "a": "Soya beans. The levy funds new breeding technology and runs until 28 February 2025."}, "ref": "1.5, pp.18-21"}, {"title": "Cheat sheet: four crops side by side", "body": "<table><tr><th><\/th><th>Maize<\/th><th>Wheat<\/th><th>Sunflower<\/th><th>Soya<\/th><\/tr><tr><td>Grades<\/td><td>WM1-3, YM1-3<\/td><td>Super, 1, 2, 3 + Other<\/td><td>FH, FS (Gr 1), Other<\/td><td>SB (SB1), Other<\/td><\/tr><tr><td>Moisture<\/td><td>12.5% std, max 14%<\/td><td>max 13%<\/td><td>max 10%<\/td><td>max 13%<\/td><\/tr><tr><td>Plant<\/td><td>Nov-Dec<\/td><td>Apr-Jul<\/td><td>Oct-Jan<\/td><td>Nov-Dec<\/td><\/tr><tr><td>Harvest<\/td><td>May-Jul (mainly Jun-Jul)<\/td><td>Nov-Jan<\/td><td>Jan-Jun/Jul<\/td><td>120-130 days later<\/td><\/tr><tr><td>Season starts<\/td><td>1 May<\/td><td>1 October<\/td><td>March<\/td><td>March<\/td><\/tr><tr><td>Main areas<\/td><td>FS, NW, MP<\/td><td>WC, FS, NC<\/td><td>NW, FS<\/td><td>FS, MP, KZN<\/td><\/tr><tr><td>Trade<\/td><td>net exporter<\/td><td>net importer<\/td><td>net importer<\/td><td>-<\/td><\/tr><\/table><p>For information, go to <b>Grain SA<\/b>, <b>SAGIS<\/b>, the <b>Department of Agriculture, Land Reform and Rural Development<\/b>, the National Chamber of Milling and SAGL.<\/p>", "example": null, "remember": ["Maize is the only crop with a 'standard' moisture (12.5%)", "Wheat is the only winter crop", "Maize season 1 May; wheat 1 October; oilseeds March"], "trap": "The book's summary table gives yields (maize 4 t/ha, soya 2-4 t/ha) that differ from the section text (maize under 2 to about 3 t/ha, soya under 2 t/ha). If yields come up, read the options carefully. The moisture and calendar facts are consistent and more likely to be asked.", "check": {"q": "Rank the four crops by moisture limit, strictest first.", "a": "Sunflower (max 10%), then wheat and soya (max 13%), then maize (max 14%, standard 12.5%)."}, "ref": "Table 3, p.22"}]}, {"chapter": 2, "title": "Origin, role and prerequisites of derivatives markets", "intro": "A short chapter, but nearly every paper asks about the role of futures markets and the prerequisites for a tradable commodity. Learn the dates and the 'why'.", "cards": [{"title": "What makes something a derivative (IFRS 9)", "body": "<p>A derivative <b>derives its value from an underlying<\/b> (a share, commodity, interest rate or currency). IFRS 9 gives <b>three characteristics<\/b>:<\/p><ul><li><b>(1) Value changes with an underlying<\/b> variable. A non-financial variable must not be specific to one party, so both parties stay 'at arm's length' from it.<\/li><li><b>(2) No or a small initial net investment<\/b>: the <b>gearing<\/b> (leverage) feature. Forwards and OTC swaps often need no upfront cash, options need a premium, and futures need initial margin. All of these are far smaller than the value of the underlying.<\/li><li><b>(3) Settled at a future date<\/b>, later than the normal spot settlement.<\/li><\/ul><p>Example: shares settle spot at T+5 (per the book). Buy a share for payment at T+30 and you have a derivative.<\/p>", "example": null, "remember": ["Three features: linked to an underlying, little or no upfront investment, settled in the future", "Point (2) = gearing/leverage", "Futures need initial margin, options need a premium, forwards are often free upfront"], "trap": "Repurchase agreements are linked to underlyings but are NOT derivatives. Linking to an underlying alone isn't enough.", "check": {"q": "Which IFRS 9 characteristic explains why derivatives are risky for speculators?", "a": "Characteristic (2), little or no initial investment, which is gearing. A small deposit controls a large exposure."}, "ref": "2.1, pp.24-25"}, {"title": "A short history: Thales, rice tickets and Chicago", "body": "<ul><li><b>Ancient Greece:<\/b> Aristotle tells how <b>Thales<\/b> profited from an option-type deal (6th century BC).<\/li><li><b>18th-century Japan:<\/b> the <b>first organised futures trading<\/b>. Landlords issued <b>rice tickets<\/b> for future delivery, traded on the <b>Dojima rice market near Osaka (1730)<\/b>. The rules were similar to modern futures markets.<\/li><li><b>Chicago, about 1848:<\/b> became the US grain-marketing centre, with a large cash market and storage.<\/li><li><b>Early 1970s:<\/b> fixed exchange rates collapsed (spurring FX derivatives) and the <b>Black-Scholes<\/b> model made options priceable. The first financial futures traded on the <b>Chicago Mercantile Exchange in 1972<\/b>, and equity derivatives followed in the late 1980s.<\/li><\/ul>", "example": null, "remember": ["First organised futures: Dojima rice market, Japan, 1730", "First financial futures: CME, 1972", "Black-Scholes enabled option pricing"], "trap": null, "check": {"q": "Why could a Dojima rice-ticket holder avoid taking delivery?", "a": "He could sell the ticket in the market. That transferability is the same flexibility modern futures give."}, "ref": "2.1.1, p.25"}, {"title": "What a futures market is", "body": "<p>A futures market is a <b>formal exchange<\/b> where buyers and sellers trade <b>commitments to make or take delivery<\/b>. The <b>seller<\/b> promises to <b>make<\/b> delivery and the <b>buyer<\/b> to <b>take<\/b> delivery.<\/p><p>Contracts are <b>standardised<\/b> for <b>commodity, quality, quantity, location and delivery period<\/b>. The <b>price is not standardised<\/b>; it is discovered by trading.<\/p><p>Futures are used mainly for <b>price discovery<\/b> and <b>price risk management<\/b>. They are <b>seldom used to transfer the physical goods<\/b>: commitments are usually offset, so actual delivery seldom happens. Because futures are linked to the spot market, price discovery sets prices in both.<\/p>", "example": null, "remember": ["Standardised: commodity, quality, quantity, location, delivery period", "Price is NOT standardised; it is negotiated by trading", "Seller makes delivery, buyer takes delivery", "Physical delivery seldom takes place; positions are offset"], "trap": "'Standardised in respect of the price of the underlying' is wrong. Also wrong: 'the buyer commits to MAKE delivery'.", "check": {"q": "A miller buys a July white maize future. Must he end up with maize in July?", "a": "No. He can offset (sell) the contract before expiry, and most positions are closed this way rather than delivered."}, "ref": "2.2, p.26"}, {"title": "SA timeline: SAFEX to CDM", "body": "<ul><li><b>1960s<\/b>: the SA Sugar Association, a copper dealer and wool firms may use foreign forward markets. <b>1973<\/b>: Holcom acts as a broker on the London Metals Exchange.<\/li><li><b>1987<\/b>: Rand Merchant Bank starts an <b>informal<\/b> local futures market (JSE indices first).<\/li><li><b>Sept 1988<\/b>: <b>SAFEX<\/b> and its clearing house <b>SAFCOM<\/b> are formed. <b>10 Aug 1990<\/b>: official licence from the Financial Services Board.<\/li><li><b>1996<\/b>: the Marketing of Agricultural Products Act ends the marketing boards. Prices are free, and the AMD becomes the benchmark.<\/li><li><b>Early 1995<\/b>: the Agricultural Markets Division (AMD) is set up. <b>Maize futures and options are introduced in May 1995.<\/b><\/li><li><b>Wheat 1997<\/b>; <b>first options trades 1998<\/b>; <b>sunflower 1999<\/b>; <b>soya 2002<\/b>.<\/li><li><b>2001<\/b>: the <b>JSE buys SAFEX<\/b>; from Aug 2001 it is the Agricultural Products Division.<\/li><li><b>2009<\/b>: foreign, cash-settled products are added (first: <b>Chicago Corn<\/b>, referencing CBOT). The division is rebranded as the <b>CDM<\/b>.<\/li><\/ul>", "example": null, "remember": ["SAFEX formed 1988, licensed 10 Aug 1990", "Maize 1995, wheat 1997, options 1998, sunflower 1999, soya 2002", "JSE buyout 2001; CDM and foreign products 2009", "SA grains are physically settled; foreign products are cash settled"], "trap": "'SAFEX was incorporated into the JSE in 2009' is FALSE: the buyout was 2001. 2009 is the expansion and rebranding to CDM.", "check": {"q": "What was the first foreign product on the CDM, and how does it settle?", "a": "Chicago Corn, cash settled off the CBOT final price."}, "ref": "2.3, pp.26-27"}, {"title": "The role of futures markets: risk first, discovery second", "body": "<p>The <b>primary purpose<\/b> is an <b>efficient and effective mechanism for managing price risk<\/b>, called <b>hedging<\/b>. It works like insurance against adverse price moves. A Free State farmer sells futures before harvest and then only has to worry about the weather, not the price.<\/p><p>Futures don't set the absolute price level. Their pricing role is <b>secondary<\/b>: they discover <b>inter-temporal prices<\/b> (today's price against a future date), which helps decisions about production and consumption.<\/p><p>Other roles: price determination and <b>transparency<\/b>. Banks that lend to farmers hedge part of their clients' risk. Fund managers can gain or close exposure quickly. Speculators get <b>high leverage<\/b> because initial margin is small compared with the exposure.<\/p>", "example": null, "remember": ["Primary purpose: managing price risk (hedging)", "Also: price discovery and transparency", "Pricing role is secondary: inter-temporal prices", "Speculators get leverage, but that is not the purpose"], "trap": "Wrong 'roles' in the papers: 'transfer the underlying commodities between owners' and 'provide speculators with high profits'. The correct pair is price risk management + price discovery.", "check": {"q": "Is the main purpose of a futures market to let speculators participate?", "a": "No. The primary purpose is efficient price risk management. Speculators provide liquidity and get leverage, but that is a side effect."}, "ref": "2.4, p.27"}, {"title": "Prerequisites for a commodity futures contract", "body": "<p><b>The product must be:<\/b><\/p><ul><li><b>Homogeneous<\/b>, gradable into standard quality and quantity, so a Cape Town miller can buy maize <b>without seeing it<\/b>. Grain and meat qualify; bottled wine doesn't.<\/li><li><b>Storable<\/b> and cheap to <b>transport in bulk<\/b> over long distances. If not, you need a <b>cash-settled<\/b> contract, which requires a very well-established cash market. The CDM's potato future (a five-day average across four major markets) failed and is no longer traded.<\/li><\/ul><p><b>The market must have:<\/b><\/p><ul><li>A <b>well-functioning cash market<\/b> with free prices that a few big players can't manipulate.<\/li><li><b>Frequent price variation<\/b>. No price risk means no need to hedge and nothing for speculators.<\/li><li><b>High liquidity<\/b>. Otherwise you can't hedge or close out fast enough, and the market adds risk.<\/li><\/ul>", "example": null, "remember": ["Homogeneous, gradable commodity", "Storable and transportable in bulk", "Well-functioning cash market, frequent price variation, high liquidity"], "trap": "Exam distractors: 'available for visual inspection by the buyer' (no: standard grading means you never need to see it), 'heterogeneous' (no: homogeneous), 'not easily traded in the spot market' (no: it needs a good cash market). The answer is 'exposed to frequent price variation'.", "check": {"q": "Why did the potato future need cash settlement?", "a": "Potatoes are perishable and not easily stored or bulk-transported, so physical delivery wasn't practical. The price was a five-day average across four major markets."}, "ref": "2.5, p.28"}]}, {"chapter": 3, "title": "Forwards and forward pricing", "intro": "Each paper carries one forward-pricing calculation (spot, storage, interest and convenience yield) plus an advantages/disadvantages question. Master formula 3.5 and you have the calculation mark.", "cards": [{"title": "Forward contract: an OTC handshake deal", "body": "<p>A <b>forward<\/b> is an <b>OTC<\/b> agreement between two <b>counterparties<\/b> to deliver a physical asset at a <b>future date<\/b> for a <b>fixed price<\/b>. Quality, quantity, product, time and place are all agreed at the start.<\/p><p>Example: a feedlot needs 70 t of yellow maize at the end of August and agrees with a farmer at <b>R3 700/t<\/b>. The farmer gets <b>R259 000<\/b> on delivery. Sometimes there is an upfront deposit, e.g. 10%.<\/p><p><b>Buyer = long<\/b>: profits if the actual price ends <b>above<\/b> the contract price. <b>Seller = short<\/b>: profits if the price ends <b>below<\/b> it.<\/p><p>A forward is <b>not standardised<\/b>, not necessarily exchange-traded, and has <b>default risk<\/b>. If the other side defaults, your only recourse is the courts, which is slow and costly.<\/p>", "example": "<p>Feedlot (long) and farmer (short) agree 70 t at R3 700/t: 70 x 3 700 = <b>R259 000<\/b>.<\/p><ul><li>If the spot price at the end of August is R4 000: the feedlot gains (4 000 - 3 700) x 70 = <b>R21 000<\/b> compared with buying spot; the farmer gives that up.<\/li><li>If spot is R3 500: the farmer gains (3 700 - 3 500) x 70 = <b>R14 000<\/b>; the feedlot overpays by that much.<\/li><\/ul>", "remember": ["Forward = OTC, non-standardised, fixed price, future delivery", "Long = buyer, profits if the price rises", "Short = seller, profits if the price falls", "Default risk is only remedied through the legal system"], "trap": "Forwards are NOT marked to market daily. That's futures. A forward settles once, at maturity.", "check": {"q": "A miller is long a wheat forward at R2 600/t and wheat ends at R2 700/t. Gain or loss?", "a": "Gain of R100/t compared with buying spot. A long position profits when the price ends above the contract price."}, "ref": "3.1, p.30"}, {"title": "Forwards: advantages vs disadvantages", "body": "<table><tr><th>Advantages<\/th><th>Disadvantages<\/th><\/tr><tr><td>Simple, and <b>flexible<\/b> on size, quality and delivery time<\/td><td>Locked price: the <b>buyer can't benefit from a price fall<\/b> and the <b>seller misses a rally<\/b><\/td><\/tr><tr><td>Counterparties usually know each other (OTC), though often one is a financial intermediary<\/td><td>For the <b>seller, income is deferred<\/b> until delivery<\/td><\/tr><tr><td>Price locked: <b>buyer protected against rises<\/b>, <b>seller protected against falls<\/b><\/td><td>If the crop disappoints, the producer faces <b>non-delivery risk<\/b><\/td><\/tr><tr><td>The <b>buyer defers all payment until delivery<\/b><\/td><td><b>Default risk<\/b>: the seller fails to deliver or the buyer can't pay<\/td><\/tr><\/table><p>Ch.4 adds that forwards are hard to unwind before delivery, unlike futures, which can be closed out.<\/p>", "example": null, "remember": ["Buyer defers payment = advantage", "Seller's income deferred = disadvantage", "Fixed price protects against adverse moves but excludes favourable ones", "Default risk exists in forwards"], "trap": "'Buyer can't estimate cash flow because profits and losses are realised daily' describes FUTURES, not forwards. 'No default risk' is FALSE for forwards.", "check": {"q": "Is 'payment deferred until delivery' an advantage or a disadvantage?", "a": "Both, depending on the side: an advantage for the buyer, a disadvantage for the seller, whose income is deferred."}, "ref": "3.1.1-3.1.2, pp.30-31"}, {"title": "Cost of carry: the bull example", "body": "<p>Farmer A sells his bull to neighbour B for delivery and payment in 3 months. The spot price is <b>R20 000<\/b>. A will ask R20 000 <b>plus<\/b> the cost of keeping the bull: interest, feed, shelter and medicine. That extra is the <b>cost of carry<\/b>, and the bull is the <b>underlying asset<\/b>.<\/p><p>Every forward price is built this way: <b>spot + cost of carry<\/b>.<\/p><p><code>Carry costs = cost of funds + storage cost - convenience yield<\/code> (3.3)<\/p><p>Carrying costs for commodities include <b>storage, insurance, transport and financing<\/b>.<\/p><p><b>Convenience yield<\/b> is the benefit of physically holding the commodity, e.g. a cereal maker avoiding emergency deliveries if it runs out. It <b>reduces<\/b> the forward price. Investment assets such as shares have a convenience yield of zero.<\/p>", "example": null, "remember": ["Forward price = spot + cost of carry", "Carry = cost of funds + storage - convenience yield", "Carrying costs: storage, insurance, transport, financing", "Convenience yield lowers the forward price"], "trap": "Convenience yield is SUBTRACTED, not added. Self-test: 'cost of carry includes storage and convenience yield' is TRUE (convenience yield is part of the formula, with a minus sign). Time value of money is NOT ignored.", "check": {"q": "Millers start stockpiling because they fear a shortage. What happens to the convenience yield and to the forward price?", "a": "The convenience yield rises, so the forward price falls relative to spot (possibly into backwardation)."}, "ref": "3.2, pp.31-34"}, {"title": "Formula 3.1: interest only", "body": "<p>When the asset pays no income and has no storage cost, interest is the only carry:<\/p><p><code>F0 = S0 x (1 + i/f)^(n x f)<\/code><\/p><ul><li><code>S0<\/code> = spot price today, <code>i<\/code> = annual interest rate<\/li><li><code>f<\/code> = compounding frequency per year (12 monthly, 4 quarterly, 2 semi-annual)<\/li><li><code>n<\/code> = years to maturity (6/12, 91/365, ...)<\/li><\/ul><p><b>Which compounding?<\/b> Use the convention of the market you are funded in. Monthly bank interest means a nominal annual rate compounded monthly (<b>NACM<\/b>), so f = 12. The book does <b>not<\/b> use continuous compounding; continuous compounding would give R264.14 instead of R264.07 for the share example below.<\/p>", "example": "<p>Share at R250, 6 months, 11% compounded monthly:<\/p><ul><li>i/f = 0.11/12 = 0.0091667; n x f = 0.5 x 12 = 6<\/li><li>(1.0091667)^6 = 1.0563<\/li><li>F0 = 250 x 1.0563 = <b>R264.07<\/b><\/li><\/ul>", "remember": ["F0 = S0(1 + i/f)^(nf)", "f: 12 monthly, 4 quarterly, 2 semi-annual, 1 annual", "Use the compounding convention of the funding market (e.g. NACM)"], "trap": "Exponent mistakes cost marks: the power is n x f (number of compounding periods), not n, and the rate per period is i/f, not i.", "check": {"q": "9 months at 8% compounded quarterly: what are the rate per period and the exponent?", "a": "Rate per period = 0.08/4 = 0.02; exponent = 0.75 x 4 = 3. So the factor is (1.02)^3."}, "ref": "3.2, formula 3.1, pp.32-33"}, {"title": "Arbitrage keeps forwards honest", "body": "<p>The cost-of-carry price is the <b>fair value<\/b>, the price at which <b>no arbitrage<\/b> is possible. Arbitrage means buying where an asset is cheap and simultaneously selling where it is dear, for a <b>risk-free profit<\/b>.<\/p><p>If the market forward price is <b>above fair value<\/b>, do <b>cash and carry<\/b>: borrow, buy spot, sell forward, hold, deliver, repay. The book's example assumes equal lending and borrowing rates.<\/p><p>In practice transaction costs, different borrowing and lending rates, and demand for the physical product cause <b>market imperfections<\/b>.<\/p>", "example": "<p>Fair value R264.07, but the market quotes R267:<\/p><ol><li>Borrow R250 at 11% NACM for 6 months and buy the share spot.<\/li><li>Sell it 6 months forward at R267.<\/li><li>At maturity deliver and receive R267, then repay 250 x (1 + 0.11/12)^6 = R264.07.<\/li><li>Profit = 267 - 264.07 = <b>R2.93<\/b>, risk-free.<\/li><\/ol>", "remember": ["Fair value = no-arbitrage price", "Forward too high: borrow, buy spot, sell forward (cash and carry)", "Imperfections: transaction costs, rate differences, physical demand"], "trap": null, "check": {"q": "If the market forward were BELOW fair value, which way would you trade?", "a": "The reverse: sell spot (or sell from inventory), invest the cash, and buy forward. You lock in the difference."}, "ref": "3.2, p.34"}, {"title": "Formula 3.2: adding storage (discount it first)", "body": "<p>Storage is a cost, so add its <b>present value<\/b> to spot:<\/p><p><code>F0 = (S0 + U) x (1 + i/f)^(nf)<\/code> (3.2)<\/p><p><code>U = PV of storage = storage x (1 + i/f)^(-nf)<\/code> (3.4)<\/p><p>Storage is usually <b>payable at the end<\/b>, so you <b>discount<\/b> it back to today first, then compound the whole lot forward. If storage is given as a % of spot (<code>u<\/code>): <code>F0 = S0(1 + (u + i)/f)^(nf)<\/code> (3.2*).<\/p><p>Then compare: if a buyer offers more than F0 for later delivery, sell forward and store. You beat the cost of carrying.<\/p>", "example": "<p>Maize spot R2 000/t, or R2 500/t in 6 months. Storage R180/t payable after 6 months, 10% compounded annually (f = 1, nf = 0.5).<\/p><ol><li>PV storage = 180 x (1.10)^-0.5 = 180 x 0.9535 = <b>R171.62<\/b><\/li><li>F0 = (2 000 + 171.62) x (1.10)^0.5 = 2 171.62 x 1.0488 = <b>R2 277.61<\/b><\/li><li>R2 500 &gt; R2 277.61, so <b>sell 6 months forward at R2 500<\/b>, store, and deliver.<\/li><\/ol>", "remember": ["Discount storage to PV first, then compound (S0 + U)", "PVU = U(1 + i/f)^(-nf)", "Forward offer above fair value: sell forward, store, deliver"], "trap": "Don't add the full R180 to spot. That skips discounting and gives a slightly wrong answer, often one of the distractors.", "check": {"q": "Self-test: wheat spot R1 000, later price R1 200 in 6 months, storage R70 after 6 months, 10% compounded quarterly. Fair forward?", "a": "PVU = 70 x 1.025^-2 = R66.63 (about R67). F0 = 1 067 x 1.025^2 = about R1 121. Selling forward at R1 200 beats this by R79/t."}, "ref": "3.2, formulas 3.2 and 3.4, pp.34-35"}, {"title": "Formula 3.5: full model with convenience yield", "body": "<p>The exam formula, with everything in:<\/p><p><code>F0 = (S0 + U) x (1 + (i - y)/f)^(nf)<\/code><\/p><p><code>U<\/code> = PV of storage, <code>i<\/code> = interest rate, <code>y<\/code> = convenience yield as a % of spot. The yield comes off the interest rate <b>inside the bracket<\/b>.<\/p><p><b>Calculator routine (4 steps):<\/b><\/p><ol><li>Write down S0, storage, i, y, f and n, and work out nf.<\/li><li>U = storage x (1 + i/f)^(-nf). Discount at <b>i only<\/b>.<\/li><li>Growth factor = (1 + (i - y)/f)^(nf).<\/li><li>F0 = (S0 + U) x factor.<\/li><\/ol>", "example": "<p><b>Book:<\/b> maize spot R2 500, 9 months, 11.5% quarterly, storage R175 after 9 months, y = 5%. nf = 0.75 x 4 = 3.<\/p><ul><li>U = 175 x (1.02875)^-3 = 175 x 0.91848 = <b>R160.73<\/b><\/li><li>Factor = (1 + 0.065/4)^3 = (1.01625)^3 = 1.04955<\/li><li>F0 = 2 660.73 x 1.04955 = <b>R2 792.56<\/b><\/li><\/ul><p><b>Exam-style:<\/b> spot R1 100, 7.5% quarterly, storage R75 after 9 months, y = 2.5%.<\/p><ul><li>U = 75 x (1.01875)^-3 = <b>R70.93<\/b><\/li><li>Factor = (1 + 0.05/4)^3 = (1.0125)^3 = 1.03797<\/li><li>F0 = 1 170.93 x 1.03797 = <b>R1 215.40<\/b><\/li><\/ul>", "remember": ["F0 = (S0 + U)(1 + (i - y)/f)^(nf)", "Discount storage at i; grow at (i - y)", "Watch nf: 9 months quarterly = 3; 6 months monthly = 6"], "trap": "Classic slip: discounting the storage at (i - y) instead of i, or forgetting to discount it at all. Each gives a nearby wrong option. The book's text misprints the final answer as 'R1792.56'; the correct result is R2 792.56.", "check": {"q": "Spot R1 150, 6.5% quarterly, storage R69 after 9 months, y = 2.75%. 9-month forward?", "a": "U = 69 x (1.01625)^-3 = R65.74. Factor = (1 + 0.0375/4)^3 = 1.02839. F0 = 1 215.74 x 1.02839 = R1 250.26."}, "ref": "3.2, formula 3.5, pp.36-37"}, {"title": "Backwardation: when forward < spot", "body": "<p>Normally forward &gt; spot because carrying costs money. That is <b>contango<\/b> (ch.4). But when the <b>convenience yield is high<\/b>, e.g. millers stockpiling because they expect a shortage, <code>(i - y)<\/code> turns <b>negative<\/b> and the forward price drops <b>below spot<\/b>. That is <b>backwardation<\/b>.<\/p><p>Backwardation is associated with <b>commodities<\/b> (oil, agricultural products), because the convenience yield of <b>investment assets is always zero<\/b>.<\/p><p><b>Futures vs forwards:<\/b> futures are <b>marked to market daily<\/b>, and forwards settle once at expiry. The daily moves add up to the same total, but daily profits and losses are carried at the risk-free rate, so the end value can differ depending on the price path.<\/p>", "example": "<p>Book: the same maize as before (S0 + U = R2 660.73, 11.5% quarterly, 9 months) with the convenience yield in the formula at 0.20:<\/p><ul><li>(i - y)/f = (0.115 - 0.20)/4 = -0.02125, so the factor = (0.97875)^3 = 0.9376<\/li><li>F0 = 2 660.73 x 0.9376 = <b>R2 494.69<\/b> &lt; spot R2 500: <b>backwardation<\/b><\/li><\/ul>", "remember": ["Backwardation: forward/futures below spot", "Caused by a high convenience yield (expected shortage)", "Investment assets have zero convenience yield", "Futures are marked to market daily; forwards are not"], "trap": "The book's text says the yield rises 'to 15%' but plugs 0.20 into the formula. With 15% the forward would be R2 591.50, still above spot. Trust the mechanics: backwardation needs y large enough to beat interest plus storage.", "check": {"q": "Why can a gold share's forward never be in backwardation due to convenience yield?", "a": "Investment assets have zero convenience yield, so with positive interest the forward stays above spot."}, "ref": "3.2, p.37"}, {"title": "Cash-settled forward = swap", "body": "<p>Accounting standards and regulators want companies to state whether a forward is meant to <b>transfer ownership<\/b> of the product or only its <b>price risk<\/b>.<\/p><p>If the parties only exchange <b>cash<\/b> at maturity instead of the physical product, the forward is a <b>cash-settling instrument<\/b> and is regarded as a <b>swap<\/b> (ch.5).<\/p><p>So distinguish between <b>cash-settling forwards<\/b> and <b>fixed-price delivery contracts<\/b>. A Randfontein miller who wants actual maize in his silo at a fixed price uses a delivery contract. One who only wants to fix the cost and buys maize elsewhere uses a cash-settled forward, which is effectively a swap.<\/p>", "example": null, "remember": ["Cash-settled forward = swap", "Fixed-price delivery contract = transfer of ownership", "Companies must state their intent: ownership vs price risk"], "trap": null, "check": {"q": "A feedlot and a trader agree to settle only the difference between the market price and R3 700/t in cash in August. What is this called?", "a": "A cash-settling forward, which is regarded as a swap."}, "ref": "3.3, p.37"}]}, {"chapter": 4, "title": "Futures in the commodity derivatives market", "intro": "The biggest and most-examined chapter: past papers give it a solid block of questions (roughly Q8 to Q21), especially on basis, margin and delivery. Get the language (long/short, strengthen/weaken) and the F1 + B2 formula solid and you collect easy marks.", "cards": [{"title": "What a futures contract is", "body": "<p>A futures contract is a <b>standardised, transferable, exchange-traded<\/b> contract that requires delivery of a commodity at a specified price on a specified future date. It is an <b>obligation<\/b>, not a choice.<\/p><ul><li><b>Seller = short<\/b>: commits to MAKE delivery.<\/li><li><b>Buyer = long<\/b>: commits to TAKE delivery and pay.<\/li><li>Both obligations are with the <b>clearing house<\/b>, not with each other.<\/li><\/ul><p>The payoff is symmetrical, so risk is unlimited for both sides and what one wins the other loses: a <b>zero-sum game<\/b>. In principle futures are also forward contracts (a pledge to transact later), just standardised and exchange-guaranteed.<\/p><p>Because a short and a long cancel each other, you can get out by buying/selling the same contract and expiry month. The vast majority of positions end this way (<b>offsetting<\/b>).<\/p><p><b>Open interest<\/b> = contracts still open (count the longs OR the shorts, not both). <b>Trading volume<\/b> = contracts traded during the day.<\/p>", "example": null, "remember": ["Long = take delivery; short = make delivery", "Futures trading is a zero-sum game; risk unlimited both sides", "Most positions are closed by offsetting, not delivery", "Open interest = outstanding contracts; buyer + seller together create ONE contract"], "trap": "Paper statement: 'the buyer of a futures contract commits to MAKE delivery' is false. Also false: 'most futures positions are fulfilled by physical delivery'.", "check": {"q": "A miller buys 3 contracts from a farmer who had no position. By how much does open interest rise?", "a": "By 3. Each buyer-seller pair creates one contract, so you count one side only."}, "ref": "4.1, 4.12, p.40-42, 86"}, {"title": "Futures vs forwards", "body": "<p>A forward is a private deal; a futures contract is the exchange-made version. The exchange standardises <b>everything except the price<\/b>.<\/p><table><tr><th><\/th><th>Forward<\/th><th>Futures<\/th><\/tr><tr><td>Size, date, terms<\/td><td>Negotiable<\/td><td>Standardised<\/td><\/tr><tr><td>Where<\/td><td>OTC<\/td><td>Exchange<\/td><\/tr><tr><td>Guarantee<\/td><td>None (counterparty risk)<\/td><td>Clearing house<\/td><\/tr><tr><td>Price<\/td><td>Negotiated privately<\/td><td>Auction-type market<\/td><\/tr><tr><td>Cash flows<\/td><td>At the end<\/td><td>Daily (MTM)<\/td><\/tr><tr><td>Delivery<\/td><td>Usually physical<\/td><td>Few deliveries; mostly closed before expiry<\/td><\/tr><tr><td>Parties<\/td><td>Known<\/td><td>Not known<\/td><\/tr><tr><td>Close early<\/td><td>Not possible<\/td><td>Easy: opposite trade<\/td><\/tr><\/table><p>Futures are deep and liquid, so speculators prefer them. Downsides of hedging with futures (Table 4.2): margin means bigger cash-flow needs, limited trading hours, contracts can freeze when price limits are hit, basis can change, and you must deal through an exchange member.<\/p>", "example": null, "remember": ["Major difference: futures are marked to market daily", "Futures credit risk is very low thanks to the clearing house", "Forward parties know each other; futures parties do not", "Speculators prefer futures (liquid, deep, easy to close)"], "trap": "Distractors: 'futures price is negotiated between buyer and seller' (false, auction market); 'credit risk is higher in futures' (false); 'forwards are more liquid' (false).", "check": {"q": "Name the ONE contract term the exchange does not standardise.", "a": "The price. It is found in the auction-type market; size, quality, date and location are fixed."}, "ref": "4.2, Tables 4.1 and 4.2, p.42-48"}, {"title": "Spot vs futures: carry, contango and backwardation", "body": "<p>The <b>spot (cash) market<\/b> is for immediate delivery; the <b>futures market<\/b> is for later delivery. The main difference between the two prices is the delivery date. The futures price includes the <b>financing and storage cost<\/b> (cost of carry), and it moves towards spot as delivery gets closer.<\/p><ul><li><b>Contango<\/b>: positive net carry, futures &gt; spot. The normal state for stored grain.<\/li><li><b>Backwardation<\/b> (inverted market): futures &lt; spot, caused by negative carry from a high <b>convenience yield<\/b>.<\/li><\/ul><p>A normal <b>old-crop/new-crop inversion<\/b> happens between the last month of one crop year (supplies lowest) and the first month of the next (harvest coming in). For <b>maize: March vs May<\/b>. For <b>wheat: September vs December<\/b>.<\/p>", "example": "<p>July maize trades at R3 000/t and December at R3 300/t.<\/p><p><code>Carry = 3 300 - 3 000 = R300/t<\/code> (financing + storage). Futures above spot: contango.<\/p>", "remember": ["Contango: futures above spot (positive carry)", "Backwardation: futures below spot (high convenience yield)", "Old/new crop spread: maize March-May; wheat Sept-Dec", "Futures price converges to spot as delivery approaches"], "trap": "Exam statement 'for maize the old-crop/new-crop spread is May vs July' is FALSE. It is March vs May.", "check": {"q": "Wheat December futures trade below September. Is this unusual?", "a": "No. It is the normal old-crop/new-crop inversion: new harvest supply is expected by December."}, "ref": "4.1.2, 4.4.1, p.40-41, 47"}, {"title": "Hedging and speculation", "body": "<p>The <b>primary purpose<\/b> of futures markets is managing price risk: you fix a price now for a deal later. That is <b>hedging<\/b>.<\/p><ul><li><b>Long hedge<\/b> (buy futures): the user who fears rising prices, e.g. Breadbakers buying wheat futures. Profits if the price at expiry is above the contract price X.<\/li><li><b>Short hedge<\/b> (sell futures): the producer who fears falling prices, e.g. Farmer Jones. Profits if the price ends below X.<\/li><\/ul><p>Either way the hedger ends up at roughly X: a futures profit subsidises a dearer spot purchase, a futures loss eats a cheaper one.<\/p><p><b>Speculators<\/b> (Pietie Quickbuck) trade to profit from the very price changes hedgers avoid. They have no physical stock and no intention of holding any, so they cash settle by offsetting before expiry. They add liquidity. <b>Arbitrageurs<\/b> only trade when they are sure of a profit from price differences between markets.<\/p>", "example": "<p>Pietie buys 10 wheat contracts of 50 t each at R2 000/t. Price at expiry: R2 200/t.<\/p><p><code>Profit = (2 200 - 2 000) x 10 x 50 = 200 x 500 = R100 000<\/code><\/p><p>He receives it gradually through daily variation margin.<\/p>", "remember": ["Miller/baker (user) = long hedge = buy futures", "Farmer (producer) = short hedge = sell futures", "Speculators do not hold or want physical stock", "Participants: sellers, buyers, speculators AND arbitrageurs"], "trap": "False statement on paper: 'speculators buy or sell futures to offset their spot market exposure'. That describes hedgers. A baker who buys at R2 600 profits at R2 700, not R2 500.", "check": {"q": "A maize farmer wants to lock in a price for his harvest. Buy or sell futures, and through whom?", "a": "Sell maize futures through a JSE CDM member he has a client agreement with."}, "ref": "4.3, 4.13, p.43-45, 86-87"}, {"title": "Price discovery and the trading months", "body": "<p><b>Price discovery<\/b> is how buyers and sellers, trading freely and transparently, set the price. The futures price is a <b>consensus<\/b> forecast of the spot price for a future month, pulling together the Free State farmer with storm damage, the Mpumalanga farmer with a bumper crop, the feed maker and the grain trader watching the US crop and the rand.<\/p><p>A futures market works when there is:<\/p><ul><li>a potential for <b>shifting risk<\/b><\/li><li><b>price volatility<\/b> (frequent price variation)<\/li><li><b>cash market rivalry<\/b>: a big, competitive spot market<\/li><li><b>liquid trading<\/b><\/li><\/ul><p><b>Hedging months<\/b> for white and yellow maize, wheat, sunflower seed, sorghum and soya beans: <b>March, May, July, September, December<\/b>. The other seven months get <b>constant (non-standard) month<\/b> contracts, so prices exist all year and positions can be rolled. With other factors constant, each later month is higher by storage and finance costs.<\/p>", "example": null, "remember": ["Futures price = market consensus forecast of future spot price", "Prerequisite: commodity exposed to frequent price variation", "Hedging months: Mar, May, Jul, Sep, Dec", "Main purposes: price risk management + price discovery (not transferring ownership)"], "trap": "Distractors for prerequisites: 'heterogeneous commodity', 'always available for visible inspection', 'does not trade easily in the spot market'. All wrong.", "check": {"q": "Which two roles of the futures market do examiners call 'very important'?", "a": "Facilitating price risk management for buyers and sellers, and enhancing price discovery."}, "ref": "4.4, 4.4.1, p.45-47"}, {"title": "Closing a position: offset or deliver via silo receipt", "body": "<p>Open a position by buying or selling through a trading member. Close it in one of two ways:<\/p><ul><li><b>Offset<\/b>: an equal and opposite trade, same commodity, quantity and delivery month. A miller long 2 December yellow maize sells 2 December yellow maize. A short buys back.<\/li><li><b>Physical delivery<\/b>: in a well-functioning market <b>less than 5%<\/b> of contracts end in delivery.<\/li><\/ul><p>Delivery happens with a <b>JSE silo receipt<\/b>, not a truck at the JSE. It is <b>transferable but non-negotiable<\/b> and certifies quantity and quality in a registered silo. Receipts are <b>electronic<\/b>, can be retendered many times, and are cancelled only when the grain is outloaded. The <b>storage operator guarantees<\/b> quality and quantity. SA has 250 registered delivery stations and 16 registered storage operators.<\/p><p>All prices are <b>Randfontein-based<\/b>. Deliver elsewhere and the price is the JSE price minus the location differential (transport cost), published once a year.<\/p>", "example": "<p>Transport from a farmer's silo to Randfontein is R100/t.<\/p><p><code>Delivery price = JSE delivery-month price - R100/t<\/code><\/p><p>The buyer collects at the same JSE price minus R100/t.<\/p>", "remember": ["Close a short by BUYING back the same month and quantity", "Under 5% of contracts are delivered", "Silo receipt: transferable, NOT negotiable, electronic", "Storage operator (not the producer) guarantees quality and quantity"], "trap": "'Physically deliverable' means grain is available in a JSE-approved silo, NOT delivered to the JSE in Johannesburg.", "check": {"q": "You are short and want to deliver. What do you do?", "a": "Deliver to a JSE-approved delivery station, get a silo receipt, notify your JSE CDM member and follow the procedure."}, "ref": "4.5, 4.5.1, 4.5.2, p.48-50, 88"}, {"title": "Delivery timeline, EFP and allocation", "body": "<p>Delivery takes place only <b>in the delivery month<\/b> (July contract: July). It takes two business days: <b>notice day<\/b> then <b>delivery day<\/b> (next business day). The short gives notice with silo receipts by <b>14h15<\/b>. Contracts close at the <b>MTM price on notice day<\/b>, adjusted for storage, VAT (wheat, sunflower, sorghum), location differential, grade and basis premiums. After the last trading day, open shorts must deliver on the next business day. The long has <b>three months<\/b> to check the delivery was good.<\/p><p>How the grain reaches a long:<\/p><ol><li><b>EFP<\/b> (exchange for physical): a privately agreed, simultaneous swap of a futures position for a spot position. The <b>long<\/b> (miller) <b>sells<\/b> the EFP; the short (farmer) <b>buys<\/b> it. Reported to the JSE, processed at the <b>current MTM<\/b>; the JSE can do the delivery. Used to get grain from a preferred location.<\/li><li><b>Basis premium matching<\/b> for all non-EFP deliveries: clients bid or offer premiums per silo; leftovers go to the best remaining bid.<\/li><li><b>Random allocation<\/b> for the rest.<\/li><\/ol>", "example": null, "remember": ["Long futures to spot: SELL an EFP; short futures: BUY an EFP", "EFP is agreed off-exchange, reported to the JSE, processed at MTM", "Notice before 14h15; delivery the next business day", "Order: EFP, then basis premium platform, then random allocation"], "trap": "EFP deliveries are NOT sent to the basis premium platform; only non-EFP deliveries go there. A July position cannot be delivered in June.", "check": {"q": "A miller with long maize futures wants grain from a specific silo. Which transaction?", "a": "Sell an EFP with a farmer who holds grain there. The farmer buys the EFP; both positions close."}, "ref": "4.5.2, p.50-52"}, {"title": "The margining system and the MTM price", "body": "<p>The JSE principle: <b>\"You stand good for your client.\"<\/b> Members carry their clients' defaults. After matching, <b>JSE Clear<\/b> becomes buyer to every seller and seller to every buyer: <b>novation<\/b>.<\/p><ul><li>Margins cover <b>two days'<\/b> market risk. <b>Only cash<\/b> is accepted.<\/li><li><b>Initial margin<\/b> is due by 12h00 the next business day. June 2022: white maize 7.75%, yellow maize 6.82%, sunflower 7.06%, wheat 6.46%, soya 6.60%.<\/li><li><b>Calendar spread<\/b> (long July + short December white maize) gets reduced margin: R8 000 white, R4 500 yellow.<\/li><li><b>Variation margin<\/b> = daily price change, paid in cash. Not paid on time: position closed out immediately.<\/li><\/ul><p><b>MTM price<\/b>: picked at random in the <b>final five minutes<\/b>. Liquid contracts (100+ contracts in the last half hour) use <b>VWAP<\/b>. Illiquid: use the <b>bid if it is higher than the last trade<\/b>, the <b>offer if it is lower<\/b>.<\/p><p><b>Daily price limits<\/b>: maize R150/t, wheat R240/t, sunflower and soya R270/t. If two or more contracts (excluding delivery month) hit the limit two days running, limits rise to <b>150%<\/b> (R225, R360, R405) and initial margin rises.<\/p>", "example": null, "remember": ["Novation: JSE Clear becomes counterparty to every trade", "Margin covers two days' risk; cash only", "Illiquid MTM: bid if above last trade, offer if below last trade", "Extended limit = 150% of normal; delivery month excluded"], "trap": "Price limits help risk but can make a contract totally illiquid: at limit-up or limit-down nobody will trade, so the person on the wrong side keeps paying variation margin.", "check": {"q": "Soya's everyday limit is R70 in an exam question. What is the extended limit?", "a": "R105, i.e. 150% of R70."}, "ref": "4.6, 4.4.1, Tables 4.3 and 4.9, p.47, 52-57, 67"}, {"title": "Variation margin step by step, and gearing", "body": "<p>Each day the position is revalued at the MTM price. <code>VM = (today's MTM - yesterday's MTM) x tons<\/code>, positive for the long when prices rise, negative for the short. The margin account must never fall below the initial margin. If a loss would take it below, you <b>top up<\/b> in cash.<\/p><p>Over the life of the trade, the sum of all VM equals the total profit or loss. Initial margin (with interest) comes back at the end.<\/p><p><b>Gearing<\/b>: a small move in price is a big move on your margin. A maize contract at R2 000/t is worth R200 000 (100 t). An R80/t move is R8 000: only 4% of the contract but about 73% of an R11 000 initial margin. Great for speculators, dangerous too.<\/p>", "example": "<p>White maize, 100 t, IM R11 000. Buyer at R2 500 on 10 Sep.<\/p><table><tr><th>Day<\/th><th>MTM<\/th><th>Buyer VM<\/th><th>Account<\/th><\/tr><tr><td>11 Sep<\/td><td>2 540<\/td><td>+40 x 100 = +4 000<\/td><td>15 000<\/td><\/tr><tr><td>12 Sep<\/td><td>2 510<\/td><td>-3 000<\/td><td>12 000<\/td><\/tr><tr><td>13 Sep<\/td><td>2 480<\/td><td>-3 000<\/td><td>9 000, so top up 2 000 to 11 000<\/td><\/tr><\/table><p>Closes 14 Sep at 2 480: gets R11 000 back after paying 11 000 + 2 000. <code>Net = 11 000 - 13 000 = -R2 000<\/code> = (2 480 - 2 500) x 100. The seller makes +R2 000 (paid 11 000 IM + 4 000 top-up, gets 17 000 back).<\/p>", "remember": ["VM day t = price day t - price day t-1 (x contract size)", "Total VM = total profit/loss of the position", "Day-one cash out = initial margin + day-one VM", "Gearing: R80/t = 4% of contract but ~73% of R11 000 margin"], "trap": "On the opening day the cash flow is the initial margin for ALL contracts PLUS that day's VM. 5 contracts at R11 000 = R55 000 before any VM.", "check": {"q": "A short holds 1 maize contract and the MTM rises R30/t. What is her VM?", "a": "-R3 000 (30 x 100 t). The short loses when the price rises."}, "ref": "4.6, Table 4.4, p.55-57"}, {"title": "Trading calendar and contract specs", "body": "<p>For a hedging month (Table 4.6, matching the dated Table 4.7):<\/p><ul><li><b>Option expiry<\/b>: 5th last business day of the previous month.<\/li><li><b>First position day<\/b>: 4th last business day of the previous month. First day a short may notify the JSE of intent to deliver.<\/li><li><b>First notice day<\/b>: last business day of the previous month. The JSE randomly assigns the notice to a long the same day.<\/li><li><b>Last trading day = futures expiry<\/b>: 12h00 on the 6th last business day of the expiry month.<\/li><li><b>Last notice day<\/b>: 5th last business day of the expiry month.<\/li><li><b>First delivery day<\/b>: 1st business day of the expiry month. Deliveries run to the 4th last business day (spec table).<\/li><\/ul><p><b>Specs<\/b>: white maize (WMAZ) and yellow maize (YMAZ) <b>100 t<\/b>; WOPT/YOPT = grade 2 maize of any origin, 100 t; wheat, sunflower, soya <b>50 t<\/b>. Trading 09:00-12:00, quoted in Rand/ton, minimum move 20c/t. Constant months are introduced <b>40 business days<\/b> before the month.<\/p>", "example": "<p>Sep 2023 (25 Sep a holiday): last business days are 29, 28, 27, 26, 22, 21.<\/p><p>Last trading day 21/09 = 6th last. Last notice day 22/09 = 5th last. Last delivery 26/09 = 4th last. First notice day 31/08 = last business day of August.<\/p>", "remember": ["First position day = first day a short may notify intent to deliver", "Futures expiry = last trading day (12h00, 6th last business day)", "Maize 100 t; wheat, sunflower, soya 50 t", "Constant month contracts: 40 business days before the month"], "trap": "The book's 4.5.2 text says the last notice day is the 'second last business day', but Table 4.6 and the dated Table 4.7 show the 5th last. Note also that 4.4.1 says constant months appear 20 business days before; the spec table and calendar say 40.", "check": {"q": "Which calendar day is the same as the futures expiry date?", "a": "The last trading day."}, "ref": "4.6, 4.6.1, Tables 4.6-4.9, p.58-67"}, {"title": "Basis and the effective hedge price", "body": "<p><code>Basis B = S - F<\/code> (spot minus the nearby futures). Negative is <b>'under'<\/b>, positive is <b>'over'<\/b>.<\/p><ul><li><b>Strengthens / narrows / improves<\/b>: less negative or more positive (spot rises relative to futures).<\/li><li><b>Weakens / widens<\/b>: more negative or less positive.<\/li><\/ul><p><b>Short hedger<\/b> (farmer, sells futures) is <b>long the basis<\/b>: gains when it strengthens. <b>Long hedger<\/b> (miller, buys futures) is <b>short the basis<\/b>: gains when it weakens.<\/p><p>For both hedgers, closing at t2:<\/p><p><code>Effective price = F1 + B2 = S2 + (F1 - F2) = S2 + variation margin<\/code><\/p><p><b>Price risk<\/b> is the general price moving. <b>Basis risk<\/b> is futures and spot diverging or converging unexpectedly. It is biggest if you lift the hedge before maturity, and smaller in forwards, which run to expiry.<\/p>", "example": "<p>15 May: S1 = R1 500, July F1 = R1 550, so B1 = -R50 (R50 under). Farmer John sells July futures.<\/p><p>15 June: S2 = R1 510, F2 = R1 555, so <code>B2 = 1 510 - 1 555 = -R45<\/code> (strengthened R5).<\/p><p><code>Effective = 1 550 + (-45) = R1 505/t<\/code>. Check: 1 510 + (1 550 - 1 555) = R1 505. If B2 were -R55, he gets 1 550 - 55 = R1 495: worse.<\/p>", "remember": ["B = S - F; negative = 'under'", "Seller of futures is long the basis: benefits if it strengthens", "Effective price (long or short hedge) = F1 + B2", "Basis risk is biggest when the hedge is lifted before expiry"], "trap": "One sentence in 4.7 says a widening basis hurts the long hedger. Trust the formula: F1 + B2 with a more negative B2 means the miller PAYS LESS. The exam answer for 'sells futures' is 'long; strengthens'.", "check": {"q": "Miller buys Dec wheat at R2 970 (spot R2 905). Later spot is R2 900 and Dec is R2 975. Effective price?", "a": "B2 = 2 900 - 2 975 = -75, so 2 970 - 75 = R2 895/t."}, "ref": "4.7, p.69-71, 210"}, {"title": "What makes up the basis, and convergence", "body": "<p>Basis has two parts:<\/p><ol><li><b>Location (transport) differential<\/b>: how far the local cash price is below Randfontein, set yearly by the JSE (weighted road and rail cost).<\/li><li>Randfontein cash price vs the nearby futures: <b>storage<\/b> (incl. interest and insurance), <b>handling<\/b>, <b>local surplus or shortage<\/b>, and <b>quality<\/b>.<\/li><\/ol><p>Every location has its own basis. Surplus areas have a weaker basis; shortage areas, or spots near an ethanol plant or feedlot, have a stronger one, sometimes even positive.<\/p><p><b>Convergence<\/b>: the basis usually narrows as delivery approaches, enforced by arbitrage. Equity and bond futures converge to zero basis. Grain does not: at expiry spot and futures still differ by the <b>transport cost<\/b>, plus any local supply and demand effects. Convergence can wobble, widening and narrowing along the way.<\/p><p>Tip from the book: when confused, picture a normal contango market (S below F).<\/p>", "example": "<p>Gauteng maize in January: transport to Randfontein R140/t, carry from January to March R40/t.<\/p><p><code>Basis vs March = -140 - 40 = -R180/t<\/code><\/p><p>Another: S1 = 100, F1 = 110, so B1 = -10. If S2 = 95, F2 = 108, then B2 = -13 (weaker). If S2 = 105, F2 = 112, then B2 = -7 (stronger).<\/p>", "remember": ["Basis components: transport, storage, handling, local supply and demand, quality", "Contango gives negative basis; high convenience yield can give positive basis", "Grain basis at expiry is not zero: transport differential remains", "Location differentials change once every 12 months"], "trap": "'Basis is affected only by storage and transport' is wrong. The self-test answer is ALL: storage/transport, local supply and demand, AND quality.", "check": {"q": "A new feedlot opens next to a silo. What happens to that silo's basis?", "a": "It strengthens: local demand lifts spot relative to futures, and the basis can even turn positive."}, "ref": "4.7.1, 4.7.2, p.70-75"}, {"title": "How the spot price is found: parity, location, area premium", "body": "<p>The local spot price is bounded by trade:<\/p><ul><li><b>Import parity<\/b> = landed cost of imported maize (transport, insurance, tariff, exchange rate). Millers import above it, so it is the <b>maximum<\/b>.<\/li><li><b>Export parity<\/b> = what foreign buyers pay. Farmers export below it, so it is the <b>minimum<\/b>.<\/li><\/ul><p>The price moves between the two with local supply and demand.<\/p><p>There is no single national price anymore. The spot price is the <b>JSE futures price in the delivery month at Randfontein<\/b>, minus each silo's location differential. SA has about 432 silos (172 on-farm, 260 commercial) and about 260 spot prices. 17 commercial owners hold 94% of capacity; AFGRI, Senwes and NWK hold 73%.<\/p><p>An <b>area (basis) premium<\/b> is added when local grain is scarce. It is arbitrary, negotiated, and can even exceed the transport differential.<\/p>", "example": "<p>Middelburg, March 2023: transport differential R173/t, a local buyer pays a R100/t premium.<\/p><p><code>Farmer gets = spot - 173 + 100 = spot - R73/t<\/code><\/p>", "remember": ["Import parity = ceiling; export parity = floor", "Spot price = JSE futures price in the delivery month (Randfontein)", "Local price = Randfontein - location differential (+ area premium)", "Area premium is negotiated and can exceed the differential"], "trap": "Distractors: spot 'should be higher than import parity' (no, it is the ceiling), 'same in Randfontein as Pretoria West' (no, differentials), 'dictated by silo owners' (no).", "check": {"q": "Why can't the domestic maize price stay above import parity?", "a": "Millers would just import more until local maize is as cheap as imported maize."}, "ref": "4.8, 4.8.1, 4.8.2, p.75-77"}, {"title": "Fair value, efficient markets and international contra
