b>JSE Executive<\/b>: where the JSE systems failed or were closed, halted or suspended.<\/li><li><b>Director: Market Regulation<\/b> (head of JSE Surveillance): where, from a <b>lack of clarity in published information<\/b>, a member traded a quantity or price that is unreasonable.<\/li><li>A void declaration is <b>binding on the member and the client<\/b>.<\/li><\/ul><p><b>Trading halt<\/b>: declared by the <b>Director: Market Regulation in conjunction with the CEO<\/b>, if trading:<\/p><ul><li>is or could be done by people with <b>unpublished price-sensitive information<\/b><\/li><li>is influenced by a <b>manipulative or deceptive<\/b> practice<\/li><li>may otherwise give rise to an <b>artificial price<\/b><\/li><\/ul><p>During a halt a member <b>may not trade<\/b> but <b>may delete orders<\/b>.<\/p>", "example": null, "remember": ["Trading halt: Director: Market Regulation + CEO.", "Void declaration binds member AND client.", "During a halt: no trading, but orders may be deleted.", "The JSE may impose daily price limits and position limits."], "trap": "'A trader may not delete orders during a halt' is FALSE. 'A trader may complete transactions during a halt' is also false. And the halt is NOT declared by the Market Controller.", "check": {"q": "Who may declare a trading halt in an agricultural product security?", "a": "The Director: Market Regulation, in conjunction with the Chief Executive Officer."}, "ref": "8.8, p.180-181; quiz p.191"}, {"title": "Reported trades: EFP, EFR and client registration", "body": "<p>All trades go through the <b>central order book<\/b> (price-time priority), except <b>reported transactions<\/b>. Members may enter and report principal assignment trades, <b>EFP<\/b> and <b>EFR<\/b> trades directly on the ATS, with <b>no prior referral<\/b> to the exchange.<\/p><p>Off-book criteria: supporting documents for the physical/OTC deal, available on request; futures quantity <b>within 5%<\/b> of the physical or OTC contract quantity; if the price is outside the rule parameters, it must be in the contract and the <b>clearing member must approve<\/b> first.<\/p><p><b>EFP<\/b> (exchange for physical): written contract where the futures buyer sells the physical to the futures seller; physical delivery months and futures expiry <b>within two months<\/b>; delivery/settlement at or after the futures trade; <b>SAGOS<\/b> terms (or equivalent); same parties or same beneficial ownership.<\/p><p><b>EFR<\/b> (exchange for risk): linked to an earlier OTC derivative on <b>ISDA<\/b> terms (or equivalent), unwound at about the same time the futures trade is reported; same parties/beneficial ownership.<\/p><p><b>Clients<\/b>: a member may only trade with/for a client after a <b>client agreement<\/b> and after <b>registering the client with the JSE<\/b>.<\/p>", "example": null, "remember": ["EFP/EFR futures quantity within 5% of the physical/OTC quantity.", "EFP: delivery and futures expiry within 2 months; SAGOS contract.", "EFR: ISDA agreement.", "Client: signed client agreement + registered with JSE."], "trap": "'The member must register as an FSP' or 'confirm the client's financial standing' are not the two rule 7.60 requirements.", "check": {"q": "What two things must happen before a member trades for a new client?", "a": "The client signs a client agreement with the member, and the member registers the client with the JSE."}, "ref": "8.9-8.13, p.181-182"}, {"title": "Daily price limits and their triggers", "body": "<p>Two types: <b>standard (everyday) limits<\/b> and <b>extended limits<\/b>. They apply to all <b>hedging months with open interest, excluding the spot month<\/b>.<\/p><ul><li><b>Extended trigger<\/b>: <b>two or more<\/b> hedging months MTM at the everyday limit, in the same direction, on <b>two consecutive days<\/b>. It doesn't have to be the same two months both days.<\/li><li><b>Return trigger<\/b>: a <b>majority (more than 65%)<\/b> of hedging months MTM <b>equal to or below<\/b> the everyday limit, in any direction.<\/li><\/ul><table><tr><th>Contract<\/th><th>Everyday<\/th><th>Extended<\/th><\/tr><tr><td>WMAZ / YMAZ<\/td><td>R150/t<\/td><td>R225/t<\/td><\/tr><tr><td>SOYA / SUNS<\/td><td>R270/t<\/td><td>R405/t<\/td><\/tr><tr><td>WEAT<\/td><td>R240/t<\/td><td>R360/t<\/td><\/tr><\/table><p>Limits may change from time to time (they are not fixed for a season). Extended = everyday x 1.5.<\/p>", "example": "<p>Table 8.1, everyday R50, extended R75, June = spot (ignored):<\/p><table><tr><th>Day<\/th><th>Jul<\/th><th>Sep<\/th><th>Dec<\/th><th>Mar<\/th><\/tr><tr><td>2<\/td><td>-50<\/td><td>-50<\/td><td>-30<\/td><td>-20<\/td><\/tr><tr><td>3<\/td><td>-50<\/td><td>-40<\/td><td>-50<\/td><td>-39<\/td><\/tr><tr><td>4<\/td><td>-51<\/td><td>-55<\/td><td>-60<\/td><td>-44<\/td><\/tr><tr><td>5<\/td><td>+40<\/td><td>+45<\/td><td>+50<\/td><td>+52<\/td><\/tr><\/table><ul><li>Day 2: Jul+Sep at limit. Day 3: Jul+Dec at limit. Two consecutive days, so <b>extended on day 4<\/b>.<\/li><li>Day 4: 3 of 4 above R50, so extended remains.<\/li><li>Day 5: 3 of 4 (75%, more than 65%) at or below R50, so <b>everyday limits return on day 6<\/b>.<\/li><li>Day 8: only 2 of 4 (50%) at or below R50, not a majority: extended stays.<\/li><\/ul>", "remember": ["Spot month is excluded from price limits.", "Extended: 2+ hedging months at limit, 2 consecutive days, same direction.", "Return: more than 65% of hedging months at or below everyday limit.", "Maize R150/R225; soya and sunflower R270/R405; wheat R240/R360."], "trap": "'Price limits stay unchanged for the whole season' is FALSE (they may change). 50% is not enough to return to everyday limits; you need more than 65%.", "check": {"q": "4 hedging months; on day 9 all four MTM at or below the everyday limit. What happens?", "a": "Everyday limits return the next day (day 10): 100% is more than 65%."}, "ref": "8.14, p.182-184"}, {"title": "Position limits, DOTs and trading times", "body": "<p><b>Delta option trades (DOTs)<\/b>: option trades between two members, reported to the system without delay after terms are agreed, with a minimum number of contracts and conditions on the delta hedge.<\/p><p><b>Speculative position limits<\/b>: no member or client may hold or control positions above the limits. Positions are counted net long or net short, with options on a <b>futures equivalent (delta-adjusted)<\/b> basis. Positions of people acting together count as one. On a written JSE request you must give a statement within <b>two business days<\/b>. The clearing house may order a position to be reduced.<\/p><p>Limits may be exceeded only for <b>valid hedging positions<\/b>, and for <b>spread/arbitrage positions<\/b> between single months (outside the spot month) within the all-months limit.<\/p><table><tr><th>Contract<\/th><th>Size<\/th><th>Spot month<\/th><th>Single month<\/th><th>All months<\/th><\/tr><tr><td>White maize<\/td><td>100<\/td><td>800<\/td><td>3 000<\/td><td>5 000<\/td><\/tr><tr><td>Yellow maize<\/td><td>100<\/td><td>1 800<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>Wheat<\/td><td>50<\/td><td>1 000<\/td><td>-<\/td><td>-<\/td><\/tr><tr><td>Soybeans<\/td><td>50<\/td><td>270<\/td><td>1 200<\/td><td>2 000<\/td><\/tr><\/table><p><b>Times<\/b> (agricultural): open 09h00, close 12h00, MTM release 12h45, physical delivery invoicing 14h30-15h00. The CDM trades every <b>business<\/b> day.<\/p>", "example": null, "remember": ["White maize: 800 spot / 3 000 single month / 5 000 all months.", "Futures delta factor +1 (long) / -1 (short); long call and short put = positive delta.", "Statement to the JSE within 2 business days.", "Ag market: 09h00 to 12h00, MTM 12h45."], "trap": "'The CDM operates every calendar day' is FALSE: every business day. Also, hedging positions may exceed speculative limits.", "check": {"q": "Which positions may exceed the speculative position limits?", "a": "Valid hedging positions, and spread/arbitrage positions between single months (outside the spot month) that stay within the all-months limit."}, "ref": "8.15-8.17, p.184-189"}]}, {"chapter": 9, "title": "How commodity prices are determined", "intro": "Why maize trades where it does: supply and demand, the rand, and the import/export parity band. Short chapter, but it reliably gives you one or two easy marks (fundamental vs technical, parity levels).", "cards": [{"title": "Fundamental analysis: finding real value", "body": "<p><b>Fundamental analysis<\/b> is rooted in economics and accounting, where <b>finding real value<\/b> is the name of the game. Its starting point: the market is <b>not perfectly efficient<\/b>. It can be the most time-consuming part of a decision. Once you know whether there's value at a price, you decide to be bullish or bearish.<\/p><p>It boils down to studying supply and demand and forecasting prices: supply large relative to demand, prices fall; demand large relative to supply, prices rise.<\/p><p><b>Top-down, three steps:<\/b><\/p><ol><li><b>Economy<\/b>: macro factors (economic and political climate, exchange rates, trade policies, overall commodity price level)<\/li><li><b>Commodity industry<\/b>: pricing vs substitutes, producer market power, tastes, exports, weather, technology, seasons<\/li><li><b>The commodity<\/b>: supply (beginning stock, production, imports) and demand (human consumption, feed, exports, industrial use, currency, transport cost)<\/li><\/ol>", "example": null, "remember": ["Determining whether there is real value at a price = FUNDAMENTAL analysis.", "Premise: price can only be understood by analysing underlying economic conditions.", "Top-down: economy, then industry, then commodity."], "trap": "'Price behaviour is random', 'moves in trends' or 'is cyclical' are the wrong premises. Trends belong to technical analysis.", "check": {"q": "What is the basic premise of fundamental analysis?", "a": "Price behaviour can only be understood by analysing the underlying economic conditions around the market (it assumes markets are not perfectly efficient)."}, "ref": "9.1, p.192-193; quiz p.202"}, {"title": "Macro and micro factors", "body": "<p><b>Macroeconomic factors<\/b> (the four in the book):<\/p><ul><li><b>Overall economic and political climate<\/b>: inflation, interest rates, price levels, fiscal policy, trade balances, politics<\/li><li><b>Foreign exchange rates<\/b>: if a currency depreciates, that country's goods become cheaper and more attractive<\/li><li><b>International trading policies and commodity agreements<\/b>: export subsidies and trade deals can override supply/demand for a while<\/li><li><b>Overall level of commodity prices<\/b>: commodity prices tend to move together; if one rises 10%, substitutes may rise similarly<\/li><\/ul><p><b>Industry/micro level<\/b>: how the commodity is priced against substitutes (to study sunflowers, look at soya beans and peanuts), producer market power, tastes, export opportunities, weather, technology, seasonal factors.<\/p><p>Some markets react more to <b>supply<\/b> (agriculture: weather dominates in the short run), others more to <b>demand<\/b> (precious metals with large stockpiles).<\/p>", "example": null, "remember": ["4 macro factors: economic/political climate, FX rates, trade policies/agreements, overall commodity price level.", "Agriculture: supply (weather) usually dominates in the short run.", "Precious metals: demand shifts are more pivotal."], "trap": "'All commodity prices are equally sensitive to supply and demand' is FALSE.", "check": {"q": "Why would a sunflower analyst look at soya bean prices?", "a": "Soya beans are a competing plant-oil source (substitute), and fundamental analysis checks how a commodity is priced relative to its substitutes."}, "ref": "9.1, p.193-194"}, {"title": "The supply and demand balance sheet", "body": "<p>National supply and demand figures (kept by <b>SAGIS<\/b>, the South African Grain Information Service) show how much is available and used per marketing year.<\/p><ul><li><b>Supply<\/b>: beginning (opening) stocks carried over from last year, <b>production<\/b> (hectares planted x expected yield), and <b>imports<\/b>.<\/li><li><b>Demand<\/b>: domestic human consumption and feed use, <b>exports<\/b>, industrial use. Exports vary with crop success here and abroad, currency value and transport costs.<\/li><\/ul><p><b>Closing stocks matter:<\/b><\/p><ul><li><b>Low<\/b> closing stock: price very sensitive to <b>weather, international supply and exchange rates<\/b>.<\/li><li><b>High<\/b> closing stock: less sensitive to weather, more sensitive to <b>exchange rates, SADC food availability and export opportunities<\/b>.<\/li><\/ul><p>The SA marketing year runs 1 May (opening stock) to 30 April (closing stock).<\/p>", "example": "<p>Table 9.1, total maize, projection 2022/23:<\/p><ul><li>Total supply: <b>17 356 171 t<\/b><\/li><li>Total demand: <b>15 416 200 t<\/b><\/li><li>Closing stock (30 Apr) = 17 356 171 - 15 416 200 = <b>1 939 971 t<\/b><\/li><li>That's about <b>2.0 months<\/b> or 62 days of stock at 950 600 t processed per month<\/li><\/ul>", "remember": ["Supply = opening stock + production + imports.", "Demand = human + feed + industrial + exports.", "Low stocks: weather-sensitive. High stocks: FX, SADC and export-sensitive.", "SAGIS keeps the national data."], "trap": "Mixing up the two stock scenarios: weather sensitivity goes with LOW stocks, not high stocks.", "check": {"q": "Closing stocks are very high this year. What will prices be most sensitive to?", "a": "Exchange rates, food availability in SADC and international export opportunities (and less to weather)."}, "ref": "9.1, p.194-197"}, {"title": "Import parity: the price ceiling", "body": "<p>Local maize prices move between two extremes: <b>import parity<\/b> (top) and <b>export parity<\/b> (bottom).<\/p><p><b>Import parity<\/b> = the cost of importing US maize from a Gulf of Mexico port, landed in <b>Randfontein<\/b>. Reference: CME futures (or Argentine maize on ROFEX/MATBA from up-river ports). Uses <b>yellow<\/b> maize, which is the bulk of world production and trade.<\/p><p>Build-up: <code>FOB + freight + insurance (0.3% of FOB) = CIF<\/code>, convert to rand, add financing, discharging costs and import tariff (= FOR price at the harbour), then add railage to Randfontein.<\/p><p>Import parity is the <b>highest<\/b> level of local prices. Prices can briefly go above it, but arbitrage (importing) pulls them back down.<\/p>", "example": "<p>USA maize (Table 9.2):<\/p><ul><li>CIF = 318.00 + 39.00 + 0.95 = <b>$357.95/t<\/b><\/li><li>x R8.7461 = <b>R3 130.67<\/b><\/li><li>+ financing R21.87 = R3 152.54<\/li><li>+ Durban discharging R139.93 = FOR Durban <b>R3 292.47<\/b> (tariff R0)<\/li><li>+ railage Durban-Randfontein R353.08 = <b>R3 645.55/t<\/b> delivered Randfontein<\/li><\/ul><p>Argentina: 287 + 31 + 0.86 = $318.86, delivered Randfontein R3 301.27. SAFEX yellow maize spot was R2 525: well below parity.<\/p>", "remember": ["Import parity = HIGHEST level of the local price (ceiling).", "Insurance = 0.3% of FOB.", "Argentina is the world's 3rd-largest maize exporter (after USA, Brazil) in 2022/23."], "trap": "The book's own chapter-9 quiz answer says import parity is the 'lowest' level, which contradicts the text. Go with the text: import parity = highest (ceiling), export parity = lowest (floor). 'The local spot price should normally be higher than import parity' is false.", "check": {"q": "Local maize trades above import parity. What happens next?", "a": "Importing becomes profitable; arbitrage brings in imports and forces the local price back down to import parity."}, "ref": "9.1.1, p.197-198"}, {"title": "Export parity: the price floor", "body": "<p><b>Export parity<\/b> = what you realise by exporting maize from <b>Durban harbour<\/b>. It reflects the <b>lowest<\/b> level of the local price.<\/p><p>Build-up: start from the US Gulf FOB price, add the SA quality/locality difference (for maize <b>plus $10<\/b>) to get SA FOB, convert to rand, then <b>subtract<\/b> marketing costs: financing, railage Randfontein to Durban, and harbour loading costs.<\/p><p>As local prices fall towards export parity, <b>export opportunities<\/b> open up. Exports add demand, pushing prices higher in the medium term.<\/p>", "example": "<p>Table 9.3:<\/p><ul><li>SA FOB = 318.00 + 10.00 = <b>$328/t<\/b><\/li><li>x R8.7461 = <b>R2 868.72<\/b><\/li><li>- financing R20.048<\/li><li>- railage Randfontein-Durban R353.08<\/li><li>- loading Durban R130.72<\/li><li>= export realisation <b>R2 364.88/t<\/b> (book figure)<\/li><\/ul><p>SAFEX spot R2 525 sat between export parity (R2 364.88) and import parity (R3 645.55).<\/p>", "remember": ["Export parity = LOWEST level of the local price (floor).", "Costs are SUBTRACTED for export parity, ADDED for import parity.", "SA maize quality/locality adjustment: +$10/t."], "trap": null, "check": {"q": "Why can't the local price stay far below export parity for long?", "a": "Exporting becomes attractive, export demand increases and pushes local prices back up."}, "ref": "9.1.1, p.198-199"}, {"title": "Soft vs hard commodities and the rand", "body": "<ul><li><b>Soft commodities<\/b>: grown or cultivated (maize, wheat). Local grain prices are guided in the medium to long run by import and export parity.<\/li><li><b>Hard commodities<\/b>: mined (gold, platinum, palladium, coal, iron ore, copper). Prices are mainly set in <b>international markets<\/b>, though a local supply problem in a major metal like platinum can move world prices for a while. SA's only oil comes from Sasol's coal-to-oil process.<\/li><\/ul><p>All internationally traded commodities are strongly affected by the <b>rand-dollar rate<\/b>:<\/p><ul><li><b>Weak rand<\/b>: good for exporters (platinum, coal, gold)<\/li><li><b>Strong rand<\/b>: good for importers and users of imported goods (oil, coffee)<\/li><\/ul><p>Mixed effect: a chicken producer likes a strong rand (it lowers maize parity prices, his main input), but a strong rand also makes <b>imported chicken cheaper<\/b>, which hurts him.<\/p>", "example": null, "remember": ["Soft = grown; hard = mined.", "Weak rand helps exporters; strong rand helps importers.", "A strong rand lowers import/export parity prices of maize."], "trap": null, "check": {"q": "How does a stronger rand affect the local maize price band?", "a": "It lowers both import and export parity prices (in rand), so the band moves down."}, "ref": "9.1.2, p.199"}, {"title": "Supply, demand and the equilibrium price", "body": "<p>Under normal conditions, price comes from the interaction of supply and demand. When buyers and sellers agree, that price is the <b>equilibrium<\/b> or <b>market clearing<\/b> price.<\/p><p>A market price is <b>not<\/b> a fair price to everyone: satisfaction depends on each participant's competitive position. Both sides are profit maximisers: too low a price gives buyers excess profits and attracts buyer competition; too high a price attracts more producers.<\/p><p>When supply or demand <b>shifts<\/b>, the equilibrium changes. Good weather shifts supply outward; with no matching rise in demand, the price falls to a new, lower equilibrium to clear the extra grain. A change in consumer preferences shifts demand and also moves the price.<\/p>", "example": null, "remember": ["Equilibrium price = market clearing price.", "A market price is not necessarily fair to all participants.", "Good weather: supply shifts out, equilibrium price falls."], "trap": null, "check": {"q": "A bumper maize crop arrives and demand doesn't change. What happens to the price and why?", "a": "It falls: supply shifts outward, and a lower equilibrium price is needed to clear the excess supply."}, "ref": "9.2, p.199-200"}, {"title": "Technical analysis vs fundamental analysis", "body": "<p><b>Fundamental<\/b> analysis studies the <b>causes<\/b> of price moves (supply and demand). <b>Technical<\/b> analysis studies the market action itself, the <b>effect<\/b>: price charts, trends, cycles, support and resistance, using daily, weekly and monthly charts to time entry and exit.<\/p><p>Three assumptions of technical analysis:<\/p><ol><li>The market has <b>discounted all current fundamental factors<\/b><\/li><li>Prices move in <b>trends<\/b> and countertrends, not haphazardly<\/li><li><b>History repeats itself<\/b><\/li><\/ol><table><tr><th>Fundamental<\/th><th>Technical<\/th><\/tr><tr><td>Intrinsic value<\/td><td>Price movements and volume traded<\/td><\/tr><tr><td>Justifies WHAT to buy or sell<\/td><td>Strongest on WHEN to buy or sell<\/td><\/tr><tr><td>More objective<\/td><td>More subjective<\/td><\/tr><tr><td>Needs a lot of effort, expertise, experience<\/td><td>Needs less training and insight<\/td><\/tr><\/table>", "example": null, "remember": ["Technical: discounts everything, trends, history repeats.", "Fundamental = what to trade (intrinsic value); technical = when to trade (timing).", "Fundamental is more objective but needs more expertise."], "trap": "Swapping the columns: technical is the MORE subjective one and needs LESS training.", "check": {"q": "List the three assumptions of technical analysis.", "a": "The market has discounted all fundamentals; prices move in trends; history repeats itself."}, "ref": "9.3, p.200-202"}]}];
const SOURCES = { P1: "Paper 1 (sunflower)", P3: "Paper 2 (wheat grades)", BOOK: "Study book self-tests", IDK: "IDK practice questions (new)" };

const STORE = "safex-oefen-v1";

QUESTIONS.forEach(q => { q.id = q.paper + "-" + q.n; });
const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));

// stats[id] = {seen, right, streak}; wrong ids leave the review list after 2 right in a row
let state = load();
function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || { stats: {}, exams: [] }; }
  catch { return { stats: {}, exams: [] }; }
}
function save() { localStorage.setItem(STORE, JSON.stringify(state)); }
function record(q, ok) {
  const s = state.stats[q.id] || (state.stats[q.id] = { seen: 0, right: 0, streak: 0, review: false });
  s.seen++;
  if (ok) { s.right++; s.streak++; if (s.streak >= 2) s.review = false; }
  else { s.streak = 0; s.review = true; }
  const day = new Date().toLocaleDateString("sv-SE");
  state.days = state.days || {};
  state.days[day] = (state.days[day] || 0) + 1;
  save();
}
const reviewIds = () => QUESTIONS.filter(q => state.stats[q.id]?.review).map(q => q.id);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
const topics = [...new Set(QUESTIONS.map(q => q.topic))].sort();

const IZAK_WA = "27825528523";
function topicScores() {
  return topics.map(t => {
    const st = QUESTIONS.filter(q => q.topic === t).map(q => state.stats[q.id]).filter(Boolean);
    const seenN = st.reduce((a, s) => a + s.seen, 0), rightN = st.reduce((a, s) => a + s.right, 0);
    return { t, seenN, pct: seenN ? Math.round(100 * rightN / seenN) : null };
  }).filter(x => x.seenN >= 3).sort((a, b) => a.pct - b.pct);
}
function sendReport() {
  const st = Object.values(state.stats);
  const answered = st.reduce((a, s) => a + s.seen, 0);
  const right = st.reduce((a, s) => a + s.right, 0);
  const pct = answered ? Math.round(100 * right / answered) : 0;
  const days = Object.keys(state.days || {}).sort();
  const today = new Date().toLocaleDateString("sv-SE");
  const lastDay = days[days.length - 1];
  const ex = state.exams;
  const best = ex.length ? Math.max(...ex.map(e => e.pct)) : null;
  const ts = topicScores();
  const verdict =
    !answered ? "Hy het die app oopgemaak. Dis al. 🦗" :
    answered < 30 ? "Hy't die swembad met een toon getoets. 🩴" :
    pct < 50 ? "Die handboek is nog in die plastiek. 📦" :
    pct < 70 ? "Op pad, maar die eksaminator lag nog. 😬" :
    pct < 85 ? "Slaag-gebied! Moenie nou ophou nie. 🔥" :
    "SAFEX-legende. Bestel al die feestaart. 🏆";
  const lines = [
    "📊 *SAFEX-RAPPORT: Renaldogg*",
    "",
    `Uitspraak: ${verdict}`,
    "",
    `🧠 Antwoorde gegee: ${answered} (${pct}% reg)`,
    `📚 Vrae gesien: ${st.filter(s => s.seen).length} / ${QUESTIONS.length}`,
    `🔁 Foute nog om reg te kry: ${reviewIds().length}`,
    `⏱️ Eksamens geskryf: ${ex.length}${ex.length ? ` (beste ${best}%, laaste ${ex[ex.length - 1].pct}%)` : " 🐔"}`,
    `📅 Dae geoefen: ${days.length}${lastDay ? (lastDay === today ? " (ook vandag ✅)" : ` (laaste keer ${lastDay} 👀)`) : ""}`,
  ];
  if (ts.length) {
    lines.push(`💀 Swakste: ${ts[0].t} (${ts[0].pct}%)`);
    if (ts.length > 1) lines.push(`💪 Sterkste: ${ts[ts.length - 1].t} (${ts[ts.length - 1].pct}%)`);
  }
  lines.push("", "_Outomaties gestuur deur SAFEX Oefen. Hy kan nie die syfers kul nie._ 😏");
  window.open(`https://wa.me/${IZAK_WA}?text=${encodeURIComponent(lines.join("\n"))}`, "_blank");
}

function showCard(c, i) {

function chapterDone(c) {

// ---------- learn: calculators ----------
const R = x => (x < 0 ? "−" : "") + "R" + Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(/,/g, " ");
const num = id => parseFloat(document.getElementById(id).value) || 0;
const field = (id, label, val, step = "any") => `<label for="${id}">${label}</label><input id="${id}" type="number" inputmode="decimal" step="${step}" value="${val}" oninput="calcRun()">`;
const CALCS = {
  basis: {
    title: "Basis & effective hedge price",
    intro: "Basis = spot − futures. A hedger locks in F1 + B2 (futures price when opening + basis when closing).",
    form: () => `<div class="row2">${field("s2", "Spot price at close (R/t)", 1810)}${field("f2", "Futures price at close (R/t)", 1855)}</div>
      ${field("f1", "Futures price when hedge opened (R/t)", 1850)}`,
    run: () => {
      const s2 = num("s2"), f2 = num("f2"), f1 = num("f1"), b = s2 - f2;
      return `<p>Basis = <code>${s2} − ${f2} = ${b}</code> → <b>R${Math.abs(b)} ${b < 0 ? "“under”" : b > 0 ? "“over”" : "(zero)"}</b></p>
        <p>Effective price = <code>F1 + B2 = ${f1} + (${b}) = ${f1 + b}</code> → <b>${R(f1 + b)}/t</b></p>
        <p class="muted">Short hedger (farmer) is <b>long the basis</b>: a stronger basis helps him. Long hedger (miller) is <b>short the basis</b>: a stronger basis hurts him.</p>`;
    },
  },
  mtm: {
    title: "Margin & daily mark-to-market",
    intro: "Every day the position is revalued at the MTM price. Variation margin = change in price × tons. Initial margin is paid on day 1 and returned at close-out.",
    form: () => `<label for="side">Position</label><select id="side" onchange="calcRun()"><option value="1">Long (bought)</option><option value="-1">Short (sold)</option></select>
      <div class="row2">${field("n", "Contracts", 5, 1)}${field("t", "Tons per contract", 100, 1)}</div>
      <div class="row2">${field("p0", "Trade price (R/t)", 1800)}${field("im", "Initial margin per contract", 11000)}</div>
      <label for="mtms">Daily MTM prices, comma separated (R/t)</label><input id="mtms" value="1790, 1815, 1830, 1820" oninput="calcRun()">`,
    run: () => {
      const side = +document.getElementById("side").value, n = num("n"), t = num("t"), p0 = num("p0"), im = num("im");
      const prices = document.getElementById("mtms").value.split(",").map(x => parseFloat(x)).filter(x => !isNaN(x));
      let prev = p0, cum = 0;
      const rows = prices.map((p, i) => {
        const vm = side * (p - prev) * n * t; prev = p; cum += vm;
        const imFlow = i === 0 ? -im * n : 0;
        return `<tr><td>Day ${i + 1}</td><td class="num">${p}</td><td class="num">${R(vm)}</td><td class="num">${imFlow ? R(imFlow) : "–"}</td></tr>`;
      }).join("");
      return `<table><tr><th>Day</th><th class="num">MTM</th><th class="num">Variation margin</th><th class="num">Initial margin</th></tr>${rows}</table>
        <p>Total variation margin: <b>${R(cum)}</b> = <code>${side > 0 ? "" : "−"}(${prev} − ${p0}) × ${n} × ${t}</code></p>
        <p class="muted">Initial margin of ${R(im * n)} comes back when he closes. Day 1 cash flow = −initial margin + day 1 variation margin.</p>`;
    },
  },
  fwd: {
    title: "Forward / futures fair price",
    intro: "Book method: take the present value of storage (U), add it to spot, then grow at interest minus convenience yield: F = (S + U)(1 + (r − y)/m)^(m×t).",
    form: () => `<div class="row2">${field("S", "Spot price (R/t)", 1150)}${field("st", "Storage (R/t, paid at end)", 69)}</div>
      <div class="row2">${field("r", "Interest rate (% p.a.)", 6.5)}${field("y", "Convenience yield (%)", 2.75)}</div>
      <div class="row2">${field("mo", "Months to delivery", 9, 1)}${field("m", "Compounding per year", 4, 1)}</div>`,
    run: () => {
      const S = num("S"), st = num("st"), r = num("r") / 100, y = num("y") / 100, t = num("mo") / 12, m = num("m") || 1;
      const U = st * Math.pow(1 + r / m, -m * t), F = (S + U) * Math.pow(1 + (r - y) / m, m * t);
      return `<p>U = <code>${st} × (1 + ${r}/${m})^−${(m * t).toFixed(2)}</code> = <b>${R(U)}</b></p>
        <p>F = <code>(${S} + ${U.toFixed(2)}) × (1 + (${r} − ${y})/${m})^${(m * t).toFixed(2)}</code> = <b>${R(F)}/t</b></p>
        <p class="muted">Higher interest or storage → higher forward price (contango). A big convenience yield can push it below spot (backwardation).</p>`;
    },
  },
  opt: {
    title: "Option value: ITM, ATM or OTM?",
    intro: "Premium = intrinsic value + time value. Intrinsic value is never negative.",
    form: () => `<label for="ty">Option type</label><select id="ty" onchange="calcRun()"><option value="call">Call (right to buy)</option><option value="put">Put (right to sell)</option></select>
      <div class="row2">${field("K", "Strike (R/t)", 3200)}${field("F", "Futures price (R/t)", 3300)}</div>${field("prem", "Premium (R/t)", 140)}`,
    run: () => {
      const call = document.getElementById("ty").value === "call", K = num("K"), F = num("F"), prem = num("prem");
      const iv = Math.max(0, call ? F - K : K - F), tv = prem - iv;
      const m = (call ? F - K : K - F) > 0 ? "In-the-money (ITM)" : F === K ? "At-the-money (ATM)" : "Out-of-the-money (OTM)";
      return `<p><b>${m}</b></p>
        <p>Intrinsic value = <code>max(0, ${call ? `${F} − ${K}` : `${K} − ${F}`})</code> = <b>${R(iv)}</b></p>
        <p>Time value = <code>${prem} − ${iv}</code> = <b>${R(tv)}</b></p>
        <p class="muted">${call ? "A call is ITM when the futures price is above the strike." : "A put is ITM when the futures price is below the strike."} OTM and ATM options are pure time value.</p>`;
    },
  },
};
let calcCur = null;
function showCalc(k) {
  calcCur = k;
  const c = CALCS[k];
  app.innerHTML = `<div class="bar"><button class="small" onclick="learnHome()">← Learn</button><span>🧮 Calculator</span></div>
    <h1>${c.title}</h1><p class="muted">${c.intro}</p>
    <div class="card calc">${c.form()}<div class="out" id="calcOut"></div></div>`;
  calcRun();
  window.scrollTo(0, 0);
}
function calcRun() { document.getElementById("calcOut").innerHTML = CALCS[calcCur].run(); }

// ---------- home ----------
function home() {
  stopTimer();
  const rev = reviewIds().length;
  const seen = Object.values(state.stats).filter(s => s.seen).length;
  const last = state.exams[state.exams.length - 1];
  app.innerHTML = `
    ${BRAND}
        <h1>SAFEX Practice 💪</h1>
    <p class="muted">Hey Renaldogg. ${QUESTIONS.length} questions, all checked against the study book. Exam: 50 questions, 60 min, 70% to pass.</p>
    <div class="card">
      <p><b>${seen}</b> / ${QUESTIONS.length} questions seen · <b>${rev}</b> to review${last ? ` · last exam: <b class="${last.pct >= 70 ? "pass" : "fail"}">${last.pct}%</b>` : ""}</p>
    </div>
    ${LESSONS.length ? `<button onclick="learnHome()">📖 Learn the book <span class="muted">(chapters, explained simply)</span></button>` : ""}
    ${rev ? `<button class="primary" onclick="startPractice(reviewIds(), 'Review mistakes')">🔁 Review my mistakes (${rev})</button>` : ""}
    <button ${rev ? "" : 'class="primary"'} onclick="startPractice(QUESTIONS.map(q=>q.id), 'Everything shuffled')">🎯 Practice: everything shuffled</button>
    <button onclick="startExam()">⏱️ Exam mode: 50 questions, 60 minutes</button>
    <h2>By paper</h2>
    ${Object.entries(SOURCES).filter(([k]) => QUESTIONS.some(q => q.paper === k)).map(([k, v]) =>
      `<button onclick="startPractice(QUESTIONS.filter(q=>q.paper==='${k}').map(q=>q.id), '${esc(v)}', true)">${esc(v)} <span class="muted">(${QUESTIONS.filter(q => q.paper === k).length})</span></button>`).join("")}
    <h2>By topic</h2>
    <table>${topics.map(t => {
      const qs = QUESTIONS.filter(q => q.topic === t);
      const st = qs.map(q => state.stats[q.id]).filter(Boolean);
      const seenN = st.reduce((a, s) => a + s.seen, 0), rightN = st.reduce((a, s) => a + s.right, 0);
      const pct = seenN ? Math.round(100 * rightN / seenN) : null;
      return `<tr onclick="startPractice(QUESTIONS.filter(q=>q.topic===${esc(JSON.stringify(t))}).map(q=>q.id), ${esc(JSON.stringify(t))})" style="cursor:pointer">
        <td>${esc(t)} <span class="muted">(${qs.length})</span></td>
        <td class="num ${pct === null ? "" : pct >= 70 ? "pass" : "fail"}">${pct === null ? "–" : pct + "%"}</td></tr>`;
    }).join("")}</table>
    <button style="margin-top:20px" onclick="sendReport()">📲 Send report to Izak</button>
    <p class="muted" style="margin-top:12px">Progress is saved on this phone.
      <button class="small" onclick="if(confirm('Delete all progress?')){state={stats:{},exams:[],days:{},learned:{}};save();home()}">Start over</button></p>`;
}

// ---------- practice ----------
let P = null;
function startPractice(ids, title, inOrder) {
  if (!ids.length) return;
  P = { title, queue: inOrder ? ids.slice() : shuffle(ids), done: 0, right: 0, total: ids.length, answered: null };
  showPractice();
}
function qHtml(q) {
  return `
    <div><span class="tag">${esc(SOURCES[q.paper] || q.paper)} · Q${esc(q.n)}</span><span class="tag">${esc(q.topic)}</span></div>
    <p style="margin-top:10px"><b>${esc(q.question)}</b></p>
    ${q.data ? `<pre class="data">${esc(q.data)}</pre>` : ""}
    ${q.statements?.length ? `<ul class="stmts">${q.statements.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}`;
}
function showPractice() {
  const id = P.queue[0];
  if (!id) return practiceDone();
  const q = byId[id];
  P.answered = null;
  app.innerHTML = `
    <div class="bar"><button class="small" onclick="home()">← Home</button><span>${esc(P.title)} · ${P.done}/${P.total} · ✅ ${P.right}</span></div>
    <div class="progress"><div style="width:${100 * P.done / P.total}%"></div></div>
    ${qHtml(q)}
    <div id="opts">${Object.entries(q.options).map(([k, v]) =>
      `<button class="opt" data-k="${k}" onclick="answerPractice('${k}')"><b>${k}</b><span>${esc(v)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  window.scrollTo(0, 0);
}
function feedbackHtml(q, ok, noHead) {
  const uitleg = q.uitleg_en || q.uitleg;
  const note = q.note_en || q.note;
  const head = ok ? "✅ Correct!" : `❌ The answer is ${q.answer}.`;
  return `<div class="card feedback ${ok ? "" : "bad"}">
    ${noHead ? "" : `<p><b>${head}</b></p>`}
    <p>${esc(uitleg)}</p>
    ${q.book_ref ? `<p class="muted">📖 Study book: ${esc(q.book_ref)}</p>` : ""}
    ${note ? `<p class="flag">⚠️ ${esc(note)}</p>` : ""}
  </div>`;
}
function answerPractice(k) {
  if (P.answered) return;
  const q = byId[P.queue[0]];
  const ok = k === q.answer;
  P.answered = k;
  record(q, ok);
  document.querySelectorAll("#opts .opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.k === q.answer) b.classList.add("correct");
    else if (b.dataset.k === k) b.classList.add("wrong");
  });
  P.queue.shift();
  if (ok) { P.done++; P.right++; }
  else P.queue.splice(Math.min(3, P.queue.length), 0, q.id); // comes back 3 questions later
  document.getElementById("fb").innerHTML = feedbackHtml(q, ok) +
    `<button class="primary" onclick="showPractice()">Next →</button>`;
  document.getElementById("fb").scrollIntoView({ behavior: "smooth", block: "start" });
}
function practiceDone() {
  app.innerHTML = `<h1>Done! 🎉</h1>
    <div class="card"><p>${esc(P.title)}: all ${P.total} questions answered correctly.</p>
    <p class="muted">Questions you got wrong came back until you got them right.</p></div>
    <button class="primary" onclick="home()">Back home</button>`;
}

// ---------- exam ----------
let E = null, timer = null;
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function startExam() {
  // the papers share many questions; skip repeats of the same stem
  const seen = new Set();
  const ids = shuffle(QUESTIONS).filter(q => {
    const key = q.question.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 80);
    return !seen.has(key) && seen.add(key);
  }).slice(0, 50).map(q => q.id);
  E = { ids, picks: {}, i: 0, end: Date.now() + 60 * 60 * 1000 };
  stopTimer();
  timer = setInterval(() => {
    const el = document.getElementById("clock");
    const left = E.end - Date.now();
    if (left <= 0) return finishExam();
    if (el) el.textContent = fmt(left);
  }, 1000);
  showExam();
}
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function showExam() {
  const q = byId[E.ids[E.i]];
  const answered = Object.keys(E.picks).length;
  app.innerHTML = `
    <div class="bar"><span>Question ${E.i + 1}/${E.ids.length} · ${answered} answered</span><b id="clock">${fmt(E.end - Date.now())}</b></div>
    <div class="grid">${E.ids.map((id, i) =>
      `<button class="${E.picks[id] ? "done" : ""} ${i === E.i ? "cur" : ""}" onclick="E.i=${i};showExam()">${i + 1}</button>`).join("")}</div>
    <div class="card">${qHtml(q).replace(/<span class="tag">[^<]*<\/span><span class="tag">[^<]*<\/span>/, "")}
    ${Object.entries(q.options).map(([k, v]) =>
      `<button class="opt ${E.picks[q.id] === k ? "picked" : ""}" onclick="E.picks['${q.id}']='${k}';${E.i < E.ids.length - 1 ? "E.i++;" : ""}showExam()"><b>${k}</b><span>${esc(v)}</span></button>`).join("")}</div>
    <div class="bar">
      <button class="small" ${E.i ? "" : "disabled"} onclick="E.i--;showExam()">← Previous</button>
      <button class="small" ${E.i < E.ids.length - 1 ? "" : "disabled"} onclick="E.i++;showExam()">Next →</button>
    </div>
    <button class="primary" onclick="if(confirm('Submit? ${E.ids.length - answered} unanswered.'))finishExam()">Submit</button>
    <button class="small" onclick="if(confirm('Quit the exam?'))home()">Quit</button>`;
  window.scrollTo(0, 0);
}
function finishExam() {
  stopTimer();
  let right = 0;
  E.ids.forEach(id => { const q = byId[id]; const k = E.picks[id]; const ok = k === q.answer; if (ok) right++; record(q, ok); });
  const pct = Math.round(100 * right / E.ids.length);
  state.exams.push({ at: Date.now(), pct }); save();
  const perTopic = {};
  E.ids.forEach(id => { const q = byId[id]; const t = perTopic[q.topic] || (perTopic[q.topic] = [0, 0]); t[1]++; if (E.picks[id] === q.answer) t[0]++; });
  app.innerHTML = `
    <h1>Result</h1>
    <div class="card"><div class="big ${pct >= 70 ? "pass" : "fail"}">${pct}%</div>
      <p>${right}/${E.ids.length} correct · ${pct >= 70 ? "✅ Passed!" : "❌ Not yet. You need 70% (35/50)."}</p></div>
    <h2>By topic</h2>
    <table>${Object.entries(perTopic).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([t, [r, n]]) =>
      `<tr><td>${esc(t)}</td><td class="num ${r / n >= .7 ? "pass" : "fail"}">${r}/${n}</td></tr>`).join("")}</table>
    <h2>Mistakes</h2>
    ${E.ids.filter(id => E.picks[id] !== byId[id].answer).map(id => {
      const q = byId[id];
      return `<div class="card">${qHtml(q)}
        ${Object.entries(q.options).map(([k, v]) => `<div class="opt ${k === q.answer ? "correct" : k === E.picks[id] ? "wrong" : ""}" style="padding:6px;border-radius:8px;border:1px solid transparent"><b>${k}</b> <span>${esc(v)}</span></div>`).join("")}
        <p class="muted">You: ${E.picks[id] || "nothing"} · Correct: ${q.answer}</p>${feedbackHtml(q, false, true)}</div>`;
    }).join("") || "<p>No mistakes! 🔥</p>"}
    <button onclick="sendReport()">📲 Send report to Izak</button>
    <button class="primary" onclick="home()">Back home</button>`;
  window.scrollTo(0, 0);
}

home();
</script>
