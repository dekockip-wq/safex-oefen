ding to some of the other farmers in the district, the price of White Maize will increase dramatically as they expect adverse weather in other countries to result in a supply shortage. Which ONE of the following positions should the farmer enter into if he is to limit his potential losses, but still wants to share in the profits should prices increase? He should take a", "statements": [], "options": {"A": "short position in a call option.", "B": "short position in a futures contract.", "C": "long position in a put option.", "D": "long position in a futures contract."}, "answer": "C", "uitleg": "'n Long put gee die boer 'n vloerprys (beperk verliese as pryse daal) terwyl hy steeds voordeel trek as pryse styg; hy verloor net die premie. 'n Short futures beskerm ook, maar sluit die opside uit. 'n Short call beskerm nie teen 'n groot prysdaling nie.", "book_ref": "6.2 p.100; 7.1.5 p.156", "topic": "Option strategies", "note": null, "data": null}, {"paper": "P3", "n": 33, "question": "A prudent grain elevator owner would use the commodity derivatives market to obtain protection against", "statements": [], "options": {"A": "a decrease in price before purchasing the maize.", "B": "a decrease in price during its maize holding period.", "C": "an increase in price during its maize holding period.", "D": "an increase in price after selling the maize."}, "answer": "B", "uitleg": "Die boek noem 'merchandisers, elevators' as hedgers wat beskerming nodig het teen laer pryse gedurende hul mielie-houperiode. Hulle besit die voorraad (long physical), so 'n prysdaling is die risiko. 'n Prysstyging tydens die houperiode is juis voordelig vir hulle.", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 34, "question": "Which of the following are an objective of hedging using a commodity futures contract?", "statements": ["(i) Protecting profit margins.", "(ii) Locking in certain cash flows.", "(iii) Increase exposure to the commodity.", "(iv) Diversification of one's overall position."], "options": {"A": "(i) and (ii) only", "B": "(i), (ii) and (iv) only", "C": "(i), (iii) and (iv) only", "D": "(ii), (iii) and (iv) only"}, "answer": "B", "uitleg": "Die boek lys redes vir hedging: protect profit margins, stabilise (lock in) cash flows, transfer risk, diversify en improve liquidity. 'Increase exposure to the commodity' is spekulasie, nie hedging nie - hedging verminder blootstelling.", "book_ref": "7.1.1, p.141", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 35, "question": "A long hedge may be defined as taking a", "statements": [], "options": {"A": "short position in the futures contract to hedge an existing short position.", "B": "short position in the futures contract to hedge an existing long position.", "C": "long position in the futures contract to hedge an existing short physical position.", "D": "long position in the futures contract to hedge an existing long position."}, "answer": "C", "uitleg": "'n Long (buying) hedge: iemand wat die produk nodig het (bv. 'n meulenaar) is 'short' in die fisiese mark en koop futures (long) om teen stygende pryse te beskerm. B is die definisie van 'n short hedge.", "book_ref": "7.1.2, p.142-143", "topic": "Basis & hedging", "note": null, "data": null}, {"paper": "P3", "n": 36, "question": "Baker John Motsepe from Bela Bela is concerned that the price of wheat may rise due to poor crop conditions experienced in America and in Australia. He would like to hedge his exposure to 2 000 tons of wheat that he will need during December. He phones his broker and instructs him to buy (go long) 40 December wheat contracts at R2 000/ton. Brokerage also amounts to R5/t per trade. Location differential and handling fees for Bela Bela amount to R100/ton and this basis (which is R100 'under') also remains constant. During December, baker Motsepe exits his entire futures position by offsetting at the new futures price of R1 600/ton and buys the wheat in the spot market. If the basis remains constant, his cash flow position will be as per the table. Should the basis strengthen by R15 per ton in December, the total net cash flow for Baker Motsepe will change to", "statements": [], "options": {"A": "-R3 850 000", "B": "-R3 830 000", "C": "-R3 820 000", "D": "-R3 790 000"}, "answer": "A", "uitleg": "Long hedge: effective price paid = F1 + B2 + brokerage. Konstante basis: 2 000 - 100 + 2×5 = R1 910/t → -R3 820 000 (dis opsie C, die tabel se bedrag). Basis versterk met R15 → B2 = -85: 2 000 - 85 + 10 = R1 925/t × 2 000 t = -R3 850 000. Die boek: 'n versterking van die basis is ongunstig vir die long hedger (short the basis), dus betaal hy meer, nie minder nie (D gaan verkeerdelik die ander kant toe).", "book_ref": "4.7, p.70; 7.1.2, p.142", "topic": "Basis & hedging", "note": "Die memo het D gesê, maar volgens die handboek is A reg.", "data": null}, {"paper": "P3", "n": 37, "question": "A farmer knows that he needs to receive at least R850/ton of maize when he harvests his crop in 3 months' time. He is of the opinion that maize prices will drop over the next few months and wishes to lock in the price at which he may sell his produce. He is convinced that an option would be a better hedging instrument than a futures contract. Which ONE of the following statements makes the most sense? The farmer should take a", "statements": [], "options": {"A": "long call position which will have limited downside potential, as opposed to a future's unlimited downside potential.", "B": "short call position where he will receive the option premium upfront in order to supplement his profits.", "C": "long put position which will provide limited downside potential as opposed to a future's unlimited downside potential.", "D": "short put position where he will receive the option premium upfront in order to supplement his profits."}, "answer": "C", "uitleg": "Die boer is bang vir dalende pryse en wil 'n vloerprys vasmaak: hy koop ' function record(q, ok) {
  const s = state.stats[q.id] || (state.stats[q.id] = { seen: 0, right: 0, streak: 0, review: false });
  s.seen++;
  if (ok) { s.right++; s.streak++; if (s.streak >= 2) s.review = false; }
  else { s.streak = 0; s.review = true; }

  state.days = state.days || {};

  save();
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function topicScores() {
  return topics.map(t => {

    return { t, seenN, pct: seenN ? Math.round(100 * rightN / seenN) : null };
  }).filter(x => x.seenN >= 3).sort((a, b) => a.pct - b.pct);
}

      `<button class="opt" data-k="${k}" onclick="answerPractice('${k}')"><b>${k}</b><span>${esc(v)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  window.scrollTo(0, 0);
}
function feedbackHtml(q, ok) {
  return `<div class="card feedback ${ok ? "" : "bad"}">
    <p><b>${ok ? "✅ Reg!" : `❌ Die antwoord is ${q.answer}.`}</b></p>
    <p>${esc(q.uitleg)}</p>
    ${q.book_ref ? `<p class="muted">📖 Handboek: ${esc(q.book_ref)}</p>` : ""}
    ${q.note ? `<p class="flag">⚠️ ${esc(q.note)}</p>` : ""}
  </div>`;
}
function answerPractice(k) {
  if (P.answered) return;
  const q = byId[P.queue[0]];
  const ok = k === q.answer;
  P.answered = k;
  record(q, ok);
  document.querySelectorAll("#opts .opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.k === q.answer) b.classList.add("correct");
    else if (b.dataset.k === k) b.classList.add("wrong");
  });
  P.queue.shift();
  if (ok) { P.done++; P.right++; }
  else P.queue.splice(Math.min(3, P.queue.length), 0, q.id); // comes back 3 questions later
  document.getElementById("fb").innerHTML = feedbackHtml(q, ok) +
    `<button class="primary" onclick="showPractice()">Volgende →</button>`;
  document.getElementById("fb").scrollIntoView({ behavior: "smooth", block: "start" });
}
function practiceDone() {
  app.innerHTML = `<h1>Klaar! 🎉</h1>
    <div class="card"><p>${esc(P.title)}: al ${P.total} vrae reg beantwoord.</p>
    <p class="muted">Vrae wat jy verkeerd gehad het, het teruggekom totdat jy hulle reg gehad het.</p></div>
    <button class="primary" onclick="home()">Terug tuis</button>`;
}

// ---------- exam ----------
let E = null, timer = null;
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function startExam() {
  // the papers share many questions; skip repeats of the same stem
  const seen = new Set();
  const ids = shuffle(QUESTIONS).filter(q => {
    const key = q.question.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 80);
    return !seen.has(key) && seen.add(key);
  }).slice(0, 50).map(q => q.id);
  E = { ids, picks: {}, i: 0, end: Date.now() + 60 * 60 * 1000 };
  stopTimer();
  timer = setInterval(() => {
    const el = document.getElementById("clock");
    const left = E.end - Date.now();
    if (left <= 0) return finishExam();
    if (el) el.textContent = fmt(left);
  }, 1000);
  showExam();
}
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function showExam() {
  const q = byId[E.ids[E.i]];
  const answered = Object.keys(E.picks).length;
  app.innerHTML = `
    <div class="bar"><span>Vraag ${E.i + 1}/${E.ids.length} · ${answered} beantwoord</span><b id="clock">${fmt(E.end - Date.now())}</b></div>
    <div class="grid">${E.ids.map((id, i) =>
      `<button class="${E.picks[id] ? "done" : ""} ${i === E.i ? "cur" : ""}" onclick="E.i=${i};showExam()">${i + 1}</button>`).join("")}</div>
    <div class="card">${qHtml(q).replace(/<span class="tag">[^<]*<\/span><span class="tag">[^<]*<\/span>/, "")}
    ${Object.entries(q.options).map(([k, v]) =>
      `<button class="opt ${E.picks[q.id] === k ? "picked" : ""}" onclick="E.picks['${q.id}']='${k}';${E.i < E.ids.length - 1 ? "E.i++;" : ""}showExam()"><b>${k}</b><span>${esc(v)}</span></button>`).join("")}</div>
    <div class="bar">
      <button class="small" ${E.i ? "" : "disabled"} onclick="E.i--;showExam()">← Vorige</button>
      <button class="small" ${E.i < E.ids.length - 1 ? "" : "disabled"} onclick="E.i++;showExam()">Volgende →</button>
    </div>
    <button class="primary" onclick="if(confirm('Handig in? ${E.ids.length - answered} onbeantwoord.'))finishExam()">Handig in</button>
    <button class="small" onclick="if(confirm('Los die eksamen?'))home()">Los</button>`;
  window.scrollTo(0, 0);
}
function finishExam() {
  stopTimer();
  let right = 0;
  E.ids.forEach(id => { const q = byId[id]; const k = E.picks[id]; const ok = k === q.answer; if (ok) right++; record(q, ok); });
  const pct = Math.round(100 * right / E.ids.length);
  state.exams.push({ at: Date.now(), pct }); save();
  const perTopic = {};
  E.ids.forEach(id => { const q = byId[id]; const t = perTopic[q.topic] || (perTopic[q.topic] = [0, 0]); t[1]++; if (E.picks[id] === q.answer) t[0]++; });
  app.innerHTML = `
    <h1>Uitslag</h1>
    <div class="card"><div class="big ${pct >= 70 ? "pass" : "fail"}">${pct}%</div>
      <p>${right}/${E.ids.length} reg · ${pct >= 70 ? "✅ Geslaag!" : "❌ Nog nie. 70% nodig (35/50)."}</p></div>
    <h2>Per onderwerp</h2>
    <table>${Object.entries(perTopic).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([t, [r, n]]) =>
      `<tr><td>${esc(t)}</td><td class="num ${r / n >= .7 ? "pass" : "fail"}">${r}/${n}</td></tr>`).join("")}</table>
    <h2>Foute</h2>
    ${E.ids.filter(id => E.picks[id] !== byId[id].answer).map(id => {
      const q = byId[id];
      return `<div class="card">${qHtml(q)}
        ${Object.entries(q.options).map(([k, v]) => `<div class="opt ${k === q.answer ? "correct" : k === E.picks[id] ? "wrong" : ""}" style="padding:6px;border-radius:8px;border:1px solid transparent"><b>${k}</b> <span>${esc(v)}</span></div>`).join("")}
        <p class="muted">Jy: ${E.picks[id] || "niks"} · Reg: ${q.answer}</p>${feedbackHtml(q, false).replace(/<p><b>.*?<\/b><\/p>/, "")}</div>`;
    }).join("") || "<p>Geen foute nie! 🔥</p>"}
    <button onclick="sendReport()">📲 Stuur report vir Izak</button>
    <button class="primary" onclick="home()">Terug tuis</button>`;
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
